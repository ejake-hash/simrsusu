          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinKhusus' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/wajib-mfa:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: aturWajibMfaAkun
      summary: Nyalakan atau matikan kewajiban MFA tingkat akun
      description: |
        Izin: pengaturan.akun.perbaiki. Hanya mengubah `akses.pengguna.wajib_mfa`; kewajiban dari peran, izin
        sensitif, dan akses luar jaringan RS tetap berlaku (lihat `mfa.sumber_wajib` di respons).
        Menyalakan untuk akun yang belum punya MFA memutus sesi berjalannya: masuk berikutnya harus mendaftar MFA
        dari jaringan RS. 403 `diri_sendiri`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wajib_mfa, alasan]
              properties:
                wajib_mfa: { type: boolean }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Status MFA sesudah diubah
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/mfa/reset:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetMfaAkun
      summary: Reset MFA akun (autentikator hilang/ganti ponsel)
      description: |
        Izin: pengaturan.akun.perbaiki. Mengosongkan rahasia TOTP dan mfa_aktif_pada, membatalkan semua kode
        cadangan, memutus semua sesi akun itu, dan mencabut semua perangkat tepercayanya (sejak 1.13, alasan `mfa_direset`).
        Akun mendaftar ulang saat masuk berikutnya, hanya dari jaringan
        RS (PRD 10.3.2). Audit `akses.mfa_direset` dengan alasan dan dasar, tanpa rahasia.
        403 `diri_sendiri`; 409 `mfa_belum_aktif`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Status MFA sesudah direset
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/sandi/reset:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetSandiAkun
      summary: Reset sandi akun yang lupa sandi (sandi sementara ditampilkan sekali; wajib ganti saat masuk)
      description: |
        Tiket 1.14. Izin: pengaturan.akun.perbaiki. Lapis 5 seperti izin lain: 403 `mfa_ulang_diperlukan` /
        `mfa_belum_terdaftar` hanya bila izin itu bertanda `butuh_mfa` (bawaan tidak).
        Server membuat sandi sementara acak yang memenuhi aturan sandi (PRD 14.2). Sandi itu dikirim sekali di respons ini,
        tidak disimpan terbaca, dan tidak dicatat di log atau audit (`Cache-Control: no-store`). Sesudah reset:
        - `wajib_ganti_sandi` = true: masuk berikutnya dengan sandi sementara langsung ke layar ganti sandi
          (403 `wajib_ganti_sandi` di endpoint lain, sama dengan akun baru);
        - semua sesi akun itu diputus (401 `belum_masuk` karena hash sandi berubah, atau `sesi_dicabut`; sama dengan
          ganti sandi); perangkat tepercaya akun itu dicabut (sejak 1.13);
        - penguncian karena sandi salah dibuka (`terkunci_sampai` kosong, hitungan gagal nol); MFA tidak berubah
          (autentikator hilang = POST /akun/{id}/mfa/reset).
        Audit `akses.sandi_direset` dengan alasan dan dasar, tanpa nilai sandi.
        403 `diri_sendiri` (sandi sendiri diganti lewat POST /saya/sandi); 403 `akun_superadmin` bila akun pemegang
        superadmin direset oleh bukan superadmin (aturan sama dengan /akun/{id}/*; bawaan K4/K13: langsung oleh superadmin
        lain; jalur persetujuan bila kebijakan RS mewajibkannya belum ada, dicatat di backlog); 409 `akun_nonaktif`
        (aktifkan dulu lewat /akun/{id}/aktifkan).
        Tanpa superadmin lain: perintah konsol `php artisan akses:reset-sandi <nama_pengguna>` di server (audit
        `akses.sandi_direset_konsol`), bukan endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Sandi direset
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [akun, sandi_sementara]
                    properties:
                      akun: { $ref: '#/components/schemas/AkunRingkas' }
                      sandi_sementara:
                        type: string
                        minLength: 16
                        description: "Tampilkan sekali dengan tombol salin dan peringatan \"tidak akan ditampilkan lagi\"; jangan disimpan klien"
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Profil RS, unit organisasi, KSM (tiket 1.8a; PRD 3.4, FR-54-08 langkah 2–3, 11.2 inti.profil_rs, unit_organisasi, ksm)
  # Izin: pengaturan.profil_rs.{lihat,perbaiki}; master_data.organisasi.{lihat,input,perbaiki} untuk unit dan KSM.
  # Tidak ada DELETE: unit dan KSM dinonaktifkan lewat status. Perubahan: audit catat() dengan sebelum/sesudah.
  # Lapis 3 (PRD 9.2.2): izin ber-cakupan `unit` hanya berlaku di subpohon unit itu (unit induk mencakup turunannya):
  # daftar dan rincian unit terbatas pada subpohonnya, ubah/tambah hanya di dalam subpohonnya (pindah induk tetap di
  # dalamnya; membuat unit tingkat teratas, KSM, dan profil RS butuh cakupan `rs`). Unit puncak subpohon cakupan sendiri boleh
  # diubah, tetapi tidak dipindah ke luar subpohon. Di luar cakupan → 404 untuk rincian, 403 untuk ubah.
  # ---------------------------------------------------------------------------
  /profil-rs:
    get:
      operationId: profilRs
      summary: Profil dan paket identitas RS; publik terbatas untuk halaman masuk, lengkap bagi pemegang izin
      description: |
        Tanpa sesi boleh (halaman masuk, pita DEMO di setiap layar). Bagian `rinci` hanya dikirim bila pemanggil
        punya sesi yang masih sah dan izin pengaturan.profil_rs.lihat dengan cakupan `rs` (data yang tidak diizinkan
        tidak dikirim server). Cookie sesi yang kedaluwarsa atau dicabut tidak membuat 401: jawabannya bentuk publik.
        Cache: `Cache-Control: private, no-cache`, `Vary: Cookie`; ETag berbeda untuk bentuk publik dan bentuk
        ber-`rinci` (sama-sama turunan `versi`). Instalasi kosong (belum disiapkan) tetap 200 dengan nilai kosong dan
        `paket_identitas` bawaan produk.
      security: [{}, { sesiCookie: [] }]
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Profil RS
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProfilRs' }
        '304': { description: Tidak berubah sejak versi di If-None-Match }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: ubahProfilRs
      summary: Ubah profil RS dan warna paket identitas (FR-54-08 langkah 2)
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi`). Ganti utuh isian di bawah; berkas gambar lewat
        PUT /profil-rs/berkas/{jenis}.
        Izin dengan cakupan `rs`. Kontras warna (FR-54-08 langkah 2, rumus WCAG 2.1), 422 `kontras_kurang` dengan
        `rincian` = `{kolom, rasio, minimal, pesan}`, `kolom` = `warna.brand` atau `warna.accent`, `rasio` 2 desimal:
        - `warna.brand` = teks/tautan di latar putih dan latar tombol bertulisan putih: kontras dengan putih ≥ 4,5:1
          (sekaligus memenuhi isian ≥ 3:1).
        - `warna.accent` = isian dekoratif saja (garis, badge, aksen; PRD 5.3.2 aturan 2), tidak diuji terhadap putih;
          teks di atasnya memakai tinta `--text` (`#1D1D1B`), jadi kontras accent dengan `#1D1D1B` ≥ 4,5:1.
        Tafsiran FR-54-08 ini perlu konfirmasi pemilik produk.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianProfilRs' }
      responses:
        '200':
          description: Profil sesudah diubah (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /profil-rs/berkas/{jenis}:
    parameters:
      - in: path
        name: jenis
        required: true
        schema: { type: string, enum: [logo, motif, foto] }
    get:
      operationId: berkasProfilRs
      summary: Berkas gambar paket identitas (publik, untuk halaman masuk dan kop layar)
      parameters:
        - { in: query, name: v, required: false, schema: { type: string }, description: "Potongan sha256 berkas dari URL di ProfilRs; hanya pembeda cache, tidak diperiksa" }
      description: |
        Tanpa sesi boleh. Dikirim dari object storage (MinIO) dengan Content-Type hasil pemeriksaan saat unggah,
        `X-Content-Type-Options: nosniff`, dan untuk SVG `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'`.
        URL di ProfilRs memuat versi berkas, jadi boleh di-cache lama. 404 bila belum diunggah.
      security: [{}]
      responses:
        '200':
          description: Isi berkas
          content:
            image/svg+xml: {}
            image/png: {}
            image/webp: {}
            image/jpeg: {}
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: unggahBerkasProfilRs
      summary: Unggah atau ganti logo, motif, atau foto gedung
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi` profil). multipart/form-data, satu berkas `berkas`.
        Tipe diperiksa dari isi berkas, bukan nama atau Content-Type kiriman (422 `tipe_berkas_tidak_diizinkan`):
        logo dan motif: SVG atau PNG; foto: WebP, JPEG, atau PNG. Batas ukuran per jenis di konfigurasi
        (bawaan logo 200 KB, motif 500 KB, foto 2 MB; 422 `berkas_terlalu_besar`; di atas batas server web 413)
        dan dimensi gambar raster maksimum 4096×4096 piksel (422 `dimensi_terlalu_besar`). SVG ditolak
        (422 `berkas_tidak_aman`) bila memuat DOCTYPE/ENTITY, skrip, handler `on*`, `foreignObject`/objek tertanam,
        animasi (`animate*`, `set`), `href` selain rujukan internal `#…` (termasuk `javascript:` dan `data:`), atau
        `url()`/`@import` ke luar di CSS. Izin dengan cakupan `rs`. Berkas lama tetap
        tersimpan (tidak dihapus); profil menunjuk berkas baru. Mengosongkan berkas (kembali tanpa logo/motif/foto)
        tidak tersedia di fase 1; ganti dengan berkas lain.
        Foto (sejak v0.15.0, tiket 1.15): server memotong bagian tengah menjadi 16:10 dan menyimpan hasil enkode ulang
        dengan tipe yang sama, jadi metadata EXIF/GPS terbuang. Pratinjau klien memakai potongan tengah yang sama.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Profil sesudah berkas diganti (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '413': { description: "Berkas melebihi batas unggah server web" }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /unit-organisasi:
    get:
      operationId: daftarUnitOrganisasi
      summary: Daftar unit organisasi (paginasi kursor), per induk untuk pohon yang dimuat bertahap
      description: |
        Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input (pemilih cakupan unit di dialog Tugaskan peran),
