      summary: Daftar tempat tidur (paginasi kursor)
      description: "Izin: master_data.organisasi.lihat, cakupan `rs`. Urut: kode. `cari` cocok sebagian pada kode TT."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: kamar_id, schema: { type: string, format: uuid } }
        - { in: query, name: bangsal_id, schema: { type: string, format: uuid } }
        - { in: query, name: lokasi_id, schema: { type: string, format: uuid }, description: "TT di subpohon lokasi itu (gedung, lantai, ruang)" }
        - { in: query, name: kelas_rawat_id, schema: { type: string, format: uuid } }
        - { in: query, name: status_operasional, schema: { $ref: '#/components/schemas/StatusOperasionalTt' } }
