                berlaku_dari: { type: string, format: date }
                berlaku_sampai: { type: string, format: date }
                komite: { type: string, minLength: 2, maxLength: 150, description: "Komite pemberi rekomendasi, mis. Komite Medik" }
                dasar: { type: [string, 'null'], maxLength: 200, description: "Nomor SK penugasan klinis" }
      responses:
        '201':
          description: RKK dicatat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KewenanganKlinis' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/kewenangan-klinis/{kewenanganId}/batal:
    parameters:
      - $ref: '#/components/parameters/Id'
