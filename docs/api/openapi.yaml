          description: RKK sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KewenanganKlinis' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/akun:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: buatAkunPegawai
      summary: Buat akun untuk pegawai (sandi awal ditampilkan sekali; wajib ganti saat masuk pertama)
      description: |
        Izin: pengaturan.akun.input (dan sdm.pegawai.lihat). Respons memuat `sandi_awal` sekali saja (tidak disimpan
        terbaca, tidak dicatat di log/audit; `Cache-Control: no-store`). Tautan aktivasi lewat email menunggu notifikasi (1.7).
        Akun baru tanpa peran; penugasan lewat /akun/{id}/penugasan.
        - 409 `pegawai_sudah_punya_akun` (satu akun = satu pegawai, K5); 409 `nama_pengguna_dipakai`; 409 `pegawai_keluar`
          (status pegawai `keluar`; pegawai `akan_keluar` masih bekerja, jadi boleh — akunnya nonaktif otomatis pada tanggalnya). Audit `akses.akun_dibuat` (tanpa sandi).
        Sandi awal yang hilang belum bisa dipulihkan (reset sandi oleh admin di luar tiket ini, dicatat di backlog).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama_pengguna, dasar_pemberian]
              properties:
                nama_pengguna: { type: string, pattern: '^[a-z][a-z0-9._-]{2,49}$' }
                email: { type: [string, 'null'], format: email, maxLength: 200 }
                dasar_pemberian: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [akun, sandi_awal]
                    properties:
                      akun: { $ref: '#/components/schemas/AkunRingkas' }
                      sandi_awal: { type: string, minLength: 16, description: "Tampilkan sekali dengan tombol salin; jangan disimpan klien" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/nonaktifkan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: nonaktifkanAkun
      summary: Nonaktifkan akun (alasan wajib); sesi berjalannya diputus
      description: |
        Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`, `akun_superadmin` (aturan sama dengan /akun/{id}/*).
        409 `sudah_nonaktif`; 409 `superadmin_aktif`: akun masih memegang peran superadmin — akhiri penugasannya lebih dulu
        (lewat persetujuan superadmin lain, K4). Audit `akses.akun_dinonaktifkan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Akun sesudah dinonaktifkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AkunRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/aktifkan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aktifkanAkun
      summary: Aktifkan kembali akun (alasan wajib)
      description: |
        Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`, `akun_superadmin`. 409 `sudah_aktif`; 409 `pegawai_keluar`
        (status pegawainya `keluar`; batalkan dulu tanggal keluar di data pegawai. Pegawai `akan_keluar` boleh); 409 `superadmin_aktif` (akun
        masih memegang penugasan superadmin: mengaktifkannya = menambah superadmin tanpa K4). Audit `akses.akun_diaktifkan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Akun sesudah diaktifkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AkunRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/sandi:
    post:
      operationId: gantiSandi
      summary: Ganti sandi akun yang sedang masuk
      description: |
        Tanpa izin khusus. Selama `Saya.wajib_ganti_sandi` = true (akun baru dari /pegawai/{id}/akun), semua endpoint bersesi
        selain GET /saya, GET /saya/menu, POST /saya/sandi, POST /autentikasi/keluar, dan GET /profil-rs(/berkas/*) (identitas
        RS di layar ganti sandi) menjawab 403 `wajib_ganti_sandi`.
        Sandi baru mengikuti PRD 14.2 (panjang minimal dari konfigurasi, bawaan 12; cek sandi bocor) dan cek kontekstual:
        tidak memuat nama pengguna, nama RS, atau nama produk (ADR 0001), dan tidak sama dengan sandi lama.
        - 422 `sandi_lama_salah`: dibatasi laju per akun (429 sesudah 5 kali per 15 menit); tidak menambah hitungan
          penguncian masuk. 422 `validasi_gagal` (`rincian` kolom `sandi_baru`; layar menampilkan `rincian[].pesan`, yang
          menyebut panjang minimal yang berlaku).
        - Sesudah berhasil: ID sesi diganti, sesi lain akun ini diputus, sesi ini tetap. Audit `akses.sandi_diganti` (tanpa sandi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandi_lama, sandi_baru]
              properties:
                sandi_lama: { type: string, maxLength: 200 }
                sandi_baru: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Sandi diganti
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Saya' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Notifikasi, kotak kerja, eskalasi (tiket 1.7; PRD 7.53 FR-53-01…09, 11.2 inti.jenis_tugas/tugas/tugas_kejadian,
  # notifikasi.notifikasi; keputusan K1, K2).
  # - /saya/* tanpa izin khusus: hanya data akun yang sedang masuk. Polling 30 detik dengan If-None-Match (K1; 304 bila
  #   tidak berubah) dan header `X-Permintaan-Latar: 1`: permintaan berpenanda itu tidak memperbarui waktu aktif sesi,
  #   sehingga sesi di komputer bersama tetap berakhir sesudah batas diam (PRD 14.2, ADR 0002). Klien hanya memasang header
  #   itu pada polling otomatis, bukan pada tindakan pengguna. Isi notifikasi tidak memuat data pasien di email/pesan singkat; in-app memuat tautan ke layar.
  # - Tugas dibuat dan diselesaikan oleh kejadian domain (bukan tombol manual): mis. persetujuan akses diputuskan menutup
  #   tugas "persetujuan menunggu". Tugas punya tautan ke layar penyelesaian (rute SPA).
  # - Eskalasi 3 tingkat (FR-53-03), waktu dan unit tujuannya dari jenis tugas (FR-53-04, diubah RS di layar, bukan kode):
  #   tingkat 1 pengingat ke pelaksana sebelum tenggat (bila waktunya sudah lewat saat tugas dibuat, dikirim saat dibuat);
  #   tingkat 2 teguran ke kepala unit tugas (unit pelaksana/objek), atau kepala `unit_teguran` jenisnya bila tugas tanpa unit;
  #   tingkat 3 eskalasi ke kepala `unit_eskalasi` jenisnya, atau kepala unit induk dari unit tingkat 2 (kepala bidang),
  #   + penanda dasbor Direktur. Kepala unit dari `inti.unit_organisasi.kepala_pegawai_id` (1.8d); bila tidak ada, tingkat
  #   tetap naik dan riwayat mencatat penerima kosong.
  # - Tab kotak kerja saling lepas (lencana tidak terhitung ganda): `saya` = tugas terbuka akun ini tingkat 0–1;
  #   `dieskalasi` = tugas terbuka akun ini tingkat 2–3 (sudah ditegur/dieskalasi, sesuai prototipe "Teguran & eskalasi");
  #   `unit` = tugas terbuka bukan milik akun ini di unit yang dikepalainya (termasuk turunan) atau yang eskalasinya dikirim
  #   ke akun ini; `selesai` = tugas akun ini dan unitnya yang selesai bulan ini. Tugas di tab mana pun bisa dibuka di
  #   /tugas/{id}.
  # - Pemberitahuan AKUN_TERKUNCI (issue #11) bukan jenis tugas (tidak ada di /jenis-tugas): selalu kritis, paling banyak
  #   satu per jam per akun (in-app dan email) agar penguncian sengaja tidak membanjiri pemilik. TTD_TERKUNCI (1.6): ke
  #   pemilik dan atasan langsung, juga kritis.
  # - Kanal (K2): in-app selalu; email (antrean `notifikasi`) bila akun punya email dan preferensinya menyala; WA/SMS
  #   lewat adapter dengan driver `log` di fase 1. Notifikasi kritis tidak bisa dimatikan preferensi (FR-53-09).
  # ---------------------------------------------------------------------------
  /saya/notifikasi:
    get:
      operationId: daftarNotifikasiSaya
      summary: Notifikasi akun yang sedang masuk (paginasi kursor, terbaru dulu) beserta jumlah belum dibaca
      description: |
        `status=belum_dibaca` untuk lonceng/daftar "belum dibaca dulu" (tab pertama), `semua` (bawaan) untuk riwayat.
        `meta.jumlah_belum_dibaca` untuk angka lonceng. ETag = sidik isi respons: berubah bila ada notifikasi baru atau status baca berubah;
        If-None-Match yang sama → 304 tanpa isi (polling 30 detik).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: status, schema: { type: string, enum: [belum_dibaca, semua] } }
        - { in: header, name: If-None-Match, schema: { type: string } }
        - { in: header, name: X-Permintaan-Latar, schema: { type: string, enum: ['1'] }, description: "Polling otomatis: tidak memperbarui waktu aktif sesi" }
      responses:
        '200':
          description: Satu halaman notifikasi
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notifikasi' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah_belum_dibaca]
                        properties:
                          jumlah_belum_dibaca: { type: integer, minimum: 0 }
        '304': { description: "Tidak berubah sejak ETag yang dikirim" }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/notifikasi/{id}/dibaca:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tandaiNotifikasiDibaca
      summary: Tandai satu notifikasi dibaca (idempoten)
      description: "Hanya notifikasi milik akun ini; selain itu 404."
      responses:
        '200':
          description: Notifikasi sesudah ditandai
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Notifikasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /saya/notifikasi/semua-dibaca:
    post:
      operationId: tandaiSemuaNotifikasiDibaca
      summary: Tandai semua notifikasi akun ini dibaca
      description: "`sampai` (opsional) = waktu notifikasi terbaru yang sudah ditampilkan; yang tiba sesudahnya tetap belum dibaca. Notifikasi berprioritas kritis tidak ikut ditandai (dibuka satu per satu, PRD 5.1 butir 12)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sampai: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Jumlah yang ditandai
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [jumlah], properties: { jumlah: { type: integer, minimum: 0 } } }
        '401': { $ref: '#/components/responses/Error' }
  /saya/preferensi-notifikasi:
    get:
      operationId: preferensiNotifikasiSaya
      summary: Preferensi kanal notifikasi per jenis
      description: |
        Satu baris per jenis notifikasi yang bisa diterima akun: AKUN_TERKUNCI (kritis), TTD_TERKUNCI (kritis, 1.6),
        TTD_DICABUT (1.6), lalu jenis tugas aktif. In-app selalu menyala.
        Per kanal: `dapat_diubah = false` untuk jenis kritis (FR-53-09), kanal yang belum tersedia di instalasi (pesan singkat
        di fase 1 hanya driver log), atau email bila akun tidak punya alamat email.
      responses:
        '200':
          description: Preferensi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PreferensiNotifikasi' } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      operationId: aturPreferensiNotifikasiSaya
      summary: Ganti preferensi kanal (email, pesan singkat) per jenis
      description: |
        Mengganti nilai yang dikirim saja; jenis/kanal yang tidak dikirim tidak berubah. 422 `jenis_tidak_dikenal`;
        422 `notifikasi_kritis` bila mencoba mematikan kanal untuk jenis kritis; 422 `kanal_tidak_tersedia` bila mengubah kanal
        yang `dapat_diubah = false` karena belum tersedia. Audit `notifikasi.preferensi_diubah`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferensi]
              properties:
                preferensi:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [jenis]
                    properties:
                      jenis: { type: string, maxLength: 60 }
                      email: { type: boolean }
                      pesan_singkat: { type: boolean }
      responses:
        '200':
          description: Preferensi sesudah diubah
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PreferensiNotifikasi' } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/tugas:
    get:
      operationId: kotakKerjaSaya
      summary: Kotak kerja (paginasi kursor)
      description: |
        Tanpa izin khusus (tugas yang terkait akun ini). Arti tab di blok aturan di atas (saling lepas). "Milik akun ini" =
        pelaksananya akun ini, atau peran/unit yang dipegang akun ini lewat penugasan berlaku. Tab saya/dieskalasi/unit urut
        tenggat terdekat dulu; selesai urut selesai terbaru dulu. `meta.jumlah` per tab untuk lencana (dihitung server).
        ETag = sidik isi respons (termasuk `terlambat` dan jumlah), jadi 304 hanya bila isinya benar-benar sama.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tab, required: true, schema: { type: string, enum: [saya, unit, dieskalasi, selesai] } }
        - { in: header, name: If-None-Match, schema: { type: string } }
        - { in: header, name: X-Permintaan-Latar, schema: { type: string, enum: ['1'] }, description: "Polling otomatis: tidak memperbarui waktu aktif sesi" }
      responses:
        '200':
          description: Satu halaman tugas
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tugas' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah]
                        properties:
                          jumlah:
                            type: object
                            required: [saya, unit, dieskalasi, selesai]
                            properties:
                              saya: { type: integer, minimum: 0 }
                              unit: { type: integer, minimum: 0 }
                              dieskalasi: { type: integer, minimum: 0 }
                              selesai: { type: integer, minimum: 0 }
        '304': { description: "Tidak berubah sejak ETag yang dikirim" }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tugas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciTugas
      summary: Rincian tugas beserta riwayat (dibuat, pengingat, teguran, eskalasi, selesai)
      description: "Hanya akun yang melihatnya di salah satu tab /saya/tugas (pemilik, kepala unit tugas atau unit induknya, penerima eskalasi); selain itu 404."
      responses:
        '200':
          description: Rincian tugas
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TugasRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /jenis-tugas:
    get:
      operationId: daftarJenisTugas
      summary: Jenis tugas, tenggat, dan eskalasi (data induk), urut kode
      description: |
        Izin: master_data.jenis_tugas.lihat, cakupan `rs`. Jenis tugas dibuat oleh modul pembuatnya (kode stabil dipakai
        kejadian domain) dan dipasang migrasi; RS mengubah tenggat, waktu eskalasi, kritis, dan aktif dari layar (FR-53-04).
        Tidak ada POST: jenis tanpa modul pembuat tidak pernah menghasilkan tugas.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: aktif, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman jenis tugas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JenisTugas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jenis-tugas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciJenisTugas
      summary: Rincian jenis tugas
      description: "Izin: master_data.jenis_tugas.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian jenis tugas
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JenisTugas' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahJenisTugas
      summary: Ubah nama, tenggat, waktu dan unit eskalasi, kritis, atau aktif
      description: |
        Izin: master_data.jenis_tugas.perbaiki. Wajib If-Match. Berlaku untuk tugas yang dibuat sesudahnya; tugas terbuka
        memakai aturan saat dibuat. 422 `eskalasi_tidak_urut` bila menit tingkat 3 < tingkat 2; 422 `unit_tidak_valid`. Menonaktifkan jenis = kejadian domain tidak lagi membuat tugas jenis itu (tugas
        terbuka tetap berjalan). Audit `notifikasi.jenis_tugas_diubah`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                nama: { type: string, minLength: 3, maxLength: 150 }
                batas_menit: { type: integer, minimum: 1, maximum: 525600, description: "Lihat JenisTugas.tenggat_dari" }
                unit_teguran_id: { type: [string, 'null'], format: uuid }
                unit_eskalasi_id: { type: [string, 'null'], format: uuid }
                eskalasi: { $ref: '#/components/schemas/AturanEskalasi' }
                kritis: { type: boolean }
                aktif: { type: boolean }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Jenis tugas sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JenisTugas' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Tanda tangan elektronik T1 (tiket 1.6; PRD 7.57.1–7.57.2, FR-57-01…03/05, 11.2 ttd.*; keputusan K10).
  # - Pasangan kunci Ed25519 per akun; kunci privat dibungkus kunci turunan PIN (Argon2id + garam per akun) DAN kunci
  #   server (env/vault, bukan di DB), PIN hanya hash berlada kunci server: salinan DB saja tidak cukup untuk menebak PIN
  #   atau membuka kunci. Tidak ada jalur admin untuk menandatangani atas nama orang lain: penanda tangan = akun yang masuk.
  # - Isi yang ditandatangani dihitung SERVER dari objeknya (JSON kanonik, kunci terurut) → SHA-256 → tanda tangan; klien
  #   tidak pernah mengirim isi. Cap waktu = waktu server (NTP). Setiap objek = satu baris tanda tangan.
  # - Isi kanonik hanya dari kolom tersimpan yang tidak berubah sesudah objek final (id, kode, nilai, waktu), bukan dari
  #   label/nama yang disusun saat dibaca: mengganti nama peran, label izin, atau nama pegawai tidak membuat tanda tangan
  #   lama `isi_berubah`.
  # - Aturan PIN: tepat 6 angka; ditolak bila semua angka sama (111111), pola 2 atau 3 angka berulang (121212, 123123),
  #   atau setiap angka naik tepat 1 atau turun tepat 1 tanpa melingkar (012345, 123456, 987654). Format salah juga
  #   `pin_lemah` (bukan `validasi_gagal`). Kesalahan PIN memakai `rincian[]` = `{kolom, kode, pesan}`:
  #   `pin_lemah` (kolom `pin` | `pin_baru`), `pin_tidak_sama` (kolom `pin_ulang`), `pin_salah` (kolom `pin` | `pin_lama`,
  #   ditambah `sisa_percobaan`: integer ≥ 1).
  # - Penguncian: PIN salah ke-5 (konfigurasi) langsung 403 `ttd_terkunci` dengan header `Retry-After` (detik); terkunci
  #   15 menit (konfigurasi), sesi tanda tangan berakhir, pemilik dan atasan langsung diberi notifikasi kritis (1.7).
  #   PIN tidak pernah di log/audit/URL; respons /saya/ttd/* dan /ttd/tandatangani `Cache-Control: no-store`.
  # - Sesi tanda tangan: 15 menit tetap (tidak bergeser) sejak PIN benar terakhir di /ttd/tandatangani, dalam sesi login yang
  #   sama: penandatanganan berikutnya boleh tanpa PIN, tetap satu baris per objek. Aktivasi dan ganti PIN tidak memulai
  #   sesi; sesi berakhir saat keluar, ganti sandi, ganti PIN, terkunci, atau TTE dicabut. Klien yang menerima 422
  #   `pin_wajib` menampilkan kolom PIN dan mengirim ulang.
  # - Objek yang bisa ditandatangani di fase 1: `persetujuan_akses`, oleh akun pemutusnya (`diputuskan_oleh.id` = Saya.id)
  #   sesudah diputuskan; klien memanggil verifikasi di rincian untuk tahu apakah sudah ditandatangani. Fase 1 tidak punya
  #   endpoint "minta tanda tangan" (penanda tangan lain): mode itu di TtdModal hanya komponen dengan handler pemanggil.
  #   `usulan_data_induk` (1.8c) oleh pengusul/pemverifikasi/penyetujunya. Aturan tingkat per jenis objek (FR-57-05) adalah
  #   data induk; fase 1 hanya T1.
  # - T2/PSrE: antarmuka + simulator untuk uji alur asinkron, tanpa endpoint publik dan tanpa penyedia nyata (K10); mode
  #   T2 TtdModal di luar 1.6-fe. Semua endpoint ini memakai batas laju `throttle:api` (429).
  # - 503 `ttd_belum_dikonfigurasi` (aktivasi, ganti PIN, tandatangani): kunci server `TTD_KUNCI` kosong, atau kunci yang
  #   membungkus kredensial tidak ada lagi di `TTD_KUNCI`/`TTD_KUNCI_LAMA`. Klien menampilkan pesan server.
  # ---------------------------------------------------------------------------
  /saya/ttd/aktivasi:
    post:
      operationId: aktivasiTtd
      summary: Aktivasi T1 — buat pasangan kunci dan tetapkan PIN
      description: |
        Tanpa izin khusus (akun yang masuk). Sandi akun wajib: sesi yang ditinggal terbuka tidak bisa membuat TTE atas nama
        pemilik (PRD 7.57.2 huruf b). Juga untuk aktivasi ulang sesudah reset.
        - 422 `sandi_salah` (`rincian` kolom `sandi`; dibatasi laju per akun seperti /saya/sandi: 429 sesudah 5 kali per 15 menit);
        - 409 `ttd_sudah_aktif`; 422 `pin_lemah`, `pin_tidak_sama` (lihat aturan PIN di atas); 403 `wajib_ganti_sandi`.
        Audit `ttd.diaktifkan` (sidik kunci, tanpa PIN). Status tampil di `Saya.ttd`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandi, pin, pin_ulang]
              properties:
                sandi: { type: string, maxLength: 200 }
                pin: { type: string, maxLength: 20, description: "6 angka; format lain → 422 pin_lemah" }
                pin_ulang: { type: string, maxLength: 20 }
      responses:
        '201':
          description: TTE aktif
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusTtd' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /saya/ttd/pin:
    put:
      operationId: gantiPinTtd
      summary: Ganti PIN (pasangan kunci tetap; kunci privat dibungkus ulang)
      description: |
        - 422 `pin_salah` (kolom `pin_lama`, dihitung ke penguncian), `pin_lemah` (kolom `pin_baru`), `pin_tidak_sama`;
        - 409 `ttd_belum_aktif`; 403 `ttd_terkunci` (Retry-After).
        Sesi tanda tangan berakhir. Audit `ttd.pin_diganti`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin_lama, pin_baru, pin_ulang]
              properties:
                pin_lama: { type: string, maxLength: 20 }
                pin_baru: { type: string, maxLength: 20 }
                pin_ulang: { type: string, maxLength: 20 }
      responses:
        '200':
          description: PIN diganti
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusTtd' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ttd/{pengguna}/reset:
    parameters:
      - { in: path, name: pengguna, required: true, schema: { type: string, format: uuid }, description: "id akun (akses.pengguna) pemilik TTE, bukan id kredensial" }
    post:
      operationId: ajukanResetTtd
      summary: Ajukan reset TTE (PIN lupa) — diajukan SDM, disetujui atasan lewat persetujuan akses (1.2d)
      description: |
        Izin: sdm.kredensial.perbaiki, cakupan `rs`. Reset = TTE lama dicabut (tanda tangan lama tetap terverifikasi
        dengan kunci publik lama); pemilik mengaktifkan ulang sendiri dengan sandi, pasangan kunci, dan PIN baru. Tidak ada
        yang menetapkan PIN untuk orang lain.
        Tafsiran PRD 7.57.2 huruf b "oleh atasan + SDM": satu persetujuan dengan dua orang — pengaju (SDM, sesudah
        verifikasi identitas tatap muka, dicatat di `dasar`) dan penyetuju = atasan langsung pemilik, sebagai persetujuan
        akses `jenis = reset_ttd` dengan `penyetuju_pengguna` (`objek.jenis = reset_ttd`, `objek.akun` = pemilik;
        `peran`, `izin`, `cakupan_label`, `berlaku_sampai` null). Atasan = akun aktif kepala unit pegawainya; bila kepala
        itu pemilik sendiri, pengaju, atau tanpa akun aktif, naik ke kepala unit induk, dan seterusnya sampai unit akar.
        - 202 = persetujuan menunggu (PersetujuanAkses); berlaku saat disetujui: TTE lama dicabut, pemilik diberi notifikasi.
          Audit `ttd.dicabut` saat diterapkan (pengajuannya diaudit `akses.persetujuan_diajukan`).
        - 403 `diri_sendiri` (mengajukan untuk akun sendiri); 404 akun tidak ada; 409 `ttd_belum_aktif`;
          409 `persetujuan_ganda` (reset untuk akun ini masih menunggu);
          422 `atasan_belum_ditetapkan` (pegawai tanpa unit, atau sampai unit akar tidak ada kepala lain berakun aktif,
          mis. TTE Direktur: jalur puncak menunggu keputusan pemilik produk, lihat backlog 1.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '202':
          description: Menunggu persetujuan atasan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /ttd/tandatangani:
    post:
      operationId: tandatangani
      summary: Tandatangani satu atau banyak objek dengan T1 (isi kanonik dihitung server)
      description: |
        Penanda tangan = akun yang masuk. `pin` wajib kecuali sesi tanda tangan masih berlaku (422 `pin_wajib`).
        Semua objek diperiksa dulu; satu yang tidak boleh → tidak ada yang ditandatangani: 422 `objek_tidak_bisa_ditandatangani`,
        `rincian[]` = `{kolom: "objek.<i>", kode, pesan}` dengan `kode` ∈ `tidak_ditemukan` (tidak ada atau tidak boleh dilihat),
        `belum_diputuskan`, `bukan_pemutus`. Id ganda dalam satu permintaan → 422 `validasi_gagal` (kolom `objek.<i>.id`).
        `data` selalu sepanjang dan seurut `objek`: objek yang sudah ditandatangani akun ini dengan isi yang sama tidak
        digandakan, isinya tanda tangan lama dengan `baru: false` (kirim ulang aman, pengganti Idempotency-Key). Bila isi
        objek berubah (mis. usulan dikirim ulang), tanda tangan baru dibuat; yang lama tetap ada (verifikasi: `isi_berubah`).
        Siapa yang boleh: `persetujuan_akses` hanya akun pemutusnya sesudah diputuskan; `usulan_data_induk` (1.8c) pengusul,
        pemverifikasi, atau penyetuju putaran itu sesudah tindakannya (`bukan_pemutus` = bukan pelaku usulan itu;
        `belum_diputuskan` = pelaku yang tindakannya di putaran ini belum dilakukan).
        - 422 `pin_salah` (kolom `pin`, `sisa_percobaan`); 403 `ttd_terkunci` (Retry-After); 409 `ttd_belum_aktif`;
          422 `validasi_gagal` bila `pernyataan_disetujui` bukan true.
        Audit `ttd.ditandatangani` per objek baru (hash isi, sidik kunci; tanpa isi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objek, pernyataan_disetujui]
              properties:
                objek:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [jenis, id]
                    properties:
                      jenis: { type: string, enum: [persetujuan_akses, usulan_data_induk] }
                      id: { type: string, format: uuid }
                pin: { type: [string, 'null'], maxLength: 20 }
                pernyataan_disetujui:
                  type: boolean
                  const: true
                  description: "Akun menyetujui kalimat \"Saya menyatakan isi ini benar dan saya menandatanganinya\" (PRD 7.57.2 huruf f) yang ditampilkan klien bersama ringkasan isi"
      responses:
        '200':
          description: Tanda tangan per objek (urutan sama dengan permintaan)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/TandaTangan'
                        - type: object
                          required: [baru]
                          properties:
                            baru: { type: boolean, description: "false = tanda tangan lama akun ini untuk objek itu" }
                  meta:
                    type: object
                    required: [sesi_berlaku_sampai]
                    properties:
                      sesi_berlaku_sampai: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ttd/verifikasi/{objek_jenis}/{objek_id}:
    parameters:
      - { in: path, name: objek_jenis, required: true, schema: { type: string, enum: [persetujuan_akses, usulan_data_induk] } }
      - { in: path, name: objek_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: verifikasiTtd
      summary: Verifikasi ulang semua tanda tangan sebuah objek (integritas isi + keaslian tanda tangan)
      description: |
        Hanya akun yang boleh melihat objek itu (persetujuan_akses: aturan /persetujuan-akses/{id}; usulan_data_induk: izin
        master_data.usulan.lihat atau pelaku usulan itu); selain itu 404.
        Urutan pemeriksaan: keaslian dulu (`tanda_tangan_tidak_sah` bila tanda tangan tidak cocok dengan hash tersimpan dan
        kunci publik yang dipakai, mis. baris palsu), lalu isi (`isi_berubah` bila hash isi kanonik objek saat ini berbeda
        dari saat ditandatangani). Waktu di isi kanonik selalu UTC dengan presisi mikrodetik (tidak bergantung zona waktu
        instalasi).
        Bukan endpoint daftar: satu baris per penanda tangan per isi yang ditandatangani (usulan yang dikirim ulang bisa
        punya tanda tangan putaran lama berstatus `isi_berubah`), urut `ditandatangani_pada`.
        Hasil kosong = belum ada tanda tangan.
      responses:
        '200':
          description: Hasil verifikasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TandaTangan' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Usulan perubahan data induk berjenjang (tiket 1.8c; PRD FR-54-01, FR-54-02, FR-08-16; prototipe masterdata.html "Usulan").
  # - Mesin generik per `jenis_data`; fase 1 hanya `ruang_tt` (ruang, kamar, tempat tidur dari 1.8b). Tarif/formularium
  #   memakai mesin yang sama di fase 2–3.
  # - Tahap: diusulkan → diverifikasi → disetujui (terjadwal) → berlaku. Pemverifikasi/penyetuju bisa mengembalikan
  #   (catatan wajib) → `dikembalikan` → pengusul memperbaiki dan kirim ulang (kembali ke `diusulkan`, putaran +1).
  #   Gagal saat diterapkan (objek berubah sejak diusulkan, atau aturan 1.8b tidak terpenuhi lagi) → `gagal_diterapkan`
  #   dengan alasan; pengusul diberi tahu. `gagal_diterapkan` dan `berlaku` final (tidak bisa dikirim ulang; usulan baru
  #   dibuat bila masih perlu).
  # - Isi tiap putaran disimpan (kirim ulang tidak menimpa putaran lama; jejak PRD 7.57.2 c–d). Isi kanonik TTE = isi
  #   putaran yang ditandatangani tanpa hasil penerapan (id objek baru hasil `tambah` tidak ikut), sehingga tanda tangan
  #   tetap sah sesudah usulan berlaku.
  # - Tampilan diff: `tampilan[]` (label isian, nilai lama/baru siap tampil, mis. nama kelas/bangsal/unit) disusun server
  #   saat dibaca; hanya untuk layar, tidak masuk isi kanonik TTE. `nilai_lama`/`nilai_baru` mentah untuk kirim ulang.
  #   `ringkasan` (mis. "ICU: 12 → 16 TT") dipotret saat diusulkan/dikirim ulang, tidak bergeser sesudah berlaku.
  # - Tautan tugas/notifikasi usulan: `/master-data/usulan?usulan={id}` (rute layar).
  # - Izin sub-menu `master_data.usulan` (cakupan rs): `lihat` (semua usulan), `input` (mengusulkan dan kirim ulang
  #   usulan sendiri), `verifikasi`, `setujui`. Alur per jenis data (`inti.alur_usulan`, data induk; layar menyusul) bisa
  #   mempersempit pengusul (pemilik data), pemverifikasi, dan penyetuju ke satu peran (mis. ruang & TT: Keperawatan →
  #   Yanmed → Direktur). Tiga orang berbeda: pengusul ≠ pemverifikasi ≠ penyetuju. Pemeriksaan 403 (izin, peran alur,
  #   `pengusul_sendiri`, `sudah_memverifikasi`) didahulukan sebelum 409 `tahap_tidak_sesuai`.
  # - Tanggal: `berlaku_dari` ≥ hari ini saat diajukan. Uji kering memakai `berlaku_dari` sebagai hari acuan aturan
  #   tanggal 1.8b (mis. TT baru mulai dihitung, status ruang). Tanggal efektif penerapan = max(`berlaku_dari`, hari ini):
  #   usulan yang disetujui sesudah tanggalnya lewat berlaku mulai hari disetujui.
  # - Setiap butir `perubahan` divalidasi dengan aturan 1.8b yang sama saat diusulkan/dikirim ulang (uji kering) dan
  #   sekali lagi saat diterapkan. `nilai_lama` dan revisi objek dipotret server saat diusulkan (klien tidak
  #   mengirimnya); `objek_berubah` menandai objek yang berubah sejak itu (penerapan akan gagal; kembalikan ke pengusul).
  #   Satu objek hanya boleh ada di satu usulan yang sedang berjalan (tahap diusulkan, diverifikasi, disetujui); usulan
  #   `dikembalikan` tidak mengunci objek, konflik diperiksa lagi saat kirim ulang. Dua usulan yang sama-sama menambah
  #   kode TT yang sama: yang diterapkan belakangan gagal (`kode_sudah_dipakai`).
  # - Penerapan: tugas terjadwal 00.00 zona RS mengambil semua usulan `disetujui` dengan `berlaku_dari` ≤ hari ini
  #   (mengejar bila server mati saat itu), satu transaksi per usulan, idempoten (kunci baris + cek tahap); bila
  #   `berlaku_dari` ≤ hari ini saat disetujui, langsung diterapkan. Setiap perubahan data induk (lewat usulan maupun
  #   langsung) menyimpan versi (riwayat-versi; `versi` = urutan per objek mulai 1).
  # - Setelah instalasi siap melayani (penjaga `instalasi.siap_melayani`, tiket 1.8f; sampai 1.8f selalu belum),
  #   perubahan langsung ruang/kamar/TT ditolak 409 `harus_lewat_usulan` (`rincian` kosong; `pesan` siap ditampilkan
  #   sebagai banner dengan tautan ke /master-data/usulan): POST/PATCH /lokasi untuk jenis ruang, POST /lokasi/impor,
  #   POST/PATCH /kamar, POST/PATCH /tempat-tidur dan tutupnya — kecuali TT `ekstra` (darurat lonjakan: tambah dan tutup
  #   TT ekstra tetap langsung dan tercatat).
  # - Notifikasi/tugas (1.7) jenis USULAN_DATA_INDUK ke pemverifikasi, penyetuju, atau pengusul sesuai tahap. Usulan
  #   bisa ditandatangani (TTE T1, 1.6) oleh pengusul, pemverifikasi, dan penyetujunya (`objek_jenis = usulan_data_induk`).
  # ---------------------------------------------------------------------------
  /usulan-data-induk:
    get:
      operationId: daftarUsulanDataInduk
      summary: Daftar usulan (paginasi kursor, terbaru dulu)
      description: |
        Izin: master_data.usulan.lihat. `tahap=terbuka` = diusulkan, diverifikasi, disetujui, dikembalikan (tahap final
        `berlaku` dan `gagal_diterapkan` tidak termasuk). `perlu_saya=true` = usulan yang akun ini bisa tindak lanjuti
        sekarang (`dapat.verifikasi|setujui|kembalikan|kirim_ulang`). Semua filter digabung (AND). Urutan: waktu usulan
        pertama kali diajukan (tidak berubah saat kirim ulang), terbaru dulu. `meta.jumlah` = jumlah per tahap untuk kartu
        ringkasan (mengikuti filter `jenis_data` saja); `gagal_diterapkan` = 30 hari terakhir.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tahap, schema: { type: string, enum: [terbuka, diusulkan, diverifikasi, disetujui, berlaku, dikembalikan, gagal_diterapkan] } }
        - { in: query, name: jenis_data, schema: { $ref: '#/components/schemas/JenisDataInduk' } }
        - { in: query, name: perlu_saya, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman usulan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UsulanDataInduk' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah]
                        properties:
                          jumlah:
                            type: object
                            required: [diusulkan, diverifikasi, disetujui, dikembalikan, gagal_diterapkan]
                            properties:
                              diusulkan: { type: integer, minimum: 0 }
                              diverifikasi: { type: integer, minimum: 0 }
                              disetujui: { type: integer, minimum: 0, description: "Terjadwal berlaku" }
                              dikembalikan: { type: integer, minimum: 0 }
                              gagal_diterapkan: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatUsulanDataInduk
      summary: Ajukan usulan perubahan data induk
      description: |
        Izin: master_data.usulan.input. `berlaku_dari` ≥ hari ini zona RS (422 `tanggal_tidak_valid`).
        - 422 `perubahan_tidak_valid`: `rincian[]` = `{kolom: "perubahan.<i>[.<isian>]", kode, pesan}`, kode dari aturan 1.8b
          (mis. `kode_sudah_dipakai`, `kelas_rawat_tidak_valid`, `sudah_ditutup`, `jenis_induk_tidak_sesuai`) atau
          `objek_tidak_ditemukan`, `aksi_tidak_dikenal`.
        - 409 `objek_sedang_diusulkan`: objek yang sama ada di usulan lain yang sedang berjalan; `rincian[]` =
          `{kolom: "perubahan.<i>", kode: "objek_sedang_diusulkan", pesan, usulan: {id, nomor}}`.
        - 403 `bukan_pengusul_alur`: alur jenis data menetapkan peran pengusul (pemilik data) dan akun ini tidak memegangnya.
        Audit `master_data.usulan_diajukan`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianUsulanDataInduk' }
      responses:
        '201':
          description: Usulan diajukan (tahap diusulkan)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciUsulanDataInduk
      summary: Rincian usulan dengan perbedaan lama → baru dan riwayat tahap
      description: "Izin: master_data.usulan.lihat."
      responses:
        '200':
          description: Rincian
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/verifikasi:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: verifikasiUsulanDataInduk
      summary: Verifikasi usulan (diusulkan → diverifikasi)
      description: |
        Izin: master_data.usulan.verifikasi (dan peran pemverifikasi alur jenis data bila ditetapkan: 403 `bukan_pemverifikasi`).
        403 `pengusul_sendiri`; 409 `tahap_tidak_sesuai` (bukan tahap diusulkan). Audit `master_data.usulan_diverifikasi`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { catatan: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200':
          description: Usulan sesudah diverifikasi
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/setujui:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: setujuiUsulanDataInduk
      summary: Setujui usulan (diverifikasi → disetujui; langsung berlaku bila berlaku_dari ≤ hari ini)
      description: |
        Izin: master_data.usulan.setujui (dan peran penyetuju alur bila ditetapkan: 403 `bukan_penyetuju`).
        403 `pengusul_sendiri`, 403 `sudah_memverifikasi` (pemverifikasi tidak menyetujui usulan yang ia verifikasi);
        409 `tahap_tidak_sesuai`. Bila langsung diterapkan dan gagal: respons 200 dengan tahap `gagal_diterapkan` dan
        `gagal_alasan`. Audit `master_data.usulan_disetujui` (+ `master_data.usulan_diterapkan`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { catatan: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200':
          description: Usulan sesudah disetujui (disetujui, berlaku, atau gagal_diterapkan)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/kembalikan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: kembalikanUsulanDataInduk
      summary: Kembalikan usulan ke pengusul dengan catatan (dari tahap diusulkan atau diverifikasi)
      description: |
        Tahap diusulkan: izin verifikasi (peran pemverifikasi alur); tahap diverifikasi: izin setujui (peran penyetuju
        alur) dan bukan pemverifikasinya (403 `sudah_memverifikasi`). 403 `pengusul_sendiri`; 409 `tahap_tidak_sesuai`.
        Audit `master_data.usulan_dikembalikan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catatan]
              properties:
                catatan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Usulan sesudah dikembalikan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/kirim-ulang:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: kirimUlangUsulanDataInduk
      summary: Perbaiki dan kirim ulang usulan yang dikembalikan (dikembalikan → diusulkan)
      description: |
        Hanya pengusulnya, dengan izin master_data.usulan.input (selain itu 403 `bukan_pengusul`). Membuat putaran
        baru (isi putaran lama tetap tersimpan; bentuk sama dengan POST, kecuali `jenis_data` tetap); `nilai_lama` dipotret ulang; putaran +1; tanda
        tangan putaran sebelumnya menjadi `isi_berubah`. 409 `tahap_tidak_sesuai` (bukan tahap dikembalikan, termasuk
        bila sudah dikirim ulang dari tab lain); 409 `objek_sedang_diusulkan`; 422 seperti POST. Audit
        `master_data.usulan_dikirim_ulang`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perubahan, berlaku_dari, alasan, dasar]
              properties:
                perubahan: { $ref: '#/components/schemas/IsianPerubahanUsulan' }
                berlaku_dari: { type: string, format: date }
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Usulan sesudah dikirim ulang
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /data-induk/{jenis}/{id}/riwayat-versi:
    parameters:
      - { in: path, name: jenis, required: true, schema: { $ref: '#/components/schemas/ObjekDataInduk' } }
      - $ref: '#/components/parameters/Id'
    get:
      operationId: riwayatVersiDataInduk
      summary: Riwayat versi satu objek data induk (paginasi kursor, terbaru dulu)
      description: |
        Izin: lihat data induk itu (ruang/kamar/tempat_tidur: master_data.organisasi.lihat). Setiap perubahan (lewat usulan
        atau langsung) = satu versi dengan isi sebelum dan sesudah; versi tidak pernah diubah. Objek tanpa riwayat
        (dibuat sebelum 1.8c dan belum pernah diubah) → daftar kosong.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman versi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VersiDataInduk' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Kursor:
      in: query
      name: kursor
      required: false
      schema: { type: string }
      description: "Kursor buram dari meta.kursor_berikutnya"
    Batas:
      in: query
      name: batas
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: "Di atas 200 → 422 ukuran_halaman_melebihi_batas"
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
      description: "ETag/versi dari GET terakhir; tidak cocok → 412 versi_berubah, tidak ada → 428 if_match_wajib"
  securitySchemes:
    sesiCookie:
      type: apiKey
      in: cookie
      name: karsitara_session
      description: Cookie sesi Sanctum stateful (PRD 10.3.2); nama cookie mengikuti konfigurasi.
  responses:
    Error:
      description: Error format tunggal (PRD 10.3.1)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kode, pesan]
          properties:
            kode: { type: string, examples: [belum_masuk] }
            pesan: { type: string }
            rincian:
              type: array
              items: { type: object, additionalProperties: true }
    Saya:
      type: object
      required: [id, nama_pengguna, login_terakhir_pada, mfa_aktif, pegawai, peran, masuk_sebelumnya_pada, masuk_sebelumnya_dari_jaringan_rs, ttd]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        login_terakhir_pada: { type: [string, 'null'], format: date-time, description: "Masuk yang memulai sesi ini" }
        mfa_aktif: { type: boolean }
        wajib_ganti_sandi: { type: boolean, description: "Selalu dikirim di /saya sejak 1.8d (tidak ada di respons masuk PRD 10.3.2). true = arahkan ke layar ganti sandi; endpoint bersesi lain 403 wajib_ganti_sandi" }
        ttd: { $ref: '#/components/schemas/StatusTtd', description: "Sejak 1.6 (backend 1.6-be)" }
        pegawai:
          type: [object, 'null']
          required: [id, nama]
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
        peran:
          type: array
          description: "Peran berstatus aktif dengan penugasan yang berlaku sekarang, tanpa duplikat, urut nama. Kosong = belum ada modul yang diberikan."
          items:
            type: object
            required: [id, nama]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
        masuk_sebelumnya_pada:
          type: [string, 'null']
          format: date-time
          description: "Masuk berhasil terakhir selain sesi ini (\"apakah ini Anda?\"): masuk lain sesudah sesi ini dimulai bila ada, kalau tidak masuk sebelum sesi ini. null = tidak ada catatan: masuk pertama, atau sesi dimulai sebelum fitur ini ada."
        masuk_sebelumnya_dari_jaringan_rs:
          type: [boolean, 'null']
          description: "Apakah masuk sebelumnya dari jaringan RS (AUTENTIKASI_MFA_JARINGAN_RS). null = tidak diketahui: masuk pertama, atau masuk sebelumnya terjadi sebelum fitur ini ada."
    WarnaHex:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#006937']
    KodeData:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9._-]{0,29}$'
      description: "Kode singkat huruf besar/angka, mis. IRNA, IGD-01"
    ProfilRs:
      type: object
      required: [versi, nama, paket_identitas, kontak_admin, instalasi_demo]
      properties:
        versi: { type: string, description: "Sama dengan ETag; berubah setiap profil atau berkas diganti" }
        nama: { type: [string, 'null'], description: "Nama resmi RS; null = belum disiapkan (kartu RS tidak tampil)" }
        paket_identitas:
          type: object
          required: [warna, logo_url, motif_url, foto_url]
          properties:
            warna:
              type: object
              required: [brand, accent]
              description: "Dasar token --brand-600 dan --accent (PRD 5.3); turunan warna dihitung frontend. Bawaan = paket produk."
              properties:
                brand: { $ref: '#/components/schemas/WarnaHex' }
                accent: { $ref: '#/components/schemas/WarnaHex' }
            logo_url: { type: [string, 'null'], description: "Path relatif ke GET /profil-rs/berkas/logo dengan versi berkas; null = belum ada" }
            motif_url: { type: [string, 'null'], description: "Hanya untuk halaman masuk, layar tunggu, dan cetak (PRD 5.3.2 aturan 4)" }
            foto_url: { type: [string, 'null'] }
        kontak_admin:
          type: object
          required: [unit, kontak]
          description: "Untuk teks halaman masuk dan Beranda (lupa sandi, akun terkunci, 'Bukan Anda?')"
          properties:
            unit: { type: string, description: "Bawaan \"admin SIMRS\"" }
            kontak: { type: [string, 'null'], examples: ['ext. 1234'] }
        instalasi_demo:
          type: boolean
          description: "Instalasi demo/pelatihan berisi data sintetis (FR-54-10): pita \"DEMO — data fiktif\" di setiap layar, termasuk halaman masuk. Ditetapkan saat pemasangan di server, tidak bisa diubah dari layar."
        rinci:
          type: object
          description: "Hanya untuk pemegang izin pengaturan.profil_rs.lihat; tidak dikirim tanpa sesi atau tanpa izin."
          required: [kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, status_penyiapan, diubah_pada]
          properties:
            kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
            kelas: { type: [string, 'null'], maxLength: 20, description: "Klasifikasi RS sesuai izin operasional (mis. B); tidak dibatasi daftar tetap (PRD 17.2 T-1)" }
            status_blu: { type: [boolean, 'null'] }
            kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
            alamat: { type: [string, 'null'], maxLength: 500 }
            status_penyiapan: { type: string, enum: [belum, sebagian, selesai], description: "Langkah 2 wizard (FR-54-08); rinci per langkah di tiket 1.8f" }
            diubah_pada: { type: [string, 'null'], format: date-time }
    IsianProfilRs:
      type: object
      required: [nama, kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, warna, kontak_admin, dasar_perubahan]
      properties:
        nama: { type: string, minLength: 3, maxLength: 200 }
        kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
        kelas: { type: [string, 'null'], maxLength: 20 }
        status_blu: { type: [boolean, 'null'] }
        kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
        alamat: { type: [string, 'null'], maxLength: 500 }
        warna:
          type: object
          required: [brand, accent]
          properties:
            brand: { $ref: '#/components/schemas/WarnaHex' }
            accent: { $ref: '#/components/schemas/WarnaHex' }
        kontak_admin:
          type: object
          required: [unit, kontak]
          properties:
            unit: { type: string, minLength: 2, maxLength: 100 }
            kontak: { type: [string, 'null'], maxLength: 100 }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    RingkasPegawai:
      type: [object, 'null']
      required: [id, nama, status]
      properties:
        id: { type: string, format: uuid, description: "sdm.pegawai.id (bukan akun)" }
        nama: { type: string }
        status: { $ref: '#/components/schemas/StatusPegawai', description: "Sejak 1.8d: menandai kepala unit/ketua KSM yang sudah keluar tanpa izin sdm.pegawai" }
    JenisUnit:
      type: string
      enum: [instalasi, bidang, bagian, ruang, poli, depo]
      description: "PRD 11.2 inti.unit_organisasi.jenis"
    UnitOrganisasi:
      type: object
      required: [id, induk_id, kode, nama, jenis, status, berlaku_dari, kepala, jumlah_anak, jalur, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        induk_id: { type: [string, 'null'], format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        status: { type: string, enum: [aktif, nonaktif] }
        berlaku_dari: { type: string, format: date }
        kepala: { $ref: '#/components/schemas/RingkasPegawai', description: "Kepala unit (pegawai); null = belum ditetapkan. Dipakai eskalasi tugas (1.7)" }
        jumlah_anak: { type: integer, minimum: 0, description: "Anak langsung (aktif dan nonaktif)" }
        jalur:
          type: array
          description: "Induk dari akar sampai induk langsung, untuk breadcrumb"
          items:
            type: object
            required: [id, kode, nama]
            properties:
              id: { type: string, format: uuid }
              kode: { type: string }
              nama: { type: string }
        versi: { type: string, description: "Sama dengan ETag" }
        diubah_pada: { type: string, format: date-time }
    IsianUnitOrganisasi:
      type: object
      required: [induk_id, kode, nama, jenis, dasar_perubahan]
      properties:
        induk_id: { type: [string, 'null'], format: uuid, description: "null = unit tingkat teratas" }
        kode: { $ref: '#/components/schemas/KodeData' }
        nama: { type: string, minLength: 2, maxLength: 150 }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        berlaku_dari: { type: [string, 'null'], format: date, description: "Kosong = hari ini (zona waktu RS)" }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    Ksm:
      type: object
      required: [id, kode, nama, status, ketua, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
        ketua: { $ref: '#/components/schemas/RingkasPegawai', description: "Ketua KSM (pegawai); null = belum ditetapkan" }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    JenisLokasi:
      type: string
      enum: [situs, gedung, sayap, lantai, ruang, tempat_tidur]
      description: "Padanan FHIR Location.physicalType si/bu/wi/lvl/ro/bd (tiket 1.8b)"
    StatusLokasi:
      type: string
      enum: [aktif, renovasi, ditutup]
    FungsiRuang:
      type: [string, 'null']
      enum: [rawat_inap, rawat_jalan, igd, kamar_operasi, intensif, penunjang, administrasi, gudang, lainnya, null]
      description: "Wajib untuk ruang, kosong untuk jenis lain"
    KodeLokasi:
      type: string
      pattern: '^[A-Z0-9]{1,10}$'
      description: "Segmen kode, tanpa tanda hubung (pemisah kode_lengkap), mis. B, 3, 304, 2"
    RingkasUnit:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    RingkasLokasi:
      type: object
      required: [id, kode_lengkap, nama]
      properties:
        id: { type: string, format: uuid }
        kode_lengkap: { type: string }
        nama: { type: string }
    Lokasi:
      type: object
      required: [id, induk_id, jenis, kode, kode_lengkap, nama, fungsi, unit, status, status_berlaku_dari, satusehat_lokasi_id, kamar_id, tempat_tidur_id, jumlah_anak, jalur, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        induk_id: { type: [string, 'null'], format: uuid }
        jenis: { $ref: '#/components/schemas/JenisLokasi' }
        kode: { type: string }
        kode_lengkap: { type: string, examples: ['B-3-304-2'] }
        nama: { type: string }
        fungsi: { $ref: '#/components/schemas/FungsiRuang' }
        unit:
          description: "Unit pengelola saat ini; null = belum ditetapkan"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/StatusLokasi' }
        status_berlaku_dari: { type: string, format: date }
        satusehat_lokasi_id: { type: [string, 'null'], description: "Diisi integrasi SATUSEHAT (tiket 1.9); hanya baca" }
        kamar_id: { type: [string, 'null'], format: uuid, description: "Ruang yang menjadi kamar rawat" }
        tempat_tidur_id: { type: [string, 'null'], format: uuid, description: "Untuk jenis tempat_tidur" }
        jumlah_anak: { type: integer, minimum: 0, description: "Anak langsung semua jenis dan status, termasuk node TT dan yang ditutup" }
        jalur:
          type: array
          description: "Induk dari akar sampai induk langsung, untuk breadcrumb"
          items: { $ref: '#/components/schemas/RingkasLokasi' }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianLokasi:
      type: object
      required: [induk_id, jenis, kode, nama, dasar_perubahan]
      properties:
        induk_id: { type: [string, 'null'], format: uuid, description: "null = akar (situs atau gedung)" }
        jenis: { $ref: '#/components/schemas/JenisLokasi' }
        kode: { $ref: '#/components/schemas/KodeLokasi' }
        nama: { type: string, minLength: 2, maxLength: 150 }
        fungsi: { $ref: '#/components/schemas/FungsiRuang' }
        unit_organisasi_id: { type: [string, 'null'], format: uuid }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    HasilImporLokasi:
      type: object
      required: [mode, diterapkan, jumlah_baris, jumlah_salah, per_jenis, kesalahan, kesalahan_terpotong]
      properties:
        mode: { type: string, enum: [pratinjau, terapkan] }
        diterapkan: { type: boolean }
        jumlah_baris: { type: integer, minimum: 0 }
        jumlah_salah: { type: integer, minimum: 0, description: "Jumlah baris yang salah" }
        per_jenis:
          type: object
          description: "Jumlah baris per jenis lokasi, plus kamar yang terbentuk"
          required: [situs, gedung, sayap, lantai, ruang, tempat_tidur, kamar]
          properties:
            situs: { type: integer, minimum: 0 }
            gedung: { type: integer, minimum: 0 }
            sayap: { type: integer, minimum: 0 }
            lantai: { type: integer, minimum: 0 }
            ruang: { type: integer, minimum: 0 }
            tempat_tidur: { type: integer, minimum: 0 }
            kamar: { type: integer, minimum: 0 }
        kesalahan:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/KesalahanBarisImpor' }
        kesalahan_terpotong: { type: boolean, description: "true bila kesalahan lebih dari 500 baris" }
    KesalahanBarisImpor:
      type: object
      required: [baris, kolom, kode, pesan]
      properties:
        baris: { type: integer, minimum: 2, description: "Nomor baris di berkas (judul kolom = baris 1)" }
        kolom: { type: [string, 'null'] }
        kode: { type: string }
        pesan: { type: string }
    Bangsal:
      type: object
      required: [id, kode, nama, unit, status, jumlah_kamar, ringkasan_tt, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        unit: { $ref: '#/components/schemas/RingkasUnit' }
        status: { type: string, enum: [aktif, nonaktif] }
        jumlah_kamar: { type: integer, minimum: 0 }
        ringkasan_tt:
          type: array
          description: |
            TT per kelas, dilihat hari ini (zona RS). `jumlah_tersedia` + `jumlah_ekstra` = TT yang dihitung hari ini (sama
            dengan /kapasitas-tempat-tidur hari ini). `akan_ditutup` ⊂ keduanya (masih dihitung, sudah dijadwalkan tutup).
            `belum_berlaku` = TT yang mulai dihitung sesudah hari ini. `ditutup` = kumulatif TT yang sudah tidak dihitung.
            Kelompok yang saling lepas: (jumlah_tersedia + jumlah_ekstra), belum_berlaku, ditutup.
          items:
            type: object
            required: [kelas_rawat, jumlah_tersedia, jumlah_ekstra, akan_ditutup, belum_berlaku, ditutup]
            properties:
              kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
              jumlah_tersedia: { type: integer, minimum: 0, description: "Dihitung hari ini, bukan ekstra" }
              jumlah_ekstra: { type: integer, minimum: 0, description: "Dihitung hari ini, ekstra" }
              akan_ditutup: { type: integer, minimum: 0 }
              belum_berlaku: { type: integer, minimum: 0 }
              ditutup: { type: integer, minimum: 0 }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    AtributKamar:
      type: object
      description: |
        Atribut standar ruang rawat (FR-08-19; KRIS dan kelas lama) sebagai daftar periksa: kunci snake_case,
        nilai boolean/angka/teks pendek. Isi kriteria tidak dikodekan keras (perlu verifikasi); daftar periksa baku per RS
        menunggu keputusan pemilik (backlog).
      maxProperties: 50
      propertyNames: { pattern: '^[a-z][a-z0-9_]{1,49}$' }
      additionalProperties:
        type: [boolean, number, string]
        maxLength: 100
    Kamar:
      type: object
      required: [id, nomor, bangsal, lokasi, kapasitas_maksimum, atribut_standar, jumlah_tempat_tidur_aktif, melebihi_kapasitas, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, description: "Kode ruang (segmen terakhir kode_lengkap)" }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        lokasi:
          type: object
          description: "Ruang fisik kamar ini"
          required: [id, kode_lengkap, nama]
          properties:
            id: { type: string, format: uuid }
            kode_lengkap: { type: string }
            nama: { type: string }
        kapasitas_maksimum: { type: [integer, 'null'], minimum: 1 }
        atribut_standar: { $ref: '#/components/schemas/AtributKamar' }
        jumlah_tempat_tidur_aktif: { type: integer, minimum: 0, description: "TT yang dihitung hari ini, termasuk ekstra (dasar melebihi_kapasitas)" }
        melebihi_kapasitas: { type: boolean }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianKamar:
      type: object
      required: [bangsal_id, lokasi_id, dasar_perubahan]
      properties:
        bangsal_id: { type: string, format: uuid }
        lokasi_id: { type: string, format: uuid, description: "Lokasi jenis ruang" }
        kapasitas_maksimum: { type: [integer, 'null'], minimum: 1, maximum: 99 }
        atribut_standar: { $ref: '#/components/schemas/AtributKamar' }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    StatusOperasionalTt:
      type: string
      enum: [belum_berlaku, aktif, akan_ditutup, ditutup]
      description: "Diturunkan dari tanggal (zona RS), diperiksa berurutan: ditutup = berlaku_sampai < hari ini; akan_ditutup = berlaku_sampai ≥ hari ini; belum_berlaku = berlaku_dari > hari ini; selain itu aktif"
    AturanJenisKelamin:
      type: string
      enum: [campur, laki_laki, perempuan]
    RingkasBangsal:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    RingkasKamar:
      type: object
      required: [id, nomor, kode_lengkap, nama]
      properties:
        id: { type: string, format: uuid, description: "id kamar" }
        nomor: { type: string }
        kode_lengkap: { type: string, description: "kode_lengkap ruangnya" }
        nama: { type: string, description: "Nama ruangnya" }
    RingkasKelasRawat:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    TempatTidur:
      type: object
      required: [id, kode, kamar, bangsal, lokasi_id, kelas_rawat, aturan_jenis_kelamin, isolasi, ekstra, status_operasional, berlaku_dari, berlaku_sampai, alasan_tutup, satusehat_lokasi_id, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, examples: ['B-3-304-2'], description: "Tidak pernah berubah atau dipakai ulang" }
        kamar: { $ref: '#/components/schemas/RingkasKamar' }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        lokasi_id: { type: string, format: uuid, description: "Node lokasi jenis tempat_tidur" }
        kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
        aturan_jenis_kelamin: { $ref: '#/components/schemas/AturanJenisKelamin' }
        isolasi: { type: boolean }
        ekstra: { type: boolean, description: "TT tambahan saat lonjakan, dihitung terpisah" }
        status_operasional: { $ref: '#/components/schemas/StatusOperasionalTt' }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai: { type: [string, 'null'], format: date, description: "Hari terakhir TT dihitung; null = tanpa batas" }
        alasan_tutup: { type: [string, 'null'] }
        satusehat_lokasi_id: { type: [string, 'null'] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianTempatTidur:
      type: object
      required: [kamar_id, kode, kelas_rawat_id, dasar_perubahan]
      properties:
        kamar_id: { type: string, format: uuid }
        kode: { $ref: '#/components/schemas/KodeLokasi' }
        kelas_rawat_id: { type: string, format: uuid }
        aturan_jenis_kelamin: { $ref: '#/components/schemas/AturanJenisKelamin', description: "Kosong = campur" }
        isolasi: { type: boolean, default: false }
        ekstra: { type: boolean, default: false }
        berlaku_dari: { type: [string, 'null'], format: date, description: "Hari pertama dihitung (≥ hari ini); kosong = hari ini" }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    KelasRawat:
      type: object
      required: [id, kode, nama, kode_aplicares, berlaku_dari, status, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        kode_aplicares: { type: [string, 'null'] }
        berlaku_dari: { type: string, format: date }
        status: { type: string, enum: [aktif, nonaktif] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    Poliklinik:
      type: object
      required: [id, kode, nama, unit, lokasi, kode_poli_bpjs, status, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        unit: { $ref: '#/components/schemas/RingkasUnit' }
        lokasi:
          description: "Ruang poli; null = belum dipetakan"
          oneOf: [{ $ref: '#/components/schemas/RingkasLokasi' }, { type: 'null' }]
        kode_poli_bpjs: { type: [string, 'null'] }
        status: { type: string, enum: [aktif, nonaktif] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    KapasitasBangsal:
      type: object
      required: [tanggal, sumber, bangsal, kelas]
      properties:
        tanggal: { type: string, format: date }
        sumber: { type: string, enum: [tersimpan, dihitung] }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        kelas:
          type: array
          items:
            type: object
            required: [kelas_rawat, jumlah_tersedia, jumlah_ekstra]
            properties:
              kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
              jumlah_tersedia: { type: integer, minimum: 0 }
              jumlah_ekstra: { type: integer, minimum: 0 }
    StatusPegawai:
      type: string
      enum: [aktif, akan_keluar, keluar]
      description: "Diturunkan dari tanggal_keluar (zona RS): akan_keluar = tanggal_keluar > hari ini; keluar = tanggal_keluar ≤ hari ini"
    Profesi:
      type: [string, 'null']
      enum: [dokter, dokter_gigi, perawat, bidan, apoteker, tenaga_kesehatan_lain, non_kesehatan, null]
      description: "Kelompok profesi untuk syarat izin praktik (lapis 5). Rincian jabatan/spesialisasi di `jabatan`"
    RingkasUnitPegawai:
      type: [object, 'null']
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    StatusIzinPraktik:
      type: string
      enum: [belum_berlaku, berlaku, akan_habis, habis, batal]
      description: "akan_habis = berlaku_sampai dalam N hari (konfigurasi, angka awal 60 mengikuti contoh FR-40-01; perlu verifikasi kebijakan RS)"
    PegawaiRingkas:
      type: object
      required: [id, nip, nama, nik_samaran, profesi, jabatan, unit, status, punya_akun, akun, izin_praktik_status]
      properties:
        id: { type: string, format: uuid }
        nip: { type: [string, 'null'] }
        nama: { type: string }
        nik_samaran: { type: [string, 'null'], examples: ['1271 •••• •••• 0042'], description: "4 digit awal dan akhir; null = NIK belum diisi" }
        profesi: { $ref: '#/components/schemas/Profesi' }
        jabatan: { type: [string, 'null'] }
        unit: { $ref: '#/components/schemas/RingkasUnitPegawai' }
        status: { $ref: '#/components/schemas/StatusPegawai' }
        punya_akun: { type: boolean }
        akun:
          type: [object, 'null']
          description: "Hanya dikirim isinya untuk pemegang pengaturan.akun.lihat; selain itu null (lihat punya_akun)"
          required: [id, nama_pengguna, status]
          properties:
            id: { type: string, format: uuid }
            nama_pengguna: { type: string }
            status: { type: string, enum: [aktif, nonaktif] }
        izin_praktik_status:
          type: [string, 'null']
          enum: [belum_berlaku, berlaku, akan_habis, habis, null]
          description: "Keadaan terburuk di antara izin praktik yang tidak dibatalkan; null = belum ada izin praktik"
    PegawaiRinci:
      allOf:
        - $ref: '#/components/schemas/PegawaiRingkas'
        - type: object
          required: [jenis_kepegawaian, tmt, tanggal_keluar, alasan_keluar, ihs_practitioner_id, nik_dapat_dilihat, versi, diubah_pada]
          properties:
            nik: { type: string, pattern: '^[0-9]{16}$', description: "Hanya pada GET dengan tampilkan_nik=true dan izin sdm.pegawai.identitas.lihat" }
            nik_dapat_dilihat: { type: boolean, description: "Akun ini punya izin bagian identitas (tombol Tampilkan NIK boleh dirender)" }
            jenis_kepegawaian: { type: [string, 'null'], description: "Isian bebas RS, mis. PNS, PPPK, pegawai BLU, kontrak" }
            tmt: { type: [string, 'null'], format: date }
            tanggal_keluar: { type: [string, 'null'], format: date }
            alasan_keluar: { type: [string, 'null'] }
            ihs_practitioner_id: { type: [string, 'null'], description: "Diisi integrasi SATUSEHAT (1.9); hanya baca" }
            versi: { type: string }
            diubah_pada: { type: string, format: date-time }
    IsianPegawai:
      type: object
      required: [nama, dasar_perubahan]
      properties:
        nip: { type: [string, 'null'], maxLength: 30 }
        nik: { type: [string, 'null'], pattern: '^[0-9]{16}$', description: "Butuh izin sdm.pegawai.identitas.lihat untuk mengisi" }
        nama: { type: string, minLength: 2, maxLength: 150 }
        jenis_kepegawaian: { type: [string, 'null'], maxLength: 50 }
        profesi: { $ref: '#/components/schemas/Profesi' }
        unit_organisasi_id: { type: [string, 'null'], format: uuid }
        jabatan: { type: [string, 'null'], maxLength: 150 }
        tmt: { type: [string, 'null'], format: date }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    JenisIzinPraktik:
      type: string
      enum: [str, sip, sik, spk]
    IzinPraktik:
      type: object
      required: [id, jenis, nomor, terbit, berlaku_sampai, status, dokumen, dicatat_oleh, dicatat_pada, alasan_batal, dibatalkan_oleh, dibatalkan_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { $ref: '#/components/schemas/JenisIzinPraktik' }
        nomor: { type: string }
        terbit: { type: string, format: date }
        berlaku_sampai: { type: [string, 'null'], format: date, description: "null = seumur hidup (STR)" }
        status: { $ref: '#/components/schemas/StatusIzinPraktik' }
        dokumen:
          type: [object, 'null']
          required: [jenis_mime, ukuran]
          properties:
            jenis_mime: { type: string, enum: [application/pdf, image/jpeg, image/png] }
            ukuran: { type: integer, minimum: 1 }
        dicatat_oleh: { $ref: '#/components/schemas/Pelaku' }
        dicatat_pada: { type: string, format: date-time }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
    KewenanganKlinis:
      type: object
      required: [id, kategori, kode_tindakan, berlaku_dari, berlaku_sampai, komite, dasar, status, dicatat_oleh, dicatat_pada, alasan_batal, dibatalkan_oleh, dibatalkan_pada]
      properties:
        id: { type: string, format: uuid }
        kategori: { type: string }
        kode_tindakan: { type: array, items: { type: string } }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai: { type: string, format: date }
        komite: { type: string }
        dasar: { type: [string, 'null'] }
        status: { type: string, enum: [belum_berlaku, berlaku, habis, batal] }
        dicatat_oleh: { $ref: '#/components/schemas/Pelaku' }
        dicatat_pada: { type: string, format: date-time }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
    Notifikasi:
      type: object
      required: [id, jenis, judul, isi, tautan, prioritas, tugas_id, dibaca_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: string, description: "Kode jenis tugas (mis. PERSETUJUAN_AKSES_MENUNGGU) atau jenis akun (AKUN_TERKUNCI, TTD_TERKUNCI, TTD_DICABUT)" }
        judul: { type: string }
        isi: { type: string, description: "Tanpa data pasien, sandi, atau alamat IP lengkap" }
        tautan: { type: [string, 'null'], description: "Rute SPA, mis. /pengaturan/persetujuan/{id}" }
        prioritas: { type: string, enum: [biasa, penting, kritis] }
        tugas_id: { type: [string, 'null'], format: uuid }
        dibaca_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    KanalPreferensi:
      type: object
      required: [aktif, dapat_diubah]
      properties:
        aktif: { type: boolean }
        dapat_diubah: { type: boolean }
    PreferensiNotifikasi:
      type: object
      required: [jenis, nama, kritis, in_app, email, pesan_singkat]
      properties:
        jenis: { type: string }
        nama: { type: string }
        kritis: { type: boolean }
        in_app: { type: boolean, const: true }
        email: { $ref: '#/components/schemas/KanalPreferensi' }
        pesan_singkat: { $ref: '#/components/schemas/KanalPreferensi' }
    PelaksanaTugas:
      type: object
      required: [jenis, id, nama]
      properties:
        jenis: { type: string, enum: [pengguna, peran, unit] }
        id: { type: string, format: uuid }
        nama: { type: string }
    Tugas:
      type: object
      required: [id, jenis, judul, objek, tautan, pelaksana, tenggat_pada, tingkat_saat_ini, status, terlambat, kritis, dibuat_pada, selesai_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: object, required: [kode, nama], properties: { kode: { type: string }, nama: { type: string } } }
        judul: { type: string, description: "Ringkasan tanpa data pasien bila tugas dikirim lewat email" }
        objek:
          type: object
          required: [jenis, id, label]
          properties:
            jenis: { type: string, description: "Mis. persetujuan_akses, permintaan_akses, izin_praktik" }
            id: { type: string, format: uuid }
            label: { type: string }
        tautan: { type: string, description: "Rute SPA layar penyelesaian (FR-53-02)" }
        pelaksana: { $ref: '#/components/schemas/PelaksanaTugas' }
        tenggat_pada: { type: string, format: date-time }
        tingkat_saat_ini: { type: integer, minimum: 0, maximum: 3, description: "0 = belum ada pengingat; 1 pengingat; 2 teguran; 3 eskalasi" }
        status: { type: string, enum: [terbuka, selesai, batal] }
        terlambat: { type: boolean, description: "Tenggat lewat (terbuka), atau selesai sesudah tenggat" }
        kritis: { type: boolean }
        dibuat_pada: { type: string, format: date-time }
        selesai_pada: { type: [string, 'null'], format: date-time }
    TugasRinci:
      allOf:
        - $ref: '#/components/schemas/Tugas'
        - type: object
          required: [riwayat]
          properties:
            riwayat:
              type: array
              description: "Linimasa (FR-53-07), urut waktu"
              items:
                type: object
                required: [jenis, tingkat, terjadi_pada, penerima, kanal, catatan]
                properties:
                  jenis: { type: string, enum: [dibuat, pengingat, teguran, eskalasi, selesai, batal] }
                  tingkat: { type: integer, minimum: 0, maximum: 3 }
                  terjadi_pada: { type: string, format: date-time }
                  penerima:
                    type: array
                    description: "Kosong = tanpa penerima (mis. kepala unit belum ditetapkan)"
                    items: { type: object, required: [id, nama], properties: { id: { type: string, format: uuid }, nama: { type: string } } }
                  kanal: { type: array, items: { type: string, enum: [in_app, email, pesan_singkat] } }
                  catatan: { type: [string, 'null'], description: "Mis. tanpa penerima (kepala unit belum ditetapkan), atau kejadian penyelesai" }
    AturanEskalasi:
      type: object
      required: [pengingat_menit, teguran_menit, eskalasi_menit]
      description: "Menit relatif terhadap tenggat (negatif = sebelum tenggat). Tingkat 1 < 0 ≤ tingkat 2 ≤ tingkat 3"
      properties:
        pengingat_menit: { type: integer, maximum: -1, minimum: -525600, description: "Tingkat 1 ke pelaksana, sebelum tenggat" }
        teguran_menit: { type: integer, minimum: 0, maximum: 525600, description: "Tingkat 2 ke kepala unit, sesudah tenggat" }
        eskalasi_menit: { type: integer, minimum: 0, maximum: 525600, description: "Tingkat 3 ke kepala bidang + dasbor Direktur" }
    JenisTugas:
      type: object
      required: [id, kode, nama, uraian, modul, tenggat_dari, batas_menit, unit_teguran, unit_eskalasi, eskalasi, kritis, aktif, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, examples: ['PERSETUJUAN_AKSES_MENUNGGU'] }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        modul: { type: string, description: "Modul pembuat tugas, mis. akses, sdm" }
        tenggat_dari: { type: string, enum: [dibuat, objek], description: "dibuat = tenggat = dibuat + batas_menit; objek = tenggat dari tanggal objek (mis. izin praktik berakhir) dan tugas dibuat batas_menit sebelum itu" }
        batas_menit: { type: integer, minimum: 1 }
        unit_teguran:
          description: "Unit tujuan teguran (tingkat 2) bila tugas tanpa unit; null = hanya unit tugas"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        unit_eskalasi:
          description: "Unit tujuan eskalasi (tingkat 3); null = unit induk dari unit tingkat 2"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        eskalasi: { $ref: '#/components/schemas/AturanEskalasi' }
        kritis: { type: boolean, description: "Notifikasinya tidak bisa dimatikan preferensi" }
        aktif: { type: boolean }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    RingkasPeran:
      type: [object, 'null']
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    StatusPersetujuan:
      type: string
      enum: [menunggu, disetujui, ditolak, kedaluwarsa, dibatalkan]
    PersetujuanAkses:
      type: object
      required: [id, nomor, jenis, ringkasan, objek, penyetuju_peran, penyetuju_pengguna, status, diterapkan, diajukan_oleh, diajukan_pada, alasan, dasar, kedaluwarsa_pada, diputuskan_oleh, diputuskan_pada, catatan_keputusan, grup, akun_terdampak, dapat_diputuskan]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['PSA-2026-000012'], description: "Dipakai sebagai dasar pemberian" }
        jenis: { type: string, enum: [izin_sensitif, peran_superadmin, pengecualian, reset_ttd] }
        ringkasan: { type: string, examples: ["Tambah izin Kasir → Tagihan pasien → Batal ke peran Kasir Rawat Jalan"] }
        objek:
          type: object
          required: [jenis]
          description: "Perubahan yang akan diterapkan bila disetujui"
          properties:
            jenis: { type: string, enum: [izin_peran, penugasan, pengakhiran_penugasan, izin_khusus, penyetuju_izin, reset_ttd] }
            penugasan_id: { type: [string, 'null'], format: uuid, description: "Untuk pengakhiran_penugasan" }
            peran: { $ref: '#/components/schemas/RingkasPeran' }
            akun:
              type: [object, 'null']
              required: [id, nama_pengguna, nama]
              properties:
                id: { type: string, format: uuid }
                nama_pengguna: { type: string }
                nama: { type: string }
            izin:
              type: [object, 'null']
              required: [kode, label]
              properties:
                kode: { type: string }
                label: { type: string }
            cakupan_label: { type: [string, 'null'] }
            berlaku_sampai: { type: [string, 'null'], format: date-time }
        penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran', description: "null bila penyetujunya orang (penyetuju_pengguna)" }
        penyetuju_pengguna:
          $ref: '#/components/schemas/Pelaku'
          description: "Sejak 1.6. Penyetuju orang tertentu (reset_ttd: atasan langsung pemilik TTE, ditetapkan saat diajukan); null = penyetujunya pemegang penyetuju_peran"
        status: { $ref: '#/components/schemas/StatusPersetujuan' }
        diterapkan: { type: boolean, description: "true = perubahan sudah berlaku (semua persetujuan dalam grup disetujui)" }
        diajukan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diajukan_pada: { type: string, format: date-time }
        alasan: { type: [string, 'null'] }
        dasar: { type: string }
        kedaluwarsa_pada: { type: string, format: date-time }
        diputuskan_oleh: { $ref: '#/components/schemas/Pelaku', description: "null = belum diputuskan, atau diputuskan sistem (kedaluwarsa, tidak bisa diterapkan)" }
        diputuskan_pada: { type: [string, 'null'], format: date-time }
        catatan_keputusan: { type: [string, 'null'] }
        grup:
          type: object
          required: [id, jumlah, disetujui]
          description: "Satu pengajuan bisa butuh beberapa penyetuju (mis. peran berisi izin sensitif milik beberapa pemilik data)"
          properties:
            id: { type: string, format: uuid }
            jumlah: { type: integer, minimum: 1 }
            disetujui: { type: integer, minimum: 0 }
        akun_terdampak: { type: integer, minimum: 0 }
        dapat_diputuskan: { type: boolean, description: "Akun yang sedang masuk boleh menyetujui/menolak ini sekarang" }
    StatusTtd:
      type: object
      required: [aktif, diaktifkan_pada, dicabut_pada, terkunci_sampai, sesi_berlaku_sampai, reset_menunggu]
      description: "TTE T1 akun yang sedang masuk (tiket 1.6). Tidak memuat kunci publik/privat maupun PIN."
      properties:
        aktif: { type: boolean, description: "false = belum diaktifkan, atau dicabut karena reset (aktifkan ulang dengan PIN baru)" }
        diaktifkan_pada: { type: [string, 'null'], format: date-time }
        dicabut_pada: { type: [string, 'null'], format: date-time, description: "Terisi bila TTE terakhir dicabut karena reset dan belum diaktifkan ulang (null = belum pernah aktif, atau aktif)" }
        terkunci_sampai: { type: [string, 'null'], format: date-time, description: "Terisi selama terkunci karena 5 PIN salah" }
        sesi_berlaku_sampai: { type: [string, 'null'], format: date-time, description: "Sesi tanda tangan (15 menit sesudah PIN benar, sesi login yang sama): tandatangani tanpa PIN sampai waktu ini" }
        reset_menunggu: { type: boolean, description: "Ada persetujuan reset_ttd menunggu untuk akun ini" }
    TandaTangan:
      type: object
      required: [id, objek_jenis, objek_id, penanda_tangan, tingkat, metode, hash_isi, sidik_kunci, kredensial_dicabut, ditandatangani_pada, verifikasi]
      properties:
        id: { type: string, format: uuid }
        objek_jenis: { type: string, enum: [persetujuan_akses, usulan_data_induk] }
        objek_id: { type: string, format: uuid }
        penanda_tangan:
          type: object
          required: [id, nama, nip]
          properties:
            id: { type: string, format: uuid, description: "id akun" }
            nama: { type: string, description: "Nama pegawai (nama pengguna bila akun tanpa pegawai)" }
            nip: { type: [string, 'null'] }
        tingkat: { type: string, enum: [T1] }
        metode: { type: string, enum: [pin] }
        hash_isi: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 isi kanonik saat ditandatangani" }
        sidik_kunci: { type: string, pattern: '^[0-9a-f]{16}$', description: "16 hex awal SHA-256 kunci publik yang dipakai" }
        kredensial_dicabut: { type: boolean, description: "true = kunci yang dipakai sudah diganti karena reset (tanda tangan tetap bisa sah)" }
        ditandatangani_pada: { type: string, format: date-time, description: "Cap waktu server" }
        verifikasi:
          type: object
          required: [status, diperiksa_pada]
          properties:
            status:
              type: string
              enum: [sah, isi_berubah, tanda_tangan_tidak_sah]
              description: "sah = isi saat ini sama dengan yang ditandatangani dan tanda tangan cocok dengan kunci publiknya (juga bila kredensial itu sudah dicabut karena reset)"
            diperiksa_pada: { type: string, format: date-time }
    JenisDataInduk:
      type: string
      enum: [ruang_tt]
      description: "Kelompok data induk dengan satu alur usulan (pemilik/pemverifikasi/penyetuju). Fase 1: ruang & TT (FR-08-16)"
    ObjekDataInduk:
      type: string
      enum: [ruang, kamar, tempat_tidur]
      description: "ruang = lokasi jenis ruang (1.8b)"
    TahapUsulan:
      type: string
      enum: [diusulkan, diverifikasi, disetujui, berlaku, dikembalikan, gagal_diterapkan]
      description: "berlaku dan gagal_diterapkan final"
    IsianUsulanDataInduk:
      type: object
      required: [jenis_data, perubahan, berlaku_dari, alasan, dasar]
      properties:
        jenis_data: { $ref: '#/components/schemas/JenisDataInduk' }
        perubahan: { $ref: '#/components/schemas/IsianPerubahanUsulan' }
        berlaku_dari: { type: string, format: date, description: "≥ hari ini zona RS; diterapkan 00.00 pada tanggal ini" }
        alasan: { type: string, minLength: 5, maxLength: 500 }
        dasar: { $ref: '#/components/schemas/Dasar' }
    IsianPerubahanUsulan:
      type: array
      minItems: 1
      maxItems: 50
      description: |
        Diterapkan berurutan dalam satu transaksi. Aksi per objek dan isian `nilai_baru` (aturan 1.8b yang sama):
        - tempat_tidur `tambah` (objek_id null): kamar_id, kode, kelas_rawat_id, aturan_jenis_kelamin, isolasi, ekstra
          (IsianTempatTidur tanpa berlaku_dari/dasar_perubahan; TT mulai dihitung pada `berlaku_dari` usulan);
        - tempat_tidur `ubah`: kelas_rawat_id, aturan_jenis_kelamin, isolasi, ekstra (minimal satu);
        - tempat_tidur `tutup`: alasan (TT tidak dihitung mulai `berlaku_dari`, permanen);
        - kamar `tambah` (objek_id null): bangsal_id, lokasi_id, kapasitas_maksimum, atribut_standar;
        - kamar `ubah`: bangsal_id, kapasitas_maksimum, atribut_standar (minimal satu);
        - ruang `tambah` (objek_id null): induk_id (lantai/sayap), kode, nama, fungsi, unit_organisasi_id (IsianLokasi
          jenis ruang);
        - ruang `ubah`: induk_id, kode, nama, fungsi, unit_organisasi_id, status (status berlaku pada tanggal efektif;
          minimal satu).
      items:
        type: object
        required: [objek_jenis, aksi, objek_id, nilai_baru]
        properties:
          objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
          aksi: { type: string, enum: [tambah, ubah, tutup] }
          objek_id: { type: [string, 'null'], format: uuid, description: "Wajib untuk ubah/tutup; null untuk tambah" }
          nilai_baru: { type: object, additionalProperties: true }
    ButirUsulan:
      type: object
      required: [objek_jenis, aksi, objek_id, objek_label, objek_berubah, nilai_lama, nilai_baru, tampilan]
      properties:
        objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
        aksi: { type: string, enum: [tambah, ubah, tutup] }
        objek_id: { type: [string, 'null'], format: uuid, description: "Untuk tambah: id objek baru, terisi sesudah berlaku (tidak masuk isi kanonik TTE)" }
        objek_berubah: { type: boolean, description: "Objek (ubah/tutup) berubah sejak diusulkan; penerapan akan gagal" }
        objek_label: { type: string, examples: ['ICU · Intensive care unit', 'TT B-3-304-2'] }
        nilai_lama: { type: [object, 'null'], additionalProperties: true, description: "Dipotret server saat diusulkan; null untuk tambah. Hanya isian yang diubah" }
        nilai_baru: { type: object, additionalProperties: true }
        tampilan: { type: array, items: { $ref: '#/components/schemas/TampilanIsian' } }
    TampilanIsian:
      type: object
      required: [isian, label_isian, lama, baru]
      description: "Satu baris diff siap tampil, disusun server saat dibaca (bukan isi kanonik TTE)"
      properties:
        isian: { type: string, examples: [kelas_rawat_id] }
        label_isian: { type: string, examples: ['Kelas rawat'] }
        lama: { type: [string, 'null'], examples: ['Kelas 3'], description: "null = belum ada (tambah)" }
        baru: { type: [string, 'null'], examples: ['Kelas 1', 'Ditutup mulai 15-10-2026'], description: "Selalu teks untuk tambah/ubah/tutup (tutup: \"Ditutup mulai <tanggal>\"); null hanya di riwayat versi bila isian dikosongkan" }
    RiwayatUsulan:
      type: object
      required: [aksi, oleh, pada, catatan, putaran]
      properties:
        aksi: { type: string, enum: [diajukan, diverifikasi, disetujui, dikembalikan, dikirim_ulang, diterapkan, gagal_diterapkan] }
        oleh: { $ref: '#/components/schemas/Pelaku', description: "null = sistem (penerapan terjadwal)" }
        pada: { type: string, format: date-time }
        catatan: { type: [string, 'null'] }
        putaran: { type: integer, minimum: 1 }
    UsulanDataInduk:
      type: object
      required: [id, nomor, jenis_data, ringkasan, perubahan, berlaku_dari, alasan, dasar, tahap, putaran, diusulkan_oleh, diusulkan_pada, diverifikasi_oleh, disetujui_oleh, gagal_alasan, riwayat, dapat]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['UDI-2026-000405'] }
        jenis_data: { $ref: '#/components/schemas/JenisDataInduk' }
        ringkasan: { type: string, examples: ['ICU: 12 → 16 TT'], description: "Dipotret server saat diusulkan/dikirim ulang (tidak bergeser sesudah berlaku)" }
        perubahan: { type: array, items: { $ref: '#/components/schemas/ButirUsulan' } }
        berlaku_dari: { type: string, format: date }
        alasan: { type: string }
        dasar: { type: string }
        tahap: { $ref: '#/components/schemas/TahapUsulan' }
        putaran: { type: integer, minimum: 1, description: "Naik setiap kirim ulang" }
        diusulkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diusulkan_pada: { type: string, format: date-time }
        diverifikasi_oleh: { $ref: '#/components/schemas/Pelaku', description: "Putaran ini; null bila belum" }
        disetujui_oleh: { $ref: '#/components/schemas/Pelaku' }
        gagal_alasan: { type: [string, 'null'] }
        riwayat: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RiwayatUsulan' }, description: "Urut waktu; paling banyak 200 kejadian terakhir" }
        dapat:
          type: object
          required: [verifikasi, setujui, kembalikan, kirim_ulang, tandatangani]
          description: "Tindakan yang boleh dilakukan akun yang sedang masuk sekarang"
          properties:
            verifikasi: { type: boolean }
            setujui: { type: boolean }
            kembalikan: { type: boolean }
            kirim_ulang: { type: boolean }
            tandatangani: { type: boolean, description: "Akun ini pengusul/pemverifikasi/penyetuju putaran ini sesudah tindakannya, dan belum menandatangani isi saat ini" }
    VersiDataInduk:
      type: object
      required: [id, versi, objek_jenis, objek_id, berlaku_dari, sebelum, sesudah, tampilan, usulan, dasar, diubah_oleh, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        versi: { type: integer, minimum: 1 }
        objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
        objek_id: { type: string, format: uuid }
        berlaku_dari: { type: string, format: date }
        sebelum: { type: [object, 'null'], additionalProperties: true, description: "null = objek dibuat" }
        sesudah: { type: object, additionalProperties: true }
        tampilan: { type: array, items: { $ref: '#/components/schemas/TampilanIsian' }, description: "Isian yang berubah, siap tampil" }
        usulan:
          type: [object, 'null']
          required: [id, nomor]
          properties:
            id: { type: string, format: uuid }
            nomor: { type: string }
        dasar: { type: string }
        diubah_oleh: { $ref: '#/components/schemas/Pelaku' }
        diubah_pada: { type: string, format: date-time }
    StatusPermintaan:
      type: string
      enum: [menunggu, ditindaklanjuti, ditolak]
    PermintaanAkses:
      type: object
      required: [id, nomor, akun, sasaran_jenis, sasaran_kode, sasaran_label, alasan, status, diputuskan_oleh, diputuskan_pada, catatan_keputusan, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['PMA-2026-000034'], description: "Dipakai sebagai dasar pemberian saat ditindaklanjuti" }
        akun:
          type: object
          required: [id, nama_pengguna, nama]
          properties:
            id: { type: string, format: uuid }
            nama_pengguna: { type: string }
            nama: { type: string }
        sasaran_jenis: { type: string, enum: [menu, izin] }
        sasaran_kode: { type: string }
        sasaran_label: { type: string }
        alasan: { type: string }
        status: { $ref: '#/components/schemas/StatusPermintaan' }
        diputuskan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diputuskan_pada: { type: [string, 'null'], format: date-time }
        catatan_keputusan: { type: [string, 'null'] }
        dibuat_pada: { type: string, format: date-time }
    StatusMenu:
      type: string
      enum: [aktif, segera]
      description: "aktif = halaman tersedia; segera = tampil sebagai Segera hadir (hanya pengembangan/demo)"
    SubMenu:
      type: object
      required: [kode, label, rute, status, fase]
      properties:
        kode: { type: string, description: "kode stabil, mis. igd.papan; dipakai rute dan izin" }
        label: { type: string }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6, description: "fase rencana (PRD 16), ditampilkan di SegeraHadirPage" }
    Menu:
      type: object
      required: [kode, label, ikon, rute, status, fase, sub_menu]
      properties:
        kode: { type: string }
        label: { type: string }
        ikon: { type: string, description: "nama ikon dari design-system, bukan URL" }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6 }
        jumlah_tugas: { type: [integer, 'null'], description: "Sejak 1.7: menu beranda = jumlah tab saya + dieskalasi di /saya/tugas (tugas terbuka milik akun); menu lain null" }
        sub_menu:
          type: array
          items: { $ref: '#/components/schemas/SubMenu' }
    MenuSaya:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [versi, grup, izin]
          properties:
            versi: { type: string, description: "hash isi menu+izin; berubah saat peran/penugasan/izin berubah" }
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu:
                    type: array
                    items: { $ref: '#/components/schemas/Menu' }
            izin:
              type: array
              description: "kode izin aksi yang dimiliki (format <menu>.<sub_menu>.<aksi>); dipakai v-can/PermissionGate. Server tetap memeriksa ulang setiap permintaan."
              items: { type: string }
    MetaKursor:
      type: object
      required: [kursor_berikutnya]
      description: "Bentuk dari App\\Core\\Http\\Paginasi::respons (tiket 1.0e)"
      properties:
        kursor_berikutnya: { type: [string, 'null'], description: "null = halaman terakhir" }
    Dasar:
      type: string
      minLength: 3
      maxLength: 200
      description: "Nomor SK, surat tugas, memo, atau persetujuan (Permenkes 24/2022 Ps. 30 ayat 1–2; PRD 9.2)"
    CakupanJenis:
      type: string
      enum: [rs, unit, ruang, poli, ksm, depo, pasien_dirawat]
      description: "Diterima: `rs` (cakupan_id kosong) dan `unit` (cakupan_id = unit aktif, tiket 1.8a; unit induk mencakup turunannya). Lainnya 422 cakupan_belum_didukung"
    JenisAksi:
      type: string
      enum: [lihat, input, perbaiki, sahkan, verifikasi, setujui, batal, ekspor, cetak, lihat_rupiah]
    PermintaanBatal:
      type: object
      required: [alasan_batal]
      properties:
        alasan_batal: { type: string, minLength: 5, maxLength: 500 }
    Pelaku:
      type: [object, 'null']
      description: "null = konsol/sistem"
      required: [id, nama]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
    NodeMenu:
      type: object
      required: [id, kode, label, tingkat, tersedia, modul_aktif, ikut_induk, izin, anak]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        label: { type: string }
        tingkat: { type: string, enum: [menu, sub_menu, bagian] }
        ikon: { type: [string, 'null'] }
        fase: { type: [integer, 'null'] }
        tersedia: { type: boolean, description: "Halaman sudah dibangun di versi ini" }
        modul_aktif: { type: boolean, description: "Modul dinyalakan di instalasi ini (inti.modul_aktif)" }
        ikut_induk: { type: boolean }
        izin:
          type: array
          items:
            type: object
            required: [kode, jenis_aksi, sensitif]
            properties:
              kode: { type: string }
              jenis_aksi: { $ref: '#/components/schemas/JenisAksi' }
              sensitif: { type: boolean }
              penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran', description: "Untuk izin sensitif: peran penyetuju (K3); null = belum ditetapkan. Dikirim sejak 1.2d" }
        anak:
          type: array
          items: { $ref: '#/components/schemas/NodeMenu' }
    PohonMenu:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [grup]
          properties:
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu: { type: array, items: { $ref: '#/components/schemas/NodeMenu' } }
    PeranRingkas:
      type: object
      required: [id, kode, nama, uraian, bawaan_sistem, wajib_mfa, status, jumlah_akun, memuat_izin_sensitif]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        bawaan_sistem: { type: boolean }
        wajib_mfa: { type: boolean }
        status: { type: string, enum: [aktif, nonaktif] }
        jumlah_akun: { type: integer, minimum: 0, description: "Akun dengan penugasan berlaku untuk peran ini" }
        memuat_izin_sensitif: { type: boolean }
    PeranRinci:
      allOf:
        - $ref: '#/components/schemas/PeranRingkas'
        - type: object
          required: [versi, izin, wajib_mfa_terkunci, dapat_disunting, alasan_terkunci, diubah_pada]
          properties:
            versi: { type: string, description: "Sama dengan ETag; naik setiap perubahan peran dari layar (PATCH atau PUT izin)" }
            izin: { type: array, items: { type: string }, description: "Kode izin aksi yang diberikan" }
            wajib_mfa_terkunci: { type: boolean, description: "true = superadmin atau memuat izin sensitif; sakelar MFA dinonaktifkan di layar" }
            izin_menunggu:
              type: array
              description: "Izin sensitif yang menunggu persetujuan untuk peran ini (sejak 1.2d); tidak termasuk di `izin`"
              items:
                type: object
                required: [kode, persetujuan_id, penyetuju_peran, kedaluwarsa_pada]
                properties:
                  kode: { type: string }
                  persetujuan_id: { type: string, format: uuid }
                  penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran' }
                  kedaluwarsa_pada: { type: string, format: date-time }
            dapat_disunting: { type: boolean, description: "false bila peran bawaan terkunci atau dipegang penyunting" }
            alasan_terkunci: { type: [string, 'null'], enum: [peran_bawaan_terkunci, peran_sendiri, null] }
            diubah_pada: { type: string, format: date-time }
    StatusMfaAkun:
      type: object
      required: [aktif, aktif_pada, wajib_akun, sumber_wajib, dapat_direset]
      properties:
        aktif: { type: boolean, description: "Autentikator sudah didaftarkan" }
        aktif_pada: { type: [string, 'null'], format: date-time }
        wajib_akun: { type: boolean, description: "Sakelar tingkat akun (akses.pengguna.wajib_mfa)" }
        sumber_wajib:
          type: array
          description: "Alasan MFA wajib di dalam jaringan RS. Kosong = di jaringan RS tidak wajib. Dari luar jaringan RS selalu wajib (tidak dicantumkan di sini)."
          items:
            type: object
            required: [jenis, label, dapat_dimatikan]
            properties:
              jenis: { type: string, enum: [akun, peran, superadmin, izin_sensitif] }
              label: { type: string, examples: ["Peran Superadmin", "Sakelar akun"] }
              dapat_dimatikan: { type: boolean }
        dapat_direset: { type: boolean, description: "false bila MFA belum aktif, akun milik penyunting, atau akun superadmin dan penyunting bukan superadmin" }
    AkunRingkas:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, peran, pengecualian, mfa_aktif]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string, description: "Nama pegawai" }
        status: { type: string, enum: [aktif, nonaktif] }
        terkunci_sampai: { type: [string, 'null'], format: date-time }
        login_terakhir_pada: { type: [string, 'null'], format: date-time }
        peran:
          type: array
          description: "Peran dengan penugasan berlaku"
          items:
            type: object
            required: [id, nama, berlaku_sampai]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
              berlaku_sampai: { type: [string, 'null'], format: date-time }
        pengecualian:
          type: object
          required: [tambah, cabut]
          properties:
            tambah: { type: integer, minimum: 0 }
            cabut: { type: integer, minimum: 0 }
        mfa_aktif: { type: boolean }
    Penugasan:
      type: object
      required: [id, peran, cakupan_jenis, cakupan_id, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        peran:
          type: object
          required: [id, kode, nama]
          properties:
            id: { type: string, format: uuid }
            kode: { type: string }
            nama: { type: string }
        cakupan_jenis: { $ref: '#/components/schemas/CakupanJenis' }
        cakupan_id: { type: [string, 'null'], format: uuid }
        cakupan_label: { type: [string, 'null'], description: "Nama unit untuk cakupan `unit` (dengan kode), null untuk `rs`; tidak perlu permintaan per baris. Dikirim sejak backend 1.8a (tidak di-`required` agar kontrak ini tetap cocok dengan backend sebelumnya)" }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: [string, 'null'] }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean, description: "aktif dan di dalam masa berlaku saat ini" }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    IzinKhusus:
      type: object
      required: [id, efek, sasaran_jenis, sasaran_kode, sasaran_label, sensitif, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        efek: { type: string, enum: [tambah, cabut] }
        sasaran_jenis: { type: string, enum: [menu, izin] }
        sasaran_kode: { type: string }
        sasaran_label: { type: string, description: "Jalur label, mis. Kasir → Tutup kasir, atau Kasir → Tagihan pasien → Batal" }
        sensitif: { type: boolean }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: string }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    AkunRinci:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, diri_sendiri, dapat_diubah, alasan_terkunci, mfa, penugasan, izin_khusus]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string }
