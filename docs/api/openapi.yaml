      summary: Rincian TT
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian TT
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TempatTidur' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahTempatTidur
      summary: Ubah kelas rawat, aturan jenis kelamin, isolasi, atau penanda ekstra
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. 409 `harus_lewat_usulan` sesudah instalasi siap melayani (1.8c),
        termasuk TT ekstra (mengubah `ekstra` mengubah kapasitas resmi). Kode dan kamar tidak bisa diubah (pindah kamar = tutup lalu buat
        TT baru). 409 `sudah_ditutup`: TT yang sudah ditutup atau dijadwalkan tutup (`akan_ditutup`) tidak bisa diubah;
        422 `kelas_rawat_tidak_valid`. Perubahan kelas/ekstra berlaku untuk kapasitas mulai
        hari ini; hari yang sudah lewat tetap memakai rekaman kapasitas harian.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kelas_rawat_id: { type: string, format: uuid }
                aturan_jenis_kelamin: { $ref: '#/components/schemas/AturanJenisKelamin' }
                isolasi: { type: boolean }
                ekstra: { type: boolean }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: TT sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TempatTidur' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tempat-tidur/{id}/tutup:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tutupTempatTidur
      summary: Tutup TT mulai sebuah tanggal (permanen; kodenya tidak dipakai ulang)
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. `berlaku_dari` = hari pertama TT tidak dihitung (≥ hari ini zona RS
        dan ≥ `berlaku_dari` TT itu; selain itu 422 `tanggal_tidak_valid`); sampai hari sebelumnya TT tetap dihitung dalam
        kapasitas (status `akan_ditutup`).
        - 409 `tempat_tidur_terisi`: TT terisi atau dipesan pada tanggal itu (penempatan pasien di fase 2; di fase 1 selalu
          kosong). Penandaan "akan ditutup setelah kosong" (FR-08-17) dibangun bersama penempatan pasien.
        - 409 `sudah_ditutup` (termasuk yang sudah dijadwalkan tutup).
        Tutup sementara (renovasi singkat) dan pembukaan kembali lewat usulan berjenjang (menyusul, lihat backlog 1.8c).
        409 `harus_lewat_usulan` sesudah instalasi siap melayani (1.8c), kecuali TT ekstra (darurat lonjakan).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [berlaku_dari, alasan, dasar_perubahan]
              properties:
                berlaku_dari: { type: string, format: date }
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: TT sesudah dijadwalkan/ditutup
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TempatTidur' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /kelas-rawat:
