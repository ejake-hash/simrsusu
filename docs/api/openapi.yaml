    get:
      operationId: rinciUnitOrganisasi
      summary: Rincian unit beserta jalur induknya
      description: "Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input. ETag = `versi`."
      responses:
        '200':
          description: Rincian unit
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
