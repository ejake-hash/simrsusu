openapi: 3.1.0
info:
  title: Karsitara SIMRS API
  version: 0.19.0
  description: |
    Kontrak API untuk alur kerja per halaman (PRD D.5). Kebutuhan dan aturan tetap di docs/prd.md;
    berkas ini hanya bentuk permintaan/respons. Frontend membuat data tiruan dari berkas ini,
    backend wajib lulus uji kontrak terhadapnya. Perubahan kontrak lewat PR yang mengubah berkas ini.
    Konvensi: PRD 10.3.1 (prefiks /api/v1, kata benda Indonesia, kunci snake_case, satu format error `{"error": {kode, pesan, rincian}}`).
    Endpoint autentikasi dan MFA: PRD 10.3.2 (belum dipindah ke berkas ini; bentuk `pengguna` di respons masuk = skema Saya).
    Kode error umum: belum_masuk (401), akses_ditolak (403), csrf_tidak_valid (403), tidak_ditemukan (404),
    validasi_gagal (422), ukuran_halaman_melebihi_batas (422), kursor_tidak_valid (422), versi_berubah (412),
    if_match_wajib (428), terlalu_banyak_permintaan (429). Sesi berakhir (401): sesi_kedaluwarsa, sesi_dicabut (ADR 0002).
    Sejak v0.6.0: wajib_ganti_sandi (403) untuk akun bersandi awal, sampai POST /saya/sandi (lihat di sana).
    v0.2.0: Pengaturan Sistem → Peran & Izin, Akun & Akses (tiket 1.2c); kode menu data_induk.peran/akun → pengaturan.peran/akun.
    v0.2.1: istilah umum (tiket 1.0g, PRD 10.3.3): skema dan kunci respons `error`, field menu `jumlah_tugas`,
    kode menu `master_data`.
    v0.2.2: penyelarasan 1.2c-be: 409 `butuh_persetujuan` pada penugasan peran berizin sensitif, 409 `peran_bawaan_terkunci`
    saat mengakhiri penugasan superadmin, 403 `akun_superadmin` pada semua perubahan /akun/{id}/* atas akun superadmin oleh
    bukan superadmin (PRD 9.2.4), AkunRinci.dapat_diubah/alasan_terkunci, bentuk `rincian` error matriks, arti `versi` peran.
    v0.2.3: GET /saya pindah ke berkas ini (tiket 1.2e, Beranda): peran berlaku, masuk sebelumnya; email tidak dikirim.
    v0.3.0: Profil RS, unit organisasi, KSM (tiket 1.8a): /profil-rs (publik terbatas + `rinci` sesuai izin, berkas
    identitas), /unit-organisasi, /ksm; cakupan penugasan `unit` didukung (Penugasan.cakupan_label).
    v0.4.0: Persetujuan dan permintaan akses (tiket 1.2d; kontrol ganda K3/K4/K13): /persetujuan-akses, /permintaan-akses, /izin/{kode}/penyetuju,
    /akun/saran-peran; pemberian berisiko menjadi persetujuan menunggu (202 / `menunggu_persetujuan`); 409 `butuh_persetujuan`
    dan `peran_bawaan_terkunci` (penugasan superadmin) tetap tercantum untuk backend sebelum 1.2d.
    v0.5.0: Lokasi fisik, ruang, dan tempat tidur (tiket 1.8b): /lokasi (pohon, impor CSV), /bangsal, /kamar,
    /tempat-tidur (tutup bertanggal, kode tidak dipakai ulang), /kelas-rawat, /poliklinik, /kapasitas-tempat-tidur.
    v0.6.0: Pegawai, izin praktik, RKK, akun dari pegawai (tiket 1.8d): /pegawai (NIK terenkripsi, utuh hanya dengan izin
    bagian identitas), /pegawai/{id}/izin-praktik, /kewenangan-klinis, /akun; /akun/{id}/nonaktifkan dan /aktifkan;
    /saya/sandi dan Saya.wajib_ganti_sandi; kepala unit dan ketua KSM dari pegawai.
    v0.7.0: Notifikasi, kotak kerja, eskalasi (tiket 1.7): /saya/notifikasi (ETag/304), /saya/tugas, /tugas/{id},
    /jenis-tugas (tanpa POST), /saya/preferensi-notifikasi; header X-Permintaan-Latar untuk polling (tidak memperbarui
    waktu aktif sesi).
    v0.8.0: Tanda tangan elektronik T1 (tiket 1.6): /saya/ttd/aktivasi, /saya/ttd/pin, /ttd/{pengguna}/reset (persetujuan akses
    `reset_ttd` dengan penyetuju orang: atasan langsung), /ttd/tandatangani, /ttd/verifikasi/{objek_jenis}/{objek_id};
    Saya.ttd; PersetujuanAkses.penyetuju_pengguna. Penyelarasan 1.7-be (#53): ETag /saya/menu = `versi` + jumlah tugas
    Beranda; `jumlah_tugas` null di /akun/{id}/menu; AKUN_TERKUNCI paling banyak satu per jam (in-app dan email);
    pelaksana PERMINTAAN_AKSES = peran pemegang pengaturan.akun.perbaiki.
    v0.9.0: Usulan perubahan data induk berjenjang (tiket 1.8c): /usulan-data-induk (+ verifikasi, setujui, kembalikan,
    kirim-ulang), /data-induk/{jenis}/{id}/riwayat-versi; 409 `harus_lewat_usulan` di 1.8b sesudah instalasi siap
    melayani; TTE objek `usulan_data_induk`.
    v0.10.0: tidak dipakai (usulan #64 terbit sebagai v0.14.0).
    v0.11.0: Paket data referensi (tiket 1.8e): POST /paket-referensi/{sistem}/muat (pratinjau/terapkan, snapshot per versi).
    v0.12.0: Penyiapan instalasi kosong (tiket 1.8f): GET /penyiapan, POST /penyiapan/{langkah}/selesai; sub-menu pengaturan.penyiapan.
    v0.13.0: Gateway integrasi (tiket 1.9): /integrasi/sistem (status, kredensial tulis saja, uji koneksi), /integrasi/kotak-keluar
    (outbox, kirim ulang), /integrasi/log (disamarkan); sub-menu integrasi.log.
    v0.14.0: Lapis 4–5 hak akses (tiket 1.5): /label-sensitivitas (+ penyetuju), /akun/{id}/label (persetujuan pejabat PDP,
    jenis `izin_label`), /saya/mfa/verifikasi-ulang (K11); error 403 `mfa_ulang_diperlukan`, `izin_praktik_tidak_berlaku`,
    `kewenangan_klinis_tidak_mencakup`; skema `Terbatas`. Disetujui pemilik 12 Okt 2026.
    v0.15.0: Reset sandi oleh admin (tiket 1.14): POST /akun/{id}/sandi/reset (sandi sementara sekali tampil, wajib ganti).
    Halaman masuk dapat diatur (tiket 1.15): ProfilRs.halaman_masuk (nilai efektif, publik), IsianProfilRs.halaman_masuk
    (opsional; null = kembali ke bawaan); foto dipotong 16:10 dan metadata dibuang saat unggah; warna bawaan
    paket produk #006937/#F3C300. Paket tiket 1.13–1.16 disetujui pemilik 13 Okt 2026.
    v0.16.0: Perangkat tepercaya (tiket 1.13): /saya/perangkat, /akun/{id}/perangkat (+ cabut), /kebijakan-keamanan,
    Peran.masa_percaya_hari; sub-menu pengaturan.keamanan. Tambahan kontrak autentikasi PRD 10.3.2 (dicatat di sini sampai
    PRD diselaraskan; utang di backlog):
    - Respons `perlu_mfa` dan `perlu_daftar_mfa` membawa `percayai_perangkat: {tersedia: boolean, hari: integer}`.
      `tersedia` = false bila masa percaya efektif akun 0 atau permintaan dari luar jaringan RS (perangkat hanya
      dipercaya dari jaringan RS, tempat token berlaku); `hari` = masa percaya efektif (0 bila tidak tersedia).
    - POST /autentikasi/mfa dan /autentikasi/mfa/daftar/konfirmasi menerima `percayai_perangkat: boolean` (opsional,
      bawaan false; diabaikan bila tidak tersedia).
    - Setiap respons `status: masuk` (langkah 1, 2a, 2c) membawa `perangkat_tepercaya: {id, berlaku_sampai} | null`:
      perangkat yang baru dipercaya, atau yang dipakai melewati MFA di langkah 1; null bila tidak ada.
    - Cookie token perangkat: HttpOnly, Secure, SameSite=Strict, path /api/v1/autentikasi, terpisah dari sesi; nilainya
      tidak pernah dikirim di badan respons. Satu cookie per peramban: mempercayai perangkat untuk akun lain di peramban
      yang sama menimpa cookie akun sebelumnya (barisnya tetap ada sampai kedaluwarsa atau dicabut). POST
      /autentikasi/keluar tidak menghapusnya, karena memang untuk masuk berikutnya.
    - Langkah 1 dari jaringan RS dengan cookie token yang sah untuk akun itu langsung `status: masuk` tanpa kode MFA
      (audit `autentikasi.masuk` dengan `mfa_dilewati: perangkat_tepercaya`); dari luar jaringan RS token tidak berlaku.
    - Sesi yang masuk lewat perangkat tepercaya, atau yang baru mempercayai perangkat, dari jaringan RS memakai batas diam
      60 menit sejak awal sesi; selain itu 15 menit.
    - MFA ulang (K11, /saya/mfa/verifikasi-ulang) tidak pernah dilewati: sesi yang masuk lewat perangkat tepercaya
      diperlakukan seperti belum memverifikasi MFA.
    v0.17.0: Penjamin dan jadwal praktik (tiket 2.1 dan 2.4): /data-induk/penjamin (sub-menu master_data.penjamin; kelas rawat
    tetap /kelas-rawat 1.8b), /jadwal-praktik (kuota JKN/non-JKN, terisi, sub-menu master_data.jadwal_praktik),
    /jadwal-pengecualian (cuti dokter, libur RS). Hanya kontrak; kode menyusul di tiket BE/FE.
    v0.18.0: Buku tarif (tiket 2.2): GET /data-induk/tarif dan /data-induk/tarif/{id}/versi (sub-menu master_data.tarif, hanya baca).
    Perubahan tarif lewat usulan 1.8c: `jenis_data` dan `objek_jenis` baru `tarif` (tanpa endpoint tulis tarif). Hanya kontrak;
    kode menyusul di tiket BE/FE.
    v0.19.0: Pasien (tiket 2.5): GET /pasien (cari satu kolom; kata cari di header `X-Cari`, bukan query string),
    POST /pasien (No. RM dibuat server, tanpa celah), PATCH /pasien/{id} (jejak versi, melengkapi Mr. X). Bagian baru
    `pendaftaran.pasien.identitas` (aksi `lihat`, sensitif): tanpanya `nik`/`no_paspor` tidak dikirim, hanya samaran.
    Error baru: 409 `nik_sudah_terdaftar`/`no_kartu_sudah_terdaftar` (rujukan No. RM hanya di `rincian`, tidak di `pesan`),
    422 `kata_cari_wajib`, `kata_cari_tidak_dikenali`, `referensi_tidak_valid`, `wilayah_tidak_valid`. Hanya kontrak; kode menyusul di tiket BE/FE.
servers:
  - url: /api/v1
security:
  - sesiCookie: []

paths:
  /saya:
    get:
      operationId: saya
      summary: Akun yang sedang masuk, untuk header dan Beranda (salam, peran, keamanan akun)
      description: |
        Bentuk `data` sama dengan `pengguna` di respons masuk (PRD 10.3.2). Tidak mengirim email, NIP, atau
        data rahasia (tidak dipakai layar). Tanda instalasi demo (FR-54-10) milik instalasi, bukan akun, dan
        dibutuhkan juga di halaman masuk: dikirim GET /profil-rs publik (tiket 1.8a), bukan di sini.
        401: `belum_masuk` (tanpa sesi, atau langkah MFA belum lolos), `sesi_kedaluwarsa` (melewati batas diam),
        `sesi_dicabut` (akun dinonaktifkan, MFA direset, atau wajib MFA baru; ADR 0002).
      responses:
        '200':
          description: Akun yang sedang masuk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Saya' }
              example:
                data:
                  id: 01a12988-9987-7242-838c-4302517cfdae
                  nama_pengguna: contoh.dokter
                  login_terakhir_pada: "2026-10-11T07:02:11+00:00"
                  mfa_aktif: false
                  pegawai: { id: 01a12988-9981-7000-8000-000000000001, nama: Contoh Dokter }
                  peran: [{ id: 01a12988-996f-723e-8a2c-fdff428f4a96, nama: Contoh Dokter }]
                  masuk_sebelumnya_pada: "2026-10-10T23:48:02+00:00"
                  masuk_sebelumnya_dari_jaringan_rs: true
                  wajib_ganti_sandi: false
                  ttd: { aktif: true, diaktifkan_pada: "2026-10-12T01:15:00+00:00", dicabut_pada: null, terkunci_sampai: null, sesi_berlaku_sampai: null, reset_menunggu: false }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /saya/menu:
    get:
      operationId: menuSaya
      summary: Menu efektif akun yang sedang masuk (sidebar) beserta kode izin aksinya
      description: |
        Dihitung server dengan AccessEvaluator (PRD 9.2.5) dan modul aktif (PRD 3.4).
        - Grup/menu/sub-menu yang tidak diizinkan tidak dikirim sama sekali.
        - Menu tampil bila minimal satu bagiannya boleh dilihat.
        - Modul yang belum dibangun/aktif dikirim dengan status "segera" HANYA bila konfigurasi
          `menu.tampilkan_segera_hadir` = true (pengembangan/demo); di produksi tidak dikirim.
        - Respons di-cache per akun (Valkey cache). ETag = `versi` + jumlah tugas Beranda (`"<versi>-<n>"`, sejak 1.7):
          tugas baru mengubah ETag tanpa mengubah `versi`.
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Menu efektif
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuSaya' }
              example:
                data:
                  versi: "c3f1a9"
                  grup:
                    - kode: utama
                      label: null
                      menu:
                        - { kode: beranda, label: Beranda, ikon: beranda, rute: /, status: aktif, fase: 1, sub_menu: [] }
                    - kode: pelayanan
                      label: Pelayanan
                      menu:
                        - kode: igd
                          label: IGD
                          ikon: igd
                          rute: /igd
                          status: segera
                          fase: 2
                          sub_menu:
                            - { kode: igd.papan, label: Papan pasien IGD, rute: /igd/papan, status: segera, fase: 2 }
                    - kode: tata_kelola
                      label: Tata Kelola
                      menu:
                        - kode: pengaturan
                          label: Pengaturan Sistem
                          ikon: pengaturan
                          rute: /pengaturan
                          status: aktif
                          fase: 1
                          sub_menu:
                            - { kode: pengaturan.peran, label: Peran & izin, rute: /pengaturan/peran, status: aktif, fase: 1 }
                            - { kode: pengaturan.akun, label: Akun & akses, rute: /pengaturan/akun, status: aktif, fase: 1 }
                  izin:
                    - pengaturan.peran.lihat
                    - pengaturan.akun.lihat
        '304': { description: Tidak berubah sejak versi di If-None-Match }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Pengaturan Sistem → Peran & Izin, Akun & Akses (tiket 1.2c; PRD 9.2–9.3, 10.3.2)
  # Izin: pengaturan.peran.{lihat,input,perbaiki}, pengaturan.akun.{lihat,input,perbaiki}.
  # Semua perubahan: audit catat() di akhir transaksi dengan sebelum/sesudah dan dasar;
  # cache menu efektif akun terdampak dihapus (versi /saya/menu berubah).
  # ---------------------------------------------------------------------------
  /menu:
    get:
      operationId: pohonMenu
      summary: Pohon menu lengkap beserta izin aksi per node, untuk matriks peran dan pilihan pengecualian per akun
      description: |
        Izin: pengaturan.peran.lihat ATAU pengaturan.akun.lihat. Memuat semua node `aktif` (termasuk modul
        yang belum tersedia, agar peran bisa disiapkan sebelum modulnya dinyalakan). Grup tidak punya izin.
      responses:
        '200':
          description: Pohon menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PohonMenu' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /peran:
    get:
      operationId: daftarPeran
      summary: Daftar peran (paginasi kursor PRD 14.1.1)
      description: "Izin: pengaturan.peran.lihat."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
      responses:
        '200':
          description: Satu halaman peran
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PeranRingkas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPeran
      summary: Buat peran baru, kosong atau salinan peran lain
      description: |
        Izin: pengaturan.peran.input. `salin_dari_id` menyalin izin peran sumber KECUALI izin sensitif
        (pemberiannya butuh persetujuan, tiket 1.2d). Peran baru berstatus aktif tanpa penugasan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, wajib_mfa, dasar_perubahan]
              properties:
                kode: { type: string, pattern: '^[a-z][a-z0-9_]{1,49}$' }
                nama: { type: string, minLength: 3, maxLength: 100 }
                uraian: { type: [string, 'null'], maxLength: 500 }
                wajib_mfa: { type: boolean }
                salin_dari_id: { type: [string, 'null'], format: uuid }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Peran dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: "kode_sudah_dipakai", $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /peran/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPeran
      summary: Rincian peran beserta kode izin yang diberikannya
      description: "Izin: pengaturan.peran.lihat. ETag = `versi` (dipakai If-Match saat mengubah)."
      responses:
        '200':
          description: Rincian peran
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahPeran
      summary: Ubah nama, uraian, wajib MFA, atau status peran
      description: |
        Izin: pengaturan.peran.perbaiki. Wajib If-Match.
        - `wajib_mfa: false` ditolak (422 `mfa_tidak_bisa_dimatikan`) untuk superadmin dan peran yang memuat izin sensitif.
        - Peran bawaan sistem tidak bisa dinonaktifkan (409 `peran_bawaan_terkunci`).
        - Penyunting tidak bisa mengubah peran yang sedang ia pegang (403 `peran_sendiri`).
        - Menonaktifkan peran yang masih punya penugasan aktif ditolak (409 `peran_masih_dipakai`) dan menyebut jumlahnya.
        - `masa_percaya_hari` (1.13): 0 sampai `batas_masa_percaya_hari` peran itu; tidak bisa membuat masa percaya akun lebih
          panjang dari kebijakan instalasi (yang berlaku nilai terkecil).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                nama: { type: string, minLength: 3, maxLength: 100 }
                uraian: { type: [string, 'null'], maxLength: 500 }
                wajib_mfa: { type: boolean }
                status: { type: string, enum: [aktif, nonaktif] }
                masa_percaya_hari:
                  type: [integer, 'null']
                  minimum: 0
                  description: "Sejak v0.16.0 (1.13). null = ikut kebijakan instalasi; di atas `batas_masa_percaya_hari` → 422 `masa_percaya_melebihi_batas`"
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Peran sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { description: "versi_berubah: peran diubah orang lain sejak dibuka", $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { description: "if_match_wajib", $ref: '#/components/responses/Error' }
  /peran/{id}/izin:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: gantiIzinPeran
      summary: Ganti seluruh himpunan izin peran (simpan matriks)
      description: |
        Izin: pengaturan.peran.perbaiki. Wajib If-Match. Server menurunkan `peran_menu` dari izin `lihat`.
        Validasi (422, `rincian` = daftar `{kolom: "izin", kode, pesan}` untuk setiap kode yang salah):
        - `izin_tidak_dikenal`: kode tidak ada di akses.izin.
        - `lihat_wajib`: aksi apa pun pada node tanpa izin `<node>.lihat`.
        - `induk_belum_diberikan`: izin pada bagian tanpa `lihat` pada sub-menu induknya (MD-3).
        Penolakan lain:
        - Izin sensitif baru (sejak 1.2d): tidak langsung berlaku. Setiap izin sensitif baru menjadi satu persetujuan
          menunggu (penyetuju = peran penyetuju izin itu, K3/K13) dan tercantum di `perubahan.menunggu_persetujuan`;
          perubahan lain langsung berlaku. 422 `penyetuju_belum_ditetapkan` bila izin sensitif baru belum punya penyetuju
          (`rincian` = `{kolom: "izin", kode, pesan}` per izin; tidak ada yang disimpan). Izin yang sudah menunggu tidak
          diajukan ulang. Izin sensitif yang sedang menunggu tetap boleh dikirim di `izin` tanpa efek ganda.
          Sebelum 1.2d backend menolak utuh dengan 409 `butuh_persetujuan` (`rincian` = `{kode, pesan}`).
        - 409 `peran_bawaan_terkunci`: isi peran superadmin tidak bisa diubah dari layar.
        - 403 `peran_sendiri`.
        Respons memuat ringkasan perubahan untuk audit dan toast.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [izin, dasar_perubahan]
              properties:
                izin: { type: array, maxItems: 5000, uniqueItems: true, items: { type: string } }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
                alasan: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Izin tersimpan
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, perubahan]
                properties:
                  data: { $ref: '#/components/schemas/PeranRinci' }
                  perubahan:
                    type: object
                    required: [ditambah, dicabut, akun_terdampak]
                    properties:
                      ditambah: { type: array, items: { type: string }, description: "Yang langsung berlaku" }
                      dicabut: { type: array, items: { type: string } }
                      akun_terdampak: { type: integer, minimum: 0 }
                      menunggu_persetujuan:
                        type: array
                        description: "Izin sensitif baru yang menunggu persetujuan (sejak 1.2d)"
                        items: { $ref: '#/components/schemas/PersetujuanAkses' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /akun:
