                  data:
                    type: object
                    required: [akun, sandi_awal]
                    properties:
                      akun: { $ref: '#/components/schemas/AkunRingkas' }
                      sandi_awal: { type: string, minLength: 16, description: "Tampilkan sekali dengan tombol salin; jangan disimpan klien" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/nonaktifkan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: nonaktifkanAkun
      summary: Nonaktifkan akun (alasan wajib); sesi berjalannya diputus
      description: |
        Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`, `akun_superadmin` (aturan sama dengan /akun/{id}/*).
        Semua perangkat tepercaya akun dicabut (sejak 1.13, alasan `akun_nonaktif`), termasuk saat nonaktif karena pegawai keluar.
        409 `sudah_nonaktif`; 409 `superadmin_aktif`: akun masih memegang peran superadmin — akhiri penugasannya lebih dulu
        (lewat persetujuan superadmin lain, K4). Audit `akses.akun_dinonaktifkan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Akun sesudah dinonaktifkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AkunRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/aktifkan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aktifkanAkun
      summary: Aktifkan kembali akun (alasan wajib)
      description: |
        Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`, `akun_superadmin`. 409 `sudah_aktif`; 409 `pegawai_keluar`
        (status pegawainya `keluar`; batalkan dulu tanggal keluar di data pegawai. Pegawai `akan_keluar` boleh); 409 `superadmin_aktif` (akun
        masih memegang penugasan superadmin: mengaktifkannya = menambah superadmin tanpa K4). Audit `akses.akun_diaktifkan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Akun sesudah diaktifkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AkunRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Perangkat tepercaya (tiket 1.13; PRD 10.3.2 "keringanan lewat perangkat terdaftar", 14.2 batas diam, ADR 0002).
  # Masa percaya efektif akun = nilai terkecil dari: kebijakan instalasi (/kebijakan-keamanan), `masa_percaya_hari` tiap
  # peran yang berlaku (null = ikut instalasi), batas superadmin dan batas peran/izin khusus sensitif (konfigurasi server,
  # tidak bisa dinaikkan dari layar). 0 = fitur mati. Token berlaku sampai `berlaku_sampai` = waktu dipercaya + masa
  # percaya efektif; bila kebijakan diturunkan, token yang sudah ada ikut memendek (dihitung saat dipakai).
  # Semua perangkat tepercaya akun dicabut saat: ganti sandi, reset sandi, reset MFA, akun dinonaktifkan.
  # Sesi yang masuk lewat perangkat tepercaya, atau yang baru mempercayai perangkat, dari jaringan RS memakai batas diam
  # 60 menit, selain itu 15 menit (PRD 14.2).
  # Audit: akses.perangkat_dipercaya, akses.perangkat_dicabut (tanpa token).
  # ---------------------------------------------------------------------------
  /saya/perangkat:
    get:
      operationId: perangkatSaya
      summary: Perangkat tepercaya milik akun yang sedang masuk (menu akun)
      description: "Tanpa izin khusus; hanya perangkat akun sendiri. Urut dibuat_pada terbaru. Bawaan hanya yang `aktif`."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: status, schema: { type: string, enum: [aktif, semua], default: aktif } }
      responses:
        '200':
          description: Satu halaman perangkat
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PerangkatTepercaya' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/perangkat/{id}/cabut:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: cabutPerangkatSaya
      summary: Cabut perangkat tepercaya sendiri (masuk berikutnya dari perangkat itu diminta kode MFA lagi)
      description: |
        Tanpa izin khusus. Perangkat akun lain → 404. Sudah dicabut atau kedaluwarsa → 409 `perangkat_tidak_aktif`.
        Sesi yang sedang berjalan tidak diputus. Bila yang dicabut perangkat sesi ini, respons juga mengirim `Set-Cookie`
        kedaluwarsa untuk cookie token (path /api/v1/autentikasi). Audit `akses.perangkat_dicabut` (alasan `dicabut_pemilik`).
      responses:
        '200':
          description: Perangkat sesudah dicabut
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PerangkatTepercaya' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /akun/{id}/perangkat:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: perangkatAkun
      summary: Perangkat tepercaya akun lain (Pengaturan → Akun & akses)
      description: "Izin: pengaturan.akun.lihat. `perangkat_ini` selalu false. Urut dibuat_pada terbaru."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: status, schema: { type: string, enum: [aktif, semua], default: aktif } }
      responses:
        '200':
          description: Satu halaman perangkat
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PerangkatTepercaya' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/perangkat/{perangkatId}/cabut:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: perangkatId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cabutPerangkatAkun
      summary: Cabut perangkat tepercaya akun lain
      description: |
        Izin: pengaturan.akun.perbaiki. Aturan /akun/{id}/*: 403 `diri_sendiri` (pakai /saya/perangkat), 403 `akun_superadmin`.
        Perangkat bukan milik akun itu → 404; sudah tidak aktif → 409 `perangkat_tidak_aktif`. Sesi akun itu yang sedang
        berjalan tidak diputus (untuk memutus: nonaktifkan akun atau reset sandi). Audit `akses.perangkat_dicabut` dengan
        keterangan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Perangkat sesudah dicabut
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PerangkatTepercaya' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /kebijakan-keamanan:
    get:
      operationId: kebijakanKeamanan
      summary: Kebijakan keamanan instalasi (Pengaturan → Keamanan)
      description: "Izin: pengaturan.keamanan.lihat (cakupan rs). ETag = `versi`."
      responses:
        '200':
          description: Kebijakan berlaku
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KebijakanKeamanan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: ubahKebijakanKeamanan
      summary: Ubah masa percaya perangkat bawaan instalasi
      description: |
        Izin: pengaturan.keamanan.perbaiki (cakupan rs; izin sensitif, bawaan hanya superadmin; MFA ulang hanya bila izin
        bertanda `butuh_mfa`). Wajib If-Match.
        `perangkat_tepercaya_hari` 0 sampai `batas.maks_hari` (422 `masa_percaya_melebihi_batas`, sama dengan PATCH /peran). Menurunkan nilai langsung memendekkan
        token yang sudah ada; menaikkan hanya berlaku untuk perangkat yang dipercaya sesudahnya. Audit
        `akses.kebijakan_keamanan_diubah` dengan sebelum/sesudah dan dasar perubahan.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perangkat_tepercaya_hari, dasar_perubahan]
              properties:
                perangkat_tepercaya_hari: { type: integer, minimum: 0 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Kebijakan sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KebijakanKeamanan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /saya/sandi:
    post:
      operationId: gantiSandi
      summary: Ganti sandi akun yang sedang masuk
      description: |
        Tanpa izin khusus. Selama `Saya.wajib_ganti_sandi` = true (akun baru dari /pegawai/{id}/akun, atau sesudah
        POST /akun/{id}/sandi/reset), semua endpoint bersesi
        selain GET /saya, GET /saya/menu, POST /saya/sandi, POST /autentikasi/keluar, dan GET /profil-rs(/berkas/*) (identitas
        RS di layar ganti sandi) menjawab 403 `wajib_ganti_sandi`.
        Sandi baru mengikuti PRD 14.2 (panjang minimal dari konfigurasi, bawaan 12; cek sandi bocor) dan cek kontekstual:
        tidak memuat nama pengguna, nama RS, atau nama produk (ADR 0001), dan tidak sama dengan sandi lama.
        - 422 `sandi_lama_salah`: dibatasi laju per akun (429 sesudah 5 kali per 15 menit); tidak menambah hitungan
          penguncian masuk. 422 `validasi_gagal` (`rincian` kolom `sandi_baru`; layar menampilkan `rincian[].pesan`, yang
          menyebut panjang minimal yang berlaku).
        - Sesudah berhasil: ID sesi diganti, sesi lain akun ini diputus, sesi ini tetap, dan semua perangkat tepercaya akun
          ini dicabut (sejak 1.13, alasan `sandi_diganti`). Audit `akses.sandi_diganti` (tanpa sandi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandi_lama, sandi_baru]
              properties:
                sandi_lama: { type: string, maxLength: 200 }
                sandi_baru: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Sandi diganti
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Saya' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Notifikasi, kotak kerja, eskalasi (tiket 1.7; PRD 7.53 FR-53-01…09, 11.2 inti.jenis_tugas/tugas/tugas_kejadian,
  # notifikasi.notifikasi; keputusan K1, K2).
  # - /saya/* tanpa izin khusus: hanya data akun yang sedang masuk. Polling 30 detik dengan If-None-Match (K1; 304 bila
  #   tidak berubah) dan header `X-Permintaan-Latar: 1`: permintaan berpenanda itu tidak memperbarui waktu aktif sesi,
  #   sehingga sesi di komputer bersama tetap berakhir sesudah batas diam (PRD 14.2, ADR 0002). Klien hanya memasang header
  #   itu pada polling otomatis, bukan pada tindakan pengguna. Isi notifikasi tidak memuat data pasien di email/pesan singkat; in-app memuat tautan ke layar.
  # - Tugas dibuat dan diselesaikan oleh kejadian domain (bukan tombol manual): mis. persetujuan akses diputuskan menutup
  #   tugas "persetujuan menunggu". Tugas punya tautan ke layar penyelesaian (rute SPA).
  # - Eskalasi 3 tingkat (FR-53-03), waktu dan unit tujuannya dari jenis tugas (FR-53-04, diubah RS di layar, bukan kode):
  #   tingkat 1 pengingat ke pelaksana sebelum tenggat (bila waktunya sudah lewat saat tugas dibuat, dikirim saat dibuat);
  #   tingkat 2 teguran ke kepala unit tugas (unit pelaksana/objek), atau kepala `unit_teguran` jenisnya bila tugas tanpa unit;
  #   tingkat 3 eskalasi ke kepala `unit_eskalasi` jenisnya, atau kepala unit induk dari unit tingkat 2 (kepala bidang),
  #   + penanda dasbor Direktur. Kepala unit dari `inti.unit_organisasi.kepala_pegawai_id` (1.8d); bila tidak ada, tingkat
  #   tetap naik dan riwayat mencatat penerima kosong.
  # - Tab kotak kerja saling lepas (lencana tidak terhitung ganda): `saya` = tugas terbuka akun ini tingkat 0–1;
  #   `dieskalasi` = tugas terbuka akun ini tingkat 2–3 (sudah ditegur/dieskalasi, sesuai prototipe "Teguran & eskalasi");
  #   `unit` = tugas terbuka bukan milik akun ini di unit yang dikepalainya (termasuk turunan) atau yang eskalasinya dikirim
  #   ke akun ini; `selesai` = tugas akun ini dan unitnya yang selesai bulan ini. Tugas di tab mana pun bisa dibuka di
  #   /tugas/{id}.
  # - Pemberitahuan AKUN_TERKUNCI (issue #11) bukan jenis tugas (tidak ada di /jenis-tugas): selalu kritis, paling banyak
  #   satu per jam per akun (in-app dan email) agar penguncian sengaja tidak membanjiri pemilik. TTD_TERKUNCI (1.6): ke
  #   pemilik dan atasan langsung, juga kritis.
  # - Kanal (K2): in-app selalu; email (antrean `notifikasi`) bila akun punya email dan preferensinya menyala; WA/SMS
  #   lewat adapter dengan driver `log` di fase 1. Notifikasi kritis tidak bisa dimatikan preferensi (FR-53-09).
  # ---------------------------------------------------------------------------
  /saya/notifikasi:
    get:
      operationId: daftarNotifikasiSaya
      summary: Notifikasi akun yang sedang masuk (paginasi kursor, terbaru dulu) beserta jumlah belum dibaca
      description: |
        `status=belum_dibaca` untuk lonceng/daftar "belum dibaca dulu" (tab pertama), `semua` (bawaan) untuk riwayat.
        `meta.jumlah_belum_dibaca` untuk angka lonceng. ETag = sidik isi respons: berubah bila ada notifikasi baru atau status baca berubah;
        If-None-Match yang sama → 304 tanpa isi (polling 30 detik).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: status, schema: { type: string, enum: [belum_dibaca, semua] } }
        - { in: header, name: If-None-Match, schema: { type: string } }
        - { in: header, name: X-Permintaan-Latar, schema: { type: string, enum: ['1'] }, description: "Polling otomatis: tidak memperbarui waktu aktif sesi" }
      responses:
        '200':
          description: Satu halaman notifikasi
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notifikasi' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah_belum_dibaca]
                        properties:
                          jumlah_belum_dibaca: { type: integer, minimum: 0 }
        '304': { description: "Tidak berubah sejak ETag yang dikirim" }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/notifikasi/{id}/dibaca:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tandaiNotifikasiDibaca
      summary: Tandai satu notifikasi dibaca (idempoten)
      description: "Hanya notifikasi milik akun ini; selain itu 404."
      responses:
        '200':
          description: Notifikasi sesudah ditandai
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Notifikasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /saya/notifikasi/semua-dibaca:
    post:
      operationId: tandaiSemuaNotifikasiDibaca
      summary: Tandai semua notifikasi akun ini dibaca
      description: "`sampai` (opsional) = waktu notifikasi terbaru yang sudah ditampilkan; yang tiba sesudahnya tetap belum dibaca. Notifikasi berprioritas kritis tidak ikut ditandai (dibuka satu per satu, PRD 5.1 butir 12)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sampai: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Jumlah yang ditandai
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [jumlah], properties: { jumlah: { type: integer, minimum: 0 } } }
        '401': { $ref: '#/components/responses/Error' }
  /saya/preferensi-notifikasi:
    get:
      operationId: preferensiNotifikasiSaya
      summary: Preferensi kanal notifikasi per jenis
      description: |
        Satu baris per jenis notifikasi yang bisa diterima akun: AKUN_TERKUNCI (kritis), TTD_TERKUNCI (kritis, 1.6),
        TTD_DICABUT (1.6), lalu jenis tugas aktif. In-app selalu menyala.
        Per kanal: `dapat_diubah = false` untuk jenis kritis (FR-53-09), kanal yang belum tersedia di instalasi (pesan singkat
        di fase 1 hanya driver log), atau email bila akun tidak punya alamat email.
      responses:
        '200':
          description: Preferensi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PreferensiNotifikasi' } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      operationId: aturPreferensiNotifikasiSaya
      summary: Ganti preferensi kanal (email, pesan singkat) per jenis
      description: |
        Mengganti nilai yang dikirim saja; jenis/kanal yang tidak dikirim tidak berubah. 422 `jenis_tidak_dikenal`;
        422 `notifikasi_kritis` bila mencoba mematikan kanal untuk jenis kritis; 422 `kanal_tidak_tersedia` bila mengubah kanal
        yang `dapat_diubah = false` karena belum tersedia. Audit `notifikasi.preferensi_diubah`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferensi]
              properties:
                preferensi:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [jenis]
                    properties:
                      jenis: { type: string, maxLength: 60 }
                      email: { type: boolean }
                      pesan_singkat: { type: boolean }
      responses:
        '200':
          description: Preferensi sesudah diubah
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PreferensiNotifikasi' } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/tugas:
    get:
      operationId: kotakKerjaSaya
      summary: Kotak kerja (paginasi kursor)
      description: |
        Tanpa izin khusus (tugas yang terkait akun ini). Arti tab di blok aturan di atas (saling lepas). "Milik akun ini" =
        pelaksananya akun ini, atau peran/unit yang dipegang akun ini lewat penugasan berlaku. Tab saya/dieskalasi/unit urut
        tenggat terdekat dulu; selesai urut selesai terbaru dulu. `meta.jumlah` per tab untuk lencana (dihitung server).
        ETag = sidik isi respons (termasuk `terlambat` dan jumlah), jadi 304 hanya bila isinya benar-benar sama.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tab, required: true, schema: { type: string, enum: [saya, unit, dieskalasi, selesai] } }
        - { in: header, name: If-None-Match, schema: { type: string } }
        - { in: header, name: X-Permintaan-Latar, schema: { type: string, enum: ['1'] }, description: "Polling otomatis: tidak memperbarui waktu aktif sesi" }
      responses:
        '200':
          description: Satu halaman tugas
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tugas' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah]
                        properties:
                          jumlah:
                            type: object
                            required: [saya, unit, dieskalasi, selesai]
                            properties:
                              saya: { type: integer, minimum: 0 }
                              unit: { type: integer, minimum: 0 }
                              dieskalasi: { type: integer, minimum: 0 }
                              selesai: { type: integer, minimum: 0 }
        '304': { description: "Tidak berubah sejak ETag yang dikirim" }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tugas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciTugas
      summary: Rincian tugas beserta riwayat (dibuat, pengingat, teguran, eskalasi, selesai)
      description: "Hanya akun yang melihatnya di salah satu tab /saya/tugas (pemilik, kepala unit tugas atau unit induknya, penerima eskalasi); selain itu 404."
      responses:
        '200':
          description: Rincian tugas
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TugasRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /jenis-tugas:
    get:
      operationId: daftarJenisTugas
      summary: Jenis tugas, tenggat, dan eskalasi (data induk), urut kode
      description: |
        Izin: master_data.jenis_tugas.lihat, cakupan `rs`. Jenis tugas dibuat oleh modul pembuatnya (kode stabil dipakai
        kejadian domain) dan dipasang migrasi; RS mengubah tenggat, waktu eskalasi, kritis, dan aktif dari layar (FR-53-04).
        Tidak ada POST: jenis tanpa modul pembuat tidak pernah menghasilkan tugas.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: aktif, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman jenis tugas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JenisTugas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jenis-tugas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciJenisTugas
      summary: Rincian jenis tugas
      description: "Izin: master_data.jenis_tugas.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian jenis tugas
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JenisTugas' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahJenisTugas
      summary: Ubah nama, tenggat, waktu dan unit eskalasi, kritis, atau aktif
      description: |
        Izin: master_data.jenis_tugas.perbaiki. Wajib If-Match. Berlaku untuk tugas yang dibuat sesudahnya; tugas terbuka
        memakai aturan saat dibuat. 422 `eskalasi_tidak_urut` bila menit tingkat 3 < tingkat 2; 422 `unit_tidak_valid`. Menonaktifkan jenis = kejadian domain tidak lagi membuat tugas jenis itu (tugas
        terbuka tetap berjalan). Audit `notifikasi.jenis_tugas_diubah`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                nama: { type: string, minLength: 3, maxLength: 150 }
                batas_menit: { type: integer, minimum: 1, maximum: 525600, description: "Lihat JenisTugas.tenggat_dari" }
                unit_teguran_id: { type: [string, 'null'], format: uuid }
                unit_eskalasi_id: { type: [string, 'null'], format: uuid }
                eskalasi: { $ref: '#/components/schemas/AturanEskalasi' }
                kritis: { type: boolean }
                aktif: { type: boolean }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Jenis tugas sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JenisTugas' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Tanda tangan elektronik T1 (tiket 1.6; PRD 7.57.1–7.57.2, FR-57-01…03/05, 11.2 ttd.*; keputusan K10).
  # - Pasangan kunci Ed25519 per akun; kunci privat dibungkus kunci turunan PIN (Argon2id + garam per akun) DAN kunci
  #   server (env/vault, bukan di DB), PIN hanya hash berlada kunci server: salinan DB saja tidak cukup untuk menebak PIN
  #   atau membuka kunci. Tidak ada jalur admin untuk menandatangani atas nama orang lain: penanda tangan = akun yang masuk.
  # - Isi yang ditandatangani dihitung SERVER dari objeknya (JSON kanonik, kunci terurut) → SHA-256 → tanda tangan; klien
  #   tidak pernah mengirim isi. Cap waktu = waktu server (NTP). Setiap objek = satu baris tanda tangan.
  # - Isi kanonik hanya dari kolom tersimpan yang tidak berubah sesudah objek final (id, kode, nilai, waktu), bukan dari
  #   label/nama yang disusun saat dibaca: mengganti nama peran, label izin, atau nama pegawai tidak membuat tanda tangan
  #   lama `isi_berubah`.
  # - Aturan PIN: tepat 6 angka; ditolak bila semua angka sama (111111), pola 2 atau 3 angka berulang (121212, 123123),
  #   atau setiap angka naik tepat 1 atau turun tepat 1 tanpa melingkar (012345, 123456, 987654). Format salah juga
  #   `pin_lemah` (bukan `validasi_gagal`). Kesalahan PIN memakai `rincian[]` = `{kolom, kode, pesan}`:
  #   `pin_lemah` (kolom `pin` | `pin_baru`), `pin_tidak_sama` (kolom `pin_ulang`), `pin_salah` (kolom `pin` | `pin_lama`,
  #   ditambah `sisa_percobaan`: integer ≥ 1).
  # - Penguncian: PIN salah ke-5 (konfigurasi) langsung 403 `ttd_terkunci` dengan header `Retry-After` (detik); terkunci
  #   15 menit (konfigurasi), sesi tanda tangan berakhir, pemilik dan atasan langsung diberi notifikasi kritis (1.7).
  #   PIN tidak pernah di log/audit/URL; respons /saya/ttd/* dan /ttd/tandatangani `Cache-Control: no-store`.
  # - Sesi tanda tangan: 15 menit tetap (tidak bergeser) sejak PIN benar terakhir di /ttd/tandatangani, dalam sesi login yang
  #   sama: penandatanganan berikutnya boleh tanpa PIN, tetap satu baris per objek. Aktivasi dan ganti PIN tidak memulai
  #   sesi; sesi berakhir saat keluar, ganti sandi, ganti PIN, terkunci, atau TTE dicabut. Klien yang menerima 422
  #   `pin_wajib` menampilkan kolom PIN dan mengirim ulang.
  # - Objek yang bisa ditandatangani di fase 1: `persetujuan_akses`, oleh akun pemutusnya (`diputuskan_oleh.id` = Saya.id)
  #   sesudah diputuskan; klien memanggil verifikasi di rincian untuk tahu apakah sudah ditandatangani. Fase 1 tidak punya
  #   endpoint "minta tanda tangan" (penanda tangan lain): mode itu di TtdModal hanya komponen dengan handler pemanggil.
  #   `usulan_data_induk` (1.8c) oleh pengusul/pemverifikasi/penyetujunya. Aturan tingkat per jenis objek (FR-57-05) adalah
  #   data induk; fase 1 hanya T1.
  # - T2/PSrE: antarmuka + simulator untuk uji alur asinkron, tanpa endpoint publik dan tanpa penyedia nyata (K10); mode
  #   T2 TtdModal di luar 1.6-fe. Semua endpoint ini memakai batas laju `throttle:api` (429).
  # - 503 `ttd_belum_dikonfigurasi` (aktivasi, ganti PIN, tandatangani): kunci server `TTD_KUNCI` kosong, atau kunci yang
  #   membungkus kredensial tidak ada lagi di `TTD_KUNCI`/`TTD_KUNCI_LAMA`. Klien menampilkan pesan server.
  # ---------------------------------------------------------------------------
  /saya/ttd/aktivasi:
    post:
      operationId: aktivasiTtd
      summary: Aktivasi T1 — buat pasangan kunci dan tetapkan PIN
      description: |
        Tanpa izin khusus (akun yang masuk). Sandi akun wajib: sesi yang ditinggal terbuka tidak bisa membuat TTE atas nama
        pemilik (PRD 7.57.2 huruf b). Juga untuk aktivasi ulang sesudah reset.
        - 422 `sandi_salah` (`rincian` kolom `sandi`; dibatasi laju per akun seperti /saya/sandi: 429 sesudah 5 kali per 15 menit);
        - 409 `ttd_sudah_aktif`; 422 `pin_lemah`, `pin_tidak_sama` (lihat aturan PIN di atas); 403 `wajib_ganti_sandi`.
        Audit `ttd.diaktifkan` (sidik kunci, tanpa PIN). Status tampil di `Saya.ttd`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandi, pin, pin_ulang]
              properties:
                sandi: { type: string, maxLength: 200 }
                pin: { type: string, maxLength: 20, description: "6 angka; format lain → 422 pin_lemah" }
                pin_ulang: { type: string, maxLength: 20 }
      responses:
        '201':
          description: TTE aktif
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusTtd' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /saya/ttd/pin:
    put:
      operationId: gantiPinTtd
      summary: Ganti PIN (pasangan kunci tetap; kunci privat dibungkus ulang)
      description: |
        - 422 `pin_salah` (kolom `pin_lama`, dihitung ke penguncian), `pin_lemah` (kolom `pin_baru`), `pin_tidak_sama`;
        - 409 `ttd_belum_aktif`; 403 `ttd_terkunci` (Retry-After).
        Sesi tanda tangan berakhir. Audit `ttd.pin_diganti`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin_lama, pin_baru, pin_ulang]
              properties:
                pin_lama: { type: string, maxLength: 20 }
                pin_baru: { type: string, maxLength: 20 }
                pin_ulang: { type: string, maxLength: 20 }
      responses:
        '200':
          description: PIN diganti
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusTtd' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ttd/{pengguna}/reset:
    parameters:
      - { in: path, name: pengguna, required: true, schema: { type: string, format: uuid }, description: "id akun (akses.pengguna) pemilik TTE, bukan id kredensial" }
    post:
      operationId: ajukanResetTtd
      summary: Ajukan reset TTE (PIN lupa) — diajukan SDM, disetujui atasan lewat persetujuan akses (1.2d)
      description: |
        Izin: sdm.kredensial.perbaiki, cakupan `rs`. Reset = TTE lama dicabut (tanda tangan lama tetap terverifikasi
        dengan kunci publik lama); pemilik mengaktifkan ulang sendiri dengan sandi, pasangan kunci, dan PIN baru. Tidak ada
        yang menetapkan PIN untuk orang lain.
        Tafsiran PRD 7.57.2 huruf b "oleh atasan + SDM": satu persetujuan dengan dua orang — pengaju (SDM, sesudah
        verifikasi identitas tatap muka, dicatat di `dasar`) dan penyetuju = atasan langsung pemilik, sebagai persetujuan
        akses `jenis = reset_ttd` dengan `penyetuju_pengguna` (`objek.jenis = reset_ttd`, `objek.akun` = pemilik;
        `peran`, `izin`, `cakupan_label`, `berlaku_sampai` null). Atasan = akun aktif kepala unit pegawainya; bila kepala
        itu pemilik sendiri, pengaju, atau tanpa akun aktif, naik ke kepala unit induk, dan seterusnya sampai unit akar.
        - 202 = persetujuan menunggu (PersetujuanAkses); berlaku saat disetujui: TTE lama dicabut, pemilik diberi notifikasi.
          Audit `ttd.dicabut` saat diterapkan (pengajuannya diaudit `akses.persetujuan_diajukan`).
        - 403 `diri_sendiri` (mengajukan untuk akun sendiri); 404 akun tidak ada; 409 `ttd_belum_aktif`;
          409 `persetujuan_ganda` (reset untuk akun ini masih menunggu);
          422 `atasan_belum_ditetapkan` (pegawai tanpa unit, atau sampai unit akar tidak ada kepala lain berakun aktif,
          mis. TTE Direktur: jalur puncak menunggu keputusan pemilik produk, lihat backlog 1.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '202':
          description: Menunggu persetujuan atasan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /ttd/tandatangani:
    post:
      operationId: tandatangani
      summary: Tandatangani satu atau banyak objek dengan T1 (isi kanonik dihitung server)
      description: |
        Penanda tangan = akun yang masuk. `pin` wajib kecuali sesi tanda tangan masih berlaku (422 `pin_wajib`).
        Semua objek diperiksa dulu; satu yang tidak boleh → tidak ada yang ditandatangani: 422 `objek_tidak_bisa_ditandatangani`,
        `rincian[]` = `{kolom: "objek.<i>", kode, pesan}` dengan `kode` ∈ `tidak_ditemukan` (tidak ada atau tidak boleh dilihat),
        `belum_diputuskan`, `bukan_pemutus`. Id ganda dalam satu permintaan → 422 `validasi_gagal` (kolom `objek.<i>.id`).
        `data` selalu sepanjang dan seurut `objek`: objek yang sudah ditandatangani akun ini dengan isi yang sama tidak
        digandakan, isinya tanda tangan lama dengan `baru: false` (kirim ulang aman, pengganti Idempotency-Key). Bila isi
        objek berubah (mis. usulan dikirim ulang), tanda tangan baru dibuat; yang lama tetap ada (verifikasi: `isi_berubah`).
        Siapa yang boleh: `persetujuan_akses` hanya akun pemutusnya sesudah diputuskan; `usulan_data_induk` (1.8c) pengusul,
        pemverifikasi, atau penyetuju putaran itu sesudah tindakannya (`bukan_pemutus` = bukan pelaku usulan itu;
        `belum_diputuskan` = pelaku yang tindakannya di putaran ini belum dilakukan).
        - 422 `pin_salah` (kolom `pin`, `sisa_percobaan`); 403 `ttd_terkunci` (Retry-After); 409 `ttd_belum_aktif`;
          422 `validasi_gagal` bila `pernyataan_disetujui` bukan true.
        Audit `ttd.ditandatangani` per objek baru (hash isi, sidik kunci; tanpa isi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objek, pernyataan_disetujui]
              properties:
                objek:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [jenis, id]
                    properties:
                      jenis: { type: string, enum: [persetujuan_akses, usulan_data_induk] }
                      id: { type: string, format: uuid }
                pin: { type: [string, 'null'], maxLength: 20 }
                pernyataan_disetujui:
                  type: boolean
                  const: true
                  description: "Akun menyetujui kalimat \"Saya menyatakan isi ini benar dan saya menandatanganinya\" (PRD 7.57.2 huruf f) yang ditampilkan klien bersama ringkasan isi"
      responses:
        '200':
          description: Tanda tangan per objek (urutan sama dengan permintaan)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/TandaTangan'
                        - type: object
                          required: [baru]
                          properties:
                            baru: { type: boolean, description: "false = tanda tangan lama akun ini untuk objek itu" }
                  meta:
                    type: object
                    required: [sesi_berlaku_sampai]
                    properties:
                      sesi_berlaku_sampai: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ttd/verifikasi/{objek_jenis}/{objek_id}:
    parameters:
      - { in: path, name: objek_jenis, required: true, schema: { type: string, enum: [persetujuan_akses, usulan_data_induk] } }
      - { in: path, name: objek_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: verifikasiTtd
      summary: Verifikasi ulang semua tanda tangan sebuah objek (integritas isi + keaslian tanda tangan)
      description: |
        Hanya akun yang boleh melihat objek itu (persetujuan_akses: aturan /persetujuan-akses/{id}; usulan_data_induk: izin
        master_data.usulan.lihat atau pelaku usulan itu); selain itu 404.
        Urutan pemeriksaan: keaslian dulu (`tanda_tangan_tidak_sah` bila tanda tangan tidak cocok dengan hash tersimpan dan
        kunci publik yang dipakai, mis. baris palsu), lalu isi (`isi_berubah` bila hash isi kanonik objek saat ini berbeda
        dari saat ditandatangani). Waktu di isi kanonik selalu UTC dengan presisi mikrodetik (tidak bergantung zona waktu
        instalasi).
        Bukan endpoint daftar: satu baris per penanda tangan per isi yang ditandatangani (usulan yang dikirim ulang bisa
        punya tanda tangan putaran lama berstatus `isi_berubah`), urut `ditandatangani_pada`.
        Hasil kosong = belum ada tanda tangan.
      responses:
        '200':
          description: Hasil verifikasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TandaTangan' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Usulan perubahan data induk berjenjang (tiket 1.8c; PRD FR-54-01, FR-54-02, FR-08-16; prototipe masterdata.html "Usulan").
  # - Mesin generik per `jenis_data`: `ruang_tt` (ruang, kamar, tempat tidur dari 1.8b) dan `tarif` (tiket 2.2). Formularium
  #   memakai mesin yang sama di fase 3. Daftar jenis data bukan literal: dari `inti.alur_usulan`.
  # - Tahap: diusulkan → diverifikasi → disetujui (terjadwal) → berlaku. Pemverifikasi/penyetuju bisa mengembalikan
  #   (catatan wajib) → `dikembalikan` → pengusul memperbaiki dan kirim ulang (kembali ke `diusulkan`, putaran +1).
  #   Gagal saat diterapkan (objek berubah sejak diusulkan, atau aturan 1.8b tidak terpenuhi lagi) → `gagal_diterapkan`
  #   dengan alasan; pengusul diberi tahu. `gagal_diterapkan` dan `berlaku` final (tidak bisa dikirim ulang; usulan baru
  #   dibuat bila masih perlu).
  # - Isi tiap putaran disimpan (kirim ulang tidak menimpa putaran lama; jejak PRD 7.57.2 c–d). Isi kanonik TTE = isi
  #   putaran yang ditandatangani tanpa hasil penerapan (id objek baru hasil `tambah` tidak ikut), sehingga tanda tangan
  #   tetap sah sesudah usulan berlaku.
  # - Tampilan diff: `tampilan[]` (label isian, nilai lama/baru siap tampil, mis. nama kelas/bangsal/unit) disusun server
  #   saat dibaca; hanya untuk layar, tidak masuk isi kanonik TTE. `nilai_lama`/`nilai_baru` mentah untuk kirim ulang.
  #   `ringkasan` (mis. "ICU: 12 → 16 TT") dipotret saat diusulkan/dikirim ulang, tidak bergeser sesudah berlaku.
  # - Tautan tugas/notifikasi usulan: `/master-data/usulan?usulan={id}` (rute layar).
  # - Izin sub-menu `master_data.usulan` (cakupan rs): `lihat` (semua usulan), `input` (mengusulkan dan kirim ulang
  #   usulan sendiri), `verifikasi`, `setujui`. Alur per jenis data (`inti.alur_usulan`, data induk; layar menyusul) bisa
  #   mempersempit pengusul (pemilik data), pemverifikasi, dan penyetuju ke satu peran (mis. ruang & TT: Keperawatan →
  #   Yanmed → Direktur). Tiga orang berbeda: pengusul ≠ pemverifikasi ≠ penyetuju. Pemeriksaan 403 (izin, peran alur,
  #   `pengusul_sendiri`, `sudah_memverifikasi`) didahulukan sebelum 409 `tahap_tidak_sesuai`.
  # - Tanggal: `berlaku_dari` ≥ hari ini saat diajukan. Uji kering memakai `berlaku_dari` sebagai hari acuan aturan
  #   tanggal 1.8b (mis. TT baru mulai dihitung, status ruang). Tanggal efektif penerapan = max(`berlaku_dari`, hari ini):
  #   usulan yang disetujui sesudah tanggalnya lewat berlaku mulai hari disetujui.
  # - Setiap butir `perubahan` divalidasi dengan aturan 1.8b yang sama saat diusulkan/dikirim ulang (uji kering) dan
  #   sekali lagi saat diterapkan. `nilai_lama` dan revisi objek dipotret server saat diusulkan (klien tidak
  #   mengirimnya); `objek_berubah` menandai objek yang berubah sejak itu (penerapan akan gagal; kembalikan ke pengusul).
  #   Satu objek hanya boleh ada di satu usulan yang sedang berjalan (tahap diusulkan, diverifikasi, disetujui); usulan
  #   `dikembalikan` tidak mengunci objek, konflik diperiksa lagi saat kirim ulang. Dua usulan yang sama-sama menambah
  #   kode TT yang sama: yang diterapkan belakangan gagal (`kode_sudah_dipakai`).
  # - Penerapan: tugas terjadwal 00.00 zona RS mengambil semua usulan `disetujui` dengan `berlaku_dari` ≤ hari ini
  #   (mengejar bila server mati saat itu), satu transaksi per usulan, idempoten (kunci baris + cek tahap); bila
  #   `berlaku_dari` ≤ hari ini saat disetujui, langsung diterapkan. Setiap perubahan data induk (lewat usulan maupun
  #   langsung) menyimpan versi (riwayat-versi; `versi` = urutan per objek mulai 1).
  # - Setelah instalasi siap melayani (penjaga `instalasi.siap_melayani`, tiket 1.8f; sampai 1.8f selalu belum),
  #   perubahan langsung ruang/kamar/TT ditolak 409 `harus_lewat_usulan` (`rincian` kosong; `pesan` siap ditampilkan
  #   sebagai banner dengan tautan ke /master-data/usulan): POST/PATCH /lokasi untuk jenis ruang, POST /lokasi/impor,
  #   POST/PATCH /kamar, POST/PATCH /tempat-tidur dan tutupnya — kecuali TT `ekstra` (darurat lonjakan: tambah dan tutup
  #   TT ekstra tetap langsung dan tercatat).
  # - Notifikasi/tugas (1.7) jenis USULAN_DATA_INDUK ke pemverifikasi, penyetuju, atau pengusul sesuai tahap. Usulan
  #   bisa ditandatangani (TTE T1, 1.6) oleh pengusul, pemverifikasi, dan penyetujunya (`objek_jenis = usulan_data_induk`).
  # ---------------------------------------------------------------------------
  /usulan-data-induk:
    get:
      operationId: daftarUsulanDataInduk
      summary: Daftar usulan (paginasi kursor, terbaru dulu)
      description: |
        Izin: master_data.usulan.lihat. `tahap=terbuka` = diusulkan, diverifikasi, disetujui, dikembalikan (tahap final
        `berlaku` dan `gagal_diterapkan` tidak termasuk). `perlu_saya=true` = usulan yang akun ini bisa tindak lanjuti
        sekarang (`dapat.verifikasi|setujui|kembalikan|kirim_ulang`). Semua filter digabung (AND). Urutan: waktu usulan
        pertama kali diajukan (tidak berubah saat kirim ulang), terbaru dulu. `meta.jumlah` = jumlah per tahap untuk kartu
        ringkasan (mengikuti filter `jenis_data` saja); `gagal_diterapkan` = 30 hari terakhir.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tahap, schema: { type: string, enum: [terbuka, diusulkan, diverifikasi, disetujui, berlaku, dikembalikan, gagal_diterapkan] } }
        - { in: query, name: jenis_data, schema: { $ref: '#/components/schemas/JenisDataInduk' } }
        - { in: query, name: perlu_saya, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman usulan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UsulanDataInduk' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/MetaKursor'
                      - type: object
                        required: [jumlah]
                        properties:
                          jumlah:
                            type: object
                            required: [diusulkan, diverifikasi, disetujui, dikembalikan, gagal_diterapkan]
                            properties:
                              diusulkan: { type: integer, minimum: 0 }
                              diverifikasi: { type: integer, minimum: 0 }
                              disetujui: { type: integer, minimum: 0, description: "Terjadwal berlaku" }
                              dikembalikan: { type: integer, minimum: 0 }
                              gagal_diterapkan: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatUsulanDataInduk
      summary: Ajukan usulan perubahan data induk
      description: |
        Izin: master_data.usulan.input. `berlaku_dari` ≥ hari ini zona RS (422 `tanggal_tidak_valid`).
        - 422 `perubahan_tidak_valid`: `rincian[]` = `{kolom: "perubahan.<i>[.<isian>]", kode, pesan}`, kode dari aturan 1.8b
          (mis. `kode_sudah_dipakai`, `kelas_rawat_tidak_valid`, `sudah_ditutup`, `jenis_induk_tidak_sesuai`) atau
          `objek_tidak_ditemukan`, `aksi_tidak_dikenal`.
        - 409 `objek_sedang_diusulkan`: objek yang sama ada di usulan lain yang sedang berjalan; `rincian[]` =
          `{kolom: "perubahan.<i>", kode: "objek_sedang_diusulkan", pesan, usulan: {id, nomor}}`.
        - 403 `bukan_pengusul_alur`: alur jenis data menetapkan peran pengusul (pemilik data) dan akun ini tidak memegangnya.
        Audit `master_data.usulan_diajukan`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianUsulanDataInduk' }
      responses:
        '201':
          description: Usulan diajukan (tahap diusulkan)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciUsulanDataInduk
      summary: Rincian usulan dengan perbedaan lama → baru dan riwayat tahap
      description: "Izin: master_data.usulan.lihat."
      responses:
        '200':
          description: Rincian
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/verifikasi:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: verifikasiUsulanDataInduk
      summary: Verifikasi usulan (diusulkan → diverifikasi)
      description: |
        Izin: master_data.usulan.verifikasi (dan peran pemverifikasi alur jenis data bila ditetapkan: 403 `bukan_pemverifikasi`).
        403 `pengusul_sendiri`; 409 `tahap_tidak_sesuai` (bukan tahap diusulkan). Audit `master_data.usulan_diverifikasi`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { catatan: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200':
          description: Usulan sesudah diverifikasi
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/setujui:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: setujuiUsulanDataInduk
      summary: Setujui usulan (diverifikasi → disetujui; langsung berlaku bila berlaku_dari ≤ hari ini)
      description: |
        Izin: master_data.usulan.setujui (dan peran penyetuju alur bila ditetapkan: 403 `bukan_penyetuju`).
        403 `pengusul_sendiri`, 403 `sudah_memverifikasi` (pemverifikasi tidak menyetujui usulan yang ia verifikasi);
        409 `tahap_tidak_sesuai`. Bila langsung diterapkan dan gagal: respons 200 dengan tahap `gagal_diterapkan` dan
        `gagal_alasan`. Audit `master_data.usulan_disetujui` (+ `master_data.usulan_diterapkan`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { catatan: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200':
          description: Usulan sesudah disetujui (disetujui, berlaku, atau gagal_diterapkan)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/kembalikan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: kembalikanUsulanDataInduk
      summary: Kembalikan usulan ke pengusul dengan catatan (dari tahap diusulkan atau diverifikasi)
      description: |
        Tahap diusulkan: izin verifikasi (peran pemverifikasi alur); tahap diverifikasi: izin setujui (peran penyetuju
        alur) dan bukan pemverifikasinya (403 `sudah_memverifikasi`). 403 `pengusul_sendiri`; 409 `tahap_tidak_sesuai`.
        Audit `master_data.usulan_dikembalikan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catatan]
              properties:
                catatan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Usulan sesudah dikembalikan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /usulan-data-induk/{id}/kirim-ulang:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: kirimUlangUsulanDataInduk
      summary: Perbaiki dan kirim ulang usulan yang dikembalikan (dikembalikan → diusulkan)
      description: |
        Hanya pengusulnya, dengan izin master_data.usulan.input (selain itu 403 `bukan_pengusul`). Membuat putaran
        baru (isi putaran lama tetap tersimpan; bentuk sama dengan POST, kecuali `jenis_data` tetap); `nilai_lama` dipotret ulang; putaran +1; tanda
        tangan putaran sebelumnya menjadi `isi_berubah`. 409 `tahap_tidak_sesuai` (bukan tahap dikembalikan, termasuk
        bila sudah dikirim ulang dari tab lain); 409 `objek_sedang_diusulkan`; 422 seperti POST. Audit
        `master_data.usulan_dikirim_ulang`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perubahan, berlaku_dari, alasan, dasar]
              properties:
                perubahan: { $ref: '#/components/schemas/IsianPerubahanUsulan' }
                berlaku_dari: { type: string, format: date }
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Usulan sesudah dikirim ulang
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UsulanDataInduk' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /data-induk/{jenis}/{id}/riwayat-versi:
    parameters:
      - { in: path, name: jenis, required: true, schema: { $ref: '#/components/schemas/ObjekDataInduk' } }
      - $ref: '#/components/parameters/Id'
    get:
      operationId: riwayatVersiDataInduk
      summary: Riwayat versi satu objek data induk (paginasi kursor, terbaru dulu)
      description: |
        Izin: lihat data induk itu (ruang/kamar/tempat_tidur: master_data.organisasi.lihat; tarif: master_data.tarif.lihat, sama dengan GET /data-induk/tarif/{id}/versi). Setiap perubahan (lewat usulan
        atau langsung) = satu versi dengan isi sebelum dan sesudah; versi tidak pernah diubah. Objek tanpa riwayat
        (dibuat sebelum 1.8c dan belum pernah diubah) → daftar kosong.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman versi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VersiDataInduk' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Paket data referensi (tiket 1.8e; PRD FR-54-08 langkah 4, FR-54-09, 11.2 inti.paket_referensi/wilayah/referensi/
  # terminologi; keputusan K7). Instalasi baru memuat data rujukan nasional dengan sumber dan versi yang jelas.
  # - Satu pemuatan = satu versi lengkap satu sistem (snapshot): kode di berkas ditambah/diperbarui; kode yang sudah ada
  #   tetapi tidak ada di versi baru ditandai tidak aktif (tidak dihapus, tetap terbaca di data historis); kode yang
  #   muncul lagi diaktifkan kembali. Untuk `referensi`, snapshot berlaku per `kelompok` yang ada di berkas.
  # - Versi = kunci pemuatan per sistem (`inti.paket_referensi` unik sistem + versi, dengan sidik isi). Memuat ulang
  #   sistem + versi yang sama dengan isi sama = idempoten bila versi itu pemuatan terakhir sistem tersebut: 200,
  #   `diterapkan` true, jumlah perubahan (baru/diubah/dinonaktifkan/diaktifkan lagi) 0, tanpa baris paket dan audit baru.
  #   Pratinjau pemuatan ulang itu: 200, `diterapkan` false, jumlah perubahan 0. Versi lama yang sudah digantikan versi
  #   lain tidak bisa dimuat ulang, dan isi berbeda dengan versi yang sama ditolak: keduanya 409 `versi_sudah_dimuat`
  #   (pakai nomor versi lain). Untuk `referensi`, setiap berkas (satu atau beberapa kelompok) memakai versinya sendiri
  #   (mis. `agama-2025.1`).
  # - Pemuatan terakhir yang menentukan kode mana yang aktif; pemuatan bersamaan untuk sistem yang sama diserialkan.
  # - Paket referensi bukan data induk berpemilik: tidak lewat usulan berjenjang dan tidak terkena `harus_lewat_usulan`.
  # - Nama sistem di API huruf kecil; di `inti.terminologi.sistem` sama (PRD 11.2 menulis ICD10, ICD9CM, LOINC, UCUM).
  # - Isi paket: wilayah, UCUM, subset LOINC (atribusi Regenstrief), kode variabel RME dikemas produk (berkas dari sumber
  #   resmi, SUMBER.md per paket); ICD-10/ICD-9-CM hanya dari berkas yang disediakan RS (K7, tidak ada berkas ICD di repo).
  #   KFA dan referensi BPJS ditarik lewat API di 1.9; SNOMED CT tidak dikemas.
  # - Juga lewat konsol: `php artisan referensi:muat <sistem> <berkas> --versi= --sumber=` (aturan dan validasi sama).
  # ---------------------------------------------------------------------------
  /paket-referensi/{sistem}/muat:
    parameters:
      - { in: path, name: sistem, required: true, schema: { $ref: '#/components/schemas/SistemReferensi' } }
    post:
      operationId: muatPaketReferensi
      summary: Muat satu versi paket referensi dari CSV (pratinjau dulu, lalu terapkan)
      description: |
        Izin: master_data.katalog.input, cakupan `rs` (wizard penyiapan langkah 4). Berkas CSV UTF-8 (RFC 4180, baris pertama
        judul kolom; BOM dan pemisah `;` diterima), paling besar 10 MB dan 120.000 baris data; diproses sinkron dengan target
        < 30 detik untuk 100.000 baris (PRD 14.1.1; wilayah ±91 ribu kelurahan). Judul kolom per sistem:
        - `wilayah`: `kode,nama` — kode Kemendagri bertitik (`11`, `11.01`, `11.01.01`, `11.01.01.2001`); tingkat
          (provinsi/kabupaten/kecamatan/kelurahan) dan induk diturunkan dari kode.
        - `referensi`: `kelompok,kode,label` — kelompok snake_case (mis. agama, pendidikan, pekerjaan, status_kawin).
        - `icd10`, `icd9cm`, `loinc`, `ucum`: `kode,tampilan,kode_induk` (kode_induk boleh kosong).
        - `mode=pratinjau`: tidak menyimpan; ringkasan perubahan dan baris salah.
        - `mode=terapkan`: memeriksa ulang; satu baris salah → 422 `muat_tidak_valid` (`rincian` = baris salah, paling banyak
          500; tidak ada yang disimpan); bila semua benar → satu transaksi + satu baris `inti.paket_referensi` (versi yang sama
          tidak digandakan) + audit `master_data.referensi_dimuat`.
        - 422 `berkas_tidak_valid` (bukan CSV UTF-8, judul kolom tidak sesuai, melebihi batas baris).
        - Versi sama dengan isi sama yang merupakan pemuatan terakhir sistem itu: 200 tanpa perubahan (jumlah perubahan 0;
          `diterapkan` true pada terapkan, false pada pratinjau), tanpa baris paket dan audit baru.
        - 409 `versi_sudah_dimuat` (pratinjau dan terapkan): versi itu sudah dimuat dengan isi berbeda, atau sudah
          digantikan pemuatan versi lain untuk sistem yang sama. Pakai nomor versi baru.
        - 422 `validasi_gagal` kolom `catatan_lisensi` untuk `loinc` bila kosong (atribusi Regenstrief wajib).
        Kode salah per baris: `kolom_wajib`, `kode_tidak_valid`, `kode_ganda`, `induk_tidak_ditemukan`, `nilai_tidak_valid`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas, mode, versi, sumber]
              properties:
                berkas: { type: string, contentMediaType: text/csv }
                mode: { type: string, enum: [pratinjau, terapkan] }
                versi: { type: string, minLength: 1, maxLength: 50, examples: ['2025.1', 'agama-2025.1'] }
                sumber: { type: string, minLength: 3, maxLength: 500, description: "Asal berkas (instansi/URL/nomor dokumen)" }
                catatan_lisensi: { type: [string, 'null'], maxLength: 1000, description: "Mis. atribusi Regenstrief untuk LOINC" }
      responses:
        '200':
          description: Hasil pratinjau atau penerapan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/HasilMuatReferensi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: "Berkas melebihi batas unggah server web" }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Penyiapan instalasi kosong (tiket 1.8f; PRD FR-54-08, 3.4; keputusan K6, K7). Sembilan langkah berurutan. Status tiap
  # langkah dihitung server dari data yang sudah ada; datanya diisi di layar modul masing-masing (wizard menautkan ke
  # sana, bukan formulir duplikat), lalu penyiap mengonfirmasi langkah itu (POST .../selesai, tercatat audit, bisa diulang).
  # - Status langkah:
  #   - `belum`: tidak ada syarat terpenuhi;
  #   - `sebagian`: sebagian syarat terpenuhi, atau semua terpenuhi tetapi belum dikonfirmasi;
  #   - `selesai`: semua syarat terpenuhi dan sudah dikonfirmasi. Bila sesudahnya syarat tidak lagi terpenuhi (mis.
  #     superadmin dinonaktifkan), status kembali `sebagian` dan konfirmasi terakhir tetap tampil;
  #   - `dilewati`: hanya langkah 8, dikonfirmasi dengan `dilewati` + alasan;
  #   - `menunggu_fase_2`: langkah 6–7 (K6), kerangka saja, tidak bisa dikonfirmasi.
  # - Urutan wajib (FR-54-08): langkah n hanya bisa dikonfirmasi bila semua langkah sebelumnya `selesai`, `dilewati`, atau
  #   `menunggu_fase_2`. Mengisi data tidak dibatasi urutan.
  # - Langkah yang mundur tidak mengubah status langkah sesudahnya; urutan hanya membatasi konfirmasi berikutnya.
  # - `siap_melayani` (FR-54-08 "tidak bisa melayani pasien sebelum langkah 1–6 lengkap") **terkunci**: menjadi true saat
  #   konfirmasi yang pertama kali melengkapi langkah 1–6 (`siap_melayani_sejak` dicatat), dan tidak kembali false walau
  #   langkah 1–6 kemudian mundur ke `sebagian` (mis. superadmin dinonaktifkan, izin praktik habis); kemunduran itu tampil
  #   sebagai status langkah. Di fase 1 selalu false karena langkah 6 menunggu fase 2 (K6). Modul lain memakai penjaga
  #   yang sama (`App\Core\Instalasi\StatusInstalasi`, mis. 409 `harus_lewat_usulan` di 1.8c).
  # - Ringkasan `status`: `belum` bila tidak ada langkah `selesai`/`dilewati`; `selesai` bila semua langkah selain
  #   `menunggu_fase_2` sudah `selesai`/`dilewati`; selain itu `sebagian`. Hanya di respons ini; GET tidak menulis apa pun.
  #   `inti.profil_rs.status_penyiapan` (ProfilRs.rinci) tetap berarti langkah 2 (profil RS) seperti di 1.8a.
  # - Sub-menu `pengaturan.penyiapan` termasuk sub-menu bawaan peran superadmin (seperti `pengaturan.profil_rs`), agar
  #   superadmin pertama dari konsol bisa membuka penyiapan di instalasi kosong.
  # - Syarat per langkah (`syarat[].kode`; `keterangan` menyebut yang kurang, mis. "1 dari 2"):
  #   1 `superadmin`: `superadmin_mfa` (≥ 2 akun aktif berperan superadmin dengan MFA terdaftar), `jaringan_rs`
  #     (AUTENTIKASI_MFA_JARINGAN_RS terisi di server; bagi pemanggil web praktis selalu terpenuhi karena tanpa itu masuk
  #     biasa ditolak, tetap ditampilkan sebagai bukti).
  #   2 `profil_rs`: `profil` (nama RS tersimpan), `logo` (logo paket identitas terunggah). Kontras warna sudah dijaga
  #     PUT /profil-rs.
  #   3 `organisasi`: `unit`, `ksm`, `kelas_rawat`, `bangsal`, `tempat_tidur`, `poliklinik` (masing-masing ≥ 1 aktif).
  #   4 `paket_referensi`: `wilayah`, `referensi`, `loinc`, `ucum` (≥ 1 versi dimuat; untuk `referensi` cukup satu
  #     kelompok, kelengkapan kelompok belum diperiksa). ICD-10/ICD-9-CM tidak wajib (K7, berkas dari RS) dan tampil di
  #     `paket` dengan `wajib` false.
  #   5 `pegawai`: `pegawai` (≥ 1 pegawai aktif yang belum keluar), `izin_praktik` (≥ 1 izin praktik berstatus aktif milik
  #     pegawai itu, `berlaku_sampai` kosong atau ≥ hari ini zona RS).
  #   6 `penjamin_tarif`, 7 `formularium`: tanpa syarat di fase 1 (`menunggu_fase_2`).
  #   8 `kredensial_integrasi`: `kredensial` (kredensial tersimpan dan uji koneksi berhasil; dibangun di tiket 1.9, sampai
  #     itu belum pernah terpenuhi). Boleh dilewati dengan alasan ("belum ada kredensial") selama belum `selesai`;
  #     sesudah dilewati statusnya `dilewati` sampai dikonfirmasi selesai (syarat terpenuhi) atau dilewati ulang.
  #   9 `modul_aktif`: `modul` (≥ 1 modul aktif untuk seluruh RS di `inti.modul_aktif`). Modul inti fase 1 sudah aktif dari
  #     migrasi dan layar modul aktif belum ada (utang), jadi di fase 1 syarat ini selalu terpenuhi.
  # ---------------------------------------------------------------------------
  /penyiapan:
    get:
      operationId: statusPenyiapan
      summary: Status sembilan langkah penyiapan instalasi dan penjaga siap melayani
      description: |
        Izin: pengaturan.penyiapan.lihat, cakupan `rs`. Juga dipakai Beranda untuk indikator "Instalasi belum bisa
        melayani pasien" (hanya bagi pemegang izin ini). Dihitung saat diminta dari data induk (tanpa cache).
      responses:
        '200':
          description: Status penyiapan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusPenyiapan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /penyiapan/{langkah}/selesai:
    parameters:
      - { in: path, name: langkah, required: true, schema: { $ref: '#/components/schemas/KodeLangkahPenyiapan' } }
    post:
      operationId: konfirmasiLangkahPenyiapan
      summary: Konfirmasi satu langkah penyiapan selesai (atau langkah 8 dilewati); bisa diulang
      description: |
        Izin: pengaturan.penyiapan.perbaiki, cakupan `rs`. Syarat diperiksa ulang saat itu. Setiap konfirmasi disimpan
        sebagai baris baru (riwayat) dan dicatat audit `pengaturan.penyiapan_dikonfirmasi` (langkah, dilewati, alasan).
        Mengonfirmasi ulang langkah yang sudah selesai = 200 dengan konfirmasi baru.
        Urutan pemeriksaan (error pertama yang dikembalikan):
        - 422 `validasi_gagal` kolom `alasan`: wajib (5–500 karakter) bila `dilewati` true.
        - 422 `tidak_bisa_dilewati`: `dilewati` true selain langkah 8, atau langkah 8 yang sudah `selesai`.
        - 409 `langkah_menunggu_fase_2`: langkah 6–7.
        - 409 `langkah_sebelumnya_belum_selesai`: `rincian` = `{langkah, status}` (`langkah` = KodeLangkahPenyiapan) untuk
          setiap langkah sebelumnya yang belum selesai/dilewati/menunggu fase 2.
        - 409 `syarat_belum_lengkap`: `rincian` = syarat yang belum terpenuhi `{kode, label, keterangan}`. Melewati langkah 8
          tidak memeriksa syarat `kredensial`.
        `{langkah}` di luar enum → 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dilewati: { type: boolean, default: false, description: "Hanya langkah 8 (kredensial integrasi)" }
                alasan: { type: [string, 'null'], minLength: 5, maxLength: 500, description: "Wajib bila dilewati" }
      responses:
        '200':
          description: Status penyiapan sesudah konfirmasi
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusPenyiapan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Gateway integrasi (tiket 1.9; PRD 10 Integration Gateway + outbox, FR-49-01/04/05/06/07, FR-50-01 baca, 03, 07, 08;
  # 11.2 integrasi.*; keputusan K8, K9). Semua kiriman ke sistem luar lewat outbox `integrasi.kotak_keluar` dan pekerja
  # queue `integrasi` sesudah transaksi bisnis commit; tidak ada panggilan sistem luar di dalam permintaan pengguna selain
  # uji koneksi.
  # - Sistem fase 1 (`SistemIntegrasi`): `bpjs_vclaim` (baca: peserta, rujukan, referensi), `aplicares` (ketersediaan TT),
  #   `satusehat` (OAuth2, IHS, Organization/Location, KFA). Lingkungan `sandbox` | `produksi` per sistem.
  # - Alamat sistem luar (host dan nama layanan per lingkungan) dari konfigurasi server (.env), tidak bisa diubah lewat API
  #   (mencegah SSRF); nilai awalnya dari catatan lapangan, **perlu verifikasi** ke dokumen resmi sebelum produksi.
  # - Kredensial (K9): `integrasi.kredensial_api` per sistem + lingkungan; kolom rahasia (`secret_key`, `user_key`,
  #   `client_secret`) terenkripsi kunci khusus `KREDENSIAL_KUNCI` (bukan APP_KEY; rotasi lewat perintah konsol). Tulis
  #   saja: kolom rahasia hanya menyebut terisi + `akhir` (4 karakter terakhir, hanya bila panjangnya ≥ 16; lebih pendek →
  #   null). Kolom bukan rahasia (`cons_id`, `client_id`, `organization_id`) tampil utuh di `nilai` (PRD 11.2: `cons_id`
  #   tidak dienkripsi). Nilai rahasia tidak pernah ada di respons, log, audit, atau pesan error. Kunci belum
  #   dikonfigurasi → 503 `kredensial_kunci_belum_dikonfigurasi`.
  # - Lingkungan: setiap kiriman terikat ke lingkungan aktif saat kiriman dibuat (`Kiriman.lingkungan`) dan hanya dikirim
  #   ke lingkungan itu. Mengaktifkan lingkungan lain membuat kiriman `menunggu`/`gagal` lingkungan lama menjadi
  #   `tertahan` (`lingkungan_berubah`); kiriman itu tidak pernah berpindah lingkungan (data uji tidak ke produksi, data
  #   asli tidak ke sandbox). Kiriman yang dibuat saat sistem tanpa lingkungan aktif berlingkungan null dan `tertahan`
  #   (`integrasi_nonaktif`); kiriman itu tidak dikirim otomatis, dan baru diikat ke lingkungan aktif lewat kirim ulang
  #   (aksi eksplisit pengguna). Kirim ulang otomatis FR-49-05 hanya untuk penyebab data induk, tidak untuk
  #   `lingkungan_berubah` dan `integrasi_nonaktif`.
  # - Kotak keluar: status `menunggu` → `terkirim`; `gagal` sesudah batas percobaan (retry eksponensial; kirim ulang manual);
  #   `tertahan` bila data induk kurang (penyebab + unit pemilik data, FR-49-04) dan dikirim ulang otomatis sesudah data
  #   induk diperbaiki (FR-49-05). Idempotency key per kiriman: kirim ulang tidak menggandakan di sistem luar.
  # - Circuit breaker per sistem + lingkungan: `tertutup` (normal), `terbuka` (kiriman ditahan sampai `coba_lagi_pada`),
  #   `setengah_terbuka` (satu percobaan). Saat terbuka, kiriman tetap menumpuk di outbox; queue jenis lain tidak terganggu.
  # - Data pasien: muatan kiriman tidak pernah dikirim ke layar. `error_terakhir`, `pesan`, isi log, dan path endpoint
  #   disamarkan sebelum disimpan, paling sedikit: NIK, nama, nomor kartu, nomor RM, tanggal lahir, telepon, alamat, nomor
  #   rujukan/SEP/surat kontrol, token dan header rahasia. Isi JSON disamarkan dengan daftar kunci yang boleh tampil
  #   (allowlist per sistem); kunci lain diganti `***`.
  # - Penyiapan langkah 8 (`kredensial`, kontrak v0.12.0): terpenuhi bila setiap sistem fase 1 punya lingkungan aktif yang
  #   lengkap dan uji koneksi terakhir lingkungan itu berhasil; `keterangan` menyebut jumlahnya (mis. "2 dari 3").
  # - Izin: konfigurasi dan uji koneksi `pengaturan.integrasi.*` (Pengaturan → Konfigurasi integrasi;
  #   `pengaturan.integrasi.perbaiki` sensitif: pemberiannya lewat persetujuan, penyetuju bawaan superadmin seperti K13,
  #   karena menukar kredensial mengalihkan kiriman data pasien); kotak keluar per tujuan `integrasi.satusehat.*`
  #   (satusehat) atau `integrasi.bpjs.*` (bpjs_vclaim, aplicares); log `integrasi.log.lihat` (sub-menu Integrasi dan
  #   Laporan → Log integrasi, PRD 9.1). Sub-menu `integrasi.satusehat`, `integrasi.bpjs`, `integrasi.log` dipakai sejak
  #   fase 1. Semua cakupan `rs`.
  # ---------------------------------------------------------------------------
  /integrasi/sistem:
    get:
      operationId: statusSistemIntegrasi
      summary: Status tiap sistem integrasi (lingkungan, kredensial terisi, circuit breaker, queue, error terakhir)
      description: |
        Izin: pengaturan.integrasi.lihat (semua sistem, dengan `kredensial`), atau pemantauan per tujuan
        integrasi.satusehat.lihat / integrasi.bpjs.lihat (hanya sistem itu, `kredensial` = null; FR-50-08). Cakupan `rs`.
        Daftar tetap satu baris per sistem yang boleh dilihat (urutan `SistemIntegrasi`), bukan daftar data, jadi tanpa
        kursor. Dihitung saat diminta; jumlah queue dari kotak keluar (indeks per tujuan + status).
      responses:
        '200':
          description: Status semua sistem
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StatusSistemIntegrasi' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /integrasi/sistem/{kode}/kredensial:
    parameters:
      - { in: path, name: kode, required: true, schema: { $ref: '#/components/schemas/SistemIntegrasi' } }
    put:
      operationId: simpanKredensialIntegrasi
      summary: Simpan kredensial satu sistem untuk satu lingkungan (tulis saja)
      description: |
        Izin: pengaturan.integrasi.perbaiki (sensitif), cakupan `rs`. Kolom yang dikirim menggantikan nilai lama; kolom
        yang tidak dikirim tetap (tulis sebagian; PUT sesuai teks tiket). Kolom per sistem (semua wajib):
        - `bpjs_vclaim`, `aplicares`: `cons_id` (bukan rahasia), `secret_key`, `user_key` (rahasia). Kode PPK dari profil
          RS (`kode_ppk_bpjs`, PUT /profil-rs); kosong → `peringatan` `kode_ppk_kosong` dan kiriman BPJS `tertahan`.
        - `satusehat`: `client_id`, `organization_id` (bukan rahasia; ID Organization faskes di SATUSEHAT, berbeda antara
          sandbox dan produksi, jadi disimpan per lingkungan), `client_secret` (rahasia).
        `aktifkan: true` menjadikan lingkungan ini yang dipakai pekerja dan uji koneksi (satu lingkungan aktif per sistem);
        `aktifkan` pada lingkungan yang kolom wajibnya belum lengkap → 422 `kredensial_belum_lengkap`. Berpindah lingkungan
        menutup circuit breaker lingkungan baru; kiriman lingkungan lama yang belum terkirim menjadi `tertahan`
        (`lingkungan_berubah`, lihat komentar blok). `nonaktifkan: true` mengosongkan lingkungan aktif sistem itu: kiriman
        baru tetap dibuat tetapi `tertahan` (`integrasi_nonaktif`). Audit `integrasi.kredensial_diubah` mencatat sistem,
        lingkungan, nama kolom yang diubah, aktifkan/nonaktifkan, tanpa nilai.
        - 422 `validasi_gagal` (`rincian` = `[{kolom, pesan}]`, kolom `kolom.<nama>`): kolom tidak dikenal untuk sistem
          itu, nilai kosong, lebih dari 500 karakter, atau memuat spasi di awal/akhir; `aktifkan` dan `nonaktifkan`
          bersamaan.
        - 422 `kredensial_belum_lengkap`: `rincian` = `[{kolom, pesan}]` kolom wajib yang kosong.
        - 503 `kredensial_kunci_belum_dikonfigurasi`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lingkungan]
              properties:
                lingkungan: { $ref: '#/components/schemas/LingkunganIntegrasi' }
                aktifkan: { type: boolean, default: false }
                nonaktifkan: { type: boolean, default: false }
                kolom:
                  type: object
                  description: "Nama kolom → nilai; hanya kolom milik sistem itu (lihat deskripsi)"
                  additionalProperties: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Status sistem sesudah disimpan (tanpa nilai rahasia)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusSistemIntegrasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /integrasi/sistem/{kode}/uji-koneksi:
    parameters:
      - { in: path, name: kode, required: true, schema: { $ref: '#/components/schemas/SistemIntegrasi' } }
    post:
      operationId: ujiKoneksiIntegrasi
      summary: Uji koneksi ke sistem luar dengan kredensial tersimpan
      description: |
        Izin: pengaturan.integrasi.perbaiki, cakupan `rs`. Satu panggilan baca ke sistem luar memakai kredensial lingkungan
        yang diminta (bawaan: lingkungan aktif): `bpjs_vclaim` referensi provinsi, `aplicares` referensi kelas,
        `satusehat` permintaan token OAuth2. Tidak lewat outbox dan tidak dipengaruhi circuit breaker; batas waktu 15 detik.
        Hasil (berhasil atau tidak) = 200 dan disimpan sebagai `uji_koneksi_terakhir`; dicatat di log integrasi dan audit
        `integrasi.uji_koneksi`. Dibatasi 6 kali per menit per akun (429 dengan header `Retry-After`).
        - 422 `kredensial_belum_lengkap`: kolom wajib lingkungan itu belum terisi (`rincian` = `[{kolom, pesan}]`).
        - 422 `lingkungan_belum_aktif`: `lingkungan` tidak dikirim dan sistem belum punya lingkungan aktif.
        - 503 `kredensial_kunci_belum_dikonfigurasi`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lingkungan: { $ref: '#/components/schemas/LingkunganIntegrasi' }
      responses:
        '200':
          description: Hasil uji
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/HasilUjiKoneksi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /integrasi/kotak-keluar:
    get:
      operationId: daftarKotakKeluar
      summary: Kiriman ke sistem luar (outbox), terbaru dulu
      description: |
        Izin per tujuan: `satusehat` ← integrasi.satusehat.lihat; `bpjs_vclaim`, `aplicares` ← integrasi.bpjs.lihat
        (cakupan `rs`). Tanpa filter `tujuan`, server hanya mengembalikan tujuan yang diizinkan; `tujuan` yang tidak
        diizinkan → 403. Urut (`dibuat_pada`, `id`) menurun, kursor keyset (Paginasi). Muatan kiriman tidak dikirim. Tanpa
        `dari`/`sampai` = semua tanggal (kiriman gagal/tertahan lama tetap terlihat); `dari` > `sampai` → 422
        `validasi_gagal`.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tujuan, schema: { $ref: '#/components/schemas/SistemIntegrasi' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusKiriman' } }
        - { in: query, name: lingkungan, schema: { $ref: '#/components/schemas/LingkunganIntegrasi' } }
        - { in: query, name: dari, schema: { type: string, format: date }, description: "Tanggal dibuat (zona RS), inklusif" }
        - { in: query, name: sampai, schema: { type: string, format: date }, description: "Inklusif" }
      responses:
        '200':
          description: Satu halaman kiriman
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Kiriman' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /integrasi/kotak-keluar/{id}/kirim-ulang:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: kirimUlangKiriman
      summary: Antrekan ulang kiriman yang gagal atau tertahan
      description: |
        Izin per tujuan: `satusehat` ← integrasi.satusehat.perbaiki; `bpjs_vclaim`, `aplicares` ← integrasi.bpjs.perbaiki
        (cakupan `rs`). Status menjadi `menunggu`, `coba_lagi_pada` = sekarang, hitungan percobaan mulai lagi; idempotency
        key tetap sama sehingga sistem luar tidak menerima duplikat. Kiriman `tertahan` diperiksa ulang syarat data
        induknya saat dikirim. Audit `integrasi.kirim_ulang`.
        - 409 `kiriman_tidak_bisa_dikirim_ulang`: status `menunggu` atau `terkirim`.
        - 409 `lingkungan_tidak_aktif`: lingkungan kiriman bukan lingkungan aktif sistem itu (kiriman tidak dipindah
          lingkungan; buat ulang dari sumbernya bila perlu), atau kiriman berlingkungan null sementara sistem belum punya
          lingkungan aktif. Kiriman berlingkungan null diikat ke lingkungan aktif saat dikirim ulang.
      responses:
        '200':
          description: Kiriman sesudah diantrekan ulang
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Kiriman' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /integrasi/log:
    get:
      operationId: daftarLogIntegrasi
      summary: Log panggilan ke sistem luar (disamarkan), terbaru dulu
      description: |
        Izin: integrasi.log.lihat, cakupan `rs`. Satu baris per panggilan HTTP (termasuk percobaan ulang dan uji koneksi).
        Permintaan dan respons disimpan sesudah disamarkan menurut aturan masking di komentar blok gateway integrasi
        (paling sedikit NIK, nama, nomor kartu, nomor RM, tanggal lahir, telepon, alamat, nomor rujukan/SEP/surat kontrol,
        token dan header rahasia; isi JSON lewat allowlist kunci per sistem), dipotong paling banyak 16 KB per isian (`terpotong`), dan dihapus sesudah masa simpan di
        konfigurasi (`INTEGRASI_LOG_HARI`). Urut (`terjadi_pada`, `id`) menurun, kursor keyset. Karena isi per baris
        sampai 2 × 16 KB, `batas` paling banyak 50 (di atas itu 422 `ukuran_halaman_melebihi_batas`). Tanpa `dari`/`sampai`
        = semua yang masih dalam masa simpan.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tujuan, schema: { $ref: '#/components/schemas/SistemIntegrasi' } }
        - { in: query, name: berhasil, schema: { type: boolean } }
        - { in: query, name: kotak_keluar_id, schema: { type: string, format: uuid } }
        - { in: query, name: dari, schema: { type: string, format: date } }
        - { in: query, name: sampai, schema: { type: string, format: date }, description: "Inklusif" }
      responses:
        '200':
          description: Satu halaman log
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LogIntegrasi' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Lapis 4–5 hak akses (tiket 1.5; PRD 9.2.2, 9.2.5, FR-09-05, FR-09-14, 11.2 label_sensitivitas/pengguna_label; K11).
  # - Lapis 4 (label sensitivitas): data berlabel (HIV, psikiatri, kekerasan seksual, genetik, privasi tinggi) hanya
  #   terbuka bagi akun yang punya izin label itu yang masih berlaku DAN merawat pasiennya (relasi perawatan: fase 2;
  #   di fase 1 selalu "tidak merawat", sehingga label dengan `butuh_relasi_perawatan` selalu tertutup). Objek berlabel
  #   tanpa izin dikirim sebagai `Terbatas` (tanpa isi dan tanpa nama label: nama label sendiri sudah data sensitif). Data awal: `butuh_relasi_perawatan` = true untuk semua label,
  #   termasuk `privasi_tinggi` (PRD 9.2.2; keputusan pemilik 12 Okt 2026). Izin label per akun selalu berbatas waktu dan baru berlaku
  #   sesudah disetujui pejabat PDP (peran penyetuju label, lewat persetujuan akses 1.2d).
  # - Lapis 5 (syarat yang tidak bisa diberikan admin) mengalahkan semua pemberian:
  #   - izin `butuh_kewenangan_klinis`: 403 `izin_praktik_tidak_berlaku` (SIP/SPK tidak berlaku pada tanggal itu) atau
  #     403 `kewenangan_klinis_tidak_mencakup` (RKK tidak memuat kode tindakan), data 1.8d;
  #   - izin `butuh_mfa`: 403 `mfa_ulang_diperlukan` bila verifikasi MFA terakhir di sesi ini lebih dari
  #     `AUTENTIKASI_MFA_ULANG_MENIT` (bawaan 15) menit lalu (K11). Klien memanggil POST /saya/mfa/verifikasi-ulang lalu
  #     mengulang permintaan yang sama. Akun tanpa MFA aktif: 403 `mfa_belum_terdaftar`.
  # ---------------------------------------------------------------------------
  /label-sensitivitas:
    get:
      operationId: daftarLabelSensitivitas
      summary: Daftar label sensitivitas (data induk) beserta peran penyetujunya
      description: "Izin: pengaturan.akun.lihat. Data awal dari PRD 11.2; penyetuju (pejabat PDP) ditetapkan RS."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman label
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LabelSensitivitas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /label-sensitivitas/{kode}/penyetuju:
    parameters:
      - { in: path, name: kode, required: true, schema: { type: string, maxLength: 50 } }
    put:
      operationId: aturPenyetujuLabel
      summary: Tetapkan peran penyetuju (pejabat PDP) sebuah label
      description: |
        Izin pengaturan.peran.perbaiki, cakupan `rs`. Seperti /izin/{kode}/penyetuju: 202 = persetujuan superadmin lain
        (jenis `izin_sensitif`, objek `penyetuju_label`). 403 `peran_sendiri`; 409 `persetujuan_ganda`; 422 `peran_tidak_valid`;
        404 label tidak ada. Label tanpa penyetuju tidak bisa diberikan ke akun mana pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peran_id, dasar_perubahan]
              properties:
                peran_id: { type: string, format: uuid }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '202':
          description: Menunggu persetujuan superadmin lain
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/label:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: daftarLabelAkun
      summary: Izin label sensitivitas sebuah akun (berlaku, menunggu persetujuan, berakhir, dibatalkan)
      description: "Izin: pengaturan.akun.lihat. Terbaru dulu."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman izin label
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IzinLabelAkun' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: ajukanLabelAkun
      summary: Ajukan izin label untuk akun (selalu lewat persetujuan pejabat PDP)
      description: |
        Izin pengaturan.akun.input, cakupan `rs`. Selalu 202 = persetujuan akses jenis `izin_label` dengan penyetuju =
        peran penyetuju label itu. `berlaku_sampai` wajib, di masa depan, paling lama `AKSES_LABEL_MAKS_HARI` (bawaan 365)
        hari sejak diajukan. Izin berlaku sejak disetujui.
        - 403 `diri_sendiri`; 403 `akun_superadmin` (aturan 9.2.4 yang sama dengan /akun/{id}/*);
        - 422 `penyetuju_label_belum_ditetapkan`; 422 `tanggal_tidak_valid`; 404 label/akun tidak ada;
        - 409 `persetujuan_ganda` (label yang sama untuk akun ini masih menunggu); 409 `label_masih_berlaku`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_kode, berlaku_sampai, dasar_pemberian, alasan]
              properties:
                label_kode: { type: string, maxLength: 50 }
                berlaku_sampai: { type: string, format: date-time }
                dasar_pemberian: { $ref: '#/components/schemas/Dasar' }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '202':
          description: Menunggu persetujuan pejabat PDP
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/label/{labelAkunId}/batal:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: labelAkunId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: batalkanLabelAkun
      summary: Cabut izin label sebelum masa berlakunya habis (langsung berlaku; mengurangi akses)
      description: |
        Izin pengaturan.akun.perbaiki. Hanya izin label berstatus `berlaku`; pengajuan yang masih `menunggu` ditarik
        pengajunya lewat POST /persetujuan-akses/{id}/batalkan. 403 `diri_sendiri` / `akun_superadmin` (aturan yang sama
        dengan /akun/{id}/*); 409 `sudah_tidak_berlaku`; 422 `validasi_gagal`. Cache hak akses akun dihapus. Audit
        `akses.label_dicabut`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermintaanBatal' }
      responses:
        '200':
          description: Izin label sesudah dicabut
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinLabelAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /saya/mfa/verifikasi-ulang:
    post:
      operationId: verifikasiUlangMfa
      summary: Verifikasi MFA ulang di sesi yang sedang berjalan (aksi butuh_mfa, K11)
      description: |
        Tanpa izin khusus. Kode TOTP (atau kode cadangan) akun yang masuk; tidak mengganti sesi. Sesudah berhasil,
        aksi `butuh_mfa` boleh sampai `berlaku_sampai`, lalu klien mengulang permintaan yang tadi ditolak.
        - 422 `kode_mfa_salah` (dihitung ke penguncian yang sama dengan masuk, PRD 10.3.2). Bukan 401: pengguna sudah masuk,
          dan 401 berarti sesi berakhir;
        - 403 `akun_terkunci` (Retry-After); 403 `mfa_belum_terdaftar` (sama dengan penolakan aksi `butuh_mfa`); 429.
        Audit `autentikasi.mfa_ulang_berhasil` / `autentikasi.mfa_gagal`; tanpa kode di log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metode, kode]
              properties:
                metode: { type: string, enum: [totp, kode_cadangan] }
                kode: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Terverifikasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mfa_terverifikasi_pada, berlaku_sampai]
                    properties:
                      mfa_terverifikasi_pada: { type: string, format: date-time }
                      berlaku_sampai: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /data-induk/penjamin:
    get:
      operationId: daftarPenjamin
      summary: Daftar penjamin (paginasi kursor)
      description: |
        Izin: master_data.penjamin.lihat, cakupan `rs`. Urut: kode. Pilihan penjamin di pendaftaran memakai `status=aktif`;
        penjamin nonaktif tetap terbaca (riwayat, rincian) tetapi tidak muncul di pilihan itu. Kelas rawat tidak punya
        endpoint baru di sini: pakai GET /kelas-rawat (1.8b).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
        - { in: query, name: jenis, schema: { $ref: '#/components/schemas/JenisPenjamin' } }
      responses:
        '200':
          description: Satu halaman penjamin
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Penjamin' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPenjamin
      summary: Tambah penjamin
      description: |
        Izin: master_data.penjamin.input. 422 `validasi_gagal` bila `kode` sudah dipakai penjamin lain (rincian menunjuk
        field `kode`). Atribut penagihan (`masa_berlaku_gl_hari`, `plafon`, `jatuh_tempo_hari`) opsional; kosong = tidak
        dibatasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, jenis, dasar_perubahan]
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                jenis: { $ref: '#/components/schemas/JenisPenjamin' }
                masa_berlaku_gl_hari: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                plafon: { $ref: '#/components/schemas/PlafonPenjamin' }
                jatuh_tempo_hari: { type: [integer, 'null'], minimum: 0, maximum: 365 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Penjamin dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Penjamin' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /data-induk/penjamin/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPenjamin
      summary: Rincian penjamin
      description: "Izin: master_data.penjamin.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian penjamin
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Penjamin' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahPenjamin
      summary: Ubah atau nonaktifkan penjamin
      description: |
        Izin: master_data.penjamin.perbaiki. Wajib If-Match (412 `versi_berubah`, 428 `if_match_wajib`).
        422 `validasi_gagal` bila `kode` bentrok. `jenis` tidak dapat diubah bila penjamin sudah dipakai kunjungan
        (422 `validasi_gagal`, field `jenis`). Penjamin tidak dihapus: nonaktifkan lewat `status`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                jenis: { $ref: '#/components/schemas/JenisPenjamin' }
                masa_berlaku_gl_hari: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                plafon: { $ref: '#/components/schemas/PlafonPenjamin' }
                jatuh_tempo_hari: { type: [integer, 'null'], minimum: 0, maximum: 365 }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Penjamin sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Penjamin' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /data-induk/tarif:
    get:
      operationId: daftarTarif
      summary: Daftar buku tarif (paginasi kursor)
      description: |
        Izin: master_data.tarif.lihat, cakupan `rs`. Urut: kode (unik); kursor keyset `(kode, id)`. `harga` = harga yang berlaku pada `tanggal` (bawaan hari ini
        zona RS), per kelas rawat. Tidak ada endpoint tulis tarif: menambah atau mengubah tarif = usulan 1.8c
        (POST /usulan-data-induk, `jenis_data` `tarif`; izin master_data.usulan.*). Perubahan terjadwal yang sudah disahkan
        tampil di `akan_berlaku`. Pengisian awal saat penyiapan (sebelum siap melayani) bukan bagian kontrak ini.
        Kasir dan modul tagihan hanya membaca; tidak ada jalur mengubah harga di sana.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
        - { in: query, name: kelompok, schema: { type: string, maxLength: 50 } }
        - { in: query, name: kelas_rawat_id, schema: { type: string, format: uuid }, description: "Hanya butir yang punya harga untuk kelas ini; `harga` hanya memuat kelas itu" }
        - { in: query, name: tanggal, schema: { type: string, format: date }, description: "Tanggal harga berlaku; bawaan hari ini zona RS" }
      responses:
        '200':
          description: Satu halaman tarif
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tarif' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /data-induk/tarif/{id}/versi:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: versiTarif
      summary: Riwayat versi satu tarif (paginasi kursor, terbaru dulu)
      description: |
        Izin: master_data.tarif.lihat. Setiap perubahan = satu versi dengan `berlaku_dari`, harga sebelum dan sesudah
        (`sebelum`/`sesudah` memuat `harga` per kelas); versi tidak pernah diubah atau dihapus. Bentuk sama dengan
        GET /data-induk/tarif/{id}/riwayat-versi generik (VersiDataInduk, `objek_jenis` `tarif`), dengan `usulan` terisi
        untuk perubahan lewat usulan.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman versi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VersiDataInduk' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jadwal-praktik:
    get:
      operationId: daftarJadwalPraktik
      summary: Jadwal praktik dokter dengan kuota dan keterisian (paginasi kursor)
      description: |
        Izin: master_data.jadwal_praktik.lihat, cakupan `rs`. Urut: poli, hari, jam_mulai.
        Dengan `tanggal`: hanya jadwal yang jatuh pada tanggal itu (hari ISO sama, dalam `berlaku_dari`–`berlaku_sampai`),
        masing-masing dengan `pada_tanggal` (terisi, sisa, tersedia). Jadwal yang tertutup pengecualian (cuti dokter atau
        libur) tetap dikirim dengan `tersedia = false` dan `alasan_tidak_tersedia`, agar layar dapat menjelaskannya;
        kuota tidak bisa dipakai. Tanpa `tanggal`: definisi jadwal untuk pengelolaan, `pada_tanggal` null.
        `tanggal` di masa lalu → 422 `validasi_gagal` hanya bila lebih dari 366 hari dari hari ini (zona RS).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tanggal, schema: { type: string, format: date } }
        - { in: query, name: poli_id, schema: { type: string, format: uuid } }
        - { in: query, name: pegawai_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] }, description: "Bawaan: aktif" }
      responses:
        '200':
          description: Satu halaman jadwal praktik
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JadwalPraktik' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatJadwalPraktik
      summary: Tambah jadwal praktik
      description: |
        Izin: master_data.jadwal_praktik.input. 422 `sip_tidak_aktif`: dokter tanpa SIP aktif (1.8d) pada `berlaku_dari`;
        422 `jadwal_bertumpuk`: jam bertumpuk dengan jadwal aktif dokter yang sama di hari yang sama (rincian memuat id jadwal);
        422 `bukan_ruang` (`ruang_id` bukan ruang aktif); 422 `validasi_gagal` untuk `jam_selesai` ≤ `jam_mulai` atau
        pegawai bukan dokter. `ruang_id` kosong = ruang poliklinik.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pegawai_id, poli_id, hari, jam_mulai, jam_selesai, kuota_jkn, kuota_non_jkn, berlaku_dari, dasar_perubahan]
              properties:
                pegawai_id: { type: string, format: uuid }
                poli_id: { type: string, format: uuid }
                ruang_id: { type: [string, 'null'], format: uuid }
                hari: { $ref: '#/components/schemas/HariPraktik' }
                jam_mulai: { $ref: '#/components/schemas/JamPraktik' }
                jam_selesai: { $ref: '#/components/schemas/JamPraktik' }
                kuota_jkn: { type: integer, minimum: 0, maximum: 1000 }
                kuota_non_jkn: { type: integer, minimum: 0, maximum: 1000 }
                berlaku_dari: { type: string, format: date }
                berlaku_sampai: { type: [string, 'null'], format: date }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Jadwal dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JadwalPraktik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jadwal-praktik/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: ubahJadwalPraktik
      summary: Ubah atau nonaktifkan jadwal praktik
      description: |
        Izin: master_data.jadwal_praktik.perbaiki. Wajib If-Match (412 `versi_berubah`, 428 `if_match_wajib`).
        Aturan 422 sama dengan POST (`sip_tidak_aktif`, `jadwal_bertumpuk`, `bukan_ruang`, `validasi_gagal`);
        `pegawai_id` dan `poli_id` tidak diubah (nonaktifkan lalu buat jadwal baru). Kuota di bawah jumlah yang
        sudah terisi pada tanggal mendatang → 422 `kuota_di_bawah_terisi`. Jadwal tidak dihapus: `status = nonaktif`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                ruang_id: { type: [string, 'null'], format: uuid }
                hari: { $ref: '#/components/schemas/HariPraktik' }
                jam_mulai: { $ref: '#/components/schemas/JamPraktik' }
                jam_selesai: { $ref: '#/components/schemas/JamPraktik' }
                kuota_jkn: { type: integer, minimum: 0, maximum: 1000 }
                kuota_non_jkn: { type: integer, minimum: 0, maximum: 1000 }
                berlaku_dari: { type: string, format: date }
                berlaku_sampai: { type: [string, 'null'], format: date }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Jadwal sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JadwalPraktik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /jadwal-pengecualian:
    post:
      operationId: buatJadwalPengecualian
      summary: Catat cuti dokter atau libur
      description: |
        Izin: master_data.jadwal_praktik.input. `jenis = cuti` wajib `pegawai_id` (semua jadwal dokter itu tertutup pada
        rentang); `jenis = libur` dengan `pegawai_id` kosong menutup semua jadwal RS pada rentang. Daftar pengecualian
        dibaca lewat `JadwalPraktik.pengecualian` (GET /jadwal-praktik); tidak ada daftar tersendiri. 422 `validasi_gagal`
        bila `sampai_tanggal` < `dari_tanggal`, `cuti` tanpa `pegawai_id`, atau `libur` dengan `pegawai_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenis, dari_tanggal, sampai_tanggal, alasan]
              properties:
                jenis: { $ref: '#/components/schemas/JenisPengecualian' }
                pegawai_id: { type: [string, 'null'], format: uuid }
                dari_tanggal: { type: string, format: date }
                sampai_tanggal: { type: string, format: date }
                alasan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Pengecualian dicatat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JadwalPengecualian' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jadwal-pengecualian/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: ubahJadwalPengecualian
      summary: Ubah rentang atau batalkan pengecualian
      description: |
        Izin: master_data.jadwal_praktik.perbaiki. Wajib If-Match (412, 428). Pembatalan = `status = batal` dengan
        `alasan_batal` (tidak dihapus); pengecualian batal tidak lagi menutup jadwal. Pengecualian yang sudah lewat
        seluruhnya tidak dapat diubah (422 `validasi_gagal`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                dari_tanggal: { type: string, format: date }
                sampai_tanggal: { type: string, format: date }
                alasan: { $ref: '#/components/schemas/Dasar' }
                status: { type: string, enum: [batal] }
                alasan_batal: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Pengecualian sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/JadwalPengecualian' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Pasien: cari satu kolom dan pasien baru (tiket 2.5; PRD FR-01-01, FR-01-04, FR-01-05, 11.2 skema `pasien`, 14.2).
  # Izin: `pendaftaran.pasien.lihat|input|perbaiki`, cakupan `rs`. Bagian baru `pendaftaran.pasien.identitas` (aksi
  # `lihat`, sensitif seperti `sdm.pegawai.identitas`): tanpa izin itu server tidak mengirim `nik` dan `no_paspor`, hanya
  # `nik_samaran` dan `no_paspor_samaran` (4 karakter awal dan akhir). Data pasien (NIK, No. RM, nama, tanggal lahir,
  # No. kartu) tidak pernah ada di URL, query string, log, audit, atau pesan error; karena itu kata cari dikirim di header,
  # bukan `?q=`. Semua respons pasien `Cache-Control: no-store`.
  # No. RM dibuat server di transaksi yang sama dengan pasien: angka berurutan tanpa celah, tidak dipakai ulang, tidak
  # bisa diubah. Pasien tidak pernah dihapus; setiap perubahan identitas menyimpan versi sebelumnya (jejak) dan audit
  # `pasien.diubah` berisi nama field yang berubah (tanpa nilainya).
  /pasien:
    get:
      operationId: cariPasien
      summary: Cari pasien satu kolom (NIK, No. RM, No. kartu BPJS, atau nama + tanggal lahir)
      description: |
        Izin: pendaftaran.pasien.lihat. Kata cari di header `X-Cari` (wajib; nilai di-encode persen UTF-8 seperti
        `encodeURIComponent`, ≤ 200 karakter sesudah di-decode). Server menafsirkan isinya; `meta.jenis_cari` memberi tahu
        tafsirannya:
        - hanya angka (spasi, `-`, `.` diabaikan), 16 digit → `nik` (cocok persis lewat sidik NIK);
        - hanya angka, 13 digit → `no_kartu` (No. kartu BPJS pasien);
        - hanya angka, 1–12 digit → `no_rm` (cocok persis; nol di depan boleh dihilangkan). Panjang No. RM dari
          konfigurasi server dibatasi ≤ 12 digit supaya tidak tertukar dengan NIK atau No. kartu;
        - hanya angka dengan panjang lain (14, 15, > 16) → 422 `kata_cari_tidak_dikenali`;
        - teks berisi tanggal (`DD-MM-YYYY`, `DD/MM/YYYY`, atau `YYYY-MM-DD`) dan sisa nama ≥ 3 huruf → `nama_tanggal_lahir`:
          tanggal lahir sama persis dan nama mirip (indeks trigram, tanpa membedakan huruf besar/kecil).
        Header kosong/tidak ada → 422 `kata_cari_wajib`; nama tanpa tanggal lahir atau tanggal saja → 422
        `kata_cari_tidak_dikenali` (pesan menyebut bentuk yang diterima, tanpa mengulang kata cari).
        Urut: terbaru didaftarkan dulu; kursor keyset `(dibuat_pada, id)` tanpa data pribadi. Halaman berikutnya mengirim
        header `X-Cari` yang sama. Pasien yang sudah meninggal tetap ditemukan (`meninggal_pada` terisi). Setiap pencarian
        dicatat audit `pasien.dicari` (jenis cari dan jumlah hasil, tanpa kata cari).
      parameters:
        - in: header
          name: X-Cari
          required: true
          schema: { type: string, maxLength: 600 }
          examples:
            no_rm: { value: '00000127' }
            nama_tanggal_lahir: { value: 'Contoh%20Pasien%2012-03-1980' }
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman hasil pencarian (bisa kosong)
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Pasien' } }
                  meta:
                    type: object
                    required: [kursor_berikutnya, jenis_cari]
                    properties:
                      kursor_berikutnya: { type: [string, 'null'], description: "null = halaman terakhir" }
                      jenis_cari: { $ref: '#/components/schemas/JenisCariPasien' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPasien
      summary: Daftarkan pasien baru (No. RM dibuat server)
      description: |
        Izin: pendaftaran.pasien.input. Mengisi `nik` dan `no_paspor` tidak butuh izin bagian identitas (petugas menyalin
        dari kartu identitas); respons tetap mengikuti izin bagian itu.
        - 409 `nik_sudah_terdaftar`: NIK sudah dipakai pasien lain (dibandingkan lewat sidik). `rincian`:
          `[{pasien_id, no_rm}]` pasien yang ada, supaya petugas membukanya alih-alih membuat No. RM baru. Pasien tanpa NIK
          (bayi, Mr. X, WNA) tidak diperiksa.
        - 409 `no_kartu_sudah_terdaftar`: No. kartu BPJS sudah tercatat untuk pasien lain; `rincian` sama.
        - Pasien tanpa identitas (`tanpa_identitas: true`, FR-01-05): `nama`, `nik`, `tanggal_lahir` boleh kosong; bila
          `nama` kosong server mengisi `Mr. X` (laki-laki), `Ny. X` (perempuan), atau `X`. Tetap mendapat No. RM.
        - Selain pasien tanpa identitas, `nama` dan `tanggal_lahir` wajib (422 `validasi_gagal`); `kewarganegaraan`
          `wna` tanpa `nik` wajib `no_paspor`.
        - 422 `referensi_tidak_valid` (kode agama/pendidikan/pekerjaan/status kawin tidak ada di referensi aktif),
          `wilayah_tidak_valid` (bukan kode kelurahan/desa aktif). `rincian` menyebut field-nya.
        Audit `pasien.dibuat` (No. RM dan field yang terisi, tanpa nilai identitas).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianPasien' }
      responses:
        '201':
          description: Pasien terdaftar
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Pasien' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pasien/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: ubahPasien
      summary: Perbaiki atau lengkapi identitas pasien (dengan jejak versi)
      description: |
        Izin: pendaftaran.pasien.perbaiki. Wajib If-Match (`versi`; 412, 428). Kirim minimal satu isian selain
        `alasan_perubahan`; field yang tidak dikirim tidak berubah, `null` mengosongkan. `kontak_darurat` yang dikirim
        menggantikan seluruh daftar. `no_rm` tidak bisa diubah.
        - Mengubah atau mengosongkan `nik`/`no_paspor` yang sudah terisi butuh izin `pendaftaran.pasien.identitas.lihat`
          (403 `akses_ditolak`); mengisi yang masih kosong cukup izin perbaiki.
        - Melengkapi pasien tanpa identitas: kirim `tanpa_identitas: false` bersama data yang kurang; sesudah perubahan
          `nama` dan `tanggal_lahir` wajib terisi (422 `validasi_gagal`). `tanpa_identitas` tidak bisa kembali `true`
          (422 `validasi_gagal`). Nama sementara dan data lama tetap ada di versi sebelumnya.
        - 409 `nik_sudah_terdaftar`, `no_kartu_sudah_terdaftar` (bentuk sama dengan POST).
        - 422 `referensi_tidak_valid`, `wilayah_tidak_valid`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IsianPasienUbah'
                - type: object
                  required: [alasan_perubahan]
                  minProperties: 2
                  properties:
                    alasan_perubahan: { type: string, minLength: 5, maxLength: 200, description: "Alasan perbaikan (Permenkes 24/2022 Ps. 30); disimpan di versi, tidak di audit" }
      responses:
        '200':
          description: Pasien sesudah diubah
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Pasien' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Kursor:
      in: query
      name: kursor
      required: false
      schema: { type: string }
      description: "Kursor buram dari meta.kursor_berikutnya"
    Batas:
      in: query
      name: batas
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: "Di atas 200 → 422 ukuran_halaman_melebihi_batas"
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
      description: "ETag/versi dari GET terakhir; tidak cocok → 412 versi_berubah, tidak ada → 428 if_match_wajib"
  securitySchemes:
    sesiCookie:
      type: apiKey
      in: cookie
      name: karsitara_session
      description: Cookie sesi Sanctum stateful (PRD 10.3.2); nama cookie mengikuti konfigurasi.
  responses:
    Error:
      description: Error format tunggal (PRD 10.3.1)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kode, pesan]
          properties:
            kode: { type: string, examples: [belum_masuk] }
            pesan: { type: string }
            rincian:
              type: array
              items: { type: object, additionalProperties: true }
    Saya:
      type: object
      required: [id, nama_pengguna, login_terakhir_pada, mfa_aktif, pegawai, peran, masuk_sebelumnya_pada, masuk_sebelumnya_dari_jaringan_rs, ttd]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        login_terakhir_pada: { type: [string, 'null'], format: date-time, description: "Masuk yang memulai sesi ini" }
        mfa_aktif: { type: boolean }
        wajib_ganti_sandi: { type: boolean, description: "Selalu dikirim di /saya sejak 1.8d (tidak ada di respons masuk PRD 10.3.2). true = arahkan ke layar ganti sandi; endpoint bersesi lain 403 wajib_ganti_sandi" }
        ttd: { $ref: '#/components/schemas/StatusTtd', description: "Sejak 1.6 (backend 1.6-be)" }
        pegawai:
          type: [object, 'null']
          required: [id, nama]
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
        peran:
          type: array
          description: "Peran berstatus aktif dengan penugasan yang berlaku sekarang, tanpa duplikat, urut nama. Kosong = belum ada modul yang diberikan."
          items:
            type: object
            required: [id, nama]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
        masuk_sebelumnya_pada:
          type: [string, 'null']
          format: date-time
          description: "Masuk berhasil terakhir selain sesi ini (\"apakah ini Anda?\"): masuk lain sesudah sesi ini dimulai bila ada, kalau tidak masuk sebelum sesi ini. null = tidak ada catatan: masuk pertama, atau sesi dimulai sebelum fitur ini ada."
        masuk_sebelumnya_dari_jaringan_rs:
          type: [boolean, 'null']
          description: "Apakah masuk sebelumnya dari jaringan RS (AUTENTIKASI_MFA_JARINGAN_RS). null = tidak diketahui: masuk pertama, atau masuk sebelumnya terjadi sebelum fitur ini ada."
    WarnaHex:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#1F5C99']
    KodeData:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9._-]{0,29}$'
      description: "Kode singkat huruf besar/angka, mis. IRNA, IGD-01"
    ProfilRs:
      type: object
      required: [versi, nama, paket_identitas, kontak_admin, instalasi_demo, halaman_masuk]
      properties:
        versi: { type: string, description: "Sama dengan ETag; berubah setiap profil atau berkas diganti" }
        nama: { type: [string, 'null'], description: "Nama resmi RS; null = belum disiapkan (kartu RS tidak tampil)" }
        paket_identitas:
          type: object
          required: [warna, logo_url, motif_url, foto_url]
          properties:
            warna:
              type: object
              required: [brand, accent]
              description: "Dasar token --brand-600 dan --accent (PRD 5.3); turunan warna dihitung frontend. Bawaan = paket produk (sejak v0.15.0 #006937 dan #F3C300 = palet bawaan tokens.css sesudah tiket 1.15)."
              properties:
                brand: { $ref: '#/components/schemas/WarnaHex' }
                accent: { $ref: '#/components/schemas/WarnaHex' }
            logo_url: { type: [string, 'null'], description: "Path relatif ke GET /profil-rs/berkas/logo dengan versi berkas; null = belum ada" }
            motif_url: { type: [string, 'null'], description: "Hanya untuk halaman masuk, layar tunggu, dan cetak (PRD 5.3.2 aturan 4)" }
            foto_url: { type: [string, 'null'] }
        kontak_admin:
          type: object
          required: [unit, kontak]
          description: "Untuk teks halaman masuk dan Beranda (lupa sandi, akun terkunci, 'Bukan Anda?')"
          properties:
            unit: { type: string, description: "Bawaan \"admin SIMRS\"" }
            kontak: { type: [string, 'null'], examples: ['ext. 1234'] }
        instalasi_demo:
          type: boolean
          description: "Instalasi demo/pelatihan berisi data sintetis (FR-54-10): pita \"DEMO — data fiktif\" di setiap layar, termasuk halaman masuk. Ditetapkan saat pemasangan di server, tidak bisa diubah dari layar."
        halaman_masuk:
          $ref: '#/components/schemas/HalamanMasuk'
          description: "Nilai efektif panel merek halaman masuk (tiket 1.15): yang belum diatur terisi teks bawaan produk, jadi klien tidak perlu teks cadangan. Foto dan motif tetap dari paket_identitas (foto_url, motif_url)."
        rinci:
          type: object
          description: "Hanya untuk pemegang izin pengaturan.profil_rs.lihat; tidak dikirim tanpa sesi atau tanpa izin."
          required: [kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, status_penyiapan, diubah_pada]
          properties:
            kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
            kelas: { type: [string, 'null'], maxLength: 20, description: "Klasifikasi RS sesuai izin operasional (mis. B); tidak dibatasi daftar tetap (PRD 17.2 T-1)" }
            status_blu: { type: [boolean, 'null'] }
            kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
            alamat: { type: [string, 'null'], maxLength: 500 }
            status_penyiapan: { type: string, enum: [belum, sebagian, selesai], description: "Langkah 2 wizard (FR-54-08, profil RS) saja: `sebagian` sejak profil dibuat, `selesai` sejak langkah 2 pertama kali dikonfirmasi dan tidak turun lagi walau syarat langkah 2 kemudian berkurang (GET /penyiapan tanpa efek samping). Status sembilan langkah dan siap melayani ada di GET /penyiapan (1.8f)" }
            diubah_pada: { type: [string, 'null'], format: date-time }
    IsianProfilRs:
      type: object
      required: [nama, kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, warna, kontak_admin, dasar_perubahan]
      properties:
        nama: { type: string, minLength: 3, maxLength: 200 }
        kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
        kelas: { type: [string, 'null'], maxLength: 20 }
        status_blu: { type: [boolean, 'null'] }
        kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
        alamat: { type: [string, 'null'], maxLength: 500 }
        warna:
          type: object
          required: [brand, accent]
          properties:
            brand: { $ref: '#/components/schemas/WarnaHex' }
            accent: { $ref: '#/components/schemas/WarnaHex' }
        kontak_admin:
          type: object
          required: [unit, kontak]
          properties:
            unit: { type: string, minLength: 2, maxLength: 100 }
            kontak: { type: [string, 'null'], maxLength: 100 }
        halaman_masuk:
          description: |
            Opsional (tiket 1.15). Tidak dikirim = tidak berubah; null = kembali ke teks bawaan produk; objek = ganti utuh.
            Teks biasa saja: server membuang karakter kendali, meringkas spasi dan baris baru menjadi satu spasi, dan
            memangkas tepi; HTML dan markdown tidak ditafsirkan (`<script>` tersimpan dan tampil sebagai teks). Panjang
            dihitung dalam code point Unicode sesudah dibersihkan (422 `validasi_gagal`; `kolom` berindeks mulai 0, mis.
            `halaman_masuk.fitur.0.judul`).
          oneOf:
            - { type: 'null' }
            - $ref: '#/components/schemas/IsianHalamanMasuk'
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    HalamanMasuk:
      type: object
      required: [lencana, judul, judul_sorot, uraian, fitur, foto_keterangan, tampilkan_motif, bawaan]
      description: |
        Isi panel merek halaman masuk (PRD 5.3.2; tiket 1.15). Teks bawaan produk:
        lencana "Satu data untuk seluruh rumah sakit"; judul "Pelayanan, pendapatan, dan mutu dalam" dengan
        judul_sorot "satu layar kerja."; uraian "Dari pendaftaran sampai klaim, setiap pencatatan langsung menjadi
        rekam medis, tagihan, dan laporan, tanpa entri ulang."; fitur: "Paperless" / "Pengesahan elektronik dengan PIN,
        catatan terkunci, perubahan jadi adendum.", "Terhubung" / "BPJS dan SATUSEHAT berjalan dari layar yang sama.",
        "Pendidikan" / "Akun peserta didik mengikuti masa rotasi dan supervisi."; foto_keterangan null; tampilkan_motif true.
      properties:
        lencana: { type: string, minLength: 1, maxLength: 60 }
        judul: { type: string, minLength: 1, maxLength: 80 }
        judul_sorot: { type: [string, 'null'], minLength: 1, maxLength: 40, description: "Ditempel di akhir judul (dipisah satu spasi), warna --penekanan-panel" }
        uraian: { type: string, minLength: 1, maxLength: 240 }
        fitur:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/FiturHalamanMasuk' }
        foto_keterangan: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Keterangan di atas foto panel; null = nama RS" }
        tampilkan_motif: { type: boolean, description: "false = motif paket identitas tidak dipasang di panel" }
        bawaan: { type: boolean, description: "true = belum pernah diatur (semua nilai = teks bawaan produk)" }
    IsianHalamanMasuk:
      type: object
      required: [lencana, judul, judul_sorot, uraian, fitur, foto_keterangan, tampilkan_motif]
      properties:
        lencana: { type: string, minLength: 1, maxLength: 60 }
        judul: { type: string, minLength: 1, maxLength: 80 }
        judul_sorot: { type: [string, 'null'], maxLength: 40, description: "Kosong sesudah dibersihkan = null" }
        uraian: { type: string, minLength: 1, maxLength: 240 }
        fitur:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/FiturHalamanMasuk' }
        foto_keterangan: { type: [string, 'null'], maxLength: 80, description: "Kosong sesudah dibersihkan = null" }
        tampilkan_motif: { type: boolean }
    FiturHalamanMasuk:
      type: object
      required: [judul, uraian]
      properties:
        judul: { type: string, minLength: 1, maxLength: 30 }
        uraian: { type: string, minLength: 1, maxLength: 120 }
    RingkasPegawai:
      type: [object, 'null']
      required: [id, nama, status]
      properties:
        id: { type: string, format: uuid, description: "sdm.pegawai.id (bukan akun)" }
        nama: { type: string }
        status: { $ref: '#/components/schemas/StatusPegawai', description: "Sejak 1.8d: menandai kepala unit/ketua KSM yang sudah keluar tanpa izin sdm.pegawai" }
    JenisUnit:
      type: string
      enum: [instalasi, bidang, bagian, ruang, poli, depo]
      description: "PRD 11.2 inti.unit_organisasi.jenis"
    UnitOrganisasi:
      type: object
      required: [id, induk_id, kode, nama, jenis, status, berlaku_dari, kepala, jumlah_anak, jalur, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        induk_id: { type: [string, 'null'], format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        status: { type: string, enum: [aktif, nonaktif] }
        berlaku_dari: { type: string, format: date }
        kepala: { $ref: '#/components/schemas/RingkasPegawai', description: "Kepala unit (pegawai); null = belum ditetapkan. Dipakai eskalasi tugas (1.7)" }
        jumlah_anak: { type: integer, minimum: 0, description: "Anak langsung (aktif dan nonaktif)" }
        jalur:
          type: array
          description: "Induk dari akar sampai induk langsung, untuk breadcrumb"
          items:
            type: object
            required: [id, kode, nama]
            properties:
              id: { type: string, format: uuid }
              kode: { type: string }
              nama: { type: string }
        versi: { type: string, description: "Sama dengan ETag" }
        diubah_pada: { type: string, format: date-time }
    IsianUnitOrganisasi:
      type: object
      required: [induk_id, kode, nama, jenis, dasar_perubahan]
      properties:
        induk_id: { type: [string, 'null'], format: uuid, description: "null = unit tingkat teratas" }
        kode: { $ref: '#/components/schemas/KodeData' }
        nama: { type: string, minLength: 2, maxLength: 150 }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        berlaku_dari: { type: [string, 'null'], format: date, description: "Kosong = hari ini (zona waktu RS)" }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    Ksm:
      type: object
      required: [id, kode, nama, status, ketua, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
        ketua: { $ref: '#/components/schemas/RingkasPegawai', description: "Ketua KSM (pegawai); null = belum ditetapkan" }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    JenisLokasi:
      type: string
      enum: [situs, gedung, sayap, lantai, ruang, tempat_tidur]
      description: "Padanan FHIR Location.physicalType si/bu/wi/lvl/ro/bd (tiket 1.8b)"
    StatusLokasi:
      type: string
      enum: [aktif, renovasi, ditutup]
    FungsiRuang:
      type: [string, 'null']
      enum: [rawat_inap, rawat_jalan, igd, kamar_operasi, intensif, penunjang, administrasi, gudang, lainnya, null]
      description: "Wajib untuk ruang, kosong untuk jenis lain"
    KodeLokasi:
      type: string
      pattern: '^[A-Z0-9]{1,10}$'
      description: "Segmen kode, tanpa tanda hubung (pemisah kode_lengkap), mis. B, 3, 304, 2"
    RingkasUnit:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    RingkasLokasi:
      type: object
      required: [id, kode_lengkap, nama]
      properties:
        id: { type: string, format: uuid }
        kode_lengkap: { type: string }
        nama: { type: string }
    Lokasi:
      type: object
      required: [id, induk_id, jenis, kode, kode_lengkap, nama, fungsi, unit, status, status_berlaku_dari, satusehat_lokasi_id, kamar_id, tempat_tidur_id, jumlah_anak, jalur, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        induk_id: { type: [string, 'null'], format: uuid }
        jenis: { $ref: '#/components/schemas/JenisLokasi' }
        kode: { type: string }
        kode_lengkap: { type: string, examples: ['B-3-304-2'] }
        nama: { type: string }
        fungsi: { $ref: '#/components/schemas/FungsiRuang' }
        unit:
          description: "Unit pengelola saat ini; null = belum ditetapkan"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/StatusLokasi' }
        status_berlaku_dari: { type: string, format: date }
        satusehat_lokasi_id: { type: [string, 'null'], description: "Diisi integrasi SATUSEHAT (tiket 1.9); hanya baca" }
        kamar_id: { type: [string, 'null'], format: uuid, description: "Ruang yang menjadi kamar rawat" }
        tempat_tidur_id: { type: [string, 'null'], format: uuid, description: "Untuk jenis tempat_tidur" }
        jumlah_anak: { type: integer, minimum: 0, description: "Anak langsung semua jenis dan status, termasuk node TT dan yang ditutup" }
        jalur:
          type: array
          description: "Induk dari akar sampai induk langsung, untuk breadcrumb"
          items: { $ref: '#/components/schemas/RingkasLokasi' }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianLokasi:
      type: object
      required: [induk_id, jenis, kode, nama, dasar_perubahan]
      properties:
        induk_id: { type: [string, 'null'], format: uuid, description: "null = akar (situs atau gedung)" }
        jenis: { $ref: '#/components/schemas/JenisLokasi' }
        kode: { $ref: '#/components/schemas/KodeLokasi' }
        nama: { type: string, minLength: 2, maxLength: 150 }
        fungsi: { $ref: '#/components/schemas/FungsiRuang' }
        unit_organisasi_id: { type: [string, 'null'], format: uuid }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    HasilImporLokasi:
      type: object
      required: [mode, diterapkan, jumlah_baris, jumlah_salah, per_jenis, kesalahan, kesalahan_terpotong]
      properties:
        mode: { type: string, enum: [pratinjau, terapkan] }
        diterapkan: { type: boolean }
        jumlah_baris: { type: integer, minimum: 0 }
        jumlah_salah: { type: integer, minimum: 0, description: "Jumlah baris yang salah" }
        per_jenis:
          type: object
          description: "Jumlah baris per jenis lokasi, plus kamar yang terbentuk"
          required: [situs, gedung, sayap, lantai, ruang, tempat_tidur, kamar]
          properties:
            situs: { type: integer, minimum: 0 }
            gedung: { type: integer, minimum: 0 }
            sayap: { type: integer, minimum: 0 }
            lantai: { type: integer, minimum: 0 }
            ruang: { type: integer, minimum: 0 }
            tempat_tidur: { type: integer, minimum: 0 }
            kamar: { type: integer, minimum: 0 }
        kesalahan:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/KesalahanBarisImpor' }
        kesalahan_terpotong: { type: boolean, description: "true bila kesalahan lebih dari 500 baris" }
    KesalahanBarisImpor:
      type: object
      required: [baris, kolom, kode, pesan]
      properties:
        baris: { type: integer, minimum: 2, description: "Nomor baris di berkas (judul kolom = baris 1)" }
        kolom: { type: [string, 'null'] }
        kode: { type: string }
        pesan: { type: string }
    Bangsal:
      type: object
      required: [id, kode, nama, unit, status, jumlah_kamar, ringkasan_tt, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        unit: { $ref: '#/components/schemas/RingkasUnit' }
        status: { type: string, enum: [aktif, nonaktif] }
        jumlah_kamar: { type: integer, minimum: 0 }
        ringkasan_tt:
          type: array
          description: |
            TT per kelas, dilihat hari ini (zona RS). `jumlah_tersedia` + `jumlah_ekstra` = TT yang dihitung hari ini (sama
            dengan /kapasitas-tempat-tidur hari ini). `akan_ditutup` ⊂ keduanya (masih dihitung, sudah dijadwalkan tutup).
            `belum_berlaku` = TT yang mulai dihitung sesudah hari ini. `ditutup` = kumulatif TT yang sudah tidak dihitung.
            Kelompok yang saling lepas: (jumlah_tersedia + jumlah_ekstra), belum_berlaku, ditutup.
          items:
            type: object
            required: [kelas_rawat, jumlah_tersedia, jumlah_ekstra, akan_ditutup, belum_berlaku, ditutup]
            properties:
              kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
              jumlah_tersedia: { type: integer, minimum: 0, description: "Dihitung hari ini, bukan ekstra" }
              jumlah_ekstra: { type: integer, minimum: 0, description: "Dihitung hari ini, ekstra" }
              akan_ditutup: { type: integer, minimum: 0 }
              belum_berlaku: { type: integer, minimum: 0 }
              ditutup: { type: integer, minimum: 0 }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    AtributKamar:
      type: object
      description: |
        Atribut standar ruang rawat (FR-08-19; KRIS dan kelas lama) sebagai daftar periksa: kunci snake_case,
        nilai boolean/angka/teks pendek. Isi kriteria tidak dikodekan keras (perlu verifikasi); daftar periksa baku per RS
        menunggu keputusan pemilik (backlog).
      maxProperties: 50
      propertyNames: { pattern: '^[a-z][a-z0-9_]{1,49}$' }
      additionalProperties:
        type: [boolean, number, string]
        maxLength: 100
    Kamar:
      type: object
      required: [id, nomor, bangsal, lokasi, kapasitas_maksimum, atribut_standar, jumlah_tempat_tidur_aktif, melebihi_kapasitas, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, description: "Kode ruang (segmen terakhir kode_lengkap)" }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        lokasi:
          type: object
          description: "Ruang fisik kamar ini"
          required: [id, kode_lengkap, nama]
          properties:
            id: { type: string, format: uuid }
            kode_lengkap: { type: string }
            nama: { type: string }
        kapasitas_maksimum: { type: [integer, 'null'], minimum: 1 }
        atribut_standar: { $ref: '#/components/schemas/AtributKamar' }
        jumlah_tempat_tidur_aktif: { type: integer, minimum: 0, description: "TT yang dihitung hari ini, termasuk ekstra (dasar melebihi_kapasitas)" }
        melebihi_kapasitas: { type: boolean }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianKamar:
      type: object
      required: [bangsal_id, lokasi_id, dasar_perubahan]
      properties:
        bangsal_id: { type: string, format: uuid }
        lokasi_id: { type: string, format: uuid, description: "Lokasi jenis ruang" }
        kapasitas_maksimum: { type: [integer, 'null'], minimum: 1, maximum: 99 }
        atribut_standar: { $ref: '#/components/schemas/AtributKamar' }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    StatusOperasionalTt:
      type: string
      enum: [belum_berlaku, aktif, akan_ditutup, ditutup]
      description: "Diturunkan dari tanggal (zona RS), diperiksa berurutan: ditutup = berlaku_sampai < hari ini; akan_ditutup = berlaku_sampai ≥ hari ini; belum_berlaku = berlaku_dari > hari ini; selain itu aktif"
    AturanJenisKelamin:
      type: string
      enum: [campur, laki_laki, perempuan]
    RingkasBangsal:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    RingkasKamar:
      type: object
      required: [id, nomor, kode_lengkap, nama]
      properties:
        id: { type: string, format: uuid, description: "id kamar" }
        nomor: { type: string }
        kode_lengkap: { type: string, description: "kode_lengkap ruangnya" }
        nama: { type: string, description: "Nama ruangnya" }
    RingkasKelasRawat:
      type: object
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    TempatTidur:
      type: object
      required: [id, kode, kamar, bangsal, lokasi_id, kelas_rawat, aturan_jenis_kelamin, isolasi, ekstra, status_operasional, berlaku_dari, berlaku_sampai, alasan_tutup, satusehat_lokasi_id, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, examples: ['B-3-304-2'], description: "Tidak pernah berubah atau dipakai ulang" }
        kamar: { $ref: '#/components/schemas/RingkasKamar' }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        lokasi_id: { type: string, format: uuid, description: "Node lokasi jenis tempat_tidur" }
        kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
        aturan_jenis_kelamin: { $ref: '#/components/schemas/AturanJenisKelamin' }
        isolasi: { type: boolean }
        ekstra: { type: boolean, description: "TT tambahan saat lonjakan, dihitung terpisah" }
        status_operasional: { $ref: '#/components/schemas/StatusOperasionalTt' }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai: { type: [string, 'null'], format: date, description: "Hari terakhir TT dihitung; null = tanpa batas" }
        alasan_tutup: { type: [string, 'null'] }
        satusehat_lokasi_id: { type: [string, 'null'] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    IsianTempatTidur:
      type: object
      required: [kamar_id, kode, kelas_rawat_id, dasar_perubahan]
      properties:
        kamar_id: { type: string, format: uuid }
        kode: { $ref: '#/components/schemas/KodeLokasi' }
        kelas_rawat_id: { type: string, format: uuid }
        aturan_jenis_kelamin: { $ref: '#/components/schemas/AturanJenisKelamin', description: "Kosong = campur" }
        isolasi: { type: boolean, default: false }
        ekstra: { type: boolean, default: false }
        berlaku_dari: { type: [string, 'null'], format: date, description: "Hari pertama dihitung (≥ hari ini); kosong = hari ini" }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    KelasRawat:
      type: object
      required: [id, kode, nama, kode_aplicares, berlaku_dari, status, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        kode_aplicares: { type: [string, 'null'] }
        berlaku_dari: { type: string, format: date }
        status: { type: string, enum: [aktif, nonaktif] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    Poliklinik:
      type: object
      required: [id, kode, nama, unit, lokasi, kode_poli_bpjs, status, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        unit: { $ref: '#/components/schemas/RingkasUnit' }
        lokasi:
          description: "Ruang poli; null = belum dipetakan"
          oneOf: [{ $ref: '#/components/schemas/RingkasLokasi' }, { type: 'null' }]
        kode_poli_bpjs: { type: [string, 'null'] }
        status: { type: string, enum: [aktif, nonaktif] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    KapasitasBangsal:
      type: object
      required: [tanggal, sumber, bangsal, kelas]
      properties:
        tanggal: { type: string, format: date }
        sumber: { type: string, enum: [tersimpan, dihitung] }
        bangsal: { $ref: '#/components/schemas/RingkasBangsal' }
        kelas:
          type: array
          items:
            type: object
            required: [kelas_rawat, jumlah_tersedia, jumlah_ekstra]
            properties:
              kelas_rawat: { $ref: '#/components/schemas/RingkasKelasRawat' }
              jumlah_tersedia: { type: integer, minimum: 0 }
              jumlah_ekstra: { type: integer, minimum: 0 }
    StatusPegawai:
      type: string
      enum: [aktif, akan_keluar, keluar]
      description: "Diturunkan dari tanggal_keluar (zona RS): akan_keluar = tanggal_keluar > hari ini; keluar = tanggal_keluar ≤ hari ini"
    Profesi:
      type: [string, 'null']
      enum: [dokter, dokter_gigi, perawat, bidan, apoteker, tenaga_kesehatan_lain, non_kesehatan, null]
      description: "Kelompok profesi untuk syarat izin praktik (lapis 5). Rincian jabatan/spesialisasi di `jabatan`"
    RingkasUnitPegawai:
      type: [object, 'null']
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    StatusIzinPraktik:
      type: string
      enum: [belum_berlaku, berlaku, akan_habis, habis, batal]
      description: "akan_habis = berlaku_sampai dalam N hari (konfigurasi, angka awal 60 mengikuti contoh FR-40-01; perlu verifikasi kebijakan RS)"
    PegawaiRingkas:
      type: object
      required: [id, nip, nama, nik_samaran, profesi, jabatan, unit, status, punya_akun, akun, izin_praktik_status]
      properties:
        id: { type: string, format: uuid }
        nip: { type: [string, 'null'] }
        nama: { type: string }
        nik_samaran: { type: [string, 'null'], examples: ['1271 •••• •••• 0042'], description: "4 digit awal dan akhir; null = NIK belum diisi" }
        profesi: { $ref: '#/components/schemas/Profesi' }
        jabatan: { type: [string, 'null'] }
        unit: { $ref: '#/components/schemas/RingkasUnitPegawai' }
        status: { $ref: '#/components/schemas/StatusPegawai' }
        punya_akun: { type: boolean }
        akun:
          type: [object, 'null']
          description: "Hanya dikirim isinya untuk pemegang pengaturan.akun.lihat; selain itu null (lihat punya_akun)"
          required: [id, nama_pengguna, status]
          properties:
            id: { type: string, format: uuid }
            nama_pengguna: { type: string }
            status: { type: string, enum: [aktif, nonaktif] }
        izin_praktik_status:
          type: [string, 'null']
          enum: [belum_berlaku, berlaku, akan_habis, habis, null]
          description: "Keadaan terburuk di antara izin praktik yang tidak dibatalkan; null = belum ada izin praktik"
    PegawaiRinci:
      allOf:
        - $ref: '#/components/schemas/PegawaiRingkas'
        - type: object
          required: [jenis_kepegawaian, tmt, tanggal_keluar, alasan_keluar, ihs_practitioner_id, nik_dapat_dilihat, versi, diubah_pada]
          properties:
            nik: { type: string, pattern: '^[0-9]{16}$', description: "Hanya pada GET dengan tampilkan_nik=true dan izin sdm.pegawai.identitas.lihat" }
            nik_dapat_dilihat: { type: boolean, description: "Akun ini punya izin bagian identitas (tombol Tampilkan NIK boleh dirender)" }
            jenis_kepegawaian: { type: [string, 'null'], description: "Isian bebas RS, mis. PNS, PPPK, pegawai BLU, kontrak" }
            tmt: { type: [string, 'null'], format: date }
            tanggal_keluar: { type: [string, 'null'], format: date }
            alasan_keluar: { type: [string, 'null'] }
            ihs_practitioner_id: { type: [string, 'null'], description: "Diisi integrasi SATUSEHAT (1.9); hanya baca" }
            versi: { type: string }
            diubah_pada: { type: string, format: date-time }
    IsianPegawai:
      type: object
      required: [nama, dasar_perubahan]
      properties:
        nip: { type: [string, 'null'], maxLength: 30 }
        nik: { type: [string, 'null'], pattern: '^[0-9]{16}$', description: "Butuh izin sdm.pegawai.identitas.lihat untuk mengisi" }
        nama: { type: string, minLength: 2, maxLength: 150 }
        jenis_kepegawaian: { type: [string, 'null'], maxLength: 50 }
        profesi: { $ref: '#/components/schemas/Profesi' }
        unit_organisasi_id: { type: [string, 'null'], format: uuid }
        jabatan: { type: [string, 'null'], maxLength: 150 }
        tmt: { type: [string, 'null'], format: date }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    JenisIzinPraktik:
      type: string
      enum: [str, sip, sik, spk]
    IzinPraktik:
      type: object
      required: [id, jenis, nomor, terbit, berlaku_sampai, status, dokumen, dicatat_oleh, dicatat_pada, alasan_batal, dibatalkan_oleh, dibatalkan_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { $ref: '#/components/schemas/JenisIzinPraktik' }
        nomor: { type: string }
        terbit: { type: string, format: date }
        berlaku_sampai: { type: [string, 'null'], format: date, description: "null = seumur hidup (STR)" }
        status: { $ref: '#/components/schemas/StatusIzinPraktik' }
        dokumen:
          type: [object, 'null']
          required: [jenis_mime, ukuran]
          properties:
            jenis_mime: { type: string, enum: [application/pdf, image/jpeg, image/png] }
            ukuran: { type: integer, minimum: 1 }
        dicatat_oleh: { $ref: '#/components/schemas/Pelaku' }
        dicatat_pada: { type: string, format: date-time }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
    KewenanganKlinis:
      type: object
      required: [id, kategori, kode_tindakan, berlaku_dari, berlaku_sampai, komite, dasar, status, dicatat_oleh, dicatat_pada, alasan_batal, dibatalkan_oleh, dibatalkan_pada]
      properties:
        id: { type: string, format: uuid }
        kategori: { type: string }
        kode_tindakan: { type: array, items: { type: string } }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai: { type: string, format: date }
        komite: { type: string }
        dasar: { type: [string, 'null'] }
        status: { type: string, enum: [belum_berlaku, berlaku, habis, batal] }
        dicatat_oleh: { $ref: '#/components/schemas/Pelaku' }
        dicatat_pada: { type: string, format: date-time }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
    Notifikasi:
      type: object
      required: [id, jenis, judul, isi, tautan, prioritas, tugas_id, dibaca_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: string, description: "Kode jenis tugas (mis. PERSETUJUAN_AKSES_MENUNGGU) atau jenis akun (AKUN_TERKUNCI, TTD_TERKUNCI, TTD_DICABUT)" }
        judul: { type: string }
        isi: { type: string, description: "Tanpa data pasien, sandi, atau alamat IP lengkap" }
        tautan: { type: [string, 'null'], description: "Rute SPA, mis. /pengaturan/persetujuan/{id}" }
        prioritas: { type: string, enum: [biasa, penting, kritis] }
        tugas_id: { type: [string, 'null'], format: uuid }
        dibaca_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    KanalPreferensi:
      type: object
      required: [aktif, dapat_diubah]
      properties:
        aktif: { type: boolean }
        dapat_diubah: { type: boolean }
    PreferensiNotifikasi:
      type: object
      required: [jenis, nama, kritis, in_app, email, pesan_singkat]
      properties:
        jenis: { type: string }
        nama: { type: string }
        kritis: { type: boolean }
        in_app: { type: boolean, const: true }
        email: { $ref: '#/components/schemas/KanalPreferensi' }
        pesan_singkat: { $ref: '#/components/schemas/KanalPreferensi' }
    PelaksanaTugas:
      type: object
      required: [jenis, id, nama]
      properties:
        jenis: { type: string, enum: [pengguna, peran, unit] }
        id: { type: string, format: uuid }
        nama: { type: string }
    Tugas:
      type: object
      required: [id, jenis, judul, objek, tautan, pelaksana, tenggat_pada, tingkat_saat_ini, status, terlambat, kritis, dibuat_pada, selesai_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: object, required: [kode, nama], properties: { kode: { type: string }, nama: { type: string } } }
        judul: { type: string, description: "Ringkasan tanpa data pasien bila tugas dikirim lewat email" }
        objek:
          type: object
          required: [jenis, id, label]
          properties:
            jenis: { type: string, description: "Mis. persetujuan_akses, permintaan_akses, izin_praktik" }
            id: { type: string, format: uuid }
            label: { type: string }
        tautan: { type: string, description: "Rute SPA layar penyelesaian (FR-53-02)" }
        pelaksana: { $ref: '#/components/schemas/PelaksanaTugas' }
        tenggat_pada: { type: string, format: date-time }
        tingkat_saat_ini: { type: integer, minimum: 0, maximum: 3, description: "0 = belum ada pengingat; 1 pengingat; 2 teguran; 3 eskalasi" }
        status: { type: string, enum: [terbuka, selesai, batal] }
        terlambat: { type: boolean, description: "Tenggat lewat (terbuka), atau selesai sesudah tenggat" }
        kritis: { type: boolean }
        dibuat_pada: { type: string, format: date-time }
        selesai_pada: { type: [string, 'null'], format: date-time }
    TugasRinci:
      allOf:
        - $ref: '#/components/schemas/Tugas'
        - type: object
          required: [riwayat]
          properties:
            riwayat:
              type: array
              description: "Linimasa (FR-53-07), urut waktu"
              items:
                type: object
                required: [jenis, tingkat, terjadi_pada, penerima, kanal, catatan]
                properties:
                  jenis: { type: string, enum: [dibuat, pengingat, teguran, eskalasi, selesai, batal] }
                  tingkat: { type: integer, minimum: 0, maximum: 3 }
                  terjadi_pada: { type: string, format: date-time }
                  penerima:
                    type: array
                    description: "Kosong = tanpa penerima (mis. kepala unit belum ditetapkan)"
                    items: { type: object, required: [id, nama], properties: { id: { type: string, format: uuid }, nama: { type: string } } }
                  kanal: { type: array, items: { type: string, enum: [in_app, email, pesan_singkat] } }
                  catatan: { type: [string, 'null'], description: "Mis. tanpa penerima (kepala unit belum ditetapkan), atau kejadian penyelesai" }
    AturanEskalasi:
      type: object
      required: [pengingat_menit, teguran_menit, eskalasi_menit]
      description: "Menit relatif terhadap tenggat (negatif = sebelum tenggat). Tingkat 1 < 0 ≤ tingkat 2 ≤ tingkat 3"
      properties:
        pengingat_menit: { type: integer, maximum: -1, minimum: -525600, description: "Tingkat 1 ke pelaksana, sebelum tenggat" }
        teguran_menit: { type: integer, minimum: 0, maximum: 525600, description: "Tingkat 2 ke kepala unit, sesudah tenggat" }
        eskalasi_menit: { type: integer, minimum: 0, maximum: 525600, description: "Tingkat 3 ke kepala bidang + dasbor Direktur" }
    JenisTugas:
      type: object
      required: [id, kode, nama, uraian, modul, tenggat_dari, batas_menit, unit_teguran, unit_eskalasi, eskalasi, kritis, aktif, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, examples: ['PERSETUJUAN_AKSES_MENUNGGU'] }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        modul: { type: string, description: "Modul pembuat tugas, mis. akses, sdm" }
        tenggat_dari: { type: string, enum: [dibuat, objek], description: "dibuat = tenggat = dibuat + batas_menit; objek = tenggat dari tanggal objek (mis. izin praktik berakhir) dan tugas dibuat batas_menit sebelum itu" }
        batas_menit: { type: integer, minimum: 1 }
        unit_teguran:
          description: "Unit tujuan teguran (tingkat 2) bila tugas tanpa unit; null = hanya unit tugas"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        unit_eskalasi:
          description: "Unit tujuan eskalasi (tingkat 3); null = unit induk dari unit tingkat 2"
          oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }]
        eskalasi: { $ref: '#/components/schemas/AturanEskalasi' }
        kritis: { type: boolean, description: "Notifikasinya tidak bisa dimatikan preferensi" }
        aktif: { type: boolean }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    RingkasPeran:
      type: [object, 'null']
      required: [id, kode, nama]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
    StatusPersetujuan:
      type: string
      enum: [menunggu, disetujui, ditolak, kedaluwarsa, dibatalkan]
    PersetujuanAkses:
      type: object
      required: [id, nomor, jenis, ringkasan, objek, penyetuju_peran, penyetuju_pengguna, status, diterapkan, diajukan_oleh, diajukan_pada, alasan, dasar, kedaluwarsa_pada, diputuskan_oleh, diputuskan_pada, catatan_keputusan, grup, akun_terdampak, dapat_diputuskan]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['PSA-2026-000012'], description: "Dipakai sebagai dasar pemberian" }
        jenis: { type: string, enum: [izin_sensitif, peran_superadmin, pengecualian, reset_ttd, izin_label] }
        ringkasan: { type: string, examples: ["Tambah izin Kasir → Tagihan pasien → Batal ke peran Kasir Rawat Jalan"] }
        objek:
          type: object
          required: [jenis]
          description: "Perubahan yang akan diterapkan bila disetujui"
          properties:
            jenis: { type: string, enum: [izin_peran, penugasan, pengakhiran_penugasan, izin_khusus, penyetuju_izin, reset_ttd, izin_label, penyetuju_label] }
            penugasan_id: { type: [string, 'null'], format: uuid, description: "Untuk pengakhiran_penugasan" }
            peran: { $ref: '#/components/schemas/RingkasPeran' }
            akun:
              type: [object, 'null']
              required: [id, nama_pengguna, nama]
              properties:
                id: { type: string, format: uuid }
                nama_pengguna: { type: string }
                nama: { type: string }
            izin:
              type: [object, 'null']
              required: [kode, label]
              properties:
                kode: { type: string }
                label: { type: string }
            cakupan_label: { type: [string, 'null'] }
            berlaku_sampai: { type: [string, 'null'], format: date-time }
            label:
              type: [object, 'null']
              required: [kode, nama]
              description: "Sejak v0.14.0: label sensitivitas untuk `izin_label` dan `penyetuju_label`; null untuk jenis lain"
              properties:
                kode: { type: string }
                nama: { type: string }
        penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran', description: "null bila penyetujunya orang (penyetuju_pengguna)" }
        penyetuju_pengguna:
          $ref: '#/components/schemas/Pelaku'
          description: "Sejak 1.6. Penyetuju orang tertentu (reset_ttd: atasan langsung pemilik TTE, ditetapkan saat diajukan); null = penyetujunya pemegang penyetuju_peran"
        status: { $ref: '#/components/schemas/StatusPersetujuan' }
        diterapkan: { type: boolean, description: "true = perubahan sudah berlaku (semua persetujuan dalam grup disetujui)" }
        diajukan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diajukan_pada: { type: string, format: date-time }
        alasan: { type: [string, 'null'] }
        dasar: { type: string }
        kedaluwarsa_pada: { type: string, format: date-time }
        diputuskan_oleh: { $ref: '#/components/schemas/Pelaku', description: "null = belum diputuskan, atau diputuskan sistem (kedaluwarsa, tidak bisa diterapkan)" }
        diputuskan_pada: { type: [string, 'null'], format: date-time }
        catatan_keputusan: { type: [string, 'null'] }
        grup:
          type: object
          required: [id, jumlah, disetujui]
          description: "Satu pengajuan bisa butuh beberapa penyetuju (mis. peran berisi izin sensitif milik beberapa pemilik data)"
          properties:
            id: { type: string, format: uuid }
            jumlah: { type: integer, minimum: 1 }
            disetujui: { type: integer, minimum: 0 }
        akun_terdampak: { type: integer, minimum: 0 }
        dapat_diputuskan: { type: boolean, description: "Akun yang sedang masuk boleh menyetujui/menolak ini sekarang" }
    StatusTtd:
      type: object
      required: [aktif, diaktifkan_pada, dicabut_pada, terkunci_sampai, sesi_berlaku_sampai, reset_menunggu]
      description: "TTE T1 akun yang sedang masuk (tiket 1.6). Tidak memuat kunci publik/privat maupun PIN."
      properties:
        aktif: { type: boolean, description: "false = belum diaktifkan, atau dicabut karena reset (aktifkan ulang dengan PIN baru)" }
        diaktifkan_pada: { type: [string, 'null'], format: date-time }
        dicabut_pada: { type: [string, 'null'], format: date-time, description: "Terisi bila TTE terakhir dicabut karena reset dan belum diaktifkan ulang (null = belum pernah aktif, atau aktif)" }
        terkunci_sampai: { type: [string, 'null'], format: date-time, description: "Terisi selama terkunci karena 5 PIN salah" }
        sesi_berlaku_sampai: { type: [string, 'null'], format: date-time, description: "Sesi tanda tangan (15 menit sesudah PIN benar, sesi login yang sama): tandatangani tanpa PIN sampai waktu ini" }
        reset_menunggu: { type: boolean, description: "Ada persetujuan reset_ttd menunggu untuk akun ini" }
    TandaTangan:
      type: object
      required: [id, objek_jenis, objek_id, penanda_tangan, tingkat, metode, hash_isi, sidik_kunci, kredensial_dicabut, ditandatangani_pada, verifikasi]
      properties:
        id: { type: string, format: uuid }
        objek_jenis: { type: string, enum: [persetujuan_akses, usulan_data_induk] }
        objek_id: { type: string, format: uuid }
        penanda_tangan:
          type: object
          required: [id, nama, nip]
          properties:
            id: { type: string, format: uuid, description: "id akun" }
            nama: { type: string, description: "Nama pegawai (nama pengguna bila akun tanpa pegawai)" }
            nip: { type: [string, 'null'] }
        tingkat: { type: string, enum: [T1] }
        metode: { type: string, enum: [pin] }
        hash_isi: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 isi kanonik saat ditandatangani" }
        sidik_kunci: { type: string, pattern: '^[0-9a-f]{16}$', description: "16 hex awal SHA-256 kunci publik yang dipakai" }
        kredensial_dicabut: { type: boolean, description: "true = kunci yang dipakai sudah diganti karena reset (tanda tangan tetap bisa sah)" }
        ditandatangani_pada: { type: string, format: date-time, description: "Cap waktu server" }
        verifikasi:
          type: object
          required: [status, diperiksa_pada]
          properties:
            status:
              type: string
              enum: [sah, isi_berubah, tanda_tangan_tidak_sah]
              description: "sah = isi saat ini sama dengan yang ditandatangani dan tanda tangan cocok dengan kunci publiknya (juga bila kredensial itu sudah dicabut karena reset)"
            diperiksa_pada: { type: string, format: date-time }
    JenisDataInduk:
      type: string
      enum: [ruang_tt, tarif]
      description: "Kelompok data induk dengan satu alur usulan (pemilik/pemverifikasi/penyetuju): ruang_tt = ruang & TT (FR-08-16); tarif = buku tarif (FR-28-12, 2.2)"
    ObjekDataInduk:
      type: string
      enum: [ruang, kamar, tempat_tidur, tarif]
      description: "ruang = lokasi jenis ruang (1.8b); tarif = satu butir buku tarif (2.2, jenis_data `tarif`)"
    TahapUsulan:
      type: string
      enum: [diusulkan, diverifikasi, disetujui, berlaku, dikembalikan, gagal_diterapkan]
      description: "berlaku dan gagal_diterapkan final"
    IsianUsulanDataInduk:
      type: object
      required: [jenis_data, perubahan, berlaku_dari, alasan, dasar]
      properties:
        jenis_data: { $ref: '#/components/schemas/JenisDataInduk' }
        perubahan: { $ref: '#/components/schemas/IsianPerubahanUsulan' }
        berlaku_dari: { type: string, format: date, description: "≥ hari ini zona RS; diterapkan 00.00 pada tanggal ini" }
        alasan: { type: string, minLength: 5, maxLength: 500 }
        dasar: { $ref: '#/components/schemas/Dasar' }
    IsianPerubahanUsulan:
      type: array
      minItems: 1
      maxItems: 50
      description: |
        Diterapkan berurutan dalam satu transaksi. Aksi per objek dan isian `nilai_baru` (aturan 1.8b yang sama):
        - tempat_tidur `tambah` (objek_id null): kamar_id, kode, kelas_rawat_id, aturan_jenis_kelamin, isolasi, ekstra
          (IsianTempatTidur tanpa berlaku_dari/dasar_perubahan; TT mulai dihitung pada `berlaku_dari` usulan);
        - tempat_tidur `ubah`: kelas_rawat_id, aturan_jenis_kelamin, isolasi, ekstra (minimal satu);
        - tempat_tidur `tutup`: alasan (TT tidak dihitung mulai `berlaku_dari`, permanen);
        - kamar `tambah` (objek_id null): bangsal_id, lokasi_id, kapasitas_maksimum, atribut_standar;
        - kamar `ubah`: bangsal_id, kapasitas_maksimum, atribut_standar (minimal satu);
        - ruang `tambah` (objek_id null): induk_id (lantai/sayap), kode, nama, fungsi, unit_organisasi_id (IsianLokasi
          jenis ruang);
        - ruang `ubah`: induk_id, kode, nama, fungsi, unit_organisasi_id, status (status berlaku pada tanggal efektif;
          minimal satu);
        - tarif `tambah` (objek_id null): kode, nama, kelompok, harga (IsianHargaTarif[]);
        - tarif `ubah`: nama, kelompok, status, harga (minimal satu; `harga` mengganti seluruh daftar harga per kelas);
        - tarif `tutup`: alasan (butir tidak berlaku mulai `berlaku_dari`, permanen; riwayat harga tetap terbaca).
        Satu usulan hanya memuat objek dari satu `jenis_data` (422 `perubahan_tidak_valid`, kode `jenis_campur`).
      items:
        type: object
        required: [objek_jenis, aksi, objek_id, nilai_baru]
        properties:
          objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
          aksi: { type: string, enum: [tambah, ubah, tutup] }
          objek_id: { type: [string, 'null'], format: uuid, description: "Wajib untuk ubah/tutup; null untuk tambah" }
          nilai_baru: { type: object, additionalProperties: true }
    ButirUsulan:
      type: object
      required: [objek_jenis, aksi, objek_id, objek_label, objek_berubah, nilai_lama, nilai_baru, tampilan]
      properties:
        objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
        aksi: { type: string, enum: [tambah, ubah, tutup] }
        objek_id: { type: [string, 'null'], format: uuid, description: "Untuk tambah: id objek baru, terisi sesudah berlaku (tidak masuk isi kanonik TTE)" }
        objek_berubah: { type: boolean, description: "Objek (ubah/tutup) berubah sejak diusulkan; penerapan akan gagal" }
        objek_label: { type: string, examples: ['ICU · Intensive care unit', 'TT B-3-304-2'] }
        nilai_lama: { type: [object, 'null'], additionalProperties: true, description: "Dipotret server saat diusulkan; null untuk tambah. Hanya isian yang diubah" }
        nilai_baru: { type: object, additionalProperties: true }
        tampilan: { type: array, items: { $ref: '#/components/schemas/TampilanIsian' } }
    TampilanIsian:
      type: object
      required: [isian, label_isian, lama, baru]
      description: "Satu baris diff siap tampil, disusun server saat dibaca (bukan isi kanonik TTE)"
      properties:
        isian: { type: string, examples: [kelas_rawat_id] }
        label_isian: { type: string, examples: ['Kelas rawat'] }
        lama: { type: [string, 'null'], examples: ['Kelas 3'], description: "null = belum ada (tambah)" }
        baru: { type: [string, 'null'], examples: ['Kelas 1', 'Ditutup mulai 15-10-2026'], description: "Selalu teks untuk tambah/ubah/tutup (tutup: \"Ditutup mulai <tanggal>\"); null hanya di riwayat versi bila isian dikosongkan" }
    RiwayatUsulan:
      type: object
      required: [aksi, oleh, pada, catatan, putaran]
      properties:
        aksi: { type: string, enum: [diajukan, diverifikasi, disetujui, dikembalikan, dikirim_ulang, diterapkan, gagal_diterapkan] }
        oleh: { $ref: '#/components/schemas/Pelaku', description: "null = sistem (penerapan terjadwal)" }
        pada: { type: string, format: date-time }
        catatan: { type: [string, 'null'] }
        putaran: { type: integer, minimum: 1 }
    UsulanDataInduk:
      type: object
      required: [id, nomor, jenis_data, ringkasan, perubahan, berlaku_dari, alasan, dasar, tahap, putaran, diusulkan_oleh, diusulkan_pada, diverifikasi_oleh, disetujui_oleh, gagal_alasan, riwayat, dapat]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['UDI-2026-000405'] }
        jenis_data: { $ref: '#/components/schemas/JenisDataInduk' }
        ringkasan: { type: string, examples: ['ICU: 12 → 16 TT'], description: "Dipotret server saat diusulkan/dikirim ulang (tidak bergeser sesudah berlaku)" }
        perubahan: { type: array, items: { $ref: '#/components/schemas/ButirUsulan' } }
        berlaku_dari: { type: string, format: date }
        alasan: { type: string }
        dasar: { type: string }
        tahap: { $ref: '#/components/schemas/TahapUsulan' }
        putaran: { type: integer, minimum: 1, description: "Naik setiap kirim ulang" }
        diusulkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diusulkan_pada: { type: string, format: date-time }
        diverifikasi_oleh: { $ref: '#/components/schemas/Pelaku', description: "Putaran ini; null bila belum" }
        disetujui_oleh: { $ref: '#/components/schemas/Pelaku' }
        gagal_alasan: { type: [string, 'null'] }
        riwayat: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RiwayatUsulan' }, description: "Urut waktu; paling banyak 200 kejadian terakhir" }
        dapat:
          type: object
          required: [verifikasi, setujui, kembalikan, kirim_ulang, tandatangani]
          description: "Tindakan yang boleh dilakukan akun yang sedang masuk sekarang"
          properties:
            verifikasi: { type: boolean }
            setujui: { type: boolean }
            kembalikan: { type: boolean }
            kirim_ulang: { type: boolean }
            tandatangani: { type: boolean, description: "Akun ini pengusul/pemverifikasi/penyetuju putaran ini sesudah tindakannya, dan belum menandatangani isi saat ini" }
    VersiDataInduk:
      type: object
      required: [id, versi, objek_jenis, objek_id, berlaku_dari, sebelum, sesudah, tampilan, usulan, dasar, diubah_oleh, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        versi: { type: integer, minimum: 1 }
        objek_jenis: { $ref: '#/components/schemas/ObjekDataInduk' }
        objek_id: { type: string, format: uuid }
        berlaku_dari: { type: string, format: date }
        sebelum: { type: [object, 'null'], additionalProperties: true, description: "null = objek dibuat" }
        sesudah: { type: object, additionalProperties: true }
        tampilan: { type: array, items: { $ref: '#/components/schemas/TampilanIsian' }, description: "Isian yang berubah, siap tampil" }
        usulan:
          type: [object, 'null']
          required: [id, nomor]
          properties:
            id: { type: string, format: uuid }
            nomor: { type: string }
        dasar: { type: string }
        diubah_oleh: { $ref: '#/components/schemas/Pelaku' }
        diubah_pada: { type: string, format: date-time }
    KodeLangkahPenyiapan:
      type: string
      enum: [superadmin, profil_rs, organisasi, paket_referensi, pegawai, penjamin_tarif, formularium, kredensial_integrasi, modul_aktif]
      description: "Langkah 1–9 FR-54-08, berurutan"
    StatusPenyiapan:
      type: object
      required: [status, siap_melayani, siap_melayani_sejak, langkah]
      properties:
        status: { type: string, enum: [belum, sebagian, selesai] }
        siap_melayani: { type: boolean, description: "Terkunci sejak langkah 1–6 pertama kali selesai (FR-54-08); fase 1 selalu false (K6)" }
        siap_melayani_sejak: { type: [string, 'null'], format: date-time }
        langkah:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/LangkahPenyiapan' }
    LangkahPenyiapan:
      type: object
      required: [no, kode, judul, status, wajib_untuk_melayani, syarat, dapat_dikonfirmasi, dapat_dilewati, konfirmasi_terakhir, paket]
      properties:
        no: { type: integer, minimum: 1, maximum: 9 }
        kode: { $ref: '#/components/schemas/KodeLangkahPenyiapan' }
        judul: { type: string, examples: ['Profil RS dan paket identitas'] }
        status: { type: string, enum: [belum, sebagian, selesai, dilewati, menunggu_fase_2] }
        wajib_untuk_melayani: { type: boolean, description: "Langkah 1–6" }
        syarat:
          type: array
          description: "Kosong untuk langkah menunggu fase 2"
          items:
            type: object
            required: [kode, label, terpenuhi, keterangan]
            properties:
              kode: { type: string, examples: [superadmin_mfa] }
              label: { type: string, examples: ['Dua superadmin dengan MFA'] }
              terpenuhi: { type: boolean }
              keterangan: { type: [string, 'null'], examples: ['1 dari 2'] }
        dapat_dikonfirmasi: { type: boolean, description: "Syarat lengkap, urutan terpenuhi, dan pemanggil memegang pengaturan.penyiapan.perbaiki" }
        dapat_dilewati: { type: boolean, description: "Hanya langkah 8 yang belum selesai, urutan terpenuhi, dan pemanggil memegang izin perbaiki" }
        konfirmasi_terakhir:
          type: [object, 'null']
          required: [oleh, pada, dilewati, alasan]
          properties:
            oleh: { $ref: '#/components/schemas/Pelaku' }
            pada: { type: string, format: date-time }
            dilewati: { type: boolean }
            alasan: { type: [string, 'null'] }
        paket:
          type: [array, 'null']
          description: "Hanya langkah 4: satu baris per sistem (urutan SistemReferensi), dari pemuatan terakhir di inti.paket_referensi (dimuat_pada lalu id terbaru, sama dengan pemuat 1.8e); null untuk langkah lain. Untuk `referensi` (versi per berkas/kelompok) `versi`/`sumber` = berkas terakhir yang dimuat, sedangkan `jumlah_kode_aktif` mencakup semua kelompok."
          items:
            type: object
            required: [sistem, wajib, versi, sumber, dimuat_pada, jumlah_kode_aktif]
            properties:
              sistem: { $ref: '#/components/schemas/SistemReferensi' }
              wajib: { type: boolean, description: "false untuk icd10/icd9cm (K7)" }
              versi: { type: [string, 'null'], description: "Versi pemuatan terakhir; null = belum dimuat" }
              sumber: { type: [string, 'null'] }
              dimuat_pada: { type: [string, 'null'], format: date-time }
              jumlah_kode_aktif: { type: integer, minimum: 0 }
    SistemReferensi:
      type: string
      enum: [wilayah, referensi, icd10, icd9cm, loinc, ucum]
    HasilMuatReferensi:
      type: object
      required: [sistem, versi, mode, diterapkan, jumlah_baris, jumlah_salah, jumlah_baru, jumlah_diubah, jumlah_dinonaktifkan, jumlah_diaktifkan_lagi, kesalahan, kesalahan_terpotong]
      properties:
        sistem: { $ref: '#/components/schemas/SistemReferensi' }
        versi: { type: string }
        mode: { type: string, enum: [pratinjau, terapkan] }
        diterapkan: { type: boolean }
        jumlah_baris: { type: integer, minimum: 0 }
        jumlah_salah: { type: integer, minimum: 0, description: "Jumlah baris salah (kesalahan dipotong 500)" }
        jumlah_baru: { type: integer, minimum: 0 }
        jumlah_diubah: { type: integer, minimum: 0, description: "Kode yang ada dengan nama/tampilan/induk berbeda" }
        jumlah_dinonaktifkan: { type: integer, minimum: 0, description: "Kode aktif yang tidak ada di versi ini" }
        jumlah_diaktifkan_lagi: { type: integer, minimum: 0 }
        kesalahan: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/KesalahanBarisImpor' } }
        kesalahan_terpotong: { type: boolean }
    LabelSensitivitas:
      type: object
      required: [id, kode, nama, uraian, butuh_relasi_perawatan, penyetuju_peran, aktif]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, examples: [hiv, psikiatri, kekerasan_seksual, genetik, privasi_tinggi] }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        butuh_relasi_perawatan: { type: boolean, description: "true = selain izin label, akun harus merawat pasiennya (fase 2). Data awal true untuk semua label" }
        penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran', description: "Pejabat PDP; null = label belum bisa diberikan" }
        aktif: { type: boolean }
    IzinLabelAkun:
      type: object
      required: [id, label, berlaku_dari, berlaku_sampai, status, berlaku_sekarang, persetujuan, dasar_pemberian, alasan, diberikan_oleh, disetujui_oleh, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        label: { type: object, required: [kode, nama], properties: { kode: { type: string }, nama: { type: string } } }
        berlaku_dari: { type: [string, 'null'], format: date-time, description: "Saat disetujui; null selama menunggu atau bila ditolak" }
        berlaku_sampai: { type: string, format: date-time }
        status:
          type: string
          enum: [menunggu, berlaku, berakhir, batal, ditolak]
          description: "ditolak = pengajuannya ditolak, kedaluwarsa, atau ditarik pengaju; berakhir = lewat berlaku_sampai; batal = dicabut"
        berlaku_sekarang: { type: boolean, description: "status `berlaku` dan di dalam masa berlaku saat ini" }
        persetujuan: { type: object, required: [id, nomor], properties: { id: { type: string, format: uuid }, nomor: { type: string } } }
        dasar_pemberian: { type: string }
        alasan: { type: string }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        disetujui_oleh: { $ref: '#/components/schemas/Pelaku' }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    Terbatas:
      type: object
      required: [terbatas]
      description: |
        Pengganti isi objek berlabel bagi akun yang tidak lolos lapis 4; dipakai endpoint data pasien mulai fase 2. Tanpa
        nama atau kode label: label itu sendiri sudah data sensitif (mis. status HIV). Layar menampilkan "Terbatas".
      properties:
        terbatas: { type: boolean, const: true }
    StatusPermintaan:
      type: string
      enum: [menunggu, ditindaklanjuti, ditolak]
    PermintaanAkses:
      type: object
      required: [id, nomor, akun, sasaran_jenis, sasaran_kode, sasaran_label, alasan, status, diputuskan_oleh, diputuskan_pada, catatan_keputusan, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, examples: ['PMA-2026-000034'], description: "Dipakai sebagai dasar pemberian saat ditindaklanjuti" }
        akun:
          type: object
          required: [id, nama_pengguna, nama]
          properties:
            id: { type: string, format: uuid }
            nama_pengguna: { type: string }
            nama: { type: string }
        sasaran_jenis: { type: string, enum: [menu, izin] }
        sasaran_kode: { type: string }
        sasaran_label: { type: string }
        alasan: { type: string }
        status: { $ref: '#/components/schemas/StatusPermintaan' }
        diputuskan_oleh: { $ref: '#/components/schemas/Pelaku' }
        diputuskan_pada: { type: [string, 'null'], format: date-time }
        catatan_keputusan: { type: [string, 'null'] }
        dibuat_pada: { type: string, format: date-time }
    StatusMenu:
      type: string
      enum: [aktif, segera]
      description: "aktif = halaman tersedia; segera = tampil sebagai Segera hadir (hanya pengembangan/demo)"
    SubMenu:
      type: object
      required: [kode, label, rute, status, fase]
      properties:
        kode: { type: string, description: "kode stabil, mis. igd.papan; dipakai rute dan izin" }
        label: { type: string }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6, description: "fase rencana (PRD 16), ditampilkan di SegeraHadirPage" }
    Menu:
      type: object
      required: [kode, label, ikon, rute, status, fase, sub_menu]
      properties:
        kode: { type: string }
        label: { type: string }
        ikon: { type: string, description: "nama ikon dari design-system, bukan URL" }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6 }
        jumlah_tugas: { type: [integer, 'null'], description: "Sejak 1.7: menu beranda = jumlah tab saya + dieskalasi di /saya/tugas (tugas terbuka milik akun); menu lain null" }
        sub_menu:
          type: array
          items: { $ref: '#/components/schemas/SubMenu' }
    MenuSaya:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [versi, grup, izin]
          properties:
            versi: { type: string, description: "hash isi menu+izin; berubah saat peran/penugasan/izin berubah" }
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu:
                    type: array
                    items: { $ref: '#/components/schemas/Menu' }
            izin:
              type: array
              description: "kode izin aksi yang dimiliki (format <menu>.<sub_menu>.<aksi>); dipakai v-can/PermissionGate. Server tetap memeriksa ulang setiap permintaan."
              items: { type: string }
    PerangkatTepercaya:
      type: object
      required: [id, nama_perangkat, status, dibuat_pada, terakhir_dipakai_pada, berlaku_sampai, perangkat_ini, dicabut_pada, alasan_cabut, keterangan_cabut, dicabut_oleh]
      properties:
        id: { type: string, format: uuid }
        nama_perangkat: { type: string, maxLength: 100, description: "Dari user-agent saat dipercaya, mis. \"Chrome di Windows\"; user-agent mentah tidak disimpan" }
        status: { type: string, enum: [aktif, kedaluwarsa, dicabut] }
        dibuat_pada: { type: string, format: date-time }
        terakhir_dipakai_pada: { type: [string, 'null'], format: date-time, description: "Terakhir MFA dilewati karena perangkat ini" }
        berlaku_sampai: { type: string, format: date-time, description: "Efektif: sudah memperhitungkan kebijakan yang berlaku sekarang" }
        perangkat_ini: { type: boolean, description: "Perangkat yang terikat ke sesi ini: dipercaya saat langkah MFA sesi ini, atau dipakai melewati MFA saat masuk (disimpan di sesi; cookie token tidak dikirim ke /saya). Selalu false di /akun/{id}/perangkat" }
        dicabut_pada: { type: [string, 'null'], format: date-time }
        alasan_cabut:
          type: [string, 'null']
          enum: [dicabut_pemilik, dicabut_admin, sandi_diganti, sandi_direset, mfa_direset, akun_nonaktif, null]
        keterangan_cabut: { type: [string, 'null'], description: "Teks alasan admin (dicabut_admin); null untuk alasan lain" }
        dicabut_oleh: { $ref: '#/components/schemas/Pelaku', description: "Yang mencabut (pemilik, admin, atau pelaku ganti/reset sandi, reset MFA, nonaktif); null bila belum dicabut atau kedaluwarsa" }
    KebijakanKeamanan:
      type: object
      required: [versi, perangkat_tepercaya_hari, batas, diubah_pada]
      properties:
        versi: { type: string }
        perangkat_tepercaya_hari: { type: integer, minimum: 0, description: "Bawaan instalasi 30; 0 = perangkat tepercaya mati" }
        batas:
          type: object
          required: [maks_hari, maks_hari_superadmin, maks_hari_peran_sensitif]
          description: "Dari konfigurasi server, tidak bisa diubah dari layar"
          properties:
            maks_hari: { type: integer, minimum: 0, examples: [30] }
            maks_hari_superadmin: { type: integer, minimum: 0, examples: [7] }
            maks_hari_peran_sensitif: { type: integer, minimum: 0, examples: [14] }
        diubah_pada: { type: [string, 'null'], format: date-time }
    JenisPenjamin:
      type: string
      enum: [bpjs, umum, asuransi, perusahaan, jasa_raharja, jamkesda, sponsor_riset]
    PlafonPenjamin:
      type: [string, 'null']
      pattern: '^[0-9]{1,15}(\.[0-9]{1,2})?$'
      description: "Rupiah sebagai string desimal (tanpa pembulatan float); null = tanpa plafon tetap. Nilai klinis/tarif tidak ada di sini"
    Penjamin:
      type: object
      required: [id, kode, nama, jenis, status, masa_berlaku_gl_hari, plafon, jatuh_tempo_hari, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { $ref: '#/components/schemas/JenisPenjamin' }
        status: { type: string, enum: [aktif, nonaktif] }
        masa_berlaku_gl_hari: { type: [integer, 'null'], description: "Masa berlaku surat jaminan (GL) sejak terbit, hari; null = tidak dibatasi" }
        plafon: { $ref: '#/components/schemas/PlafonPenjamin' }
        jatuh_tempo_hari: { type: [integer, 'null'], description: "Jatuh tempo penagihan sejak tagihan terbit, hari" }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    HargaRupiah:
      type: string
      pattern: '^[0-9]{1,13}(\.[0-9]{1,2})?$'
      description: "Rupiah sebagai string desimal (tanpa float), ≥ 0"
    IsianHargaTarif:
      type: object
      required: [kelas_rawat_id, jasa_sarana, jasa_pelayanan, bhp]
      description: "Satu baris harga per kelas rawat; `kelas_rawat_id` unik dalam satu daftar (422 `kelas_ganda`); harga negatif ditolak"
      properties:
        kelas_rawat_id: { type: string, format: uuid }
        jasa_sarana: { $ref: '#/components/schemas/HargaRupiah' }
        jasa_pelayanan: { $ref: '#/components/schemas/HargaRupiah' }
        bhp: { $ref: '#/components/schemas/HargaRupiah', description: "Bahan habis pakai" }
    HargaTarif:
      type: object
      required: [kelas_rawat_id, kelas_rawat_label, jasa_sarana, jasa_pelayanan, bhp, total]
      properties:
        kelas_rawat_id: { type: string, format: uuid }
        kelas_rawat_label: { type: string, examples: ['Kelas 1'] }
        jasa_sarana: { $ref: '#/components/schemas/HargaRupiah' }
        jasa_pelayanan: { $ref: '#/components/schemas/HargaRupiah' }
        bhp: { $ref: '#/components/schemas/HargaRupiah' }
        total: { $ref: '#/components/schemas/HargaRupiah', description: "Jumlah tiga komponen, dihitung server" }
    Tarif:
      type: object
      required: [id, kode, nama, kelompok, status, berlaku_dari, harga, akan_berlaku, usulan_terbuka, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        kelompok: { type: string, description: "Pengelompokan buku tarif (mis. jenis layanan), teks bebas dari data RS" }
        status: { type: string, enum: [aktif, nonaktif] }
        berlaku_dari: { type: string, format: date, description: "Mulai berlaku versi yang tampil pada `tanggal`" }
        harga: { type: array, items: { $ref: '#/components/schemas/HargaTarif' } }
        akan_berlaku:
          type: [object, 'null']
          required: [berlaku_dari, harga]
          description: "Versi terjadwal terdekat sesudah `tanggal` (usulan disahkan, belum berlaku); null bila tidak ada"
          properties:
            berlaku_dari: { type: string, format: date }
            harga: { type: array, items: { $ref: '#/components/schemas/HargaTarif' } }
        usulan_terbuka:
          type: [object, 'null']
          required: [id, nomor]
          description: "Usulan yang sedang berjalan untuk butir ini; null bila tidak ada. Hanya terisi bila akun punya master_data.usulan.lihat"
          properties:
            id: { type: string, format: uuid }
            nomor: { type: string }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    HariPraktik:
      type: integer
      minimum: 1
      maximum: 7
      description: "Hari ISO: 1 = Senin … 7 = Minggu (zona RS)"
    JamPraktik:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: "Jam lokal RS, HH:MM"
    JenisPengecualian:
      type: string
      enum: [cuti, libur]
    JadwalPengecualian:
      type: object
      required: [id, jenis, pegawai, dari_tanggal, sampai_tanggal, alasan, status, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        jenis: { $ref: '#/components/schemas/JenisPengecualian' }
        pegawai:
          description: "null = berlaku untuk semua dokter (libur)"
          oneOf: [{ $ref: '#/components/schemas/RingkasPegawai' }, { type: 'null' }]
        dari_tanggal: { type: string, format: date }
        sampai_tanggal: { type: string, format: date }
        alasan: { type: string }
        status: { type: string, enum: [aktif, batal] }
        alasan_batal: { type: [string, 'null'] }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    KeterisianJadwal:
      type: object
      required: [tanggal, kuota_jkn, terisi_jkn, kuota_non_jkn, terisi_non_jkn, sisa_jkn, sisa_non_jkn, tersedia, alasan_tidak_tersedia]
      properties:
        tanggal: { type: string, format: date }
        kuota_jkn: { type: integer, minimum: 0 }
        terisi_jkn: { type: integer, minimum: 0 }
        kuota_non_jkn: { type: integer, minimum: 0 }
        terisi_non_jkn: { type: integer, minimum: 0 }
        sisa_jkn: { type: integer, minimum: 0 }
        sisa_non_jkn: { type: integer, minimum: 0 }
        tersedia: { type: boolean, description: "false bila tertutup pengecualian atau jadwal tidak aktif pada tanggal itu" }
        alasan_tidak_tersedia: { type: [string, 'null'], enum: [cuti, libur, nonaktif, null] }
    JadwalPraktik:
      type: object
      required: [id, pegawai, poliklinik, ruang, hari, jam_mulai, jam_selesai, kuota_jkn, kuota_non_jkn, berlaku_dari, berlaku_sampai, status, pada_tanggal, pengecualian, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        pegawai: { $ref: '#/components/schemas/RingkasPegawai' }
        poliklinik:
          type: object
          required: [id, kode, nama]
          properties:
            id: { type: string, format: uuid }
            kode: { type: string }
            nama: { type: string }
        ruang:
          description: "Ruang praktik (penunjuk arah dan lantai); null = poli belum dipetakan"
          oneOf: [{ $ref: '#/components/schemas/RingkasLokasi' }, { type: 'null' }]
        hari: { $ref: '#/components/schemas/HariPraktik' }
        jam_mulai: { $ref: '#/components/schemas/JamPraktik' }
        jam_selesai: { $ref: '#/components/schemas/JamPraktik' }
        kuota_jkn: { type: integer, minimum: 0 }
        kuota_non_jkn: { type: integer, minimum: 0 }
        berlaku_dari: { type: string, format: date }
        berlaku_sampai: { type: [string, 'null'], format: date }
        status: { type: string, enum: [aktif, nonaktif] }
        pada_tanggal:
          description: "Terisi dan sisa pada `tanggal` query; null bila `tanggal` tidak dikirim"
          oneOf: [{ $ref: '#/components/schemas/KeterisianJadwal' }, { type: 'null' }]
        pengecualian:
          type: array
          description: "Pengecualian aktif yang menutup jadwal ini (cuti dokter + libur RS) dengan sampai_tanggal ≥ hari ini; hanya jika pemanggil berizin lihat"
          items: { $ref: '#/components/schemas/JadwalPengecualian' }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    MetaKursor:
      type: object
      required: [kursor_berikutnya]
      description: "Bentuk dari App\\Core\\Http\\Paginasi::respons (tiket 1.0e)"
      properties:
        kursor_berikutnya: { type: [string, 'null'], description: "null = halaman terakhir" }
    Dasar:
      type: string
      minLength: 3
      maxLength: 200
      description: "Nomor SK, surat tugas, memo, atau persetujuan (Permenkes 24/2022 Ps. 30 ayat 1–2; PRD 9.2)"
    CakupanJenis:
      type: string
      enum: [rs, unit, ruang, poli, ksm, depo, pasien_dirawat]
      description: "Diterima: `rs` (cakupan_id kosong) dan `unit` (cakupan_id = unit aktif, tiket 1.8a; unit induk mencakup turunannya). Lainnya 422 cakupan_belum_didukung"
    JenisAksi:
      type: string
      enum: [lihat, input, perbaiki, sahkan, verifikasi, setujui, batal, ekspor, cetak, lihat_rupiah]
    PermintaanBatal:
      type: object
      required: [alasan_batal]
      properties:
        alasan_batal: { type: string, minLength: 5, maxLength: 500 }
    Pelaku:
      type: [object, 'null']
      description: "null = konsol/sistem"
      required: [id, nama]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
    NodeMenu:
      type: object
      required: [id, kode, label, tingkat, tersedia, modul_aktif, ikut_induk, izin, anak]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        label: { type: string }
        tingkat: { type: string, enum: [menu, sub_menu, bagian] }
        ikon: { type: [string, 'null'] }
        fase: { type: [integer, 'null'] }
        tersedia: { type: boolean, description: "Halaman sudah dibangun di versi ini" }
        modul_aktif: { type: boolean, description: "Modul dinyalakan di instalasi ini (inti.modul_aktif)" }
        ikut_induk: { type: boolean }
        izin:
          type: array
          items:
            type: object
            required: [kode, jenis_aksi, sensitif]
            properties:
              kode: { type: string }
              jenis_aksi: { $ref: '#/components/schemas/JenisAksi' }
              sensitif: { type: boolean }
              penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran', description: "Untuk izin sensitif: peran penyetuju (K3); null = belum ditetapkan. Dikirim sejak 1.2d" }
        anak:
          type: array
          items: { $ref: '#/components/schemas/NodeMenu' }
    PohonMenu:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [grup]
          properties:
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu: { type: array, items: { $ref: '#/components/schemas/NodeMenu' } }
    PeranRingkas:
      type: object
      required: [id, kode, nama, uraian, bawaan_sistem, wajib_mfa, status, jumlah_akun, memuat_izin_sensitif]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        bawaan_sistem: { type: boolean }
        wajib_mfa: { type: boolean }
        status: { type: string, enum: [aktif, nonaktif] }
        jumlah_akun: { type: integer, minimum: 0, description: "Akun dengan penugasan berlaku untuk peran ini" }
        memuat_izin_sensitif: { type: boolean }
    PeranRinci:
      allOf:
        - $ref: '#/components/schemas/PeranRingkas'
        - type: object
          required: [versi, izin, wajib_mfa_terkunci, masa_percaya_hari, batas_masa_percaya_hari, masa_percaya_instalasi_hari, dapat_disunting, alasan_terkunci, diubah_pada]
          properties:
            versi: { type: string, description: "Sama dengan ETag; naik setiap perubahan peran dari layar (PATCH atau PUT izin)" }
            izin: { type: array, items: { type: string }, description: "Kode izin aksi yang diberikan" }
            wajib_mfa_terkunci: { type: boolean, description: "true = superadmin atau memuat izin sensitif; sakelar MFA dinonaktifkan di layar" }
            izin_menunggu:
              type: array
              description: "Izin sensitif yang menunggu persetujuan untuk peran ini (sejak 1.2d); tidak termasuk di `izin`"
              items:
                type: object
                required: [kode, persetujuan_id, penyetuju_peran, kedaluwarsa_pada]
                properties:
                  kode: { type: string }
                  persetujuan_id: { type: string, format: uuid }
                  penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran' }
                  kedaluwarsa_pada: { type: string, format: date-time }
            masa_percaya_hari: { type: [integer, 'null'], minimum: 0, description: "Perangkat tepercaya (1.13); null = ikut kebijakan instalasi." }
            batas_masa_percaya_hari: { type: integer, minimum: 0, description: "Batas atas dari konfigurasi: superadmin, peran memuat izin sensitif, atau umum" }
            masa_percaya_instalasi_hari: { type: integer, minimum: 0, description: "Kebijakan instalasi saat ini (baca saja), untuk teks \"kosong = ikut instalasi (N hari)\" tanpa izin pengaturan.keamanan" }
            dapat_disunting: { type: boolean, description: "false bila peran bawaan terkunci atau dipegang penyunting" }
            alasan_terkunci: { type: [string, 'null'], enum: [peran_bawaan_terkunci, peran_sendiri, null] }
            diubah_pada: { type: string, format: date-time }
    StatusMfaAkun:
      type: object
      required: [aktif, aktif_pada, wajib_akun, sumber_wajib, dapat_direset]
      properties:
        aktif: { type: boolean, description: "Autentikator sudah didaftarkan" }
        aktif_pada: { type: [string, 'null'], format: date-time }
        wajib_akun: { type: boolean, description: "Sakelar tingkat akun (akses.pengguna.wajib_mfa)" }
        sumber_wajib:
          type: array
          description: "Alasan MFA wajib di dalam jaringan RS. Kosong = di jaringan RS tidak wajib. Dari luar jaringan RS selalu wajib (tidak dicantumkan di sini)."
          items:
            type: object
            required: [jenis, label, dapat_dimatikan]
            properties:
              jenis: { type: string, enum: [akun, peran, superadmin, izin_sensitif] }
              label: { type: string, examples: ["Peran Superadmin", "Sakelar akun"] }
              dapat_dimatikan: { type: boolean }
        dapat_direset: { type: boolean, description: "false bila MFA belum aktif, akun milik penyunting, atau akun superadmin dan penyunting bukan superadmin" }
    AkunRingkas:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, peran, pengecualian, mfa_aktif]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string, description: "Nama pegawai" }
        status: { type: string, enum: [aktif, nonaktif] }
        terkunci_sampai: { type: [string, 'null'], format: date-time }
        login_terakhir_pada: { type: [string, 'null'], format: date-time }
        peran:
          type: array
          description: "Peran dengan penugasan berlaku"
          items:
            type: object
            required: [id, nama, berlaku_sampai]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
              berlaku_sampai: { type: [string, 'null'], format: date-time }
        pengecualian:
          type: object
          required: [tambah, cabut]
          properties:
            tambah: { type: integer, minimum: 0 }
            cabut: { type: integer, minimum: 0 }
        mfa_aktif: { type: boolean }
    Penugasan:
      type: object
      required: [id, peran, cakupan_jenis, cakupan_id, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        peran:
          type: object
          required: [id, kode, nama]
          properties:
            id: { type: string, format: uuid }
            kode: { type: string }
            nama: { type: string }
        cakupan_jenis: { $ref: '#/components/schemas/CakupanJenis' }
        cakupan_id: { type: [string, 'null'], format: uuid }
        cakupan_label: { type: [string, 'null'], description: "Nama unit untuk cakupan `unit` (dengan kode), null untuk `rs`; tidak perlu permintaan per baris. Dikirim sejak backend 1.8a (tidak di-`required` agar kontrak ini tetap cocok dengan backend sebelumnya)" }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: [string, 'null'] }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean, description: "aktif dan di dalam masa berlaku saat ini" }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    IzinKhusus:
      type: object
      required: [id, efek, sasaran_jenis, sasaran_kode, sasaran_label, sensitif, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        efek: { type: string, enum: [tambah, cabut] }
        sasaran_jenis: { type: string, enum: [menu, izin] }
        sasaran_kode: { type: string }
        sasaran_label: { type: string, description: "Jalur label, mis. Kasir → Tutup kasir, atau Kasir → Tagihan pasien → Batal" }
        sensitif: { type: boolean }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: string }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    AkunRinci:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, diri_sendiri, dapat_diubah, alasan_terkunci, mfa, penugasan, izin_khusus]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
        terkunci_sampai: { type: [string, 'null'], format: date-time }
        login_terakhir_pada: { type: [string, 'null'], format: date-time }
        diri_sendiri: { type: boolean, description: "true = akun milik penyunting; semua tombol ubah disembunyikan (PRD 9.2.4)" }
        dapat_diubah: { type: boolean, description: "false = semua perubahan /akun/{id}/* oleh penyunting ini akan ditolak 403; tombol ubah tidak dirender" }
        alasan_terkunci: { type: [string, 'null'], enum: [diri_sendiri, akun_superadmin, null], description: "Kode 403 yang akan diterima bila tetap mengubah" }
        mfa: { $ref: '#/components/schemas/StatusMfaAkun' }
        penugasan: { type: array, items: { $ref: '#/components/schemas/Penugasan' }, description: "Berlaku dulu, lalu riwayat (batal/kedaluwarsa) terbaru dulu" }
        izin_khusus: { type: array, items: { $ref: '#/components/schemas/IzinKhusus' } }
        menunggu_persetujuan:
          type: array
          description: "Penugasan, pengakhiran penugasan, dan izin khusus untuk akun ini yang menunggu persetujuan (sejak 1.2d)"
          items: { $ref: '#/components/schemas/PersetujuanAkses' }
    SistemIntegrasi:
      type: string
      enum: [bpjs_vclaim, aplicares, satusehat]
      description: "Sistem fase 1 (tiket 1.9); nilai sama dengan `integrasi.kotak_keluar.tujuan` (PRD 11.2)"
    LingkunganIntegrasi:
      type: string
      enum: [sandbox, produksi]
    StatusKiriman:
      type: string
      enum: [menunggu, terkirim, gagal, tertahan]
    KolomKredensial:
      type: object
      required: [nama, rahasia, wajib, terisi, nilai, akhir]
      properties:
        nama: { type: string, examples: [cons_id, secret_key, user_key, client_id, client_secret, organization_id] }
        rahasia: { type: boolean }
        wajib: { type: boolean }
        terisi: { type: boolean }
        nilai: { type: [string, 'null'], description: "Nilai utuh, hanya kolom bukan rahasia; selalu null untuk kolom rahasia" }
        akhir: { type: [string, 'null'], description: "Hanya kolom rahasia: 4 karakter terakhir bila panjang nilai ≥ 16; selain itu null" }
    KredensialLingkungan:
      type: object
      required: [lingkungan, aktif, lengkap, kolom, diubah_pada, diubah_oleh]
      properties:
        lingkungan: { $ref: '#/components/schemas/LingkunganIntegrasi' }
        aktif: { type: boolean }
        lengkap: { type: boolean, description: "Semua kolom wajib terisi" }
        kolom: { type: array, items: { $ref: '#/components/schemas/KolomKredensial' } }
        diubah_pada: { type: [string, 'null'], format: date-time }
        diubah_oleh: { $ref: '#/components/schemas/Pelaku' }
    HasilUjiKoneksi:
      type: object
      required: [lingkungan, berhasil, kode_http, latensi_ms, pesan, pada]
      properties:
        lingkungan: { $ref: '#/components/schemas/LingkunganIntegrasi' }
        berhasil: { type: boolean }
        kode_http: { type: [integer, 'null'], description: "null = tidak tersambung (DNS, TLS, batas waktu)" }
        latensi_ms: { type: [integer, 'null'] }
        pesan: { type: string, description: "Ringkasan untuk pengguna, disamarkan; tanpa nilai kredensial" }
        pada: { type: string, format: date-time }
    StatusSistemIntegrasi:
      type: object
      required: [kode, nama, lingkungan_aktif, kredensial, peringatan, circuit_breaker, queue, error_terakhir, uji_koneksi_terakhir]
      properties:
        kode: { $ref: '#/components/schemas/SistemIntegrasi' }
        nama: { type: string, examples: ['BPJS VClaim'] }
        lingkungan_aktif: { oneOf: [{ $ref: '#/components/schemas/LingkunganIntegrasi' }, { type: 'null' }], description: "null = belum ada yang diaktifkan" }
        kredensial:
          type: [array, 'null']
          description: "Satu baris per lingkungan (sandbox, produksi); null bila penonton tidak memegang pengaturan.integrasi.lihat"
          items: { $ref: '#/components/schemas/KredensialLingkungan' }
        peringatan:
          type: array
          description: "Hal yang membuat kiriman tertahan di tingkat sistem"
          items:
            type: object
            required: [kode, pesan]
            properties:
              kode: { type: string, examples: [kode_ppk_kosong, integrasi_nonaktif, kredensial_belum_lengkap] }
              pesan: { type: string }
        circuit_breaker:
          type: object
          description: "Untuk lingkungan aktif"
          required: [status, gagal_beruntun, sejak, coba_lagi_pada]
          properties:
            status: { type: string, enum: [tertutup, terbuka, setengah_terbuka] }
            gagal_beruntun: { type: integer, minimum: 0 }
            sejak: { type: [string, 'null'], format: date-time }
            coba_lagi_pada: { type: [string, 'null'], format: date-time }
        queue:
          type: object
          required: [menunggu, tertahan, gagal, terkirim_24_jam, menunggu_tertua_pada]
          properties:
            menunggu: { type: integer, minimum: 0 }
            tertahan: { type: integer, minimum: 0 }
            gagal: { type: integer, minimum: 0 }
            terkirim_24_jam: { type: integer, minimum: 0 }
            menunggu_tertua_pada: { type: [string, 'null'], format: date-time }
        error_terakhir:
          type: [object, 'null']
          required: [pesan, pada]
          properties:
            pesan: { type: string, description: "Disamarkan" }
            pada: { type: string, format: date-time }
        uji_koneksi_terakhir:
          oneOf: [{ $ref: '#/components/schemas/HasilUjiKoneksi' }, { type: 'null' }]
    Kiriman:
      type: object
      required: [id, tujuan, lingkungan, jenis_resource, objek_jenis, objek_id, status, percobaan, coba_lagi_pada, terkirim_pada, error_terakhir, penyebab_tertahan, pemilik_unit, id_luar, dapat_kirim_ulang, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        tujuan: { $ref: '#/components/schemas/SistemIntegrasi' }
        lingkungan: { oneOf: [{ $ref: '#/components/schemas/LingkunganIntegrasi' }, { type: 'null' }], description: "Lingkungan aktif saat kiriman dibuat; null = dibuat saat integrasi nonaktif" }
        jenis_resource: { type: string, examples: [Location, Organization, bed_update] }
        objek_jenis: { type: string, description: "Agregat lokal (`agregat_jenis`, PRD 11.2)", examples: [lokasi, unit_organisasi, bangsal] }
        objek_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusKiriman' }
        percobaan: { type: integer, minimum: 0 }
        coba_lagi_pada: { type: [string, 'null'], format: date-time }
        terkirim_pada: { type: [string, 'null'], format: date-time }
        error_terakhir: { type: [string, 'null'], description: "Disamarkan" }
        penyebab_tertahan:
          type: [object, 'null']
          description: "Hanya status tertahan (FR-49-04)"
          required: [kode, pesan]
          properties:
            kode: { type: string, examples: [kode_kelas_aplicares_kosong, induk_belum_terdaftar, kode_ppk_kosong, lingkungan_berubah, integrasi_nonaktif] }
            pesan: { type: string }
        pemilik_unit: { oneOf: [{ $ref: '#/components/schemas/RingkasUnit' }, { type: 'null' }], description: "Unit pemilik data induk yang perlu diperbaiki" }
        id_luar: { type: [string, 'null'], description: "ID di sistem luar sesudah terkirim (mis. id Location SATUSEHAT)" }
        dapat_kirim_ulang: { type: boolean, description: "Status gagal/tertahan, lingkungan = lingkungan aktif (atau null dan sistem punya lingkungan aktif), dan penonton memegang izin perbaiki tujuan itu" }
        dibuat_pada: { type: string, format: date-time }
    LogIntegrasi:
      type: object
      required: [id, tujuan, lingkungan, metode, endpoint, kode_http, berhasil, latensi_ms, pesan, kotak_keluar_id, permintaan, respons, terpotong, terjadi_pada]
      properties:
        id: { type: string, format: uuid }
        tujuan: { $ref: '#/components/schemas/SistemIntegrasi' }
        lingkungan: { $ref: '#/components/schemas/LingkunganIntegrasi' }
        metode: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        endpoint: { type: string, description: "Path tanpa host dan query, segmen identitas disamarkan", examples: ['/fhir-r4/v1/Location'] }
        kode_http: { type: [integer, 'null'] }
        berhasil: { type: boolean, description: "Menurut aturan sukses sistem itu (mis. BPJS `metaData.code`), bukan hanya kode HTTP" }
        latensi_ms: { type: [integer, 'null'] }
        pesan: { type: [string, 'null'], description: "Ringkasan error, disamarkan" }
        kotak_keluar_id: { type: [string, 'null'], format: uuid, description: "null = uji koneksi atau panggilan baca langsung" }
        permintaan: { type: [string, 'null'], description: "Isi permintaan disamarkan (≤ 16 KB)" }
        respons: { type: [string, 'null'], description: "Isi respons sesudah dekripsi, disamarkan (≤ 16 KB)" }
        terpotong: { type: boolean }
        terjadi_pada: { type: string, format: date-time }
    JenisCariPasien:
      type: string
      enum: [nik, no_rm, no_kartu, nama_tanggal_lahir]
    JenisKelaminPasien:
      type: string
      enum: [laki_laki, perempuan, tidak_diketahui]
      description: "`tidak_diketahui` hanya untuk pasien tanpa identitas yang belum bisa ditentukan"
    KontakDaruratPasien:
      type: object
      required: [nama, hubungan, telepon]
      properties:
        nama: { type: string, minLength: 1, maxLength: 150 }
        hubungan: { type: string, minLength: 1, maxLength: 50, examples: [istri, anak, orang_tua, saudara, lainnya] }
        telepon: { type: string, pattern: '^\+?[0-9]{8,15}$' }
    IsianAlamatPasien:
      type: object
      required: [jalan, wilayah_kode]
      properties:
        jalan: { type: string, minLength: 1, maxLength: 200 }
        rt: { type: [string, 'null'], pattern: '^[0-9]{1,3}$' }
        rw: { type: [string, 'null'], pattern: '^[0-9]{1,3}$' }
        kode_pos: { type: [string, 'null'], pattern: '^[0-9]{5}$' }
        wilayah_kode: { type: string, pattern: '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$', description: "Kode Kemendagri tingkat kelurahan/desa dari paket referensi `wilayah` (1.8e)" }
    IsianPasienUbah:
      type: object
      description: "Field isian pasien (PRD FR-01-04, FR-01-05). Kode referensi dari paket `referensi` 1.8e (kelompok agama, pendidikan, pekerjaan, status_kawin)"
      properties:
        nama: { type: [string, 'null'], minLength: 1, maxLength: 150 }
        nik: { type: [string, 'null'], pattern: '^[0-9]{16}$' }
        no_paspor: { type: [string, 'null'], pattern: '^[A-Z0-9]{5,20}$' }
        no_kartu_bpjs: { type: [string, 'null'], pattern: '^[0-9]{13}$' }
        tanggal_lahir: { type: [string, 'null'], format: date }
        tempat_lahir: { type: [string, 'null'], maxLength: 100 }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelaminPasien' }
        agama: { type: [string, 'null'], maxLength: 50, description: "Kode referensi kelompok `agama`" }
        pendidikan: { type: [string, 'null'], maxLength: 50, description: "Kode referensi kelompok `pendidikan`" }
        pekerjaan: { type: [string, 'null'], maxLength: 50, description: "Kode referensi kelompok `pekerjaan`" }
        status_kawin: { type: [string, 'null'], maxLength: 50, description: "Kode referensi kelompok `status_kawin`" }
        kewarganegaraan: { type: string, enum: [wni, wna] }
        bahasa: { type: [string, 'null'], maxLength: 50, description: "Bahasa sehari-hari bila bukan bahasa Indonesia" }
        kebutuhan_khusus: { type: [string, 'null'], maxLength: 200, examples: ['Kursi roda; butuh juru bahasa isyarat'] }
        alamat: { oneOf: [{ $ref: '#/components/schemas/IsianAlamatPasien' }, { type: 'null' }] }
        telepon: { type: [string, 'null'], pattern: '^\+?[0-9]{8,15}$' }
        kontak_darurat: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/KontakDaruratPasien' } }
        tanpa_identitas: { type: boolean }
        ciri_pengenal: { type: [string, 'null'], maxLength: 500, description: "Pasien tanpa identitas: ciri fisik, tempat dan waktu ditemukan, pengantar" }
    IsianPasien:
      allOf:
        - $ref: '#/components/schemas/IsianPasienUbah'
        - type: object
          required: [jenis_kelamin]
          description: "`nama` dan `tanggal_lahir` wajib kecuali `tanpa_identitas: true` (bawaan false); `kewarganegaraan` kosong = `wni`"
          properties:
            kewarganegaraan: { default: wni }
    KodeLabelReferensi:
      type: [object, 'null']
      required: [kode, label]
      properties:
        kode: { type: string }
        label: { type: string }
    Pasien:
      type: object
      required: [id, no_rm, nama, nik_samaran, no_paspor_samaran, no_kartu_bpjs, tanggal_lahir, tempat_lahir, jenis_kelamin,
        agama, pendidikan, pekerjaan, status_kawin, kewarganegaraan, bahasa, kebutuhan_khusus, alamat, telepon, kontak_darurat,
        tanpa_identitas, ciri_pengenal, meninggal_pada, jumlah_kunjungan, sejak_tahun, versi, dibuat_pada, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        no_rm: { type: string, pattern: '^[0-9]{1,12}$', examples: ['00000127'], description: "Seumur hidup; panjang tetap dari konfigurasi server (nol di depan), tampilan berpemisah urusan klien" }
        nama: { type: string }
        nik: { type: [string, 'null'], description: "Hanya dikirim kepada akun berizin `pendaftaran.pasien.identitas.lihat`; selain itu field tidak ada" }
        nik_samaran: { type: [string, 'null'], examples: ['1271 •••• •••• 0042'], description: "Selalu dikirim; null = NIK belum diisi" }
        no_paspor: { type: [string, 'null'], description: "Sama seperti `nik`: hanya dengan izin bagian identitas" }
        no_paspor_samaran: { type: [string, 'null'], examples: ['A12••••89'] }
        no_kartu_bpjs: { type: [string, 'null'] }
        tanggal_lahir: { type: [string, 'null'], format: date }
        tempat_lahir: { type: [string, 'null'] }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelaminPasien' }
        agama: { $ref: '#/components/schemas/KodeLabelReferensi' }
        pendidikan: { $ref: '#/components/schemas/KodeLabelReferensi' }
        pekerjaan: { $ref: '#/components/schemas/KodeLabelReferensi' }
        status_kawin: { $ref: '#/components/schemas/KodeLabelReferensi' }
        kewarganegaraan: { type: string, enum: [wni, wna] }
        bahasa: { type: [string, 'null'] }
        kebutuhan_khusus: { type: [string, 'null'] }
        alamat:
          type: [object, 'null']
          required: [jalan, rt, rw, kode_pos, wilayah]
          properties:
            jalan: { type: string }
            rt: { type: [string, 'null'] }
            rw: { type: [string, 'null'] }
            kode_pos: { type: [string, 'null'] }
            wilayah:
              type: object
              required: [kode, kelurahan, kecamatan, kabupaten_kota, provinsi]
              properties:
                kode: { type: string }
                kelurahan: { type: string }
                kecamatan: { type: string }
                kabupaten_kota: { type: string }
                provinsi: { type: string }
        telepon: { type: [string, 'null'] }
        kontak_darurat: { type: array, items: { $ref: '#/components/schemas/KontakDaruratPasien' } }
        tanpa_identitas: { type: boolean }
        ciri_pengenal: { type: [string, 'null'] }
        meninggal_pada: { type: [string, 'null'], format: date-time }
        jumlah_kunjungan: { type: integer, minimum: 0, description: "Kunjungan yang tidak batal (0 sampai tiket 2.6)" }
        sejak_tahun: { type: integer, description: "Tahun pasien pertama terdaftar (zona RS)" }
        versi: { type: string }
        dibuat_pada: { type: string, format: date-time }
        diubah_pada: { type: string, format: date-time }
