      description: "Izin: sdm.kredensial.lihat, cakupan `rs`."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman RKK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KewenanganKlinis' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatKewenanganKlinis
      summary: Catat RKK minimal (daftar kode tindakan + masa berlaku)
      description: |
        Izin: sdm.kredensial.input. Kode tindakan diisi RS dari referensi resmi (mis. ICD-9-CM yang dimuat di 1.8e); di 1.8d
        hanya diperiksa bentuknya, tidak ada daftar bawaan. Perbaikan = batalkan lalu catat ulang. 422 `tanggal_tidak_valid`.
      requestBody:
