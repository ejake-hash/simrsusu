      responses:
        '200':
          description: Rincian KSM
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahKsm
      summary: Ubah atau nonaktifkan KSM
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        409 `kode_sudah_dipakai`; 409 `ksm_masih_dipakai` bila dinonaktifkan selagi ada penugasan ber-cakupan KSM itu yang
        masih aktif; `rincian` = daftar berisi satu objek `{jumlah_penugasan}`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
