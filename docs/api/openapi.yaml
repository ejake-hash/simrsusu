    get:
      operationId: saranPeran
      summary: Pengecualian per akun yang sama dipakai ≥ 5 akun (saran jadikan peran, FR-09-15)
      description: "Izin pengaturan.akun.lihat. Hanya pengecualian aktif; urut jumlah akun terbanyak; paling banyak 50 baris."
      responses:
        '200':
          description: Daftar saran
          content:
            application/json:
              schema:
                type: object
