        - `induk_id` kosong + `akar=true` → unit tingkat teratas; `induk_id=<id>` → anak langsung unit itu.
          Tiap baris membawa `jumlah_anak` agar pohon tahu node mana yang bisa dibuka.
        - `milik_saya=true` → unit dari penugasan akun yang sedang masuk ber-cakupan `unit` yang berlaku (unit itu
          saja, bukan turunannya; pemilih unit kerja di header); boleh untuk semua akun yang masuk, filter lain diabaikan.
          Selain nilai true, pemeriksaan izin biasa berlaku. Pemilih unit kerja
          hanya konteks tampilan di klien (mis. filter bawaan daftar); tidak mengubah izin, dan server tetap memaksa
          cakupan dari penugasan pada setiap permintaan.
        Urut: kode.
