        '200':
          description: Izin praktik sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinPraktik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/izin-praktik/{izinPraktikId}/dokumen:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: izinPraktikId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: dokumenIzinPraktik
      summary: Unduh dokumen izin praktik
      description: "Izin: sdm.kredensial.lihat. `Content-Disposition: attachment` dengan nama berkas generik `<jenis>-<id>.<ekstensi>` (tanpa nomor izin atau nama pegawai), `X-Content-Type-Options: nosniff`, tidak di-cache. 404 bila tidak ada dokumen."
      responses:
