    patch:
      operationId: ubahUnitOrganisasi
      summary: Ubah, pindah induk, atau nonaktifkan unit
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        - 422 `siklus`: induk baru adalah unit itu sendiri atau turunannya.
        - 409 `unit_masih_dipakai`: menonaktifkan unit yang masih punya anak aktif, penugasan ber-cakupan unit itu yang
          masih aktif (sedang atau akan berlaku), atau modul aktif per unit itu (inti.modul_aktif); `rincian` = daftar berisi
          satu objek `{jumlah_anak_aktif, jumlah_penugasan, jumlah_modul_aktif}`.
        - 409 `kode_sudah_dipakai`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
