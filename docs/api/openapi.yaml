        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Persetujuan akses dan permintaan akses (tiket 1.2d; PRD 9.2.3–9.2.4, 9.3; keputusan K3, K4, K13)
  # Pemberian berisiko tidak langsung berlaku: dicatat sebagai persetujuan menunggu dan diterapkan (dalam transaksi
  # yang sama dengan keputusan) saat semua penyetuju yang dibutuhkan menyetujui. Penyetuju = pemegang peran penyetuju
  # yang berlaku, atau orang tertentu (`penyetuju_pengguna`, sejak 1.6: reset TTE oleh atasan langsung); tidak pernah
  # pengaju dan tidak pernah akun penerima akses. Kedaluwarsa 7 hari.
  # Jalan masuk layar: sub-menu `pengaturan.persetujuan` (izin `pengaturan.persetujuan.lihat`, tidak sensitif) diberikan
  # **lewat peran** seperti menu lain: bawaan untuk superadmin; untuk pemilik data, admin memberikannya ke peran penyetujunya.
  # Endpoint /persetujuan-akses sendiri tidak butuh izin (hanya data yang relevan bagi akun itu). Usulan sub-menu otomatis
  # untuk semua penyetuju dicatat terpisah untuk keputusan pemilik (melonggarkan model "diberikan eksplisit", PRD 9.2).
  # Tidak ada POST /persetujuan-akses: persetujuan dibuat oleh endpoint pemberian (PUT izin peran, penugasan, izin khusus,
  # pengakhiran penugasan superadmin, penyetuju izin).
  # Aturan penyetuju (diperiksa server):
  # - memegang peran penyetuju yang berlaku (atau = penyetuju_pengguna); bukan pengaju (403 pengaju_sendiri);
  # - bukan penerima (403 penerima_sendiri): untuk penugasan/izin khusus = akun sasaran; untuk izin peran = semua pemegang
  #   peran sasaran (penugasan aktif); untuk penyetuju izin = pemegang peran yang ditunjuk;
  # - kontrol ganda K3/K13 tidak bisa dilewati satu superadmin: menunjuk penyetuju izin (PUT /izin/{kode}/penyetuju) dan
  #   menugaskan peran yang menjadi penyetuju izin sensitif (POST /akun/{id}/penugasan) sama-sama butuh persetujuan
  #   superadmin lain (202);
  # - persetujuan yang lewat `kedaluwarsa_pada` ditolak (409 sudah_diputuskan) walau tugas harian belum jalan;
  # - `permintaan_akses_id` tidak melewati persetujuan: pemberian berisiko tetap 202;
  # - syarat saat penerapan (mis. minimal 2 superadmin, penugasan ganda) diperiksa ulang dengan kunci.
  # Pengajuan ganda: sasaran yang sama selagi menunggu → 409 `persetujuan_ganda` (penugasan, izin khusus, pengakhiran);
  # di PUT /peran/{id}/izin izin yang sudah menunggu tidak diajukan ulang (idempoten, tercantum lagi di menunggu_persetujuan).
  # ---------------------------------------------------------------------------
  /persetujuan-akses:
    get:
      operationId: daftarPersetujuanAkses
      summary: Antrean persetujuan akses untuk akun yang sedang masuk (paginasi kursor, terbaru dulu)
      description: |
        Tanpa izin khusus: hanya data yang relevan bagi akun ini.
        - `tab=perlu_saya_putuskan`: status menunggu, akun ini memegang peran penyetujunya (atau akun ini `penyetuju_pengguna`),
          bukan pengaju, bukan penerima.
        - `tab=saya_ajukan`: diajukan akun ini (semua status).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tab, required: true, schema: { type: string, enum: [perlu_saya_putuskan, saya_ajukan] } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusPersetujuan' } }
      responses:
        '200':
          description: Satu halaman persetujuan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PersetujuanAkses' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPersetujuanAkses
      summary: Rincian persetujuan (siapa, apa, dasar, dampak)
      description: "Hanya pengaju, penerima, pemegang peran penyetujunya, atau penyetuju_pengguna; selain itu 404."
      responses:
        '200':
          description: Rincian
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}/setujui:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: setujuiPersetujuanAkses
      summary: Setujui; perubahan diterapkan bila semua penyetuju dalam grup sudah setuju
      description: |
        - 403 `bukan_penyetuju`: tidak memegang peran penyetuju (atau bukan `penyetuju_pengguna`); 403 `pengaju_sendiri`: pengaju tidak bisa menyetujui
          permintaannya sendiri; 403 `penerima_sendiri`: akun penerima akses tidak bisa menyetujui.
        - 409 `sudah_diputuskan` (bukan menunggu, termasuk kedaluwarsa/dibatalkan).
        - 409 `tidak_bisa_diterapkan`: keadaan berubah sejak diajukan (mis. peran nonaktif, akun nonaktif, penugasan
          ganda, superadmin tinggal 2); seluruh grup tetap tersimpan sebagai ditolak oleh sistem dengan alasan itu
          (klien memuat ulang rincian).
        Audit `akses.persetujuan_disetujui` (+ audit perubahan yang diterapkan); cache menu akun terdampak dihapus.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Persetujuan sesudah diputuskan (`diterapkan` = perubahan sudah berlaku)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}/tolak:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tolakPersetujuanAkses
      summary: Tolak (alasan wajib); seluruh grup ikut ditolak dan tidak ada yang diterapkan
      description: "Aturan penyetuju sama dengan setujui. 409 `sudah_diputuskan`. Audit `akses.persetujuan_ditolak`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
