        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Lokasi fisik, ruang, dan tempat tidur (tiket 1.8b; PRD v0.10.11 FR-54-11…14, FR-08-16…20 — PRD menyusul di #39,
  # aturan yang dipakai kode ditulis di sini dan di badan tiket backlog).
  # Izin: sub-menu `master_data.organisasi` (PRD 9.1 "Organisasi, Unit, Ruang & Tempat Tidur", satu halaman), aksi
  # lihat/input/perbaiki, semuanya dengan cakupan `rs` (pengelolaan per unit menyusul bersama admin delegasi).
  # Bangsal tidak punya kolom `kelas_layanan` (PRD 11.2): kelas ditetapkan per TT (`kelas_rawat_id`); arti kolom itu
  # ditanyakan ke pemilik (backlog).
  # Rekaman kapasitas hari T dibuat tugas harian 00.05 zona RS dan diperbarui setiap perubahan TT sepanjang hari T;
  # sesudah T lewat, rekaman tidak berubah.
  # Status lokasi (bukan TT), semua perpindahan antara aktif, renovasi, dan ditutup boleh, dengan syarat:
  #   - ke `renovasi`: tidak ada TT yang belum ditutup dan tidak ada poliklinik aktif di lokasi itu atau turunannya;
  #   - ke `ditutup`: syarat renovasi, ditambah semua turunan non-TT sudah `ditutup`;
  #   - gagal syarat → 409 `lokasi_masih_dipakai`, `rincian` = `[{jumlah_anak_aktif, jumlah_tempat_tidur, jumlah_poliklinik}]`
  #     (`jumlah_anak_aktif` = turunan non-TT yang belum ditutup; TT dihitung terpisah);
  #   - ke `aktif`/`renovasi` dari `ditutup`, menambah anak, dan pindah induk: induk tidak boleh `ditutup` (422 `induk_tidak_aktif`);
  #     induk `renovasi` boleh;
  #   - status sama dengan sekarang = tidak ada perubahan status.
  # 409/422 bisnis membawa `rincian` `[{kolom, pesan}]` dengan `kolom` = nama isian yang salah (mis. kode_sudah_dipakai → kode,
  # siklus/jenis_induk_tidak_sesuai/induk_tidak_aktif → induk_id, tanggal_tidak_valid → berlaku_dari/status_berlaku_dari),
  # kecuali `*_masih_dipakai` (rincian berisi jumlah). Akun dengan izin bercakupan unit saja → 403 `akses_ditolak`.
  # Urutan `kode_lengkap` leksikografis (10 sebelum 2); klien boleh mengurutkan alami untuk tampilan.
  # Lokasi menjawab *di mana* (gedung, lantai, ruang, TT); unit organisasi menjawab *siapa yang mengelola*.
  # Jenis anak sesuai jenis induk:
  #   (akar) → situs | gedung;  situs → gedung;  gedung → sayap | lantai;  sayap → lantai;  lantai → ruang;
  #   ruang → tempat_tidur;  tempat_tidur → (tidak ada).
  # `kode` = segmen pendek, unik di antara saudara; `kode_lengkap` = gabungan kode dari akar dengan "-" (mis. B-3-304-2),
  # dihitung server, unik di seluruh RS. Lokasi tidak pernah dihapus: penutupan lewat status dan tanggal.
  # Tempat tidur: node lokasi jenis `tempat_tidur` dibuat/dikelola lewat /tempat-tidur (bukan /lokasi). Kode TT tidak
  # pernah dihapus atau dipakai ulang, termasuk setelah TT ditutup atau ruangnya dipindah.
  # Mengubah ruang/kamar/TT dengan usulan berjenjang = tiket 1.8c; di 1.8b perubahan langsung oleh pemegang izin.
  # ---------------------------------------------------------------------------
  /lokasi:
    get:
      operationId: daftarLokasi
      summary: Daftar lokasi (paginasi kursor), per induk untuk pohon yang dimuat bertahap
      description: |
        Izin: master_data.organisasi.lihat, cakupan `rs`. Untuk jenis `tempat_tidur`, `status` mengikuti TT-nya:
        `ditutup` mulai hari pertama TT tidak dihitung, selain itu `aktif` (rincian belum_berlaku/akan_ditutup ada di
        `TempatTidur.status_operasional`); filter `status` membaca nilai itu.
        - `akar=true` → lokasi tingkat teratas; `induk_id=<id>` → anak langsung lokasi itu (`jumlah_anak` untuk pohon).
        - `cari` → cocok sebagian pada `kode_lengkap`, nama, atau kode TT (`TempatTidur.kode`, tetap walau ruangnya dipindah)
          di seluruh pohon (mis. "B-3-304").
        Urut: kode_lengkap.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: induk_id, schema: { type: string, format: uuid } }
        - { in: query, name: akar, schema: { type: boolean } }
        - { in: query, name: cari, schema: { type: string, maxLength: 100 } }
        - { in: query, name: jenis, schema: { $ref: '#/components/schemas/JenisLokasi' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusLokasi' } }
      responses:
        '200':
          description: Satu halaman lokasi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lokasi' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatLokasi
      summary: Tambah lokasi (situs, gedung, sayap, lantai, atau ruang)
      description: |
        Izin: master_data.organisasi.input. Jenis `tempat_tidur` lewat POST /tempat-tidur (422 `kelola_lewat_tempat_tidur`).
        Jenis `ruang` sesudah instalasi siap melayani: 409 `harus_lewat_usulan` (1.8c).
        - 422 `jenis_induk_tidak_sesuai` (aturan jenis di atas); 422 `induk_tidak_aktif` (induk ditutup);
          422 `fungsi_wajib` (ruang tanpa fungsi) / `fungsi_hanya_ruang`; 422 `unit_tidak_valid` (unit tidak ada atau nonaktif).
        - 409 `kode_sudah_dipakai`: kode sama dengan saudara, atau `kode_lengkap` yang terbentuk sudah ada.
        - `unit_organisasi_id` kosong = disalin dari pengelola induk saat dibuat (bukan warisan dinamis).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianLokasi' }
      responses:
        '201':
          description: Lokasi dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lokasi/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciLokasi
      summary: Rincian lokasi beserta jalur induknya
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian lokasi
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahLokasi
      summary: Ubah, pindah induk, atau ubah status lokasi
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        Lokasi jenis `tempat_tidur`: 422 `kelola_lewat_tempat_tidur`. `jenis` tidak bisa diubah. Lokasi jenis `ruang`
        sesudah instalasi siap melayani: 409 `harus_lewat_usulan` (1.8c).
        - Pindah induk (`induk_id`): 422 `siklus` (induk baru = lokasi itu atau turunannya), 422 `jenis_induk_tidak_sesuai`,
          422 `induk_tidak_aktif`;
          `kode_lengkap` lokasi dan seluruh turunannya dihitung ulang (409 `kode_sudah_dipakai` bila bentrok). Kode TT
          (`TempatTidur.kode`) tidak ikut berubah.
        - Status (`status` + `status_berlaku_dari`, tanggal ≤ hari ini zona RS, selain itu 422 `tanggal_tidak_valid`;
          kosong = hari ini): perpindahan dan syaratnya di blok aturan di atas (409 `lokasi_masih_dipakai`,
          422 `induk_tidak_aktif`).
          Penjadwalan status ke tanggal mendatang lewat usulan berjenjang (/usulan-data-induk).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                induk_id: { type: [string, 'null'], format: uuid }
                kode: { $ref: '#/components/schemas/KodeLokasi' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                fungsi: { $ref: '#/components/schemas/FungsiRuang' }
                unit_organisasi_id: { type: [string, 'null'], format: uuid }
                status: { $ref: '#/components/schemas/StatusLokasi' }
                status_berlaku_dari: { type: [string, 'null'], format: date }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Lokasi sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /lokasi/impor:
    post:
      operationId: imporLokasi
      summary: Impor lokasi, kamar, dan TT dari CSV (pratinjau dulu, lalu terapkan)
      description: |
        Izin: master_data.organisasi.input. Untuk penyiapan instalasi: sesudah siap melayani 409 `harus_lewat_usulan` (1.8c).
        Berkas CSV UTF-8 (RFC 4180, pemisah koma, baris pertama judul kolom), paling
        besar 2 MB dan 5.000 baris data; diproses sinkron (target < 30 detik untuk 5.000 baris). Berkas lebih besar dipecah
        oleh pengguna; impor lewat antrean untuk berkas besar adalah usulan terpisah (backlog). Templat dibuat klien dari
        daftar kolom ini:
        `jenis,kode,induk,nama,fungsi,unit,bangsal,kelas_rawat,kapasitas_maksimum,ekstra`
        - `jenis`: situs | gedung | sayap | lantai | ruang | tempat_tidur.
        - `kode`: segmen (KodeLokasi). `induk`: `kode_lengkap` induk, kosong = akar. Induk boleh ada di basis data atau di
          baris lain berkas yang sama (urutan bebas).
        - `nama` wajib kecuali `tempat_tidur` (kosong = "TT <kode>"). `fungsi` wajib untuk ruang (FungsiRuang).
        - `unit`: kode unit organisasi pengelola; kosong = mengikuti induk.
        - `bangsal` (hanya ruang): kode bangsal; bila diisi, ruang itu sekaligus menjadi kamar bangsal tersebut, dengan
          `kapasitas_maksimum` opsional. Ruang induk baris `tempat_tidur` wajib menjadi kamar (di berkas atau sudah ada).
        - `kelas_rawat` (wajib untuk tempat_tidur): kode kelas rawat. `ekstra`: `ya` | `tidak` (kosong = tidak).
          TT hasil impor: kode TT = `kode_lengkap`, aturan jenis kelamin `campur`, tidak isolasi, berlaku mulai hari ini.
        Bangsal dan kelas rawat harus sudah ada dan aktif. Impor hanya menambah: `kode_lengkap` yang sudah ada, atau kode TT
        yang pernah dipakai TT mana pun (termasuk yang ditutup), = `kode_sudah_dipakai`.
        `per_jenis` menghitung semua baris berkas menurut kolom `jenis` (termasuk baris salah); `kamar` = ruang berisi `bangsal`.
        Judul kolom persis seperti di atas (huruf kecil, urutan sama); penanda BOM UTF-8 dan pemisah `;` (Excel ber-locale
        Indonesia) diterima. `dasar_perubahan` wajib juga untuk pratinjau.
        - `mode=pratinjau`: tidak menyimpan apa pun; mengembalikan ringkasan dan baris salah beserta alasannya.
        - `mode=terapkan`: memeriksa ulang; bila ada satu baris salah → 422 `impor_tidak_valid` (`rincian` = baris salah,
          tidak ada yang disimpan; `rincian` = daftar KesalahanBarisImpor, sama dengan `data.kesalahan` pratinjau, paling
          banyak 500); bila semua benar → disimpan
          dalam satu transaksi, satu audit `master_data.lokasi_diimpor`.
        - 422 `berkas_tidak_valid`: bukan CSV UTF-8, judul kolom tidak sesuai, atau melebihi batas.
        Kode salah per baris: `kolom_wajib`, `jenis_tidak_dikenal`, `kode_tidak_valid`, `kode_ganda` (sama di berkas),
        `kode_sudah_dipakai`, `induk_tidak_ditemukan`, `siklus`, `jenis_induk_tidak_sesuai`, `induk_tidak_aktif`,
        `fungsi_wajib`, `fungsi_hanya_ruang`, `unit_tidak_valid`, `bangsal_tidak_valid`, `kelas_rawat_tidak_valid`, `bukan_kamar`,
        `nilai_tidak_valid`. Berkas di atas batas baris → 422 `berkas_tidak_valid` (bukan kesalahan per baris).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
