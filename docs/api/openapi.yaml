                  data: { type: array, items: { $ref: '#/components/schemas/Poliklinik' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPoliklinik
      summary: Tambah poliklinik
      description: |
        Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai`; 422 `unit_tidak_valid`; 422 `bukan_ruang`
        (`lokasi_id` bukan ruang aktif). `kode_poli_bpjs` diisi RS dari referensi BPJS resmi (tidak ada daftar bawaan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, unit_organisasi_id, dasar_perubahan]
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                unit_organisasi_id: { type: string, format: uuid }
                lokasi_id: { type: [string, 'null'], format: uuid, description: "Ruang tempat poli (penunjuk arah)" }
                kode_poli_bpjs: { type: [string, 'null'], maxLength: 10 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Poliklinik dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Poliklinik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /poliklinik/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPoliklinik
      summary: Rincian poliklinik
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian poliklinik
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Poliklinik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahPoliklinik
      summary: Ubah atau nonaktifkan poliklinik
      description: "Izin: master_data.organisasi.perbaiki. Wajib If-Match. 409 `kode_sudah_dipakai`; 422 `unit_tidak_valid`, `bukan_ruang`."
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                unit_organisasi_id: { type: string, format: uuid }
                lokasi_id: { type: [string, 'null'], format: uuid }
                kode_poli_bpjs: { type: [string, 'null'], maxLength: 10 }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Poliklinik sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Poliklinik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /kapasitas-tempat-tidur:
    get:
      operationId: kapasitasTempatTidur
      summary: Kapasitas TT per bangsal dan kelas pada satu tanggal (penyebut BOR/BTO/TOI), paginasi per bangsal
      description: |
        Izin: master_data.organisasi.lihat, cakupan `rs`. `tanggal` kosong = hari ini (zona RS).
        - Tanggal yang sudah lewat dibaca dari rekaman harian (`sumber = tersimpan`, tugas harian 00.05 zona RS); perubahan TT
          sesudahnya tidak mengubah angka hari itu. Hari ini, tanggal mendatang, atau hari lampau tanpa rekaman dihitung dari
          masa berlaku TT (`sumber = dihitung`).
        - TT dihitung pada tanggal T bila `berlaku_dari ≤ T` dan (`berlaku_sampai` kosong atau `T ≤ berlaku_sampai`).
          `jumlah_tersedia` = TT bukan ekstra; `jumlah_ekstra` = TT ekstra (dihitung atau tidak dalam kapasitas resmi adalah
          konfigurasi pelaporan, bukan di endpoint ini).
        Urut: kode bangsal. Satu baris = satu bangsal dengan rincian per kelas.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tanggal, schema: { type: string, format: date } }
        - { in: query, name: bangsal_id, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Satu halaman kapasitas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KapasitasBangsal' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Pegawai, izin praktik, kewenangan klinis, akun dari pegawai (tiket 1.8d; PRD 11.2 sdm, 9.2.6, 14.2; K5).
  # Izin: `sdm.pegawai.*` (data pegawai), `sdm.kredensial.*` (izin praktik dan RKK), `pengaturan.akun.*` (akun),
  # semuanya dengan cakupan `rs`. NIK disimpan terenkripsi dan ditampilkan tersamar (PRD 11.1): `nik_samaran`
  # (`1271 •••• •••• 0042`) di semua respons. NIK utuh hanya lewat GET /pegawai/{id}?tampilkan_nik=true oleh akun berizin
  # bagian `sdm.pegawai.identitas.lihat` (sensitif: diberikan lewat persetujuan pemilik data, K3), dan setiap pembacaan
  # itu diaudit. NIK tidak pernah ada di URL, query string, log, atau audit.
  # Satu akun = satu pegawai (K5). `tanggal_keluar` = hari pertama pegawai tidak lagi bekerja: mulai tanggal itu akunnya
  # nonaktif dan sesinya diputus (langsung bila tanggalnya sudah tercapai, selain itu tugas harian 00.10 zona RS), audit
  # `akses.akun_dinonaktifkan` dengan alasan pegawai_keluar (9.2.6).
  # Superadmin (PRD 9.2.4, K4): akun yang memegang peran superadmin (penugasan aktif, berlaku atau akan berlaku) tidak bisa
  # dinonaktifkan, diaktifkan, atau dicatat keluar lewat jalur SDM/akun — 409 `superadmin_aktif`; akhiri penugasan
  # superadmin lebih dulu lewat persetujuan superadmin lain. Tugas harian tidak memproses keluar pegawai yang akunnya
  # (sesudah dicatat) memegang superadmin; dicatat audit `sdm.keluar_tertunda_superadmin`.
  # Pemilih unit di form pegawai butuh /unit-organisasi (master_data.organisasi.lihat) dan pemilih kepala unit/ketua KSM
  # butuh /pegawai (sdm.pegawai.lihat): berikan lewat peran yang sama, tidak ada izin silang otomatis.
  # 409/422 bisnis membawa `rincian` `[{kolom, pesan}]` (kolom = isian yang salah), kecuali yang disebut lain; 409 konflik
  # keadaan (`sudah_nonaktif`, `sudah_aktif`, `superadmin_aktif`, `pegawai_keluar`, `sudah_batal`, `pegawai_sudah_punya_akun`)
  # memakai `rincian` kosong — tampilkan `pesan` sebagai banner. Tombol nonaktif/aktif tetap dirender; 409 ditampilkan sebagai pesan.
  # Kode izin bagian (4 segmen, mis. `sdm.pegawai.identitas.lihat`) ikut di `MenuSaya.izin`. Sub-menu SDM → Data pegawai:
  # kode `sdm.pegawai`, rute `/sdm/pegawai`.
  # ---------------------------------------------------------------------------
  /pegawai:
    get:
      operationId: daftarPegawai
      summary: Daftar pegawai (paginasi kursor), terbaru dicatat dulu
      description: |
        Izin: sdm.pegawai.lihat, cakupan `rs`. `cari` cocok sebagian pada nama atau NIP (NIK tidak bisa dicari lewat URL).
        Tidak diurut nama: kursor ada di query string dan tidak boleh memuat data pribadi. Klien menampilkan urutan server
        (terbaru dicatat dulu) dan memakai `cari`/filter; tidak mengurutkan ulang antarhalaman.
        Filter satu nilai; `status` kosong = semua (termasuk keluar); `unit_organisasi_id` = unit itu saja (tanpa subpohon).
        `punya_akun=false` → pegawai yang belum punya akun dan belum keluar (aktif atau akan keluar; pemilih "Buat akun").
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusPegawai' } }
        - { in: query, name: profesi, schema: { $ref: '#/components/schemas/Profesi' } }
        - { in: query, name: unit_organisasi_id, schema: { type: string, format: uuid } }
        - { in: query, name: punya_akun, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman pegawai
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PegawaiRingkas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPegawai
      summary: Tambah pegawai
      description: |
        Izin: sdm.pegawai.input. 409 `nip_sudah_dipakai`; 409 `nik_sudah_dipakai` (dibandingkan lewat sidik; `rincian` tidak
        menyebut pegawai pemegang NIK itu); 422 `unit_tidak_valid`. NIK 16 digit; mengisinya butuh izin bagian
        `sdm.pegawai.identitas.lihat` (403 `akses_ditolak`). Respons tidak memuat `nik` (hanya `nik_samaran`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianPegawai' }
      responses:
        '201':
          description: Pegawai dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PegawaiRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPegawai
      summary: Rincian pegawai (NIK utuh hanya atas permintaan dan dengan izin bagian identitas; diaudit)
      description: |
        Izin: sdm.pegawai.lihat. ETag = `versi`. `tampilkan_nik=true` (tombol "Tampilkan" di layar): field `nik` ikut dikirim
        bila akun punya izin `sdm.pegawai.identitas.lihat` (selain itu 403 `akses_ditolak`), dan audit `sdm.nik_dilihat`
        dicatat (tanpa NIK). Tanpa parameter itu `nik` tidak pernah dikirim; NIK yang belum diisi = field `nik` tidak ada.
        Respons `Cache-Control: no-store`.
      parameters:
        - { in: query, name: tampilkan_nik, schema: { type: boolean } }
      responses:
        '200':
          description: Rincian pegawai
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PegawaiRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahPegawai
      summary: Ubah data pegawai, termasuk pencatatan keluar
      description: |
        Izin: sdm.pegawai.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`. Mengubah `nik` butuh
        izin `sdm.pegawai.identitas.lihat` (403 `akses_ditolak`). 409 `nip_sudah_dipakai`, `nik_sudah_dipakai`. Respons tidak
        memuat `nik` (hanya `nik_samaran`).
        - 409 `superadmin_aktif`: mencatat `tanggal_keluar` untuk pegawai yang akunnya memegang superadmin (lihat aturan di atas).
        - `tanggal_keluar` (hari pertama tidak bekerja; + `alasan_keluar` wajib): akun pegawai itu nonaktif dan sesinya diputus
          mulai tanggal itu; tanggal lampau/hari ini = langsung. `tanggal_keluar: null` membatalkan rencana keluar; akun yang sudah nonaktif tidak aktif
          otomatis (aktifkan lewat /akun/{id}/aktifkan).
        - Pegawai yang menjadi kepala unit / ketua KSM tetap tercatat; layar menandai bila ia sudah keluar.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                nip: { type: [string, 'null'], maxLength: 30 }
                nik: { type: [string, 'null'], pattern: '^[0-9]{16}$' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                jenis_kepegawaian: { type: [string, 'null'], maxLength: 50 }
                profesi: { $ref: '#/components/schemas/Profesi' }
                unit_organisasi_id: { type: [string, 'null'], format: uuid }
                jabatan: { type: [string, 'null'], maxLength: 150 }
                tmt: { type: [string, 'null'], format: date }
                tanggal_keluar: { type: [string, 'null'], format: date }
                alasan_keluar: { type: [string, 'null'], minLength: 5, maxLength: 500 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Pegawai sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PegawaiRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/izin-praktik:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: daftarIzinPraktik
      summary: Izin praktik pegawai (STR/SIP/SIK/SPK), terbaru dulu
      description: "Izin: sdm.kredensial.lihat, cakupan `rs`."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman izin praktik
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IzinPraktik' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatIzinPraktik
      summary: Catat izin praktik beserta dokumennya
      description: |
        Izin: sdm.kredensial.input. Dokumen opsional PDF/JPEG/PNG paling besar 5 MB, disimpan privat; tidak bisa ditambahkan
        sesudah dicatat (batalkan lalu catat ulang dengan dokumen). `berlaku_sampai` tidak dikirim atau string kosong = kosong;
        kosong untuk jenis selain STR → 422 `tanggal_tidak_valid`. `terbit` di masa depan → status `belum_berlaku`. Data tidak diubah setelah dicatat: perbaikan = batalkan lalu catat ulang (riwayat tetap).
        - `berlaku_sampai` kosong hanya untuk STR (seumur hidup); 422 `tanggal_tidak_valid` bila sebelum `terbit`.
        - 409 `izin_ganda`: jenis dan nomor yang sama masih tercatat (belum dibatalkan).
        - 422 `tipe_berkas_tidak_diizinkan` (jenis dari isi berkas), 422 `berkas_terlalu_besar` (> 5 MB; di atas batas server
          web 413), sama dengan unggahan profil RS.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jenis, nomor, terbit]
              properties:
                jenis: { $ref: '#/components/schemas/JenisIzinPraktik' }
                nomor: { type: string, minLength: 3, maxLength: 100 }
                terbit: { type: string, format: date }
                berlaku_sampai: { type: [string, 'null'], format: date }
                berkas: { type: string, contentMediaType: application/octet-stream }
      responses:
        '201':
          description: Izin praktik dicatat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinPraktik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: "Berkas melebihi batas unggah server web" }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/izin-praktik/{izinPraktikId}/batal:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: izinPraktikId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: batalkanIzinPraktik
      summary: Batalkan catatan izin praktik (baris tetap sebagai riwayat)
      description: "Izin: sdm.kredensial.perbaiki. 409 `sudah_batal`; 404 bila bukan milik pegawai ini."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermintaanBatal' }
      responses:
        '200':
          description: Izin praktik sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinPraktik' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/izin-praktik/{izinPraktikId}/dokumen:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: izinPraktikId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: dokumenIzinPraktik
      summary: Unduh dokumen izin praktik
      description: "Izin: sdm.kredensial.lihat. `Content-Disposition: attachment` dengan nama berkas generik `<jenis>-<id>.<ekstensi>` (tanpa nomor izin atau nama pegawai), `X-Content-Type-Options: nosniff`, tidak di-cache. 404 bila tidak ada dokumen."
      responses:
        '200':
          description: Isi dokumen
          content:
            application/pdf: { schema: { type: string, contentMediaType: application/pdf } }
            image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
            image/png: { schema: { type: string, contentMediaType: image/png } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/kewenangan-klinis:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: daftarKewenanganKlinis
      summary: Rincian kewenangan klinis (RKK) pegawai, terbaru dulu
      description: "Izin: sdm.kredensial.lihat, cakupan `rs`."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
      responses:
        '200':
          description: Satu halaman RKK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KewenanganKlinis' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatKewenanganKlinis
      summary: Catat RKK minimal (daftar kode tindakan + masa berlaku)
      description: |
        Izin: sdm.kredensial.input. Kode tindakan diisi RS dari referensi resmi (mis. ICD-9-CM yang dimuat di 1.8e); di 1.8d
        hanya diperiksa bentuknya, tidak ada daftar bawaan. Perbaikan = batalkan lalu catat ulang. 422 `tanggal_tidak_valid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kategori, kode_tindakan, berlaku_dari, berlaku_sampai, komite]
              properties:
                kategori: { type: string, minLength: 2, maxLength: 100 }
                kode_tindakan: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, pattern: '^[0-9A-Za-z.\-]{1,20}$' } }
                berlaku_dari: { type: string, format: date }
                berlaku_sampai: { type: string, format: date }
                komite: { type: string, minLength: 2, maxLength: 150, description: "Komite pemberi rekomendasi, mis. Komite Medik" }
                dasar: { type: [string, 'null'], maxLength: 200, description: "Nomor SK penugasan klinis" }
      responses:
        '201':
          description: RKK dicatat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KewenanganKlinis' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pegawai/{id}/kewenangan-klinis/{kewenanganId}/batal:
