                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatTempatTidur
      summary: Tambah TT di sebuah kamar (sekaligus node lokasi jenis tempat_tidur di bawah ruangnya)
      description: |
        Izin: master_data.organisasi.input. Sesudah instalasi siap melayani hanya TT `ekstra` (darurat lonjakan, tetap
        tercatat); lainnya 409 `harus_lewat_usulan` (1.8c). Kode TT = `kode_lengkap` ruang + "-" + `kode`; 409 `kode_sudah_dipakai` bila kode
        itu pernah dipakai TT mana pun (termasuk yang ditutup) atau lokasi lain. 422 `kamar_tidak_valid` (ruangnya tidak
        aktif atau bangsalnya nonaktif), 422 `kelas_rawat_tidak_valid`; 422 `tanggal_tidak_valid` (`berlaku_dari` sebelum hari ini).
        Bila TT aktif melebihi kapasitas maksimum kamar: tetap dibuat, `peringatan` berisi `melebihi_kapasitas`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianTempatTidur' }
      responses:
        '201':
          description: TT dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, peringatan]
                properties:
                  data: { $ref: '#/components/schemas/TempatTidur' }
                  peringatan: { type: array, items: { type: string, enum: [melebihi_kapasitas] } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
