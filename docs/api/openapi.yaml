openapi: 3.1.0
info:
  title: Karsitara SIMRS API
  version: 0.3.0
  description: |
    Kontrak API untuk alur kerja per halaman (PRD D.5). Kebutuhan dan aturan tetap di docs/prd.md;
    berkas ini hanya bentuk permintaan/respons. Frontend membuat data tiruan dari berkas ini,
    backend wajib lulus uji kontrak terhadapnya. Perubahan kontrak lewat PR yang mengubah berkas ini.
    Konvensi: PRD 10.3.1 (prefiks /api/v1, kata benda Indonesia, kunci snake_case, satu format error `{"error": {kode, pesan, rincian}}`).
    Endpoint autentikasi dan MFA: PRD 10.3.2 (belum dipindah ke berkas ini; bentuk `pengguna` di respons masuk = skema Saya).
    Kode error umum: belum_masuk (401), akses_ditolak (403), csrf_tidak_valid (403), tidak_ditemukan (404),
    validasi_gagal (422), ukuran_halaman_melebihi_batas (422), kursor_tidak_valid (422), versi_berubah (412),
    if_match_wajib (428), terlalu_banyak_permintaan (429). Sesi berakhir (401): sesi_kedaluwarsa, sesi_dicabut (ADR 0002).
    v0.2.0: Pengaturan Sistem → Peran & Izin, Akun & Akses (tiket 1.2c); kode menu data_induk.peran/akun → pengaturan.peran/akun.
    v0.2.1: istilah umum (tiket 1.0g, PRD 10.3.3): skema dan kunci respons `error`, field menu `jumlah_tugas`,
    kode menu `master_data`.
    v0.2.2: penyelarasan 1.2c-be: 409 `butuh_persetujuan` pada penugasan peran berizin sensitif, 409 `peran_bawaan_terkunci`
    saat mengakhiri penugasan superadmin, 403 `akun_superadmin` pada semua perubahan /akun/{id}/* atas akun superadmin oleh
    bukan superadmin (PRD 9.2.4), AkunRinci.dapat_diubah/alasan_terkunci, bentuk `rincian` error matriks, arti `versi` peran.
    v0.2.3: GET /saya pindah ke berkas ini (tiket 1.2e, Beranda): peran berlaku, masuk sebelumnya; email tidak dikirim.
    v0.3.0: Profil RS, unit organisasi, KSM (tiket 1.8a): /profil-rs (publik terbatas + `rinci` sesuai izin, berkas
    identitas), /unit-organisasi, /ksm; cakupan penugasan `unit` didukung (Penugasan.cakupan_label).
servers:
  - url: /api/v1
security:
  - sesiCookie: []
paths:
  /saya:
    get:
      operationId: saya
      summary: Akun yang sedang masuk, untuk header dan Beranda (salam, peran, keamanan akun)
      description: |
        Bentuk `data` sama dengan `pengguna` di respons masuk (PRD 10.3.2). Tidak mengirim email, NIP, atau
        data rahasia (tidak dipakai layar). Tanda instalasi demo (FR-54-10) milik instalasi, bukan akun, dan
        dibutuhkan juga di halaman masuk: dikirim GET /profil-rs publik (tiket 1.8a), bukan di sini.
        401: `belum_masuk` (tanpa sesi, atau langkah MFA belum lolos), `sesi_kedaluwarsa` (melewati batas diam),
        `sesi_dicabut` (akun dinonaktifkan, MFA direset, atau wajib MFA baru; ADR 0002).
      responses:
        '200':
          description: Akun yang sedang masuk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Saya' }
              example:
                data:
                  id: 01a12988-9987-7242-838c-4302517cfdae
                  nama_pengguna: contoh.dokter
                  login_terakhir_pada: "2026-10-11T07:02:11+00:00"
                  mfa_aktif: false
                  pegawai: { id: 01a12988-9981-7000-8000-000000000001, nama: Contoh Dokter }
                  peran: [{ id: 01a12988-996f-723e-8a2c-fdff428f4a96, nama: Contoh Dokter }]
                  masuk_sebelumnya_pada: "2026-10-10T23:48:02+00:00"
                  masuk_sebelumnya_dari_jaringan_rs: true
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /saya/menu:
    get:
      operationId: menuSaya
      summary: Menu efektif akun yang sedang masuk (sidebar) beserta kode izin aksinya
      description: |
        Dihitung server dengan AccessEvaluator (PRD 9.2.5) dan modul aktif (PRD 3.4).
        - Grup/menu/sub-menu yang tidak diizinkan tidak dikirim sama sekali.
        - Menu tampil bila minimal satu bagiannya boleh dilihat.
        - Modul yang belum dibangun/aktif dikirim dengan status "segera" HANYA bila konfigurasi
          `menu.tampilkan_segera_hadir` = true (pengembangan/demo); di produksi tidak dikirim.
        - Respons di-cache per akun (Valkey cache) dan memakai ETag dari `versi`.
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Menu efektif
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuSaya' }
              example:
                data:
                  versi: "c3f1a9"
                  grup:
                    - kode: utama
                      label: null
                      menu:
                        - { kode: beranda, label: Beranda, ikon: beranda, rute: /, status: aktif, fase: 1, sub_menu: [] }
                    - kode: pelayanan
                      label: Pelayanan
                      menu:
                        - kode: igd
                          label: IGD
                          ikon: igd
                          rute: /igd
                          status: segera
                          fase: 2
                          sub_menu:
                            - { kode: igd.papan, label: Papan pasien IGD, rute: /igd/papan, status: segera, fase: 2 }
                    - kode: tata_kelola
                      label: Tata Kelola
                      menu:
                        - kode: pengaturan
                          label: Pengaturan Sistem
                          ikon: pengaturan
                          rute: /pengaturan
                          status: aktif
                          fase: 1
                          sub_menu:
                            - { kode: pengaturan.peran, label: Peran & izin, rute: /pengaturan/peran, status: aktif, fase: 1 }
                            - { kode: pengaturan.akun, label: Akun & akses, rute: /pengaturan/akun, status: aktif, fase: 1 }
                  izin:
                    - pengaturan.peran.lihat
                    - pengaturan.akun.lihat
        '304': { description: Tidak berubah sejak versi di If-None-Match }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Pengaturan Sistem → Peran & Izin, Akun & Akses (tiket 1.2c; PRD 9.2–9.3, 10.3.2)
  # Izin: pengaturan.peran.{lihat,input,perbaiki}, pengaturan.akun.{lihat,input,perbaiki}.
  # Semua perubahan: audit catat() di akhir transaksi dengan sebelum/sesudah dan dasar;
  # cache menu efektif akun terdampak dihapus (versi /saya/menu berubah).
  # ---------------------------------------------------------------------------
  /menu:
    get:
      operationId: pohonMenu
      summary: Pohon menu lengkap beserta izin aksi per node, untuk matriks peran dan pilihan pengecualian per akun
      description: |
        Izin: pengaturan.peran.lihat ATAU pengaturan.akun.lihat. Memuat semua node `aktif` (termasuk modul
        yang belum tersedia, agar peran bisa disiapkan sebelum modulnya dinyalakan). Grup tidak punya izin.
      responses:
        '200':
          description: Pohon menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PohonMenu' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /peran:
    get:
      operationId: daftarPeran
      summary: Daftar peran (paginasi kursor PRD 14.1.1)
      description: "Izin: pengaturan.peran.lihat."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
      responses:
        '200':
          description: Satu halaman peran
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PeranRingkas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPeran
      summary: Buat peran baru, kosong atau salinan peran lain
      description: |
        Izin: pengaturan.peran.input. `salin_dari_id` menyalin izin peran sumber KECUALI izin sensitif
        (pemberiannya butuh persetujuan, tiket 1.2d). Peran baru berstatus aktif tanpa penugasan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, wajib_mfa, dasar_perubahan]
              properties:
                kode: { type: string, pattern: '^[a-z][a-z0-9_]{1,49}$' }
                nama: { type: string, minLength: 3, maxLength: 100 }
                uraian: { type: [string, 'null'], maxLength: 500 }
                wajib_mfa: { type: boolean }
                salin_dari_id: { type: [string, 'null'], format: uuid }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Peran dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: "kode_sudah_dipakai", $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /peran/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPeran
      summary: Rincian peran beserta kode izin yang diberikannya
      description: "Izin: pengaturan.peran.lihat. ETag = `versi` (dipakai If-Match saat mengubah)."
      responses:
        '200':
          description: Rincian peran
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahPeran
      summary: Ubah nama, uraian, wajib MFA, atau status peran
      description: |
        Izin: pengaturan.peran.perbaiki. Wajib If-Match.
        - `wajib_mfa: false` ditolak (422 `mfa_tidak_bisa_dimatikan`) untuk superadmin dan peran yang memuat izin sensitif.
        - Peran bawaan sistem tidak bisa dinonaktifkan (409 `peran_bawaan_terkunci`).
        - Penyunting tidak bisa mengubah peran yang sedang ia pegang (403 `peran_sendiri`).
        - Menonaktifkan peran yang masih punya penugasan aktif ditolak (409 `peran_masih_dipakai`) dan menyebut jumlahnya.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                nama: { type: string, minLength: 3, maxLength: 100 }
                uraian: { type: [string, 'null'], maxLength: 500 }
                wajib_mfa: { type: boolean }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Peran sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PeranRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { description: "versi_berubah: peran diubah orang lain sejak dibuka", $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { description: "if_match_wajib", $ref: '#/components/responses/Error' }
  /peran/{id}/izin:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: gantiIzinPeran
      summary: Ganti seluruh himpunan izin peran (simpan matriks)
      description: |
        Izin: pengaturan.peran.perbaiki. Wajib If-Match. Server menurunkan `peran_menu` dari izin `lihat`.
        Validasi (422, `rincian` = daftar `{kolom: "izin", kode, pesan}` untuk setiap kode yang salah):
        - `izin_tidak_dikenal`: kode tidak ada di akses.izin.
        - `lihat_wajib`: aksi apa pun pada node tanpa izin `<node>.lihat`.
        - `induk_belum_diberikan`: izin pada bagian tanpa `lihat` pada sub-menu induknya (MD-3).
        Penolakan lain:
        - 409 `butuh_persetujuan`: menambah izin sensitif. Alur persetujuan pemilik data di tiket 1.2d; sampai itu
          ditolak utuh (tidak ada yang disimpan sebagian). `rincian` = `{kode, pesan}` per izin sensitif baru.
        - 409 `peran_bawaan_terkunci`: isi peran superadmin tidak bisa diubah dari layar.
        - 403 `peran_sendiri`.
        Respons memuat ringkasan perubahan untuk audit dan toast.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [izin, dasar_perubahan]
              properties:
                izin: { type: array, maxItems: 5000, uniqueItems: true, items: { type: string } }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
                alasan: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Izin tersimpan
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data, perubahan]
                properties:
                  data: { $ref: '#/components/schemas/PeranRinci' }
                  perubahan:
                    type: object
                    required: [ditambah, dicabut, akun_terdampak]
                    properties:
                      ditambah: { type: array, items: { type: string } }
                      dicabut: { type: array, items: { type: string } }
                      akun_terdampak: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /akun:
    get:
      operationId: daftarAkun
      summary: Daftar akun (paginasi kursor PRD 14.1.1)
      description: "Izin: pengaturan.akun.lihat. Tidak mengirim NIP, email, atau data rahasia."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada nama pengguna atau nama pegawai" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif, terkunci] } }
        - { in: query, name: peran_id, schema: { type: string, format: uuid } }
        - { in: query, name: mfa, schema: { type: string, enum: [aktif, belum] } }
      responses:
        '200':
          description: Satu halaman akun
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AkunRingkas' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciAkun
      summary: Rincian akun, penugasan, pengecualian per akun (termasuk riwayat batal), dan status MFA
      description: "Izin: pengaturan.akun.lihat."
      responses:
        '200':
          description: Rincian akun
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AkunRinci' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /akun/{id}/menu:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: menuAkun
      summary: Lihat sebagai — menu efektif dan izin akun lain, dihitung AccessEvaluator yang sama dengan /saya/menu
      description: |
        Izin: pengaturan.akun.lihat. Bentuk respons = MenuSaya. Hanya pratinjau: tidak membuat sesi atas nama akun itu.
        Status "segera" mengikuti aturan yang sama dengan /saya/menu. Audit `akses.lihat_sebagai`.
      responses:
        '200':
          description: Menu efektif akun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuSaya' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # Semua perubahan /akun/{id}/* (penugasan, izin khusus, wajib MFA, reset MFA): 403 `diri_sendiri` untuk akun sendiri,
  # 403 `akun_superadmin` bila akun memegang peran superadmin dan penyunting bukan superadmin (PRD 9.2.4).
  /akun/{id}/penugasan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tugaskanPeran
      summary: Tugaskan peran ke akun dengan cakupan, masa berlaku, dan dasar pemberian (FR-09-04)
      description: |
        Izin: pengaturan.akun.input.
        - 403 `diri_sendiri`: tidak bisa menugaskan peran ke akun sendiri (PRD 9.2.4).
        - 409 `peran_bawaan_terkunci`: peran superadmin hanya lewat konsol sampai tiket 1.2d (persetujuan superadmin lain).
        - 409 `peran_nonaktif`, 409 `penugasan_ganda` (peran dan cakupan yang sama masih aktif).
        - 409 `butuh_persetujuan`: peran memuat izin sensitif (PRD 9.2.4; alur persetujuan di tiket 1.2d).
        - 422 `cakupan_belum_didukung`: selain `rs` dan `unit` (unit sejak tiket 1.8a) menunggu data lokasi/KSM/depo dan relasi perawatan.
        - 422 `cakupan_tidak_valid`: `unit` tanpa `cakupan_id`, unit tidak ada, atau unit nonaktif; `rs` dengan `cakupan_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peran_id, cakupan_jenis, dasar_pemberian]
              properties:
                peran_id: { type: string, format: uuid }
                cakupan_jenis: { $ref: '#/components/schemas/CakupanJenis' }
                cakupan_id: { type: [string, 'null'], format: uuid }
                berlaku_dari: { type: [string, 'null'], format: date-time, description: "Kosong = sekarang (jam aplikasi)" }
                berlaku_sampai: { type: [string, 'null'], format: date-time }
                dasar_pemberian: { $ref: '#/components/schemas/Dasar' }
                alasan: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Penugasan dibuat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Penugasan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/penugasan/{penugasanId}/batal:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: penugasanId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: batalkanPenugasan
      summary: Akhiri penugasan (status batal; baris tidak dihapus)
      description: |
        Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`; 409 `sudah_batal`; 409 `peran_bawaan_terkunci`
        (penugasan superadmin diakhiri dengan persetujuan superadmin lain, tiket 1.2d); 404 bila penugasan bukan milik akun ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermintaanBatal' }
      responses:
        '200':
          description: Penugasan sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Penugasan' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/izin-khusus:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: buatIzinKhusus
      summary: Tambah atau cabut sub-menu, bagian, atau aksi untuk satu akun (FR-09-13; cabut selalu menang)
      description: |
        Izin: pengaturan.akun.input. Sasaran ditulis dengan kode: kode menu (sub-menu/bagian) ATAU kode izin aksi.
        - 403 `diri_sendiri`.
        - 409 `butuh_persetujuan`: `tambah` atas izin sensitif (tiket 1.2d).
        - 422 `berlaku_sampai_wajib`: menambah (`tambah`) izin sensitif tanpa batas waktu (PRD 9.2.3). Sasaran `menu`
          tidak dianggap sensitif (lapis 4 label sensitivitas di tiket 1.5); mencabut tidak butuh batas waktu.
        - 422 `sasaran_tidak_dikenal`, 409 `pengecualian_ganda` (sasaran dan efek yang sama masih aktif).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [efek, sasaran_jenis, sasaran_kode, dasar_pemberian, alasan]
              properties:
                efek: { type: string, enum: [tambah, cabut] }
                sasaran_jenis: { type: string, enum: [menu, izin] }
                sasaran_kode: { type: string, examples: [kasir.tutup, kasir.tagihan.batal] }
                berlaku_sampai: { type: [string, 'null'], format: date-time }
                dasar_pemberian: { $ref: '#/components/schemas/Dasar' }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201':
          description: Pengecualian dibuat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinKhusus' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/izin-khusus/{izinKhususId}/batal:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: path, name: izinKhususId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: batalkanIzinKhusus
      summary: Akhiri pengecualian per akun (MD-1; bukan hapus)
      description: "Izin: pengaturan.akun.perbaiki. 403 `diri_sendiri`; 409 `sudah_batal`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermintaanBatal' }
      responses:
        '200':
          description: Pengecualian sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinKhusus' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/wajib-mfa:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: aturWajibMfaAkun
      summary: Nyalakan atau matikan kewajiban MFA tingkat akun
      description: |
        Izin: pengaturan.akun.perbaiki. Hanya mengubah `akses.pengguna.wajib_mfa`; kewajiban dari peran, izin
        sensitif, dan akses luar jaringan RS tetap berlaku (lihat `mfa.sumber_wajib` di respons).
        Menyalakan untuk akun yang belum punya MFA memutus sesi berjalannya: masuk berikutnya harus mendaftar MFA
        dari jaringan RS. 403 `diri_sendiri`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wajib_mfa, alasan]
              properties:
                wajib_mfa: { type: boolean }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Status MFA sesudah diubah
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/mfa/reset:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetMfaAkun
      summary: Reset MFA akun (autentikator hilang/ganti ponsel)
      description: |
        Izin: pengaturan.akun.perbaiki. Mengosongkan rahasia TOTP dan mfa_aktif_pada, membatalkan semua kode
        cadangan, dan memutus semua sesi akun itu. Akun mendaftar ulang saat masuk berikutnya, hanya dari jaringan
        RS (PRD 10.3.2). Audit `akses.mfa_direset` dengan alasan dan dasar, tanpa rahasia.
        403 `diri_sendiri`; 409 `mfa_belum_aktif`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Status MFA sesudah direset
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Profil RS, unit organisasi, KSM (tiket 1.8a; PRD 3.4, FR-54-08 langkah 2–3, 11.2 inti.profil_rs, unit_organisasi, ksm)
  # Izin: pengaturan.profil_rs.{lihat,perbaiki}; master_data.organisasi.{lihat,input,perbaiki} untuk unit dan KSM.
  # Tidak ada DELETE: unit dan KSM dinonaktifkan lewat status. Perubahan: audit catat() dengan sebelum/sesudah.
  # ---------------------------------------------------------------------------
  /profil-rs:
    get:
      operationId: profilRs
      summary: Profil dan paket identitas RS; publik terbatas untuk halaman masuk, lengkap bagi pemegang izin
      description: |
        Tanpa sesi boleh (halaman masuk, pita DEMO di setiap layar). Bagian `rinci` hanya dikirim bila pemanggil
        sudah masuk dan punya izin pengaturan.profil_rs.lihat (data yang tidak diizinkan tidak dikirim server).
        Respons di-cache publik singkat dan memakai ETag dari `versi`; instalasi kosong (belum disiapkan) tetap 200
        dengan nilai kosong dan `paket_identitas` bawaan produk.
      security: [{}, { sesiCookie: [] }]
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Profil RS
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProfilRs' }
        '304': { description: Tidak berubah sejak versi di If-None-Match }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: ubahProfilRs
      summary: Ubah profil RS dan warna paket identitas (FR-54-08 langkah 2)
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi`). Ganti utuh isian di bawah; berkas gambar lewat
        PUT /profil-rs/berkas/{jenis}.
        Kontras warna (FR-54-08 langkah 2), 422 `kontras_kurang` dengan `rincian` = `{kolom, rasio, minimal, pesan}`,
        `kolom` = `warna.brand` atau `warna.accent`, `rasio` dibulatkan 2 desimal:
        - `warna.brand` dipakai sebagai teks/tautan di latar putih dan latar tombol bertulisan putih: kontras dengan
          putih ≥ 4,5:1.
        - `warna.accent` dipakai hanya sebagai isian (garis penanda, badge, aksen; PRD 5.3.2 aturan 2): teks di atas
          isian itu (hitam `#1D1D1B` atau putih, mana yang lebih kontras) ≥ 3:1. Interpretasi "isian < 3:1"
          FR-54-08; perlu konfirmasi pemilik produk.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianProfilRs' }
      responses:
        '200':
          description: Profil sesudah diubah (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /profil-rs/berkas/{jenis}:
    parameters:
      - in: path
        name: jenis
        required: true
        schema: { type: string, enum: [logo, motif, foto] }
    get:
      operationId: berkasProfilRs
      summary: Berkas gambar paket identitas (publik, untuk halaman masuk dan kop layar)
      description: |
        Tanpa sesi boleh. Dikirim dari object storage (MinIO) dengan Content-Type hasil pemeriksaan saat unggah,
        `X-Content-Type-Options: nosniff`, dan untuk SVG `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'`.
        URL di ProfilRs memuat versi berkas, jadi boleh di-cache lama. 404 bila belum diunggah.
      security: [{}]
      responses:
        '200':
          description: Isi berkas
          content:
            image/svg+xml: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: unggahBerkasProfilRs
      summary: Unggah atau ganti logo, motif, atau foto gedung
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi` profil). multipart/form-data, satu berkas `berkas`.
        Tipe diperiksa dari isi berkas, bukan nama atau Content-Type kiriman (422 `tipe_berkas_tidak_diizinkan`):
        logo dan motif: SVG atau PNG; foto: WebP, JPEG, atau PNG. Batas ukuran per jenis di konfigurasi
        (bawaan logo 200 KB, motif 500 KB, foto 2 MB; 422 `berkas_terlalu_besar`). SVG berisi skrip, handler
        `on*`, `foreignObject`, atau rujukan eksternal ditolak (422 `berkas_tidak_aman`). Berkas lama tetap
        tersimpan (tidak dihapus); profil menunjuk berkas baru. Mengosongkan berkas (kembali tanpa logo/motif/foto)
        tidak tersedia di fase 1; ganti dengan berkas lain.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, format: binary }
      responses:
        '200':
          description: Profil sesudah berkas diganti (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /unit-organisasi:
    get:
      operationId: daftarUnitOrganisasi
      summary: Daftar unit organisasi (paginasi kursor), per induk untuk pohon yang dimuat bertahap
      description: |
        Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input (pemilih cakupan unit di dialog Tugaskan peran),
        kecuali `milik_saya=true`.
        - `induk_id` kosong + `akar=true` → unit tingkat teratas; `induk_id=<id>` → anak langsung unit itu.
          Tiap baris membawa `jumlah_anak` agar pohon tahu node mana yang bisa dibuka.
        - `milik_saya=true` → unit dari penugasan akun yang sedang masuk ber-cakupan `unit` yang berlaku
          (pemilih unit kerja di header); boleh untuk semua akun yang masuk, filter lain diabaikan. Pemilih unit kerja
          hanya konteks tampilan di klien (mis. filter bawaan daftar); tidak mengubah izin, dan server tetap memaksa
          cakupan dari penugasan pada setiap permintaan.
        Urut: kode.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: induk_id, schema: { type: string, format: uuid } }
        - { in: query, name: akar, schema: { type: boolean } }
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama (seluruh pohon)" }
        - { in: query, name: jenis, schema: { $ref: '#/components/schemas/JenisUnit' } }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
        - { in: query, name: milik_saya, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman unit
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UnitOrganisasi' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatUnitOrganisasi
      summary: Tambah unit organisasi
      description: |
        Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai` (kode unik di seluruh RS);
        422 `induk_tidak_aktif` bila induk nonaktif.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianUnitOrganisasi' }
      responses:
        '201':
          description: Unit dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /unit-organisasi/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciUnitOrganisasi
      summary: Rincian unit beserta jalur induknya
      description: "Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input. ETag = `versi`."
      responses:
        '200':
          description: Rincian unit
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahUnitOrganisasi
      summary: Ubah, pindah induk, atau nonaktifkan unit
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        - 422 `siklus`: induk baru adalah unit itu sendiri atau turunannya.
        - 409 `unit_masih_dipakai`: menonaktifkan unit yang masih punya anak aktif atau penugasan ber-cakupan unit itu
          yang berlaku; `rincian` = `{jumlah_anak_aktif, jumlah_penugasan}`.
        - 409 `kode_sudah_dipakai`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                induk_id: { type: [string, 'null'], format: uuid }
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                jenis: { $ref: '#/components/schemas/JenisUnit' }
                status: { type: string, enum: [aktif, nonaktif] }
                berlaku_dari: { type: string, format: date }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Unit sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /ksm:
    get:
      operationId: daftarKsm
      summary: Daftar Kelompok Staf Medis (paginasi kursor)
      description: "Izin: master_data.organisasi.lihat. Urut: kode."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
      responses:
        '200':
          description: Satu halaman KSM
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Ksm' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatKsm
      summary: Tambah KSM
      description: "Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, dasar_perubahan]
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: KSM dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /ksm/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciKsm
      summary: Rincian KSM
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian KSM
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahKsm
      summary: Ubah atau nonaktifkan KSM
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        409 `kode_sudah_dipakai`; 409 `ksm_masih_dipakai` bila dinonaktifkan selagi ada penugasan ber-cakupan KSM itu yang berlaku.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: KSM sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Kursor:
      in: query
      name: kursor
      required: false
      schema: { type: string }
      description: "Kursor buram dari meta.kursor_berikutnya"
    Batas:
      in: query
      name: batas
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: "Di atas 200 → 422 ukuran_halaman_melebihi_batas"
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
      description: "ETag/versi dari GET terakhir; tidak cocok → 412 versi_berubah, tidak ada → 428 if_match_wajib"
  securitySchemes:
    sesiCookie:
      type: apiKey
      in: cookie
      name: karsitara_session
      description: Cookie sesi Sanctum stateful (PRD 10.3.2); nama cookie mengikuti konfigurasi.
  responses:
    Error:
      description: Error format tunggal (PRD 10.3.1)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kode, pesan]
          properties:
            kode: { type: string, examples: [belum_masuk] }
            pesan: { type: string }
            rincian:
              type: array
              items: { type: object, additionalProperties: true }
    Saya:
      type: object
      required: [id, nama_pengguna, login_terakhir_pada, mfa_aktif, pegawai, peran, masuk_sebelumnya_pada, masuk_sebelumnya_dari_jaringan_rs]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        login_terakhir_pada: { type: [string, 'null'], format: date-time, description: "Masuk yang memulai sesi ini" }
        mfa_aktif: { type: boolean }
        pegawai:
          type: [object, 'null']
          required: [id, nama]
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
        peran:
          type: array
          description: "Peran berstatus aktif dengan penugasan yang berlaku sekarang, tanpa duplikat, urut nama. Kosong = belum ada modul yang diberikan."
          items:
            type: object
            required: [id, nama]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
        masuk_sebelumnya_pada:
          type: [string, 'null']
          format: date-time
          description: "Masuk berhasil terakhir selain sesi ini (\"apakah ini Anda?\"): masuk lain sesudah sesi ini dimulai bila ada, kalau tidak masuk sebelum sesi ini. null = tidak ada catatan: masuk pertama, atau sesi dimulai sebelum fitur ini ada."
        masuk_sebelumnya_dari_jaringan_rs:
          type: [boolean, 'null']
          description: "Apakah masuk sebelumnya dari jaringan RS (AUTENTIKASI_MFA_JARINGAN_RS). null = tidak diketahui: masuk pertama, atau masuk sebelumnya terjadi sebelum fitur ini ada."
    WarnaHex:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#006937']
    KodeData:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9._-]{0,29}$'
      description: "Kode singkat huruf besar/angka, mis. IRNA, IGD-01"
    ProfilRs:
      type: object
      required: [versi, nama, singkatan, paket_identitas, kontak_admin, instalasi_demo]
      properties:
        versi: { type: string, description: "Sama dengan ETag; berubah setiap profil atau berkas diganti" }
        nama: { type: [string, 'null'], description: "Nama resmi RS; null = belum disiapkan (kartu RS tidak tampil)" }
        singkatan: { type: [string, 'null'], examples: ['RS USU'] }
        paket_identitas:
          type: object
          required: [warna, logo_url, motif_url, foto_url]
          properties:
            warna:
              type: object
              required: [brand, accent]
              description: "Dasar token --brand-600 dan --accent (PRD 5.3); turunan warna dihitung frontend. Bawaan = paket produk."
              properties:
                brand: { $ref: '#/components/schemas/WarnaHex' }
                accent: { $ref: '#/components/schemas/WarnaHex' }
            logo_url: { type: [string, 'null'], description: "Path relatif ke GET /profil-rs/berkas/logo dengan versi berkas; null = belum ada" }
            motif_url: { type: [string, 'null'], description: "Hanya untuk halaman masuk, layar tunggu, dan cetak (PRD 5.3.2 aturan 4)" }
            foto_url: { type: [string, 'null'] }
        kontak_admin:
          type: object
          required: [unit, kontak]
          description: "Untuk teks halaman masuk dan Beranda (lupa sandi, akun terkunci, 'Bukan Anda?')"
          properties:
            unit: { type: string, description: "Bawaan \"admin SIMRS\"" }
            kontak: { type: [string, 'null'], examples: ['ext. 1234'] }
        instalasi_demo:
          type: boolean
          description: "Instalasi demo/pelatihan berisi data sintetis (FR-54-10): pita \"DEMO — data fiktif\" di setiap layar, termasuk halaman masuk. Ditetapkan saat pemasangan di server, tidak bisa diubah dari layar."
        rinci:
          type: object
          description: "Hanya untuk pemegang izin pengaturan.profil_rs.lihat; tidak dikirim tanpa sesi atau tanpa izin."
          required: [kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, status_penyiapan, diubah_pada]
          properties:
            kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
            kelas: { type: [string, 'null'], enum: [A, B, C, D, null] }
            status_blu: { type: [boolean, 'null'] }
            kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
            alamat: { type: [string, 'null'], maxLength: 500 }
            status_penyiapan: { type: string, enum: [belum, sebagian, selesai], description: "Langkah 2 wizard (FR-54-08); rinci per langkah di tiket 1.8f" }
            diubah_pada: { type: [string, 'null'], format: date-time }
    IsianProfilRs:
      type: object
      required: [nama, singkatan, kode_kemenkes, kelas, status_blu, kode_ppk_bpjs, alamat, warna, kontak_admin, dasar_perubahan]
      properties:
        nama: { type: string, minLength: 3, maxLength: 200 }
        singkatan: { type: [string, 'null'], maxLength: 30 }
        kode_kemenkes: { type: [string, 'null'], maxLength: 20 }
        kelas: { type: [string, 'null'], enum: [A, B, C, D, null] }
        status_blu: { type: [boolean, 'null'] }
        kode_ppk_bpjs: { type: [string, 'null'], maxLength: 20 }
        alamat: { type: [string, 'null'], maxLength: 500 }
        warna:
          type: object
          required: [brand, accent]
          properties:
            brand: { $ref: '#/components/schemas/WarnaHex' }
            accent: { $ref: '#/components/schemas/WarnaHex' }
        kontak_admin:
          type: object
          required: [unit, kontak]
          properties:
            unit: { type: string, minLength: 2, maxLength: 100 }
            kontak: { type: [string, 'null'], maxLength: 100 }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    JenisUnit:
      type: string
      enum: [instalasi, bidang, bagian, ruang, poli, depo]
      description: "PRD 11.2 inti.unit_organisasi.jenis"
    UnitOrganisasi:
      type: object
      required: [id, induk_id, kode, nama, jenis, status, berlaku_dari, kepala, jumlah_anak, jalur, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        induk_id: { type: [string, 'null'], format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        status: { type: string, enum: [aktif, nonaktif] }
        berlaku_dari: { type: string, format: date }
        kepala: { $ref: '#/components/schemas/Pelaku', description: "Kepala unit dari data pegawai; null sampai tiket 1.8d" }
        jumlah_anak: { type: integer, minimum: 0, description: "Anak langsung (aktif dan nonaktif)" }
        jalur:
          type: array
          description: "Induk dari akar sampai induk langsung, untuk breadcrumb"
          items:
            type: object
            required: [id, kode, nama]
            properties:
              id: { type: string, format: uuid }
              kode: { type: string }
              nama: { type: string }
        versi: { type: string, description: "Sama dengan ETag" }
        diubah_pada: { type: string, format: date-time }
    IsianUnitOrganisasi:
      type: object
      required: [induk_id, kode, nama, jenis, dasar_perubahan]
      properties:
        induk_id: { type: [string, 'null'], format: uuid, description: "null = unit tingkat teratas" }
        kode: { $ref: '#/components/schemas/KodeData' }
        nama: { type: string, minLength: 2, maxLength: 150 }
        jenis: { $ref: '#/components/schemas/JenisUnit' }
        berlaku_dari: { type: [string, 'null'], format: date, description: "Kosong = hari ini (zona waktu RS)" }
        dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
    Ksm:
      type: object
      required: [id, kode, nama, status, ketua, versi, diubah_pada]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
        ketua: { $ref: '#/components/schemas/Pelaku', description: "Ketua KSM dari data pegawai; null sampai tiket 1.8d" }
        versi: { type: string }
        diubah_pada: { type: string, format: date-time }
    StatusMenu:
      type: string
      enum: [aktif, segera]
      description: "aktif = halaman tersedia; segera = tampil sebagai Segera hadir (hanya pengembangan/demo)"
    SubMenu:
      type: object
      required: [kode, label, rute, status, fase]
      properties:
        kode: { type: string, description: "kode stabil, mis. igd.papan; dipakai rute dan izin" }
        label: { type: string }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6, description: "fase rencana (PRD 16), ditampilkan di SegeraHadirPage" }
    Menu:
      type: object
      required: [kode, label, ikon, rute, status, fase, sub_menu]
      properties:
        kode: { type: string }
        label: { type: string }
        ikon: { type: string, description: "nama ikon dari design-system, bukan URL" }
        rute: { type: string }
        status: { $ref: '#/components/schemas/StatusMenu' }
        fase: { type: integer, minimum: 0, maximum: 6 }
        jumlah_tugas: { type: [integer, 'null'], description: "jumlah tugas terbuka; null bila belum tersedia (tiket 1.7)" }
        sub_menu:
          type: array
          items: { $ref: '#/components/schemas/SubMenu' }
    MenuSaya:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [versi, grup, izin]
          properties:
            versi: { type: string, description: "hash isi menu+izin; berubah saat peran/penugasan/izin berubah" }
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu:
                    type: array
                    items: { $ref: '#/components/schemas/Menu' }
            izin:
              type: array
              description: "kode izin aksi yang dimiliki (format <menu>.<sub_menu>.<aksi>); dipakai v-can/PermissionGate. Server tetap memeriksa ulang setiap permintaan."
              items: { type: string }
    MetaKursor:
      type: object
      required: [kursor_berikutnya]
      description: "Bentuk dari App\\Core\\Http\\Paginasi::respons (tiket 1.0e)"
      properties:
        kursor_berikutnya: { type: [string, 'null'], description: "null = halaman terakhir" }
    Dasar:
      type: string
      minLength: 3
      maxLength: 200
      description: "Nomor SK, surat tugas, memo, atau persetujuan (Permenkes 24/2022 Ps. 30 ayat 1–2; PRD 9.2)"
    CakupanJenis:
      type: string
      enum: [rs, unit, ruang, poli, ksm, depo, pasien_dirawat]
      description: "Diterima: `rs` (cakupan_id kosong) dan `unit` (cakupan_id = unit aktif, tiket 1.8a; unit induk mencakup turunannya). Lainnya 422 cakupan_belum_didukung"
    JenisAksi:
      type: string
      enum: [lihat, input, perbaiki, sahkan, verifikasi, setujui, batal, ekspor, cetak, lihat_rupiah]
    PermintaanBatal:
      type: object
      required: [alasan_batal]
      properties:
        alasan_batal: { type: string, minLength: 5, maxLength: 500 }
    Pelaku:
      type: [object, 'null']
      description: "null = konsol/sistem"
      required: [id, nama]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
    NodeMenu:
      type: object
      required: [id, kode, label, tingkat, tersedia, modul_aktif, ikut_induk, izin, anak]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        label: { type: string }
        tingkat: { type: string, enum: [menu, sub_menu, bagian] }
        ikon: { type: [string, 'null'] }
        fase: { type: [integer, 'null'] }
        tersedia: { type: boolean, description: "Halaman sudah dibangun di versi ini" }
        modul_aktif: { type: boolean, description: "Modul dinyalakan di instalasi ini (inti.modul_aktif)" }
        ikut_induk: { type: boolean }
        izin:
          type: array
          items:
            type: object
            required: [kode, jenis_aksi, sensitif]
            properties:
              kode: { type: string }
              jenis_aksi: { $ref: '#/components/schemas/JenisAksi' }
              sensitif: { type: boolean }
        anak:
          type: array
          items: { $ref: '#/components/schemas/NodeMenu' }
    PohonMenu:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [grup]
          properties:
            grup:
              type: array
              items:
                type: object
                required: [kode, label, menu]
                properties:
                  kode: { type: string }
                  label: { type: [string, 'null'] }
                  menu: { type: array, items: { $ref: '#/components/schemas/NodeMenu' } }
    PeranRingkas:
      type: object
      required: [id, kode, nama, uraian, bawaan_sistem, wajib_mfa, status, jumlah_akun, memuat_izin_sensitif]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        uraian: { type: [string, 'null'] }
        bawaan_sistem: { type: boolean }
        wajib_mfa: { type: boolean }
        status: { type: string, enum: [aktif, nonaktif] }
        jumlah_akun: { type: integer, minimum: 0, description: "Akun dengan penugasan berlaku untuk peran ini" }
        memuat_izin_sensitif: { type: boolean }
    PeranRinci:
      allOf:
        - $ref: '#/components/schemas/PeranRingkas'
        - type: object
          required: [versi, izin, wajib_mfa_terkunci, dapat_disunting, alasan_terkunci, diubah_pada]
          properties:
            versi: { type: string, description: "Sama dengan ETag; naik setiap perubahan peran dari layar (PATCH atau PUT izin)" }
            izin: { type: array, items: { type: string }, description: "Kode izin aksi yang diberikan" }
            wajib_mfa_terkunci: { type: boolean, description: "true = superadmin atau memuat izin sensitif; sakelar MFA dinonaktifkan di layar" }
            dapat_disunting: { type: boolean, description: "false bila peran bawaan terkunci atau dipegang penyunting" }
            alasan_terkunci: { type: [string, 'null'], enum: [peran_bawaan_terkunci, peran_sendiri, null] }
            diubah_pada: { type: string, format: date-time }
    StatusMfaAkun:
      type: object
      required: [aktif, aktif_pada, wajib_akun, sumber_wajib, dapat_direset]
      properties:
        aktif: { type: boolean, description: "Autentikator sudah didaftarkan" }
        aktif_pada: { type: [string, 'null'], format: date-time }
        wajib_akun: { type: boolean, description: "Sakelar tingkat akun (akses.pengguna.wajib_mfa)" }
        sumber_wajib:
          type: array
          description: "Alasan MFA wajib di dalam jaringan RS. Kosong = di jaringan RS tidak wajib. Dari luar jaringan RS selalu wajib (tidak dicantumkan di sini)."
          items:
            type: object
            required: [jenis, label, dapat_dimatikan]
            properties:
              jenis: { type: string, enum: [akun, peran, superadmin, izin_sensitif] }
              label: { type: string, examples: ["Peran Superadmin", "Sakelar akun"] }
              dapat_dimatikan: { type: boolean }
        dapat_direset: { type: boolean, description: "false bila MFA belum aktif, akun milik penyunting, atau akun superadmin dan penyunting bukan superadmin" }
    AkunRingkas:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, peran, pengecualian, mfa_aktif]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string, description: "Nama pegawai" }
        status: { type: string, enum: [aktif, nonaktif] }
        terkunci_sampai: { type: [string, 'null'], format: date-time }
        login_terakhir_pada: { type: [string, 'null'], format: date-time }
        peran:
          type: array
          description: "Peran dengan penugasan berlaku"
          items:
            type: object
            required: [id, nama, berlaku_sampai]
            properties:
              id: { type: string, format: uuid }
              nama: { type: string }
              berlaku_sampai: { type: [string, 'null'], format: date-time }
        pengecualian:
          type: object
          required: [tambah, cabut]
          properties:
            tambah: { type: integer, minimum: 0 }
            cabut: { type: integer, minimum: 0 }
        mfa_aktif: { type: boolean }
    Penugasan:
      type: object
      required: [id, peran, cakupan_jenis, cakupan_id, cakupan_label, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        peran:
          type: object
          required: [id, kode, nama]
          properties:
            id: { type: string, format: uuid }
            kode: { type: string }
            nama: { type: string }
        cakupan_jenis: { $ref: '#/components/schemas/CakupanJenis' }
        cakupan_id: { type: [string, 'null'], format: uuid }
        cakupan_label: { type: [string, 'null'], description: "Nama unit untuk cakupan `unit` (dengan kode), null untuk `rs`; tidak perlu permintaan per baris (tiket 1.8a)" }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: [string, 'null'] }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean, description: "aktif dan di dalam masa berlaku saat ini" }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    IzinKhusus:
      type: object
      required: [id, efek, sasaran_jenis, sasaran_kode, sasaran_label, sensitif, berlaku_dari, berlaku_sampai, dasar_pemberian, alasan, diberikan_oleh, status, berlaku_sekarang, alasan_batal, dibatalkan_oleh, dibatalkan_pada, dibuat_pada]
      properties:
        id: { type: string, format: uuid }
        efek: { type: string, enum: [tambah, cabut] }
        sasaran_jenis: { type: string, enum: [menu, izin] }
        sasaran_kode: { type: string }
        sasaran_label: { type: string, description: "Jalur label, mis. Kasir → Tutup kasir, atau Kasir → Tagihan pasien → Batal" }
        sensitif: { type: boolean }
        berlaku_dari: { type: string, format: date-time }
        berlaku_sampai: { type: [string, 'null'], format: date-time }
        dasar_pemberian: { type: string }
        alasan: { type: string }
        diberikan_oleh: { $ref: '#/components/schemas/Pelaku' }
        status: { type: string, enum: [aktif, batal] }
        berlaku_sekarang: { type: boolean }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { $ref: '#/components/schemas/Pelaku' }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
        dibuat_pada: { type: string, format: date-time }
    AkunRinci:
      type: object
      required: [id, nama_pengguna, nama, status, terkunci_sampai, login_terakhir_pada, diri_sendiri, dapat_diubah, alasan_terkunci, mfa, penugasan, izin_khusus]
      properties:
        id: { type: string, format: uuid }
        nama_pengguna: { type: string }
        nama: { type: string }
        status: { type: string, enum: [aktif, nonaktif] }
        terkunci_sampai: { type: [string, 'null'], format: date-time }
        login_terakhir_pada: { type: [string, 'null'], format: date-time }
        diri_sendiri: { type: boolean, description: "true = akun milik penyunting; semua tombol ubah disembunyikan (PRD 9.2.4)" }
        dapat_diubah: { type: boolean, description: "false = semua perubahan /akun/{id}/* oleh penyunting ini akan ditolak 403; tombol ubah tidak dirender" }
        alasan_terkunci: { type: [string, 'null'], enum: [diri_sendiri, akun_superadmin, null], description: "Kode 403 yang akan diterima bila tetap mengubah" }
        mfa: { $ref: '#/components/schemas/StatusMfaAkun' }
        penugasan: { type: array, items: { $ref: '#/components/schemas/Penugasan' }, description: "Berlaku dulu, lalu riwayat (batal/kedaluwarsa) terbaru dulu" }
        izin_khusus: { type: array, items: { $ref: '#/components/schemas/IzinKhusus' } }
