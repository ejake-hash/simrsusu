          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/KelasRawat' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /kelas-rawat/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciKelasRawat
      summary: Rincian kelas rawat
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
