      responses:
        '200':
          description: Pengecualian sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/IzinKhusus' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/wajib-mfa:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: aturWajibMfaAkun
      summary: Nyalakan atau matikan kewajiban MFA tingkat akun
      description: |
        Izin: pengaturan.akun.perbaiki. Hanya mengubah `akses.pengguna.wajib_mfa`; kewajiban dari peran, izin
        sensitif, dan akses luar jaringan RS tetap berlaku (lihat `mfa.sumber_wajib` di respons).
        Menyalakan untuk akun yang belum punya MFA memutus sesi berjalannya: masuk berikutnya harus mendaftar MFA
        dari jaringan RS. 403 `diri_sendiri`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wajib_mfa, alasan]
              properties:
                wajib_mfa: { type: boolean }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Status MFA sesudah diubah
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/{id}/mfa/reset:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetMfaAkun
      summary: Reset MFA akun (autentikator hilang/ganti ponsel)
      description: |
        Izin: pengaturan.akun.perbaiki. Mengosongkan rahasia TOTP dan mfa_aktif_pada, membatalkan semua kode
        cadangan, dan memutus semua sesi akun itu. Akun mendaftar ulang saat masuk berikutnya, hanya dari jaringan
        RS (PRD 10.3.2). Audit `akses.mfa_direset` dengan alasan dan dasar, tanpa rahasia.
        403 `diri_sendiri`; 409 `mfa_belum_aktif`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, dasar]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
                dasar: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Status MFA sesudah direset
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/StatusMfaAkun' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Profil RS, unit organisasi, KSM (tiket 1.8a; PRD 3.4, FR-54-08 langkah 2–3, 11.2 inti.profil_rs, unit_organisasi, ksm)
  # Izin: pengaturan.profil_rs.{lihat,perbaiki}; master_data.organisasi.{lihat,input,perbaiki} untuk unit dan KSM.
  # Tidak ada DELETE: unit dan KSM dinonaktifkan lewat status. Perubahan: audit catat() dengan sebelum/sesudah.
  # Lapis 3 (PRD 9.2.2): izin ber-cakupan `unit` hanya berlaku di subpohon unit itu (unit induk mencakup turunannya):
  # daftar dan rincian unit terbatas pada subpohonnya, ubah/tambah hanya di dalam subpohonnya (pindah induk tetap di
  # dalamnya; membuat unit tingkat teratas, KSM, dan profil RS butuh cakupan `rs`). Unit puncak subpohon cakupan sendiri boleh
  # diubah, tetapi tidak dipindah ke luar subpohon. Di luar cakupan → 404 untuk rincian, 403 untuk ubah.
  # ---------------------------------------------------------------------------
  /profil-rs:
    get:
      operationId: profilRs
      summary: Profil dan paket identitas RS; publik terbatas untuk halaman masuk, lengkap bagi pemegang izin
      description: |
        Tanpa sesi boleh (halaman masuk, pita DEMO di setiap layar). Bagian `rinci` hanya dikirim bila pemanggil
        punya sesi yang masih sah dan izin pengaturan.profil_rs.lihat dengan cakupan `rs` (data yang tidak diizinkan
        tidak dikirim server). Cookie sesi yang kedaluwarsa atau dicabut tidak membuat 401: jawabannya bentuk publik.
        Cache: `Cache-Control: private, no-cache`, `Vary: Cookie`; ETag berbeda untuk bentuk publik dan bentuk
        ber-`rinci` (sama-sama turunan `versi`). Instalasi kosong (belum disiapkan) tetap 200 dengan nilai kosong dan
        `paket_identitas` bawaan produk.
      security: [{}, { sesiCookie: [] }]
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Profil RS
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProfilRs' }
        '304': { description: Tidak berubah sejak versi di If-None-Match }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: ubahProfilRs
      summary: Ubah profil RS dan warna paket identitas (FR-54-08 langkah 2)
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi`). Ganti utuh isian di bawah; berkas gambar lewat
        PUT /profil-rs/berkas/{jenis}.
        Izin dengan cakupan `rs`. Kontras warna (FR-54-08 langkah 2, rumus WCAG 2.1), 422 `kontras_kurang` dengan
        `rincian` = `{kolom, rasio, minimal, pesan}`, `kolom` = `warna.brand` atau `warna.accent`, `rasio` 2 desimal:
        - `warna.brand` = teks/tautan di latar putih dan latar tombol bertulisan putih: kontras dengan putih ≥ 4,5:1
          (sekaligus memenuhi isian ≥ 3:1).
        - `warna.accent` = isian dekoratif saja (garis, badge, aksen; PRD 5.3.2 aturan 2), tidak diuji terhadap putih;
          teks di atasnya memakai tinta `--text` (`#1D1D1B`), jadi kontras accent dengan `#1D1D1B` ≥ 4,5:1.
        Tafsiran FR-54-08 ini perlu konfirmasi pemilik produk.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianProfilRs' }
      responses:
        '200':
          description: Profil sesudah diubah (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /profil-rs/berkas/{jenis}:
    parameters:
      - in: path
        name: jenis
        required: true
        schema: { type: string, enum: [logo, motif, foto] }
    get:
      operationId: berkasProfilRs
      summary: Berkas gambar paket identitas (publik, untuk halaman masuk dan kop layar)
      parameters:
        - { in: query, name: v, required: false, schema: { type: string }, description: "Potongan sha256 berkas dari URL di ProfilRs; hanya pembeda cache, tidak diperiksa" }
      description: |
        Tanpa sesi boleh. Dikirim dari object storage (MinIO) dengan Content-Type hasil pemeriksaan saat unggah,
        `X-Content-Type-Options: nosniff`, dan untuk SVG `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'`.
        URL di ProfilRs memuat versi berkas, jadi boleh di-cache lama. 404 bila belum diunggah.
      security: [{}]
      responses:
        '200':
          description: Isi berkas
          content:
            image/svg+xml: {}
            image/png: {}
            image/webp: {}
            image/jpeg: {}
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: unggahBerkasProfilRs
      summary: Unggah atau ganti logo, motif, atau foto gedung
      description: |
        Izin: pengaturan.profil_rs.perbaiki. Wajib If-Match (`versi` profil). multipart/form-data, satu berkas `berkas`.
        Tipe diperiksa dari isi berkas, bukan nama atau Content-Type kiriman (422 `tipe_berkas_tidak_diizinkan`):
        logo dan motif: SVG atau PNG; foto: WebP, JPEG, atau PNG. Batas ukuran per jenis di konfigurasi
        (bawaan logo 200 KB, motif 500 KB, foto 2 MB; 422 `berkas_terlalu_besar`; di atas batas server web 413)
        dan dimensi gambar raster maksimum 4096×4096 piksel (422 `dimensi_terlalu_besar`). SVG ditolak
        (422 `berkas_tidak_aman`) bila memuat DOCTYPE/ENTITY, skrip, handler `on*`, `foreignObject`/objek tertanam,
        animasi (`animate*`, `set`), `href` selain rujukan internal `#…` (termasuk `javascript:` dan `data:`), atau
        `url()`/`@import` ke luar di CSS. Izin dengan cakupan `rs`. Berkas lama tetap
        tersimpan (tidak dihapus); profil menunjuk berkas baru. Mengosongkan berkas (kembali tanpa logo/motif/foto)
        tidak tersedia di fase 1; ganti dengan berkas lain.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Profil sesudah berkas diganti (dengan `rinci`)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProfilRs' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '413': { description: "Berkas melebihi batas unggah server web" }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /unit-organisasi:
    get:
      operationId: daftarUnitOrganisasi
      summary: Daftar unit organisasi (paginasi kursor), per induk untuk pohon yang dimuat bertahap
      description: |
        Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input (pemilih cakupan unit di dialog Tugaskan peran),
        kecuali `milik_saya=true`.
        - `induk_id` kosong + `akar=true` → unit tingkat teratas; `induk_id=<id>` → anak langsung unit itu.
          Tiap baris membawa `jumlah_anak` agar pohon tahu node mana yang bisa dibuka.
        - `milik_saya=true` → unit dari penugasan akun yang sedang masuk ber-cakupan `unit` yang berlaku (unit itu
          saja, bukan turunannya; pemilih unit kerja di header); boleh untuk semua akun yang masuk, filter lain diabaikan.
          Selain nilai true, pemeriksaan izin biasa berlaku. Pemilih unit kerja
          hanya konteks tampilan di klien (mis. filter bawaan daftar); tidak mengubah izin, dan server tetap memaksa
          cakupan dari penugasan pada setiap permintaan.
        Urut: kode.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: induk_id, schema: { type: string, format: uuid } }
        - { in: query, name: akar, schema: { type: boolean } }
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama (seluruh pohon)" }
        - { in: query, name: jenis, schema: { $ref: '#/components/schemas/JenisUnit' } }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
        - { in: query, name: milik_saya, schema: { type: boolean } }
      responses:
        '200':
          description: Satu halaman unit
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UnitOrganisasi' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatUnitOrganisasi
      summary: Tambah unit organisasi
      description: |
        Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai` (kode unik di seluruh RS);
        422 `induk_tidak_aktif` bila induk nonaktif.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianUnitOrganisasi' }
      responses:
        '201':
          description: Unit dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /unit-organisasi/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciUnitOrganisasi
      summary: Rincian unit beserta jalur induknya
      description: "Izin: master_data.organisasi.lihat ATAU pengaturan.akun.input. ETag = `versi`."
      responses:
        '200':
          description: Rincian unit
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahUnitOrganisasi
      summary: Ubah, pindah induk, atau nonaktifkan unit
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        - 422 `siklus`: induk baru adalah unit itu sendiri atau turunannya.
        - 409 `unit_masih_dipakai`: menonaktifkan unit yang masih punya anak aktif, penugasan ber-cakupan unit itu yang
          masih aktif (sedang atau akan berlaku), atau modul aktif per unit itu (inti.modul_aktif); `rincian` = daftar berisi
          satu objek `{jumlah_anak_aktif, jumlah_penugasan, jumlah_modul_aktif}`.
        - 409 `kode_sudah_dipakai`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                induk_id: { type: [string, 'null'], format: uuid }
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                jenis: { $ref: '#/components/schemas/JenisUnit' }
                status: { type: string, enum: [aktif, nonaktif] }
                berlaku_dari: { type: string, format: date }
                kepala_pegawai_id: { type: [string, 'null'], format: uuid, description: "Sejak 1.8d; 422 pegawai_tidak_valid bila pegawai tidak ada atau sudah keluar" }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Unit sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/UnitOrganisasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /ksm:
    get:
      operationId: daftarKsm
      summary: Daftar Kelompok Staf Medis (paginasi kursor)
      description: "Izin: master_data.organisasi.lihat dengan cakupan `rs`. Urut: kode."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 }, description: "Cocok sebagian pada kode atau nama" }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
      responses:
        '200':
          description: Satu halaman KSM
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Ksm' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatKsm
      summary: Tambah KSM
      description: "Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, dasar_perubahan]
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: KSM dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /ksm/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciKsm
      summary: Rincian KSM
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian KSM
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahKsm
      summary: Ubah atau nonaktifkan KSM
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        409 `kode_sudah_dipakai`; 409 `ksm_masih_dipakai` bila dinonaktifkan selagi ada penugasan ber-cakupan KSM itu yang
        masih aktif; `rincian` = daftar berisi satu objek `{jumlah_penugasan}`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                status: { type: string, enum: [aktif, nonaktif] }
                ketua_pegawai_id: { type: [string, 'null'], format: uuid, description: "Sejak 1.8d; 422 pegawai_tidak_valid bila pegawai tidak ada atau sudah keluar" }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: KSM sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Ksm' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Persetujuan akses dan permintaan akses (tiket 1.2d; PRD 9.2.3–9.2.4, 9.3; keputusan K3, K4, K13)
  # Pemberian berisiko tidak langsung berlaku: dicatat sebagai persetujuan menunggu dan diterapkan (dalam transaksi
  # yang sama dengan keputusan) saat semua penyetuju yang dibutuhkan menyetujui. Penyetuju = pemegang peran penyetuju
  # yang berlaku, atau orang tertentu (`penyetuju_pengguna`, sejak 1.6: reset TTE oleh atasan langsung); tidak pernah
  # pengaju dan tidak pernah akun penerima akses. Kedaluwarsa 7 hari.
  # Jalan masuk layar: sub-menu `pengaturan.persetujuan` (izin `pengaturan.persetujuan.lihat`, tidak sensitif) diberikan
  # **lewat peran** seperti menu lain: bawaan untuk superadmin; untuk pemilik data, admin memberikannya ke peran penyetujunya.
  # Endpoint /persetujuan-akses sendiri tidak butuh izin (hanya data yang relevan bagi akun itu). Usulan sub-menu otomatis
  # untuk semua penyetuju dicatat terpisah untuk keputusan pemilik (melonggarkan model "diberikan eksplisit", PRD 9.2).
  # Tidak ada POST /persetujuan-akses: persetujuan dibuat oleh endpoint pemberian (PUT izin peran, penugasan, izin khusus,
  # pengakhiran penugasan superadmin, penyetuju izin).
  # Aturan penyetuju (diperiksa server):
  # - memegang peran penyetuju yang berlaku (atau = penyetuju_pengguna); bukan pengaju (403 pengaju_sendiri);
  # - bukan penerima (403 penerima_sendiri): untuk penugasan/izin khusus = akun sasaran; untuk izin peran = semua pemegang
  #   peran sasaran (penugasan aktif); untuk penyetuju izin = pemegang peran yang ditunjuk;
  # - kontrol ganda K3/K13 tidak bisa dilewati satu superadmin: menunjuk penyetuju izin (PUT /izin/{kode}/penyetuju) dan
  #   menugaskan peran yang menjadi penyetuju izin sensitif (POST /akun/{id}/penugasan) sama-sama butuh persetujuan
  #   superadmin lain (202);
  # - persetujuan yang lewat `kedaluwarsa_pada` ditolak (409 sudah_diputuskan) walau tugas harian belum jalan;
  # - `permintaan_akses_id` tidak melewati persetujuan: pemberian berisiko tetap 202;
  # - syarat saat penerapan (mis. minimal 2 superadmin, penugasan ganda) diperiksa ulang dengan kunci.
  # Pengajuan ganda: sasaran yang sama selagi menunggu → 409 `persetujuan_ganda` (penugasan, izin khusus, pengakhiran);
  # di PUT /peran/{id}/izin izin yang sudah menunggu tidak diajukan ulang (idempoten, tercantum lagi di menunggu_persetujuan).
  # ---------------------------------------------------------------------------
  /persetujuan-akses:
    get:
      operationId: daftarPersetujuanAkses
      summary: Antrean persetujuan akses untuk akun yang sedang masuk (paginasi kursor, terbaru dulu)
      description: |
        Tanpa izin khusus: hanya data yang relevan bagi akun ini.
        - `tab=perlu_saya_putuskan`: status menunggu, akun ini memegang peran penyetujunya (atau akun ini `penyetuju_pengguna`),
          bukan pengaju, bukan penerima.
        - `tab=saya_ajukan`: diajukan akun ini (semua status).
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: tab, required: true, schema: { type: string, enum: [perlu_saya_putuskan, saya_ajukan] } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusPersetujuan' } }
      responses:
        '200':
          description: Satu halaman persetujuan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PersetujuanAkses' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciPersetujuanAkses
      summary: Rincian persetujuan (siapa, apa, dasar, dampak)
      description: "Hanya pengaju, penerima, pemegang peran penyetujunya, atau penyetuju_pengguna; selain itu 404."
      responses:
        '200':
          description: Rincian
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}/setujui:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: setujuiPersetujuanAkses
      summary: Setujui; perubahan diterapkan bila semua penyetuju dalam grup sudah setuju
      description: |
        - 403 `bukan_penyetuju`: tidak memegang peran penyetuju (atau bukan `penyetuju_pengguna`); 403 `pengaju_sendiri`: pengaju tidak bisa menyetujui
          permintaannya sendiri; 403 `penerima_sendiri`: akun penerima akses tidak bisa menyetujui.
        - 409 `sudah_diputuskan` (bukan menunggu, termasuk kedaluwarsa/dibatalkan).
        - 409 `tidak_bisa_diterapkan`: keadaan berubah sejak diajukan (mis. peran nonaktif, akun nonaktif, penugasan
          ganda, superadmin tinggal 2); seluruh grup tetap tersimpan sebagai ditolak oleh sistem dengan alasan itu
          (klien memuat ulang rincian).
        Audit `akses.persetujuan_disetujui` (+ audit perubahan yang diterapkan); cache menu akun terdampak dihapus.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Persetujuan sesudah diputuskan (`diterapkan` = perubahan sudah berlaku)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}/tolak:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tolakPersetujuanAkses
      summary: Tolak (alasan wajib); seluruh grup ikut ditolak dan tidak ada yang diterapkan
      description: "Aturan penyetuju sama dengan setujui. 409 `sudah_diputuskan`. Audit `akses.persetujuan_ditolak`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Persetujuan sesudah ditolak
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /persetujuan-akses/{id}/batalkan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: batalkanPersetujuanAkses
      summary: Pengaju menarik pengajuannya (seluruh grup) selama masih menunggu
      description: "Hanya pengaju (selain itu 404). 409 `sudah_diputuskan`. Audit `akses.persetujuan_dibatalkan`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Persetujuan sesudah dibatalkan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /permintaan-akses:
    get:
      operationId: daftarPermintaanAkses
      summary: Permintaan akses (paginasi kursor, terbaru dulu)
      description: |
        - `milik_saya=true`: permintaan akun ini sendiri (semua akun yang masuk).
        - Selain itu izin pengaturan.akun.lihat (pemberi kewenangan); filter `status`.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: milik_saya, schema: { type: boolean } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusPermintaan' } }
      responses:
        '200':
          description: Satu halaman permintaan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PermintaanAkses' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatPermintaanAkses
      summary: Minta akses dari layar "Akses ditolak" (satu klik + alasan)
      description: |
        Semua akun yang masuk. Sasaran: kode sub-menu/bagian (`menu`) atau kode izin (`izin`).
        - 422 `sasaran_tidak_dikenal`; 409 `sudah_punya_akses` (akun sudah boleh); 409 `permintaan_ganda` (permintaan
          menunggu untuk sasaran yang sama). Audit `akses.permintaan_dibuat`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sasaran_jenis, sasaran_kode, alasan]
              properties:
                sasaran_jenis: { type: string, enum: [menu, izin] }
                sasaran_kode: { type: string, maxLength: 200 }
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201':
          description: Permintaan dibuat
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PermintaanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /permintaan-akses/{id}/tolak:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tolakPermintaanAkses
      summary: Tolak permintaan akses (alasan wajib)
      description: |
        Izin pengaturan.akun.perbaiki. Permintaan disetujui dengan membuat penugasan/pengecualian yang membawa
        `permintaan_akses_id` (POST /akun/{id}/penugasan, /akun/{id}/izin-khusus); dasar pemberiannya = nomor permintaan.
        403 `diri_sendiri` (permintaan sendiri); 409 `sudah_diputuskan`. Audit `akses.permintaan_ditolak`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Permintaan sesudah ditolak
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PermintaanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /izin/{kode}/penyetuju:
    parameters:
      - { in: path, name: kode, required: true, schema: { type: string, maxLength: 200 }, description: "Kode izin sensitif, mis. kasir.tagihan.batal" }
    put:
      operationId: aturPenyetujuIzin
      summary: Tetapkan peran penyetuju (pemilik data) sebuah izin sensitif (K3)
      description: |
        Izin pengaturan.peran.perbaiki dengan cakupan `rs`. Mengganti pemilik data mengubah siapa yang boleh menyetujui,
        jadi tidak langsung berlaku: 202 = persetujuan superadmin lain (jenis `izin_sensitif`, objek `penyetuju_izin`).
        Pengecualian: data awal K13 dipasang migrasi. Menetapkan penyetuju pertama kali (belum ada) juga lewat persetujuan.
        - 422 `izin_tidak_sensitif`; 422 `peran_tidak_valid` (tidak ada atau nonaktif); 404 kode izin tidak ada.
        - 403 `peran_sendiri`: penyunting tidak boleh menunjuk peran yang ia pegang.
        - 409 `persetujuan_ganda`: penggantian penyetuju izin ini masih menunggu.
        Persetujuan yang masih menunggu tetap memakai penyetuju saat diajukan. Audit `akses.penyetuju_izin_diubah` saat berlaku.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peran_id, dasar_perubahan]
              properties:
                peran_id: { type: string, format: uuid }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Izin sesudah diubah
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [kode, sensitif, penyetuju_peran]
                    properties:
                      kode: { type: string }
                      sensitif: { type: boolean }
                      penyetuju_peran: { $ref: '#/components/schemas/RingkasPeran' }
        '202':
          description: Menunggu persetujuan superadmin lain
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PersetujuanAkses' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /akun/saran-peran:
    get:
      operationId: saranPeran
      summary: Pengecualian per akun yang sama dipakai ≥ 5 akun (saran jadikan peran, FR-09-15)
      description: "Izin pengaturan.akun.lihat. Hanya pengecualian aktif; urut jumlah akun terbanyak; paling banyak 50 baris."
      responses:
        '200':
          description: Daftar saran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [efek, sasaran_jenis, sasaran_kode, sasaran_label, jumlah_akun]
                      properties:
                        efek: { type: string, enum: [tambah, cabut] }
                        sasaran_jenis: { type: string, enum: [menu, izin] }
                        sasaran_kode: { type: string }
                        sasaran_label: { type: string }
                        jumlah_akun: { type: integer, minimum: 5 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------------------
  # Lokasi fisik, ruang, dan tempat tidur (tiket 1.8b; PRD v0.10.11 FR-54-11…14, FR-08-16…20 — PRD menyusul di #39,
  # aturan yang dipakai kode ditulis di sini dan di badan tiket backlog).
  # Izin: sub-menu `master_data.organisasi` (PRD 9.1 "Organisasi, Unit, Ruang & Tempat Tidur", satu halaman), aksi
  # lihat/input/perbaiki, semuanya dengan cakupan `rs` (pengelolaan per unit menyusul bersama admin delegasi).
  # Bangsal tidak punya kolom `kelas_layanan` (PRD 11.2): kelas ditetapkan per TT (`kelas_rawat_id`); arti kolom itu
  # ditanyakan ke pemilik (backlog).
  # Rekaman kapasitas hari T dibuat tugas harian 00.05 zona RS dan diperbarui setiap perubahan TT sepanjang hari T;
  # sesudah T lewat, rekaman tidak berubah.
  # Status lokasi (bukan TT), semua perpindahan antara aktif, renovasi, dan ditutup boleh, dengan syarat:
  #   - ke `renovasi`: tidak ada TT yang belum ditutup dan tidak ada poliklinik aktif di lokasi itu atau turunannya;
  #   - ke `ditutup`: syarat renovasi, ditambah semua turunan non-TT sudah `ditutup`;
  #   - gagal syarat → 409 `lokasi_masih_dipakai`, `rincian` = `[{jumlah_anak_aktif, jumlah_tempat_tidur, jumlah_poliklinik}]`
  #     (`jumlah_anak_aktif` = turunan non-TT yang belum ditutup; TT dihitung terpisah);
  #   - ke `aktif`/`renovasi` dari `ditutup`, menambah anak, dan pindah induk: induk tidak boleh `ditutup` (422 `induk_tidak_aktif`);
  #     induk `renovasi` boleh;
  #   - status sama dengan sekarang = tidak ada perubahan status.
  # 409/422 bisnis membawa `rincian` `[{kolom, pesan}]` dengan `kolom` = nama isian yang salah (mis. kode_sudah_dipakai → kode,
  # siklus/jenis_induk_tidak_sesuai/induk_tidak_aktif → induk_id, tanggal_tidak_valid → berlaku_dari/status_berlaku_dari),
  # kecuali `*_masih_dipakai` (rincian berisi jumlah). Akun dengan izin bercakupan unit saja → 403 `akses_ditolak`.
  # Urutan `kode_lengkap` leksikografis (10 sebelum 2); klien boleh mengurutkan alami untuk tampilan.
  # Lokasi menjawab *di mana* (gedung, lantai, ruang, TT); unit organisasi menjawab *siapa yang mengelola*.
  # Jenis anak sesuai jenis induk:
  #   (akar) → situs | gedung;  situs → gedung;  gedung → sayap | lantai;  sayap → lantai;  lantai → ruang;
  #   ruang → tempat_tidur;  tempat_tidur → (tidak ada).
  # `kode` = segmen pendek, unik di antara saudara; `kode_lengkap` = gabungan kode dari akar dengan "-" (mis. B-3-304-2),
  # dihitung server, unik di seluruh RS. Lokasi tidak pernah dihapus: penutupan lewat status dan tanggal.
  # Tempat tidur: node lokasi jenis `tempat_tidur` dibuat/dikelola lewat /tempat-tidur (bukan /lokasi). Kode TT tidak
  # pernah dihapus atau dipakai ulang, termasuk setelah TT ditutup atau ruangnya dipindah.
  # Mengubah ruang/kamar/TT dengan usulan berjenjang = tiket 1.8c; di 1.8b perubahan langsung oleh pemegang izin.
  # ---------------------------------------------------------------------------
  /lokasi:
    get:
      operationId: daftarLokasi
      summary: Daftar lokasi (paginasi kursor), per induk untuk pohon yang dimuat bertahap
      description: |
        Izin: master_data.organisasi.lihat, cakupan `rs`. Untuk jenis `tempat_tidur`, `status` mengikuti TT-nya:
        `ditutup` mulai hari pertama TT tidak dihitung, selain itu `aktif` (rincian belum_berlaku/akan_ditutup ada di
        `TempatTidur.status_operasional`); filter `status` membaca nilai itu.
        - `akar=true` → lokasi tingkat teratas; `induk_id=<id>` → anak langsung lokasi itu (`jumlah_anak` untuk pohon).
        - `cari` → cocok sebagian pada `kode_lengkap`, nama, atau kode TT (`TempatTidur.kode`, tetap walau ruangnya dipindah)
          di seluruh pohon (mis. "B-3-304").
        Urut: kode_lengkap.
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: induk_id, schema: { type: string, format: uuid } }
        - { in: query, name: akar, schema: { type: boolean } }
        - { in: query, name: cari, schema: { type: string, maxLength: 100 } }
        - { in: query, name: jenis, schema: { $ref: '#/components/schemas/JenisLokasi' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/StatusLokasi' } }
      responses:
        '200':
          description: Satu halaman lokasi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lokasi' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatLokasi
      summary: Tambah lokasi (situs, gedung, sayap, lantai, atau ruang)
      description: |
        Izin: master_data.organisasi.input. Jenis `tempat_tidur` lewat POST /tempat-tidur (422 `kelola_lewat_tempat_tidur`).
        Jenis `ruang` sesudah instalasi siap melayani: 409 `harus_lewat_usulan` (1.8c).
        - 422 `jenis_induk_tidak_sesuai` (aturan jenis di atas); 422 `induk_tidak_aktif` (induk ditutup);
          422 `fungsi_wajib` (ruang tanpa fungsi) / `fungsi_hanya_ruang`; 422 `unit_tidak_valid` (unit tidak ada atau nonaktif).
        - 409 `kode_sudah_dipakai`: kode sama dengan saudara, atau `kode_lengkap` yang terbentuk sudah ada.
        - `unit_organisasi_id` kosong = disalin dari pengelola induk saat dibuat (bukan warisan dinamis).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianLokasi' }
      responses:
        '201':
          description: Lokasi dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lokasi/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciLokasi
      summary: Rincian lokasi beserta jalur induknya
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian lokasi
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahLokasi
      summary: Ubah, pindah induk, atau ubah status lokasi
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. Kirim minimal satu isian selain `dasar_perubahan`.
        Lokasi jenis `tempat_tidur`: 422 `kelola_lewat_tempat_tidur`. `jenis` tidak bisa diubah. Lokasi jenis `ruang`
        sesudah instalasi siap melayani: 409 `harus_lewat_usulan` (1.8c).
        - Pindah induk (`induk_id`): 422 `siklus` (induk baru = lokasi itu atau turunannya), 422 `jenis_induk_tidak_sesuai`,
          422 `induk_tidak_aktif`;
          `kode_lengkap` lokasi dan seluruh turunannya dihitung ulang (409 `kode_sudah_dipakai` bila bentrok). Kode TT
          (`TempatTidur.kode`) tidak ikut berubah.
        - Status (`status` + `status_berlaku_dari`, tanggal ≤ hari ini zona RS, selain itu 422 `tanggal_tidak_valid`;
          kosong = hari ini): perpindahan dan syaratnya di blok aturan di atas (409 `lokasi_masih_dipakai`,
          422 `induk_tidak_aktif`).
          Penjadwalan status ke tanggal mendatang lewat usulan berjenjang (/usulan-data-induk).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                induk_id: { type: [string, 'null'], format: uuid }
                kode: { $ref: '#/components/schemas/KodeLokasi' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                fungsi: { $ref: '#/components/schemas/FungsiRuang' }
                unit_organisasi_id: { type: [string, 'null'], format: uuid }
                status: { $ref: '#/components/schemas/StatusLokasi' }
                status_berlaku_dari: { type: [string, 'null'], format: date }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Lokasi sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Lokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /lokasi/impor:
    post:
      operationId: imporLokasi
      summary: Impor lokasi, kamar, dan TT dari CSV (pratinjau dulu, lalu terapkan)
      description: |
        Izin: master_data.organisasi.input. Untuk penyiapan instalasi: sesudah siap melayani 409 `harus_lewat_usulan` (1.8c).
        Berkas CSV UTF-8 (RFC 4180, pemisah koma, baris pertama judul kolom), paling
        besar 2 MB dan 5.000 baris data; diproses sinkron (target < 30 detik untuk 5.000 baris). Berkas lebih besar dipecah
        oleh pengguna; impor lewat antrean untuk berkas besar adalah usulan terpisah (backlog). Templat dibuat klien dari
        daftar kolom ini:
        `jenis,kode,induk,nama,fungsi,unit,bangsal,kelas_rawat,kapasitas_maksimum,ekstra`
        - `jenis`: situs | gedung | sayap | lantai | ruang | tempat_tidur.
        - `kode`: segmen (KodeLokasi). `induk`: `kode_lengkap` induk, kosong = akar. Induk boleh ada di basis data atau di
          baris lain berkas yang sama (urutan bebas).
        - `nama` wajib kecuali `tempat_tidur` (kosong = "TT <kode>"). `fungsi` wajib untuk ruang (FungsiRuang).
        - `unit`: kode unit organisasi pengelola; kosong = mengikuti induk.
        - `bangsal` (hanya ruang): kode bangsal; bila diisi, ruang itu sekaligus menjadi kamar bangsal tersebut, dengan
          `kapasitas_maksimum` opsional. Ruang induk baris `tempat_tidur` wajib menjadi kamar (di berkas atau sudah ada).
        - `kelas_rawat` (wajib untuk tempat_tidur): kode kelas rawat. `ekstra`: `ya` | `tidak` (kosong = tidak).
          TT hasil impor: kode TT = `kode_lengkap`, aturan jenis kelamin `campur`, tidak isolasi, berlaku mulai hari ini.
        Bangsal dan kelas rawat harus sudah ada dan aktif. Impor hanya menambah: `kode_lengkap` yang sudah ada, atau kode TT
        yang pernah dipakai TT mana pun (termasuk yang ditutup), = `kode_sudah_dipakai`.
        `per_jenis` menghitung semua baris berkas menurut kolom `jenis` (termasuk baris salah); `kamar` = ruang berisi `bangsal`.
        Judul kolom persis seperti di atas (huruf kecil, urutan sama); penanda BOM UTF-8 dan pemisah `;` (Excel ber-locale
        Indonesia) diterima. `dasar_perubahan` wajib juga untuk pratinjau.
        - `mode=pratinjau`: tidak menyimpan apa pun; mengembalikan ringkasan dan baris salah beserta alasannya.
        - `mode=terapkan`: memeriksa ulang; bila ada satu baris salah → 422 `impor_tidak_valid` (`rincian` = baris salah,
          tidak ada yang disimpan; `rincian` = daftar KesalahanBarisImpor, sama dengan `data.kesalahan` pratinjau, paling
          banyak 500); bila semua benar → disimpan
          dalam satu transaksi, satu audit `master_data.lokasi_diimpor`.
        - 422 `berkas_tidak_valid`: bukan CSV UTF-8, judul kolom tidak sesuai, atau melebihi batas.
        Kode salah per baris: `kolom_wajib`, `jenis_tidak_dikenal`, `kode_tidak_valid`, `kode_ganda` (sama di berkas),
        `kode_sudah_dipakai`, `induk_tidak_ditemukan`, `siklus`, `jenis_induk_tidak_sesuai`, `induk_tidak_aktif`,
        `fungsi_wajib`, `fungsi_hanya_ruang`, `unit_tidak_valid`, `bangsal_tidak_valid`, `kelas_rawat_tidak_valid`, `bukan_kamar`,
        `nilai_tidak_valid`. Berkas di atas batas baris → 422 `berkas_tidak_valid` (bukan kesalahan per baris).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas, mode, dasar_perubahan]
              properties:
                berkas: { type: string, contentMediaType: text/csv }
                mode: { type: string, enum: [pratinjau, terapkan] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Hasil pratinjau atau penerapan
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/HasilImporLokasi' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { description: "Berkas melebihi batas unggah server web" }
        '422': { $ref: '#/components/responses/Error' }
  /bangsal:
    get:
      operationId: daftarBangsal
      summary: Daftar bangsal (paginasi kursor)
      description: "Izin: master_data.organisasi.lihat, cakupan `rs`. Urut: kode."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: cari, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string, enum: [aktif, nonaktif] } }
      responses:
        '200':
          description: Satu halaman bangsal
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Bangsal' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatBangsal
      summary: Tambah bangsal
      description: "Izin: master_data.organisasi.input. 409 `kode_sudah_dipakai`; 422 `unit_tidak_valid`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama, unit_organisasi_id, dasar_perubahan]
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                unit_organisasi_id: { type: string, format: uuid }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '201':
          description: Bangsal dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Bangsal' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bangsal/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciBangsal
      summary: Rincian bangsal beserta ringkasan TT per kelas
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian bangsal
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Bangsal' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahBangsal
      summary: Ubah atau nonaktifkan bangsal
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. 409 `kode_sudah_dipakai`; 422 `unit_tidak_valid`;
        409 `bangsal_masih_dipakai` bila dinonaktifkan selagi punya TT yang belum ditutup (`rincian` = `[{jumlah_tempat_tidur}]`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                kode: { $ref: '#/components/schemas/KodeData' }
                nama: { type: string, minLength: 2, maxLength: 150 }
                unit_organisasi_id: { type: string, format: uuid }
                status: { type: string, enum: [aktif, nonaktif] }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Bangsal sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Bangsal' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /kamar:
    get:
      operationId: daftarKamar
      summary: Daftar kamar (paginasi kursor)
      description: "Izin: master_data.organisasi.lihat, cakupan `rs`. Urut: kode_lengkap ruangnya."
      parameters:
        - $ref: '#/components/parameters/Kursor'
        - $ref: '#/components/parameters/Batas'
        - { in: query, name: bangsal_id, schema: { type: string, format: uuid } }
        - { in: query, name: cari, schema: { type: string, maxLength: 100 } }
        - { in: query, name: melebihi_kapasitas, schema: { type: boolean }, description: "Hanya kamar yang TT-nya melebihi kapasitas maksimum" }
      responses:
        '200':
          description: Satu halaman kamar
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Kamar' } }
                  meta: { $ref: '#/components/schemas/MetaKursor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: buatKamar
      summary: Jadikan sebuah ruang kamar rawat dalam bangsal
      description: |
        Izin: master_data.organisasi.input. 409 `harus_lewat_usulan` sesudah instalasi siap melayani (1.8c).
        `lokasi_id` = lokasi jenis ruang yang aktif (422 `bukan_ruang`); satu ruang paling
        banyak satu kamar (409 `ruang_sudah_kamar`); 422 `bangsal_tidak_valid` (tidak ada atau nonaktif).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IsianKamar' }
      responses:
        '201':
          description: Kamar dibuat
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Kamar' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /kamar/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: rinciKamar
      summary: Rincian kamar
      description: "Izin: master_data.organisasi.lihat. ETag = `versi`."
      responses:
        '200':
          description: Rincian kamar
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Kamar' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: ubahKamar
      summary: Ubah bangsal, kapasitas maksimum, atau atribut standar kamar
      description: |
        Izin: master_data.organisasi.perbaiki. Wajib If-Match. 409 `harus_lewat_usulan` sesudah instalasi siap melayani (1.8c).
        422 `bangsal_tidak_valid`. `atribut_standar` mengganti seluruh
        objek (bukan menggabung). Kapasitas di bawah jumlah TT aktif
        tetap disimpan; kamar ditandai `melebihi_kapasitas` (peringatan, bukan penolakan).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dasar_perubahan]
              minProperties: 2
              properties:
                bangsal_id: { type: string, format: uuid }
                kapasitas_maksimum: { type: [integer, 'null'], minimum: 1, maximum: 99 }
                atribut_standar: { $ref: '#/components/schemas/AtributKamar' }
                dasar_perubahan: { $ref: '#/components/schemas/Dasar' }
      responses:
        '200':
          description: Kamar sesudah diubah
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
