        Pengecualian: data awal K13 dipasang migrasi. Menetapkan penyetuju pertama kali (belum ada) juga lewat persetujuan.
        - 422 `izin_tidak_sensitif`; 422 `peran_tidak_valid` (tidak ada atau nonaktif); 404 kode izin tidak ada.
        - 403 `peran_sendiri`: penyunting tidak boleh menunjuk peran yang ia pegang.
