<html lang="id">
<head>
<meta charset="utf-8">

<title>Display Antrean · SIMRS Karsitara</title>

<style>
:root{
  --brand-900:#0B3A22; --brand-800:#004A27; --brand-700:#005A2F; --brand-600:#006937; --brand-500:#1F8A4C; --brand-100:#CDE7D6; --brand-50:#E8F4EC; --brand-25:#F4FAF6;
  --usu-emas:#F3C300; --usu-kuning:#FAE345; --usu-gelap:#135851; --accent-ink:#7A5A00;
  --bg:#F6F7F6; --surface:#FFFFFF; --border:#E4E7E5; --border-strong:#C9CFCB;
  --text:#1D1D1B; --muted:#565C63; --subtle:#686E75;
  --danger:#C21E15; --danger-bg:#FDECEA; --warn:#8A5A00; --warn-bg:#FFF4D6; --success:#187A3E; --success-bg:#E7F5EC; --info:#2457C5; --info-bg:#EAF1FF;
  --ring:0 0 0 4px rgba(0,105,55,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

html{font-size:clamp(10px,0.9vw,20px)}
body{background:#0B3A22;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.d-top{display:flex;align-items:center;gap:1.6rem;padding:1.4rem 2.4rem;background:#fff;color:var(--text);position:relative}
.d-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.35rem;background:linear-gradient(90deg,var(--brand-600),var(--usu-emas))}
.d-top img{height:3.6rem;width:auto}
.d-top b{display:block;font-size:1.9rem;line-height:1.1}
.d-top small{display:block;font-size:1.25rem;color:var(--muted)}
.d-clock{margin-left:auto;text-align:right}
.d-clock b{font-size:3rem;font-weight:800;letter-spacing:-.02em}
.d-clock small{font-size:1.2rem}
.d-main{flex:1;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr);gap:1.6rem;padding:1.8rem 2.4rem;position:relative}
.d-main::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NSIgaGVpZ2h0PSI2NSIgdmlld0JveD0iMCAwIDY1IDY1Ij48ZyBmaWxsPSIjRkZGRkZGIj48cGF0aCBkPSJNMzIuNSAyNi4wNyAzOC45MyAzMi41IDMyLjUgMzguOTMgMjYuMDcgMzIuNVpNNDkuMTEgMzIuNSAzMi41IDE1Ljg5IDE1Ljg5IDMyLjUgMzIuNSA0OS4xMVoiLz48cGF0aCBkPSJNNTcuMDUgMjQuNTUgNDkuMTEgMzIuNSA1Ny4wNSA0MC40NSA2NSAzMi41WiIvPjxwYXRoIGQ9Ik03Ljk1IDI0LjU1IDAgMzIuNSA3Ljk1IDQwLjQ1IDE1Ljg5IDMyLjVaIi8+PHBhdGggZD0iTTI0LjU1IDcuOTUgMzIuNSAxNS44OSA0MC40NSA3Ljk1IDMyLjUgMFoiLz48cGF0aCBkPSJNMjQuNTUgNTcuMDUgMzIuNSA2NSA0MC40NSA1Ny4wNSAzMi41IDQ5LjExWiIvPjxwYXRoIGQ9Ik01OS42MyAwIDQxLjg5IDE3Ljc0IDQ3LjI2IDIzLjExIDY1IDUuMzdaIi8+PHBhdGggZD0iTTE3Ljc0IDQxLjg5IDAgNTkuNjMgNS4zNyA2NSAyMy4xMSA0Ny4yNloiLz48cGF0aCBkPSJNMCA1LjM3IDE3Ljc0IDIzLjExIDIzLjExIDE3Ljc0IDUuMzcgMFoiLz48cGF0aCBkPSJNNDEuODkgNDcuMjYgNTkuNjMgNjUgNjUgNTkuNjMgNDcuMjYgNDEuODlaIi8+PC9nPjwvc3ZnPgo=");background-size:5rem;opacity:.045;pointer-events:none}
.d-main > *{position:relative}
.now{background:linear-gradient(160deg,#135851,#004A27);border:1px solid rgba(255,255,255,.12);border-radius:1.6rem;padding:2rem;display:flex;flex-direction:column;justify-content:center;text-align:center}
.now small{font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;color:#D3EBDC;font-weight:700}
.now .no{font:800 9.5rem/1 "JetBrains Mono",monospace;letter-spacing:.02em;margin:1.2rem 0 .6rem;color:#fff}
.now .ini{font-size:2.6rem;font-weight:700;color:var(--usu-kuning)}
.now .to{margin-top:1.6rem;font-size:2.4rem;font-weight:700;background:rgba(255,255,255,.1);border-radius:1rem;padding:1rem 1.4rem}
.now .to span{display:block;font-size:1.4rem;font-weight:500;color:#D3EBDC;margin-top:.3rem}
.now.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(250,227,69,0)}50%{box-shadow:0 0 0 .6rem rgba(250,227,69,.55)}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem;align-content:start}
.room{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1.2rem;padding:1.2rem 1.4rem}
.room.on{border-color:var(--usu-kuning);background:rgba(250,227,69,.08)}
.room-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.room-h b{font-size:1.7rem}
.room-h span{font-size:1.25rem;color:#BFDCC9}
.room-dr{font-size:1.3rem;color:#D3EBDC;margin-top:.2rem}
.room-now{display:flex;align-items:baseline;gap:1rem;margin-top:.8rem}
.room-now .no{font:800 3.6rem/1 "JetBrains Mono",monospace}
.room-now .ini{font-size:1.6rem;color:var(--usu-kuning);font-weight:700}
.room-now .st{margin-left:auto;font-size:1.15rem;border-radius:999px;padding:.25rem .8rem;background:rgba(255,255,255,.12)}
.room-next{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;font-size:1.25rem;color:#BFDCC9;align-items:center}
.room-next i{font-style:normal;font-family:"JetBrains Mono",monospace;background:rgba(255,255,255,.1);color:#fff;border-radius:.5rem;padding:.15rem .6rem}
.room-next i.back{background:rgba(61,174,43,.3)}
/* farmasi */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem;align-content:start}
.col{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1.2rem;padding:1.2rem 1.4rem}
.col h2{font-size:1.7rem;margin:0 0 .2rem}
.col p{font-size:1.2rem;color:#BFDCC9;margin:0 0 1rem}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.chip{border-radius:.9rem;padding:.8rem 1rem;background:rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:baseline}
.chip b{font:800 2.2rem/1 "JetBrains Mono",monospace}
.chip span{font-size:1.25rem;color:#D3EBDC}
.chip.ready{background:var(--usu-kuning);color:#1D1D1B}
.chip.ready span{color:#1D1D1B}
.chip.rac::after{content:"R";font-size:1rem;font-weight:800;margin-left:.5rem;background:rgba(0,0,0,.18);border-radius:.4rem;padding:0 .35rem}
/* loket */
.lokets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;align-content:start}
.lk{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1.2rem;padding:1.2rem;text-align:center}
.lk.on{border-color:var(--usu-kuning);background:rgba(250,227,69,.08)}
.lk small{font-size:1.4rem;color:#BFDCC9}
.lk b{display:block;font:800 4rem/1.1 "JetBrains Mono",monospace;margin-top:.4rem}
.wait{grid-column:1/-1;background:rgba(255,255,255,.06);border-radius:1.2rem;padding:1.2rem 1.4rem;font-size:1.4rem;color:#BFDCC9}
.wait i{font-style:normal;font-family:"JetBrains Mono",monospace;color:#fff;background:rgba(255,255,255,.1);border-radius:.5rem;padding:.15rem .6rem;margin:0 .3rem}
/* kaki */
.d-foot{display:flex;align-items:center;background:#004A27;border-top:1px solid rgba(255,255,255,.12);overflow:hidden;height:3.6rem}
.d-foot .lbl{flex:none;background:var(--usu-emas);color:#1D1D1B;font-weight:800;font-size:1.3rem;height:100%;display:flex;align-items:center;padding:0 1.4rem}
.tk-wrap{flex:1;min-width:0;overflow:hidden;height:100%;display:flex;align-items:center}
.ticker{white-space:nowrap;display:inline-block;font-size:1.4rem;animation:tick 40s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.d-foot .brand{flex:none;margin-left:auto;background:#004A27;height:100%;display:flex;align-items:center;gap:.6rem;padding:0 1.4rem;font-size:1rem;color:#BFDCC9;position:relative;z-index:1}
.d-foot .brand img{height:1.4rem}
/* panel peragaan */
.ctl{position:fixed;bottom:4.4rem;right:1rem;z-index:20;display:flex;gap:6px;flex-wrap:wrap;background:#fff;color:var(--text);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;align-items:center}
.ctl small{color:var(--subtle);padding:0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ctl button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.ctl.min > :not(.tg){display:none}
@media (max-width:900px){ html{font-size:10px} .d-main{grid-template-columns:1fr;padding:1.4rem} .grid,.cols,.lokets{grid-template-columns:1fr} .chips{grid-template-columns:repeat(2,1fr)} .ctl{top:auto;bottom:4.4rem;left:8px;right:8px} .d-clock small{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

  /* ===== Identitas RS USU · Pedoman Identitas USU (2021) ===== */
  .sb-brand .sb-logo{height:24px;width:auto;display:block}
  img.hlogo{width:30px;height:32px;border:0;border-radius:0;object-fit:contain;background:transparent}
  .sb-hosp{border-top:3px solid var(--usu-emas)}
  .badge-dot{color:var(--usu-hitam)!important}
</style>
<style id="ds-css">
#dsBtn{position:fixed;right:16px;bottom:16px;z-index:60;display:inline-flex;align-items:center;gap:6px;border:1px solid #0B3A22;background:#1D1D1B;color:#fff;border-radius:999px;padding:8px 13px;font:600 12.5px/1 "Public Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(16,32,22,.25)}
#dsBtn:focus-visible{outline:2px solid #F3C300;outline-offset:2px}
#dsPanel{position:fixed;top:0;right:0;height:100vh;width:min(520px,100%);background:#fff;z-index:61;box-shadow:-10px 0 40px rgba(16,32,22,.18);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;font:13px/1.5 "Public Sans",system-ui,sans-serif;color:#1D1D1B}
#dsPanel.open{transform:none}
#dsPanel header{padding:16px 20px;border-bottom:1px solid #E4E7E5;display:flex;gap:12px;align-items:flex-start}
#dsPanel header h2{margin:0;font-size:16px} #dsPanel header p{margin:2px 0 0;color:#565C63;font-size:12.5px}
#dsPanel .dsx{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:#565C63;width:32px;height:32px;border-radius:8px}
#dsPanel .dsx:hover{background:#F1F3F2}
#dsPanel .dsb{flex:1;overflow-y:auto;padding:14px 20px 20px}
#dsPanel h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#686E75;margin:16px 0 6px}
#dsPanel ul{margin:0;padding-left:18px} #dsPanel li{margin:2px 0}
#dsPanel code{font:500 12px/1.4 "JetBrains Mono",ui-monospace,monospace;background:#F1F3F2;border-radius:5px;padding:1px 5px;word-break:break-word}
#dsPanel .dsrule{background:#FFF7ED;color:#9A3412;border-radius:9px;padding:9px 11px;font-size:12.5px}
#dsPanel .dsview{background:#E8F4EC;color:#004A27;border-radius:9px;padding:9px 11px;font-size:12.5px}
#dsPanel .dschips{display:flex;flex-wrap:wrap;gap:5px}
#dsPanel .dschips code{display:inline-block}
#dsPanel footer{padding:12px 20px;border-top:1px solid #E4E7E5;display:flex;gap:8px;justify-content:flex-end}
#dsPanel footer button{border:1px solid #C9CFCB;background:#fff;border-radius:8px;padding:8px 12px;font:500 13px "Public Sans",system-ui,sans-serif;cursor:pointer}
#dsPanel footer button.pri{background:#006937;border-color:#006937;color:#fff}
#dsScrim{position:fixed;inset:0;background:rgba(16,32,22,.25);z-index:60;display:none} #dsScrim.show{display:block}
@media print{#dsBtn,#dsPanel,#dsScrim{display:none!important}}
</style>
</head>

    $('#main').innerHTML = `<section class="now" id="now"><small>Sedang dipanggil</small><div class="no">${last.no}</div><div class="ini">&nbsp;</div><div class="to">Silakan ke ${last.to}<span>${last.sub}</span></div></section>
     <section class="lokets">${LK.l.map((l,i)=>`<div class="lk${i===onRoom?' on':''}"><small>${l[0]}</small><b>${l[1]}</b></div>`).join('')}<div class="wait">Menunggu: ${LK.wait.map(w=>`<i>${w}</i>`).join('')}</div></section>`; }
}
function call(){
  if (area==='poli'){ const i=Math.floor(Math.random()*ROOMS.length), r=ROOMS[i]; if (!r.q.length) return; const n=r.q.shift(); r.now=[n[0],n[1]]; r.st='Dokter'; onRoom=i;
    last={no:n[0],ini:n[1],to:r.r,sub:(r.p==='Klinik 7'?'Klinik 7':'Poli '+r.p)+' · '+r.dr}; render(); speak(`Nomor antrean ${spell(n[0])}, silakan ke ${r.r.toLowerCase()}.`); }
  else if (area==='farmasi'){ if (!RX.prep.length) return; const n=RX.prep.shift(); RX.ready.unshift(n); RX.ready=RX.ready.slice(0,8); const lk='Loket penyerahan '+(1+Math.floor(Math.random()*3));
    last={no:n[0],ini:n[1],to:lk,sub:n[2]?'Obat racikan':'Obat nonracikan'}; render(); speak(`Nomor ${spell(n[0])}, obat Anda sudah siap, silakan ke ${lk.toLowerCase()}.`); }
  else { if (!LK.wait.length) return; const n=LK.wait.shift(); const i=n.startsWith('P')?0:1+Math.floor(Math.random()*5); LK.l[i][1]=n; onRoom=i;
    last={no:n,ini:'',to:LK.l[i][0].split(' · ')[0],sub:LK.l[i][0]}; render(); speak(`Nomor antrean ${spell(n)}, silakan ke ${last.to.toLowerCase()}.`); }
  const nw=$('#now'); nw.classList.remove('flash'); void nw.offsetWidth; nw.classList.add('flash');
}
function setArea(a){ area=a; history.replaceState(null,'','#'+a);
  last = a==='poli'?{no:'PD-021',ini:'N.H.',to:'Ruang 3',sub:'Poli Penyakit Dalam · dr. Larasati, Sp.PD'}: a==='farmasi'?{no:'F-040',ini:'B.U.',to:'Loket penyerahan 2',sub:'Obat nonracikan'}:{no:'A-027',ini:'',to:'Loket 2',sub:'Loket 2'}; onRoom= a==='loket'?1:0; render(); }
document.addEventListener('click',e=>{ const a=e.target.closest('[data-area]'); if (a) setArea(a.dataset.area); });
$('#nextCall').onclick=call;
$('#sound').onclick=e=>{ soundOn=!soundOn; e.target.setAttribute('aria-pressed',soundOn); e.target.textContent='Suara: '+(soundOn?'hidup':'mati'); if (soundOn) speak('Suara panggilan aktif.'); };
$('#hideCtl').onclick=e=>{ const c=$('#ctl'); c.classList.toggle('min'); e.target.textContent=c.classList.contains('min')?'Panel':'Sembunyikan'; };
setArea(area);
setInterval(call, 9000);
})();
</script>
<button id="dsBtn" type="button" aria-controls="dsPanel" title="Spesifikasi untuk pengembang (Shift+D)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>Spek dev</button>
<div id="dsScrim"></div><aside id="dsPanel" role="dialog" aria-label="Spesifikasi pengembang" aria-hidden="true"><header><div><h2 id="dsT"></h2><p id="dsS"></p></div><button class="dsx" id="dsX" aria-label="Tutup">×</button></header><div class="dsb" id="dsB"></div><footer><button id="dsCopy" class="pri">Salin sebagai tiket</button></footer></aside>
<script id="ds-js">(function(){
const SP={"judul": "Display Antrean", "modul": "Modules/Queue · layouts/KioskLayout", "rute": "/kios/display/{kode} (#poli, #farmasi, #loket)", "tujuan": "Layar TV per area: poli per ruang/dokter, farmasi (disiapkan/siap), dan loket; panggilan suara.", "fr": ["FR-02-04 display & suara", "FR-02-15 nomor + inisial, poli netral, suara tanpa nama", "FR-02-17 data induk display", "FR-02-11 panggil ulang/dilewati"], "views": {"poli": "Per ruang: nomor sedang dilayani, status perawat/dokter, 3 berikutnya; hijau = kembali membawa hasil.", "farmasi": "Hanya pasien yang sudah hadir dan pembayarannya beres tampil di kolom siap; tanda R = racikan.", "loket": "Loket 1 prioritas; daftar menunggu."}, "aturan": ["Data didorong lewat Reverb (kanal antrean.{lokasi}); tidak ada polling dari TV.", "Suara Bahasa Indonesia: nomor dan ruang saja.", "Poli sensitif tampil dengan nama netral dari data induk (contoh \"Klinik 7\")."], "tabel": ["kunjungan.display_antrean", "kunjungan.antrean", "kunjungan.antrean_panggilan"], "api": ["GET /api/kios/display/{kode} (token perangkat)", "WS antrean.{lokasi}: AntreanDipanggil, AntreanSelesai"], "regulasi": ["UU 27/2022 PDP Ps. 4", "Permenkes 24/2022 Ps. 29 (kerahasiaan)"], "belum": ["Suara memakai Web Speech API peramban sebagai peragaan; produksi memakai TTS server atau rekaman per nomor."]}, CR=["Setiap halaman dilindungi izin sub-menu; bagian di dalamnya dilindungi izin bagian (PRD 9.2). Data bagian yang tidak diizinkan tidak dikirim server.", "Setiap isian klinis menyimpan nama, waktu server, dan tanda tangan (Permenkes 24/2022 Ps. 16 ayat 2). Isi tersahkan tidak ditimpa: perbaikan = versi baru/adendum.", "Semua aksi tercatat di audit.log_aktivitas (siapa, apa, sebelum–sesudah)."];
const $=s=>document.querySelector(s), e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cv=()=>{ const h=location.hash.slice(1); const a=document.querySelector('.nav-sub a.on'); return (SP.views&&SP.views[h])?h:(a&&a.dataset.view)||h; };
function render(){ const v=cv(), vn=SP.views&&SP.views[v];
  $('#dsT').textContent='Spek dev · '+SP.judul; $('#dsS').innerHTML='Rute <code>'+e(SP.rute)+'</code> · modul <code>'+e(SP.modul)+'</code>';
  const L=(t,a,code)=>a&&a.length?'<h3>'+t+'</h3>'+(code?'<div class="dschips">'+a.map(x=>'<code>'+e(x)+'</code>').join('')+'</div>':'<ul>'+a.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>'):'';
  $('#dsB').innerHTML='<div class="dsrule"><b>PRD yang berlaku.</b> Prototipe ini alat bantu visual dengan data fiktif. Bila berbeda dengan prd.md, ikuti prd.md dan laporkan selisihnya.</div>'+
   '<h3>Tujuan layar</h3><p style="margin:0">'+e(SP.tujuan)+'</p>'+(vn?'<h3>Sub-menu yang sedang dibuka</h3><div class="dsview"><b>'+e(v)+'</b> · '+e(vn)+'</div>':'')+
   L('Kebutuhan (FR) di prd.md',SP.fr)+L('Aturan bisnis kunci',SP.aturan)+L('Berlaku di semua layar',CR)+L('Tabel database',SP.tabel,1)+L('API (usulan konvensi)',SP.api,1)+L('Dasar regulasi',SP.regulasi)+L('Belum diperagakan — kerjakan dari PRD',SP.belum)+
   '<h3>Definition of Done</h3><ul><li>Lolos uji penerimaan (Given/When/Then) per FR di tiket.</li><li>Policy/izin server ada untuk setiap endpoint dan bagian (CI gagal bila tidak ada).</li><li>Audit log, versi/adendum, dan TTE sesuai tingkatnya.</li><li>Anggaran kinerja PRD 14.1: API P95 baca ≤ 200 ms / simpan ≤ 500 ms, ≤ 10 query, tanpa N+1.</li><li>Uji Playwright alur utama + uji akses ditolak.</li></ul>'; }
function ticket(){ const v=cv(), vn=SP.views&&SP.views[v];
  return ['## [SIMRS] '+SP.judul+(vn?' · '+v:''),'','**Tujuan:** '+SP.tujuan,'**Rute / modul:** '+SP.rute+' · '+SP.modul,vn?'**Fokus sub-menu:** '+vn:'','','**FR:**',...SP.fr.map(x=>'- '+x),'','**Aturan bisnis:**',...SP.aturan.map(x=>'- '+x),'','**Tabel:** '+SP.tabel.join(', '),'**API:** '+SP.api.join(' · '),'**Regulasi:** '+SP.regulasi.join('; '),'','**Uji penerimaan (isi):**','- Given … When … Then …','- Akun tanpa izin → 403 dan bagian tidak dirender','','**Definition of Done:** policy server, audit log, TTE sesuai tingkat, kinerja 14.1, uji Playwright.','Sumber: prd.md (versi terbaru). Prototipe: '+location.pathname.split('/').pop()].filter(x=>x!==null).join('\n'); }
const P=$('#dsPanel'), S=$('#dsScrim');
const open=()=>{ render(); P.classList.add('open'); S.classList.add('show'); P.setAttribute('aria-hidden','false'); $('#dsX').focus(); };
const close=()=>{ P.classList.remove('open'); S.classList.remove('show'); P.setAttribute('aria-hidden','true'); };
$('#dsBtn').onclick=open; $('#dsX').onclick=close; S.onclick=close;
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&P.classList.contains('open')) close(); if(ev.shiftKey&&ev.key.toLowerCase()==='d'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName)) { P.classList.contains('open')?close():open(); } });
window.addEventListener('hashchange',()=>{ if(P.classList.contains('open')) render(); });
$('#dsCopy').onclick=()=>{ const t=ticket(); const done=()=>{ const b=$('#dsCopy'); b.textContent='Tersalin'; setTimeout(()=>b.textContent='Salin sebagai tiket',1500); };
  if (navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fb(t)); else fb(t);
  function fb(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(_){} a.remove(); } };
})();</script>
