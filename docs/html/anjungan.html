<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anjungan Mandiri · SIMRS Karsitara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --brand-900:#0B3A22; --brand-800:#004A27; --brand-700:#005A2F; --brand-600:#006937; --brand-500:#1F8A4C; --brand-100:#CDE7D6; --brand-50:#E8F4EC; --brand-25:#F4FAF6;
  --usu-emas:#F3C300; --usu-kuning:#FAE345; --usu-gelap:#135851; --accent-ink:#7A5A00;
  --bg:#F6F7F6; --surface:#FFFFFF; --border:#E4E7E5; --border-strong:#C9CFCB;
  --text:#1D1D1B; --muted:#565C63; --subtle:#686E75;
  --danger:#C21E15; --danger-bg:#FDECEA; --warn:#8A5A00; --warn-bg:#FFF4D6; --success:#187A3E; --success-bg:#E7F5EC; --info:#2457C5; --info-bg:#EAF1FF;
  --ring:0 0 0 4px rgba(0,105,55,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

body{min-height:100vh;display:flex;flex-direction:column;user-select:none}
/* ---------- Kepala ---------- */
.k-top{display:flex;align-items:center;gap:16px;padding:18px 32px;background:#fff;border-bottom:1px solid var(--border);position:relative}
.k-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,var(--brand-600),var(--usu-emas))}
.k-rs{display:flex;align-items:center;gap:12px}
.k-rs img{height:44px;width:auto}
.k-rs b{display:block;font-size:19px;line-height:1.2}
.k-rs small{display:block;color:var(--muted);font-size:14px}
.k-clock{margin-left:auto;text-align:right}
.k-clock b{display:block;font-size:30px;font-weight:700;letter-spacing:-.01em}
.k-clock small{color:var(--muted);font-size:14px}
.k-mode{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;margin-left:16px}
.k-mode button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.k-mode button[aria-pressed=true]{background:var(--brand-600);color:#fff}
.k-mode-l{font-size:11px;color:var(--subtle);text-transform:uppercase;letter-spacing:.06em;margin-left:16px}
/* ---------- Isi ---------- */
.k-main{flex:1;display:flex;justify-content:center;padding:32px 24px 24px}
.k-wrap{width:min(1080px,100%)}
.k-h1{font-size:40px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
.k-lead{font-size:20px;color:var(--muted);margin:0 0 28px}
.k-step{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-600);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{display:flex;gap:18px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--border);border-radius:20px;padding:26px;cursor:pointer;min-height:150px;transition:border-color .12s,transform .08s}
.tile:hover{border-color:var(--brand-500)}
.tile:active{transform:scale(.99)}
.tile:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--brand-600)}
.tile .ic{flex:none;width:64px;height:64px;border-radius:16px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center}
.tile b{display:block;font-size:24px;line-height:1.2;margin-bottom:6px}
.tile span{display:block;color:var(--muted);font-size:17px}
.tile.primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.tile.primary .ic{background:rgba(255,255,255,.14);color:#fff}
.tile.primary span{color:#D3EBDC}
.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px}
.row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
.inp{width:100%;height:76px;border:2px solid var(--border-strong);border-radius:14px;font:700 34px/1 "JetBrains Mono",monospace;letter-spacing:.06em;padding:0 20px;background:#fff;color:var(--text)}
.inp:focus{outline:none;border-color:var(--brand-600);box-shadow:var(--ring)}
.inp-l{display:block;font-weight:600;font-size:17px;margin-bottom:8px}
.help{font-size:15px;color:var(--muted);margin-top:8px}
.help.err{color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:72px;border:1px solid var(--border-strong);border-radius:14px;background:#fff;font-size:28px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--brand-50)}
.pad .w{font-size:18px;font-weight:600;color:var(--muted)}
.scan{display:flex;align-items:center;gap:16px;border:2px dashed var(--brand-100);background:var(--brand-25);border-radius:16px;padding:18px;margin-bottom:18px}
.scan .ic{width:56px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--brand-600);flex:none}
.scan b{display:block;font-size:19px}
.scan span{color:var(--muted);font-size:15px}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--subtle);align-items:center}
.demo button{border:1px dashed var(--border-strong);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:14px;margin-top:26px}
.btn{height:68px;min-width:180px;border-radius:16px;border:2px solid var(--border-strong);background:#fff;color:var(--text);font-size:21px;font-weight:700;padding:0 28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.btn-primary:hover{background:var(--brand-700)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.8}
.who{display:flex;align-items:center;gap:16px;background:var(--brand-25);border:1px solid var(--brand-100);border-radius:16px;padding:18px 20px;margin-bottom:22px}
.who .av{width:56px;height:56px;border-radius:50%;background:var(--brand-600);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.who b{display:block;font-size:24px}
.who span{color:var(--muted);font-size:16px}
.dob{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}
.dob select{height:72px;border:2px solid var(--border-strong);border-radius:14px;font-size:24px;font-weight:600;padding:0 14px;background:#fff}
.dob select:focus{outline:none;border-color:var(--brand-600);box-shadow:var(--ring)}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 18px;font-size:19px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.docs{display:grid;gap:12px}
.doc{display:flex;align-items:center;gap:16px;border:2px solid var(--border);border-radius:16px;padding:18px 20px;background:#fff;cursor:pointer;text-align:left}
.doc[aria-pressed=true]{border-color:var(--brand-600);background:var(--brand-25)}
.doc .ic{width:48px;height:48px;border-radius:12px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center;flex:none}
.doc b{display:block;font-size:20px}
.doc span{color:var(--muted);font-size:16px}
.doc .pill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--success-bg);color:var(--success)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--danger-bg);color:var(--danger)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.neutral{background:var(--bg);color:var(--muted)}
.drs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dr{border:2px solid var(--border);border-radius:16px;padding:20px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.dr[aria-pressed=true]{border-color:var(--brand-600);background:var(--brand-25)}
.dr[disabled]{opacity:.55;cursor:not-allowed}
.dr b{font-size:21px}
.dr span{color:var(--muted);font-size:16px}
.dr .q{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.bio{display:grid;place-items:center;text-align:center;padding:20px 0}
.fp{width:170px;height:170px;border-radius:50%;background:var(--brand-50);display:grid;place-items:center;color:var(--brand-600);position:relative}
.fp.scan::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--brand-500);border-top-color:transparent;animation:spin 1s linear infinite}
.fp.ok{background:var(--success-bg);color:var(--success)}
.fp.bad{background:var(--danger-bg);color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.prog li{display:flex;align-items:center;gap:14px;font-size:20px;color:var(--subtle)}
.prog li i{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-strong);display:grid;place-items:center;flex:none;font-style:normal}
.prog li.run{color:var(--text);font-weight:600} .prog li.run i{border-color:var(--brand-500);border-top-color:transparent;animation:spin .9s linear infinite}
.prog li.done{color:var(--success)} .prog li.done i{background:var(--success);border-color:var(--success);color:#fff}
/* ---------- Struk ---------- */
.ticket-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.ticket{background:#fff;border-radius:18px;border:1px solid var(--border);box-shadow:0 18px 40px rgba(16,32,22,.12);padding:26px 26px 22px;position:relative;font-size:16px}
.ticket::before,.ticket::after{content:"";position:absolute;left:-1px;right:-1px;height:12px;background:radial-gradient(circle at 8px 0,transparent 7px,#fff 8px) repeat-x;background-size:16px 12px}
.ticket::after{bottom:-11px;transform:rotate(180deg)} .ticket::before{top:-11px}
.t-head{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--border-strong);padding-bottom:12px;margin-bottom:12px}
.t-head img{height:30px}
.t-head small{font-size:12px;color:var(--muted);line-height:1.3}
.t-no{text-align:center;padding:6px 0 10px}
.t-no small{display:block;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.t-no b{display:block;font:800 64px/1.05 "JetBrains Mono",monospace;letter-spacing:.02em;color:var(--brand-800)}
.t-no span{font-weight:600}
.t-kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;border-top:1px dashed var(--border-strong);padding-top:10px}
.t-kv dt{color:var(--muted)} .t-kv dd{margin:0;font-weight:600}
.t-qr{display:flex;gap:12px;align-items:center;border-top:1px dashed var(--border-strong);margin-top:12px;padding-top:12px}
.t-qr svg{flex:none}
.t-qr small{font-size:12.5px;color:var(--muted);line-height:1.35}
.next{background:var(--brand-800);color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NSIgaGVpZ2h0PSI2NSIgdmlld0JveD0iMCAwIDY1IDY1Ij48ZyBmaWxsPSIjRkZGRkZGIj48cGF0aCBkPSJNMzIuNSAyNi4wNyAzOC45MyAzMi41IDMyLjUgMzguOTMgMjYuMDcgMzIuNVpNNDkuMTEgMzIuNSAzMi41IDE1Ljg5IDE1Ljg5IDMyLjUgMzIuNSA0OS4xMVoiLz48cGF0aCBkPSJNNTcuMDUgMjQuNTUgNDkuMTEgMzIuNSA1Ny4wNSA0MC40NSA2NSAzMi41WiIvPjxwYXRoIGQ9Ik03Ljk1IDI0LjU1IDAgMzIuNSA3Ljk1IDQwLjQ1IDE1Ljg5IDMyLjVaIi8+PHBhdGggZD0iTTI0LjU1IDcuOTUgMzIuNSAxNS44OSA0MC40NSA3Ljk1IDMyLjUgMFoiLz48cGF0aCBkPSJNMjQuNTUgNTcuMDUgMzIuNSA2NSA0MC40NSA1Ny4wNSAzMi41IDQ5LjExWiIvPjxwYXRoIGQ9Ik01OS42MyAwIDQxLjg5IDE3Ljc0IDQ3LjI2IDIzLjExIDY1IDUuMzdaIi8+PHBhdGggZD0iTTE3Ljc0IDQxLjg5IDAgNTkuNjMgNS4zNyA2NSAyMy4xMSA0Ny4yNloiLz48cGF0aCBkPSJNMCA1LjM3IDE3Ljc0IDIzLjExIDIzLjExIDE3Ljc0IDUuMzcgMFoiLz48cGF0aCBkPSJNNDEuODkgNDcuMjYgNTkuNjMgNjUgNjUgNTkuNjMgNDcuMjYgNDEuODlaIi8+PC9nPjwvc3ZnPgo=");background-size:46px;opacity:.06}
.next > *{position:relative}
.next h2{font-size:28px;margin:0 0 14px}
.next ol{margin:0;padding-left:24px;display:grid;gap:12px;font-size:19px}
.next ol b{color:var(--usu-kuning)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;font-size:17px;margin-top:16px}
.note.info{background:var(--info-bg);color:var(--info)} .note.warn{background:var(--warn-bg);color:var(--warn)} .note.ok{background:var(--success-bg);color:var(--success)} .note.bad{background:var(--danger-bg);color:var(--danger)}
.note svg{flex:none;margin-top:3px}
.ex-ic{width:84px;height:84px;border-radius:24px;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;margin-bottom:18px}
.sched{width:100%;border-collapse:collapse;font-size:18px}
.sched th{text-align:left;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);padding:10px 12px;border-bottom:1px solid var(--border)}
.sched td{padding:14px 12px;border-bottom:1px solid var(--border)}
.rx{display:grid;gap:12px;margin-top:6px}
.rx-it{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:16px 18px;background:#fff}
.rx-it b{display:block;font-size:19px}
.rx-it span{color:var(--muted);font-size:15px}
.rx-it .pill{margin-left:auto}
.steps5{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.steps5 div{height:8px;border-radius:999px;background:var(--border)}
.steps5 div.on{background:var(--brand-600)}
.steps5-l{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:14px;color:var(--muted)}
/* ---------- Kaki ---------- */
.k-foot{display:flex;align-items:center;gap:16px;padding:14px 32px;border-top:1px solid var(--border);background:#fff;font-size:15px;color:var(--muted)}
.k-foot .help-btn{height:52px;border-radius:14px;border:2px solid var(--brand-600);background:#fff;color:var(--brand-700);font-weight:700;font-size:17px;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.k-foot .brand{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--subtle)}
.k-foot .brand img{height:18px}
.idle{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:999px;padding:12px 20px;font-size:17px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.idle button{border:0;background:var(--usu-emas);color:var(--text);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;top:96px;transform:translateX(-50%) translateY(-10px);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:min(680px,92vw);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){ .k-main{padding:20px 16px} .tile{padding:18px;min-height:0} .actions{flex-wrap:wrap} .btn{min-width:0;flex:1} .pad button{height:60px} .inp{font-size:26px} .dob{grid-template-columns:1fr} .k-mode{margin-left:0} .k-foot{flex-wrap:wrap;padding:12px 16px} .k-foot .brand{display:none} .tiles,.drs{grid-template-columns:1fr} .row2,.ticket-wrap{grid-template-columns:1fr} .k-h1{font-size:30px} .k-clock{display:none} .kv{grid-template-columns:1fr} .k-top{flex-wrap:wrap;padding:14px 16px} .k-mode-l{margin-left:0} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== Identitas RS USU · Pedoman Identitas USU (2021) ===== */
  .sb-brand .sb-logo{height:24px;width:auto;display:block}
  img.hlogo{width:30px;height:32px;border:0;border-radius:0;object-fit:contain;background:transparent}
  .sb-hosp{border-top:3px solid var(--usu-emas)}
  .badge-dot{color:var(--usu-hitam)!important}
</style>
<style id="ds-css">

#dsBtn:focus-visible{outline:2px solid #F3C300;outline-offset:2px}

#dsPanel.open{transform:none}
#dsPanel header{padding:16px 20px;border-bottom:1px solid #E4E7E5;display:flex;gap:12px;align-items:flex-start}
#dsPanel header h2{margin:0;font-size:16px} #dsPanel header p{margin:2px 0 0;color:#565C63;font-size:12.5px}

#dsPanel .dsb{flex:1;overflow-y:auto;padding:14px 20px 20px}

#dsPanel ul{margin:0;padding-left:18px} #dsPanel li{margin:2px 0}
#dsPanel code{font:500 12px/1.4 "JetBrains Mono",ui-monospace,monospace;background:#F1F3F2;border-radius:5px;padding:1px 5px;word-break:break-word}
#dsPanel .dsrule{background:#FFF7ED;color:#9A3412;border-radius:9px;padding:9px 11px;font-size:12.5px}

#dsPanel footer button.pri{background:#006937;border-color:#006937;color:#fff}

</style>

   <div class="rx">${f.rx.map(r=>`<div class="rx-it"><span class="ic" style="width:44px;height:44px;border-radius:12px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center">${I.rx}</span><div><b>${r.poli}</b><span>${r.dr} · ${r.jenis}</span></div><span class="pill ${r.c}">${r.st}</span></div>`).join('')}</div>
   <div class="note ${f.bayar.ok?'ok':'warn'}">${f.bayar.ok?I.ok:I.info}<span><b>${f.bayar.ok?'Pembayaran beres.':'Obat siap, tetapi belum bisa diserahkan.'}</b> ${f.bayar.t}.${f.bayar.ok?'':' Setelah pembayaran tercatat, nomor Anda otomatis dipanggil.'}</span></div></div>
   <div class="next"><h2>${f.hadir?'Anda tercatat hadir':'Konfirmasi kehadiran'}</h2><ol><li>Estimasi siap: <b>${f.est}</b>.</li><li>Nomor <b>${f.no}</b> dipanggil di layar farmasi bila Anda sudah hadir.</li><li>Pasien yang belum hadir tidak dipanggil, sehingga antrean tidak tertahan.</li></ol>
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">${f.hadir?'':'<button class="btn btn-primary" id="fHadir" style="min-width:0;height:56px;font-size:18px">Saya sudah di ruang tunggu</button>'}<button class="btn" id="fWa" style="min-width:0;height:56px;font-size:18px">Kabari lewat WhatsApp</button><button class="btn" data-go="fhome" style="min-width:0;height:56px;font-size:18px">Selesai</button></div></div></div>`); }
};
function home(){ mode==='farmasi'?FSCR.fhome():SCR.home(); $('#kLoc').textContent = mode==='farmasi'?'Anjungan Farmasi · Depo Rawat Jalan · APM-05':'Anjungan Mandiri · Lobi Rawat Jalan · APM-02'; $$('.k-mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode)); }

/* ---------- Interaksi ---------- */
document.addEventListener('click', e=>{
  const g=e.target.closest('[data-go]'); if (g && !g.disabled){ const s=g.dataset.go;
    if (s==='bkGo') return bkGo(); if (s==='idGo') return idGo(); if (s==='dobGo') return dobGo(); go(s); return; }
  const m=e.target.closest('[data-mode]'); if (m){ mode=m.dataset.mode; history.replaceState(null,'',mode==='farmasi'?'#farmasi':'#'); home(); return; }
  const f=e.target.closest('[data-fill]'); if (f){ const el=$('#'+f.dataset.fill); el.value=f.dataset.v; el.focus(); return; }
  const k=e.target.closest('[data-k]'); if (k){ const el=$('#'+k.closest('[data-pad]').dataset.pad); const v=k.dataset.k; if (v==='hapus') el.value=el.value.slice(0,-1); else if (v==='ok') $('#nextBtn').click(); else if (el.value.length<(el.maxLength>0?el.maxLength:16)) el.value+=v; el.focus(); return; }
  const d=e.target.closest('[data-dr]'); if (d && !d.disabled){ S.dr=+d.dataset.dr; SCR.dokter(); return; }
  const lk=e.target.closest('[data-lk]'); if (lk){ const pr=!!lk.dataset.pr; S.ticket={kind:'loket',no:pr?'P-0'+String(seqP++).padStart(2,'0'):'A-0'+(seqA++),cat:lk.dataset.lk,ahead:pr?1:7,loket:pr?'Loket 1 (prioritas)':'Loket 2–5',src:'Anjungan APM-02'}; go('ticket'); return; }
  const fq=e.target.closest('[data-fq]'); if (fq){ S.f=FARMASI[fq.dataset.fq]; FSCR.fstat(); return; }
  if (e.target.closest('#exGo')){ const b=e.target.closest('#exGo'); S.ticket={kind:'loket',no:'P-0'+String(seqP++).padStart(2,'0'),cat:'Prioritas · '+b.dataset.why,ahead:1,loket:'Loket 1',src:'Anjungan APM-02 · dialihkan',fwd:!!b.dataset.fwd}; go('ticket'); return; }
  if (e.target.closest('#bioGo')) return bioScan(false);
  if (e.target.closest('#bioFail')) return bioScan(true);
  if (e.target.closest('#waBtn')||e.target.closest('#fWa')) return toast('Tautan aman dikirim ke nomor WhatsApp yang terdaftar (peragaan). Nomor tidak ditampilkan di layar.');
  if (e.target.closest('#fHadir')){ S.f.hadir=true; FSCR.fstat(); toast('Kehadiran tercatat. Nomor Anda masuk daftar panggil farmasi.'); return; }
  if (e.target.closest('#helpBtn')) return toast('Petugas pendamping anjungan sudah dipanggil. Mohon tunggu sebentar.');
});
document.addEventListener('keydown', e=>{ if (e.key==='Enter' && $('#nextBtn') && document.activeElement && document.activeElement.classList.contains('inp')) $('#nextBtn').click(); });
function bkGo(){ const v=$('#bk').value.trim().toUpperCase(); if (!v){ $('#bkHelp').textContent='Masukkan kode booking.'; $('#bkHelp').className='help err'; return; }
  const b=BOOK[v]; if (!b){ $('#bkHelp').textContent='Kode tidak ditemukan untuk hari ini. Periksa kembali atau ambil nomor loket.'; $('#bkHelp').className='help err'; return; }
  S.b=b; S.p={samar:b.samar,lahir:b.lahir,kelas:'Reservasi Mobile JKN'}; S.from='booking'; SCR.dob(); }
function idGo(){ const v=$('#nik').value.replace(/\D/g,''); const h=$('#nikHelp'); if (v.length!==13 && v.length!==16){ h.textContent='Nomor kartu 13 digit atau NIK 16 digit.'; h.className='help err'; return; }
  const p=PESERTA[v]; if (!p) return SCR.exUnknown(); S.p=p; S.from='identify'; SCR.dob(); }
function dobGo(){ const p=S.p, ok=+$('#dd').value===p.lahir[0] && $('#mm').value===p.lahir[1] && +$('#yy').value===p.lahir[2];
  if (!ok){ S.dobTry=(S.dobTry||0)+1; const h=$('#dobHelp'); h.className='help err'; h.textContent = S.dobTry>=3 ? 'Tanggal lahir tidak cocok 3 kali. Silakan ke loket.' : `Tanggal lahir tidak cocok. Sisa ${3-S.dobTry} percobaan. (Peragaan: ${p.lahir.join(' ')})`; if (S.dobTry>=3) setTimeout(()=>ex('Data perlu dicek petugas','Tanggal lahir tidak cocok. Demi keamanan data, pendaftaran dilanjutkan di loket.','Identitas tidak cocok',false),1200); return; }
  if (S.b){ const b=S.b; view(head('Check-in berhasil','Silakan langsung ke poli','Anda sudah punya nomor dari reservasi Mobile JKN. Check-in dikirim ke BPJS.')+`<div class="panel"><dl class="kv"><dt>Poli</dt><dd>${b.poli}</dd><dt>Dokter</dt><dd>${b.dokter} · ${b.jam}</dd><dt>Ruang</dt><dd>${b.ruang}</dd><dt>Nomor</dt><dd class="mono" style="font-size:26px;color:var(--brand-800)">${b.no}</dd></dl></div>`+acts(null,'ticketBk','Cetak struk'));
    S.ticket={kind:'poli',no:b.no,poli:b.poli,dr:b.dokter,ruang:b.ruang,est:plus(25),sep:null,src:'Mobile JKN · check-in '+hm(new Date())}; $('#nextBtn').dataset.go='ticket'; return; }
  SCR.docs(); }
function bioScan(fail){ const fp=$('#fp'), t=$('#bioTxt'); fp.className='fp scan'; t.textContent='Memindai… tahan jari Anda.'; $('#bioGo').disabled=true;
  setTimeout(()=>{ if (fail){ S.bioTry++; fp.className='fp bad'; t.textContent=`Sidik jari tidak terbaca (percobaan ${S.bioTry} dari 3).`; $('#bioGo').disabled=false; $('#bioGo').textContent='Coba lagi'; if (S.bioTry>=3) setTimeout(()=>SCR.exBio(),900); }
    else { fp.className='fp ok'; fp.innerHTML=I.ok.replace(/22/g,'84'); t.textContent='Sidik jari cocok.'; S.bioAt=hm(new Date()); setTimeout(()=>go('sum'),700); } },1300); }

/* ---------- Sesi otomatis ditutup ---------- */
let idleT, idleC, left;
function resetIdle(){ clearTimeout(idleT); clearInterval(idleC); $('#idle').classList.add('hidden'); const atHome=!S || (!S.p && !S.ticket && !S.f && !S.b);
  idleT=setTimeout(()=>{ left=15; $('#idle').classList.remove('hidden'); $('#idleTxt').textContent=`Sesi akan ditutup dalam ${left} detik`; idleC=setInterval(()=>{ left--; $('#idleTxt').textContent=`Sesi akan ditutup dalam ${left} detik`; if (left<=0){ clearInterval(idleC); $('#idle').classList.add('hidden'); home(); toast('Sesi ditutup dan data di layar dihapus.'); } },1000); }, 45000); }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ if (!$('#idle').classList.contains('hidden')||true) resetIdle(); },{passive:true}));
$('#idleStay').onclick=resetIdle;
home();
})();
</script>
<button id="dsBtn" type="button" aria-controls="dsPanel" title="Spesifikasi untuk pengembang (Shift+D)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>Spek dev</button>
<div id="dsScrim"></div><aside id="dsPanel" role="dialog" aria-label="Spesifikasi pengembang" aria-hidden="true"><header><div><h2 id="dsT"></h2><p id="dsS"></p></div><button class="dsx" id="dsX" aria-label="Tutup">×</button></header><div class="dsb" id="dsB"></div><footer><button id="dsCopy" class="pri">Salin sebagai tiket</button></footer></aside>
<script id="ds-js">(function(){
const SP={"judul": "Anjungan Mandiri (APM)", "modul": "Modules/Registration · layouts/KioskLayout", "rute": "/kios/anjungan (token perangkat, tanpa login petugas)", "tujuan": "Check-in reservasi, daftar mandiri pasien lama BPJS, nomor loket, jadwal dokter; mode farmasi untuk konfirmasi hadir dan status obat.", "fr": ["FR-01-23…30 (PRD 7.01.1)", "FR-02-08 QR kunjungan", "FR-02-10 antrean farmasi otomatis", "FR-02-14 penyerahan obat terkunci sampai lunas", "FR-01-09 biometrik"], "views": {"farmasi": "Mode farmasi (#farmasi): tidak mendaftar ulang; nomor farmasi dibuat saat resep disahkan; konfirmasi hadir; pasien umum belum bayar → penyerahan terkunci."}, "aturan": ["Mode per perangkat dari data induk kunjungan.anjungan; peragaan memakai tombol di kepala layar.", "Nama tersamar + konfirmasi tanggal lahir (3 kali salah → loket).", "Pengecualian tidak membuntu: cetak nomor loket prioritas dan teruskan data terisi.", "Sesi ditutup otomatis 60 detik tanpa sentuhan; data di layar dihapus.", "VClaim/Antrean mati → kunjungan menunggu SEP, nomor loket, sinkron ulang."], "tabel": ["kunjungan.anjungan", "kunjungan.sesi_anjungan", "kunjungan.qr_kunjungan", "kunjungan.antrean", "kunjungan.antrean_task", "kunjungan.sep", "kunjungan.episode", "kunjungan.kunjungan"], "api": ["POST /api/v1/kios/sesi (token perangkat)", "POST /api/v1/kios/identifikasi", "GET /api/v1/kios/peserta/{id}/rujukan", "GET /api/v1/kios/jadwal?poli=", "POST /api/v1/kios/daftar", "POST /api/v1/kios/checkin", "GET /api/v1/kios/farmasi/{qr}", "POST /api/v1/kios/farmasi/{qr}/hadir"], "regulasi": ["Juknis VClaim & Antrean RS BPJS — perlu dokumen versi terbaru", "UU 27/2022 PDP Ps. 4 (data kesehatan = data spesifik)"], "belum": ["Integrasi perangkat biometrik dan printer termal hanya disimulasikan.", "QR di struk adalah gambar peragaan, bukan QR yang bisa dipindai."]}, CR=["Setiap halaman dilindungi izin sub-menu; bagian di dalamnya dilindungi izin bagian (PRD 9.2). Data bagian yang tidak diizinkan tidak dikirim server.", "Setiap isian klinis menyimpan nama, waktu server, dan tanda tangan (Permenkes 24/2022 Ps. 16 ayat 2). Isi tersahkan tidak ditimpa: perbaikan = versi baru/adendum.", "Semua aksi tercatat di audit.log_aktivitas (siapa, apa, sebelum–sesudah)."];
const $=s=>document.querySelector(s), e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cv=()=>{ const h=location.hash.slice(1); const a=document.querySelector('.nav-sub a.on'); return (SP.views&&SP.views[h])?h:(a&&a.dataset.view)||h; };
function render(){ const v=cv(), vn=SP.views&&SP.views[v];
  $('#dsT').textContent='Spek dev · '+SP.judul; $('#dsS').innerHTML='Rute <code>'+e(SP.rute)+'</code> · modul <code>'+e(SP.modul)+'</code>';
  const L=(t,a,code)=>a&&a.length?'<h3>'+t+'</h3>'+(code?'<div class="dschips">'+a.map(x=>'<code>'+e(x)+'</code>').join('')+'</div>':'<ul>'+a.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>'):'';
  $('#dsB').innerHTML='<div class="dsrule"><b>PRD yang berlaku.</b> Prototipe ini alat bantu visual dengan data fiktif. Bila berbeda dengan prd.md, ikuti prd.md dan laporkan selisihnya.</div>'+
   '<h3>Tujuan layar</h3><p style="margin:0">'+e(SP.tujuan)+'</p>'+(vn?'<h3>Sub-menu yang sedang dibuka</h3><div class="dsview"><b>'+e(v)+'</b> · '+e(vn)+'</div>':'')+
   L('Kebutuhan (FR) di prd.md',SP.fr)+L('Aturan bisnis kunci',SP.aturan)+L('Berlaku di semua layar',CR)+L('Tabel database',SP.tabel,1)+L('API (usulan · konvensi PRD 10.3.1)',SP.api,1)+L('Dasar regulasi',SP.regulasi)+L('Belum diperagakan — kerjakan dari PRD',SP.belum)+
   '<h3>Definition of Done</h3><ul><li>Lolos uji penerimaan (Given/When/Then) per FR di tiket.</li><li>Policy/izin server ada untuk setiap endpoint dan bagian (CI gagal bila tidak ada).</li><li>Audit log, versi/adendum, dan TTE sesuai tingkatnya.</li><li>Anggaran kinerja PRD 14.1: API P95 baca ≤ 200 ms / simpan ≤ 500 ms, ≤ 10 query, tanpa N+1.</li><li>Uji Playwright alur utama + uji akses ditolak.</li></ul>'; }
function ticket(){ const v=cv(), vn=SP.views&&SP.views[v];
  return ['## [SIMRS] '+SP.judul+(vn?' · '+v:''),'','**Tujuan:** '+SP.tujuan,'**Rute / modul:** '+SP.rute+' · '+SP.modul,vn?'**Fokus sub-menu:** '+vn:'','','**FR:**',...SP.fr.map(x=>'- '+x),'','**Aturan bisnis:**',...SP.aturan.map(x=>'- '+x),'','**Tabel:** '+SP.tabel.join(', '),'**API:** '+SP.api.join(' · '),'**Regulasi:** '+SP.regulasi.join('; '),'','**Uji penerimaan (isi):**','- Given … When … Then …','- Akun tanpa izin → 403 dan bagian tidak dirender','','**Definition of Done:** policy server, audit log, TTE sesuai tingkat, kinerja 14.1, uji Playwright.','Sumber: prd.md (versi terbaru). Prototipe: '+location.pathname.split('/').pop()].filter(x=>x!==null).join('\n'); }
const P=$('#dsPanel'), S=$('#dsScrim');
const open=()=>{ render(); P.classList.add('open'); S.classList.add('show'); P.setAttribute('aria-hidden','false'); $('#dsX').focus(); };
const close=()=>{ P.classList.remove('open'); S.classList.remove('show'); P.setAttribute('aria-hidden','true'); };
$('#dsBtn').onclick=open; $('#dsX').onclick=close; S.onclick=close;
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&P.classList.contains('open')) close(); if(ev.shiftKey&&ev.key.toLowerCase()==='d'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName)) { P.classList.contains('open')?close():open(); } });
window.addEventListener('hashchange',()=>{ if(P.classList.contains('open')) render(); });
$('#dsCopy').onclick=()=>{ const t=ticket(); const done=()=>{ const b=$('#dsCopy'); b.textContent='Tersalin'; setTimeout(()=>b.textContent='Salin sebagai tiket',1500); };
  if (navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fb(t)); else fb(t);
  function fb(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(_){} a.remove(); } };
})();</script>
