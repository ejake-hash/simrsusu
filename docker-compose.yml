services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SIMRS_MIGRATOR_PASSWORD: simrs_migrator
      SIMRS_APP_PASSWORD: simrs_app
      TZ: UTC
    ports:
      # 5433 agar tidak bentrok dengan Postgres lokal (mis. Homebrew) di 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simrs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3, PRD 10.1) dua instans, PRD 14.1.1 butir 6. Tag dipatok lengkap, bukan tag mengambang.
  # Sesi dan antrean: noeviction, menolak tulis saat memori penuh alih-alih membuang sesi atau pekerjaan.
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache: allkeys-lru, membuang kunci lama saat maxmemory tercapai. Tanpa persistensi; isinya bisa dibangun ulang.
  valkey-cache:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "${VALKEY_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${VALKEY_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
