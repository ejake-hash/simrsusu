name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # Valkey dari docker-compose.yml (sesi/queue noeviction :6379, cache allkeys-lru :6380), sama dengan lokal.
      # Bukan `services:` karena kontainer layanan Actions tidak bisa diberi argumen valkey-server.
      - name: Jalankan Valkey
        working-directory: .
        run: docker compose up -d --wait valkey valkey-cache

      # Tes berjalan sebagai simrs_app (tanpa DDL) dan memakai DatabaseTransactions.
      - name: Larang RefreshDatabase
        run: |
          if grep -rnE '(Testing\\|use[[:space:]]+)(RefreshDatabase|DatabaseMigrations|DatabaseTruncation)\b' tests; then
            echo "::error::Pakai DatabaseTransactions (lewat Tests\\TestCase), bukan RefreshDatabase/DatabaseMigrations/DatabaseTruncation."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Siapkan role, database, dan skema
        run: ../docker/postgres/init/00-init.sh

      - name: Install dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      # Alat debug menampilkan kueri dan binding; hanya boleh di require-dev (dicek juga saat boot).
      - name: Larang Telescope/Debugbar di dependensi produksi
        run: |
          if composer show --locked --no-dev --name-only | grep -E '^(laravel/telescope|barryvdh/laravel-debugbar)$'; then
            echo "::error::Telescope/Debugbar hanya boleh di require-dev."
            exit 1
          fi

      - name: Siapkan .env
        run: cp .env.example .env && php artisan key:generate

      # Level 5; temuan kode lama ada di phpstan-baseline.neon, kode baru harus bersih.
      - name: phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Tes (migrasi simrs_test sebagai simrs_migrator, lalu phpunit)
        run: composer test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  # Playwright ke backend sungguhan di CI dengan akun sintetis (AkunSintetisSeeder), bukan data asli.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
      # Sandi akun sintetis di database CI sekali pakai; bukan rahasia.
      AKUN_SINTETIS_SANDI: e2e-ci-sintetis-kuda-biru
      E2E_SANDI: e2e-ci-sintetis-kuda-biru
      # Rahasia TOTP sintetis akun contoh.mfa (Base32), juga sekali pakai; bukan rahasia.
      AKUN_SINTETIS_MFA_RAHASIA: KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU
      E2E_MFA_RAHASIA: KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU
      # Proksi Vite (127.0.0.1) dipercaya agar e2e bisa meniru akses dari luar jaringan RS lewat
      # X-Forwarded-For (tiket 1.1c). Variabel lingkungan mengalahkan .env.
      TRUSTED_PROXIES: 127.0.0.1
    steps:
      - uses: actions/checkout@v5

      # Valkey dari docker-compose.yml (sesi/queue noeviction :6379, cache allkeys-lru :6380), sama dengan lokal.
      # Bukan `services:` karena kontainer layanan Actions tidak bisa diberi argumen valkey-server.
      - name: Jalankan Valkey
        working-directory: .
        run: docker compose up -d --wait valkey valkey-cache

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Siapkan role, database, dan skema
        run: docker/postgres/init/00-init.sh

      - name: Backend (APP_ENV=local dari .env.example, cookie tanpa Secure di http)
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan migrate --database=pgsql_migrator --force
          php artisan db:seed --class='App\Modules\Akses\Database\Seeders\AkunSintetisSeeder' --force
          php artisan serve --host=127.0.0.1 --port=8000 > ../serve.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/up > /dev/null

      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            serve.log
          retention-days: 7
