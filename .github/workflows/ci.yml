name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # Tes berjalan sebagai simrs_app (tanpa DDL) dan memakai DatabaseTransactions.
      - name: Larang RefreshDatabase
        run: |
          if grep -rnE '(Testing\\|use[[:space:]]+)(RefreshDatabase|DatabaseMigrations|DatabaseTruncation)\b' tests; then
            echo "::error::Pakai DatabaseTransactions (lewat Tests\\TestCase), bukan RefreshDatabase/DatabaseMigrations/DatabaseTruncation."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Siapkan role, database, dan skema
        run: ../docker/postgres/init/00-init.sh

      - name: Install dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: cp .env.example .env && php artisan key:generate

      - name: Tes (migrasi simrs_test sebagai simrs_migrator, lalu phpunit)
        run: composer test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
